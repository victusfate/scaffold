name: Agent loop and queue portability

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  loop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
      - run: node scripts/agent-loop.test.ts
      - run: node scripts/agent-loop.integration.test.ts
      - run: node scripts/queue-edit.test.ts
      - run: node scripts/queue-lock.test.ts
