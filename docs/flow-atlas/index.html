s covers 'pull the latest main' as a warning only; it always exits 0 and changes nothing. Cutting the fresh branch is done by the agent.","kind":"enforces","lines":["# Fetch origin/main quietly; ignore network errors.","git fetch origin main --quiet 2>/dev/null || exit 0","","BRANCH=$(git rev-parse --abbrev-ref HEAD 2>/dev/null || echo \"\")","[ -z \"$BRANCH\" ] || [ \"$BRANCH\" = \"HEAD\" ] && exit 0","","BEHIND=$(git rev-list --count HEAD..origin/main 2>/dev/null || echo \"0\")","[ \"$BEHIND\" = \"0\" ] && exit 0","","if [ \"$BRANCH\" = \"main\" ]; then","  echo \"⚠  main is $BEHIND commit(s) behind origin/main — run: git pull origin main\"","else","  echo \"⚠  '$BRANCH' is $BEHIND commit(s) behind origin/main — merge before new feature work: git merge origin/main\"","fi"],"uses":[]},{"node":"local","file":"package.json","from":8,"to":13,"title":"npm test: the local test and check commands","explain":"test runs four parts in order and stops at the first failure: the node tests one file at a time, the tool tests, every scripts/test-*.sh, and the repo checks (resolver, skills doc, agents detail, handoff, guidelines, explorer pages, diagrams). test:integration is separate and needs RUN_INTEGRATION=1.","why":"These are the commands the local gates run in this repo, and the same ones CI runs. The skill looks for `make ci` or scripts/ci-local.sh first; neither exists here, so the agent runs these directly.","kind":"implements","lines":["  \"scripts\": {","    \"test\": \"npm run test:node && npm run test:tools && npm run test:shell && npm run test:checks\",","    \"test:node\": \"node --test --test-concurrency=1 'scripts/**/*.test.ts' 'tools/**/*.test.ts' 'lib/**/*.test.ts'\",","    \"test:tools\": \"tools/hoist-skill/test && tools/sync/test && node tools/linter-setup/test && node tools/dependency-watch/test\",","    \"test:shell\": \"for f in scripts/test-*.sh; do [ \\\"$f\\\" = scripts/test-read-once.sh ] || bash \\\"$f\\\" || exit 1; done\",","    \"test:checks\": \"node scripts/check-resolvable.ts --strict && node scripts/update-skills-doc.ts --check && node scripts/check-agents-detail.ts && node scripts/check-handoff.ts && node scripts/check-guidelines.ts && node scripts/render-explorer-pages.ts --check && node scripts/render-diagrams.ts --check\","],"uses":[]},{"node":"local","file":".githooks/pre-commit","from":14,"to":41,"title":"Pre-commit hook: lint, quality check and typecheck on each commit","explain":"With set -eu any failing step blocks the commit. It runs ESLint on staged JS/TS files, the mechanical quality check on staged files, the whole-project tsc --noEmit, then check-resolvable and the skills-doc freshness check. Each step is skipped when its tool or file is missing.","why":"It catches lint and type errors before they reach the PR. It only runs when core.hooksPath is set to .githooks, which the session-start hook does for cloud sessions; locally it is opt-in.","kind":"enforces","lines":["set -eu","","# Linters read the working-tree copy, so a partially staged file is checked as edited.","staged() { git diff --cached --name-only --diff-filter=ACMR -z -- \"$@\"; }","","if ls eslint.config.* > /dev/null 2>&1; then","  if [ -x node_modules/.bin/eslint ]; then","    staged '*.js' '*.mjs' '*.cjs' '*.ts' '*.tsx' |","      xargs -0 -r node_modules/.bin/eslint --no-warn-ignored --","  else","    echo \"pre-commit: ESLint configured but not installed — skipping (install deps, e.g. npm ci)\" >&2","  fi","fi","","if [ -f scripts/check-quality-mechanical.sh ]; then","  bash scripts/check-quality-mechanical.sh --staged","fi","","if [ -f tsconfig.json ]; then","  if [ -x node_modules/.bin/tsc ]; then","    node_modules/.bin/tsc --noEmit","  else","    echo \"pre-commit: tsconfig.json present but tsc not installed — skipping (install deps, e.g. npm ci)\" >&2","  fi","fi","","if [ -f scripts/check-resolvable.ts ]; then node scripts/check-resolvable.ts; fi","if [ -f scripts/update-skills-doc.ts ]; then node scripts/update-skills-doc.ts --check; fi"],"uses":[]},{"node":"local","file":"scripts/compute-bump.ts","from":20,"to":35,"title":"computeBump: next version from commit messages","explain":"It scans commit subject and body lines. A BREAKING CHANGE or a feat!/fix! line means major and stops the scan; a feat: line means minor; a fix: line means patch if nothing higher was seen. With no such line it returns none; otherwise it returns the bumped version string.","why":"The skill pipes git log origin/main..HEAD into this to pick the version it commits on the branch before pushing. The release job later tags exactly that version.","kind":"implements","lines":["export function computeBump(messages: string[], current: string): BumpResult {","  let bump: BumpKind = 'none';","  for (const line of messages) {","    if (/(BREAKING CHANGE|^feat(\\(.*\\))?!:|^fix(\\(.*\\))?!:)/.test(line)) { bump = 'major'; break; }","    // A 'major' match above always breaks, so bump is never 'major' here.","    if (/^feat(\\(.*\\))?:/.test(line)) { bump = 'minor'; }","    else if (/^fix(\\(.*\\))?:/.test(line)) { if (bump === 'none') bump = 'patch'; }","  }","  if (bump === 'none') return { bump, next: null };","","  const [major, minor, patch] = current.split('.').map(Number);","  const next = bump === 'major' ? `${major + 1}.0.0`","             : bump === 'minor' ? `${major}.${minor + 1}.0`","             : `${major}.${minor}.${patch + 1}`;","  return { bump, next };","}"],"uses":["scripts/compute-bump.ts#BumpKind","scripts/compute-bump.ts#BumpResult"]},{"node":"open","file":"scripts/test-create-pr-gate.sh","from":23,"to":32,"title":"Test: the quality gate comes before the PR body in the skill text","explain":"It finds the line numbers of the 'Step 5' and 'Step 6' headings in skills/create-pr.md, matching headings only. It passes when Step 5 (the quality gate) appears before Step 6 (drafting the PR body), and fails otherwise.","why":"This pins the order 'score 10/10 first, then open the PR' in the skill document. It checks the text of the instructions, not what an agent did; nothing in code checks the scores or the PR body.","kind":"tests","lines":["# Gate (Step 5) must appear before Step 6 (PR body drafting). Match the section","# HEADINGS, not prose cross-references, so an earlier \"(Step 6)\" mention in the","# body of another step can't invert the check.","gate_line=$(grep -nE '^#+[[:space:]].*Step 5' \"$FILE\" | head -1 | cut -d: -f1)","step6_line=$(grep -nE '^#+[[:space:]].*Step 6' \"$FILE\" | head -1 | cut -d: -f1)","if [ -n \"$gate_line\" ] && [ -n \"$step6_line\" ] && [ \"$gate_line\" -lt \"$step6_line\" ]; then","  ok \"quality gate (Step 5) appears before PR body drafting (Step 6)\"","else","  fail \"quality gate must appear before PR body drafting\"","fi"],"uses":["scripts/test-create-pr-gate.sh#fail"]},{"node":"checks","file":".github/workflows/ci.yml","from":11,"to":24,"title":"CI verify job: npm test on every PR to main","explain":"On a pull request to main, the job checks out the code without stored credentials, installs the Node version from .node-version, runs npm ci and then npm test. npm test chains the node tests, the tool tests, the shell tests and the repo checks.","why":"This is one of the real checks whose conclusion the agent reads on the final head. The workflow has no roll-up job, so each job's own result must be read.","kind":"enforces","lines":["jobs:","  verify:","    runs-on: ubuntu-latest","    env:","      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true","    steps:","      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5","        with:","          persist-credentials: false","      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5","        with:","          node-version-file: .node-version","      - run: npm ci","      - run: npm test"],"uses":[]},{"node":"checks","file":".github/workflows/ci.yml","from":37,"to":50,"title":"CI lint job: lint, typecheck and import boundaries","explain":"After checkout and npm ci it runs npm run lint (ESLint with zero warnings allowed), npm run typecheck (tsc --noEmit), then the import-boundary check. Any failing step fails the job.","why":"A second hosted check on the PR head, separate from the tests. A PR that passes tests but breaks types or boundaries stops here.","kind":"enforces","lines":["  lint:","    runs-on: ubuntu-latest","    steps:","      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5","        with:","          persist-credentials: false","      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5","        with:","          node-version-file: .node-version","          cache: npm","      - run: npm ci","      - run: npm run lint","      - run: npm run typecheck","      - run: node scripts/check-import-boundaries.ts"],"uses":[]},{"node":"checks","file":".github/workflows/quality.yml","from":11,"to":21,"title":"Quality Gate: mechanical checks on all source files","explain":"On PR open, update or reopen it lists every tracked js, mjs, ts, tsx, sh, py, rb and go file. If there are any, it runs scripts/check-quality-mechanical.sh on all of them.","why":"This is the machine half of the quality bar; the 10/10 score from /simplify is model judgment made before the PR opens.","kind":"enforces","lines":["  mechanical:","    name: Mechanical checks","    runs-on: ubuntu-latest","    steps:","      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5","        with:","          persist-credentials: false","      - name: Run mechanical quality checks (all files)","        run: |","          mapfile -t FILES \u003c \u003c(git ls-files | grep -E '\\.(js|mjs|ts|tsx|sh|py|rb|go)$' || true)","          [ ${#FILES[@]} -gt 0 ] && bash scripts/check-quality-mechanical.sh \"${FILES[@]}\""],"uses":[]},{"node":"checks","file":".github/workflows/security.yml","from":37,"to":59,"title":"Security scan: list what the PR changes and scan it for secrets","explain":"The fetch helper downloads a release asset and rejects it unless its sha256 matches the pinned value. The step lists files added or changed between the base tip and the PR merge commit. If any changed, it downloads gitleaks, copies the changed files to a temp tree and scans them, adding 'gitleaks' to the failed list on a finding.","why":"This starts the 'Security scan' check that must pass before merge. Scanning only what the PR adds keeps it fast; osv-scanner and zizmor follow in the same step when lockfiles or workflows changed.","kind":"enforces","lines":["      - name: Scan the changes","        run: |","          set -euo pipefail","          bin=\"$RUNNER_TEMP/bin\"; mkdir -p \"$bin\"","          # fetch \u003crepo> \u003ctag> \u003casset> \u003csha256>: download a release asset and refuse it unless it is the pinned one.","          fetch() {","            curl -sSfL --retry 3 -o \"$RUNNER_TEMP/$3\" \"https://github.com/$1/releases/download/$2/$3\"","            echo \"$4  $RUNNER_TEMP/$3\" | sha256sum -c --quiet -","          }","          mapfile -d '' changed \u003c \u003c(git diff -z --name-only --diff-filter=ACMR HEAD^1 HEAD)","          echo \"${#changed[@]} changed file(s)\"","          failed=()","","          if [ ${#changed[@]} -gt 0 ]; then","            fetch gitleaks/gitleaks \"v$GITLEAKS_VERSION\" \"gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz\" \"$GITLEAKS_SHA256\"","            tar -xzf \"$RUNNER_TEMP/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz\" -C \"$bin\" gitleaks","            tree=\"$RUNNER_TEMP/changed\"; mkdir -p \"$tree\"","            # The checkout is HEAD, so copy the changed files from it (paths on stdin: no argument-length limit).","            printf '%s\\0' \"${changed[@]}\" | tar --null -T - -cf - | tar -x -C \"$tree\"","            echo \"::group::gitleaks (secrets in changed files)\"","            (cd \"$tree\" && \"$bin/gitleaks\" dir . --no-banner --redact -v -i \"$GITHUB_WORKSPACE\") || failed+=(gitleaks)","            echo \"::endgroup::\"","          fi"],"uses":[]},{"node":"checks","file":".github/workflows/security.yml","from":77,"to":89,"title":"Security scan: zizmor on workflow changes, then fail if any scanner failed","explain":"If a changed path is a workflow, an action file or dependabot.yml, it downloads the pinned zizmor and runs it, recording a failure. At the end, a non-empty failed list prints an error naming the scanners and exits 1; otherwise it prints 'security scan: clean'.","why":"All three scanners report through this one exit, so the check's conclusion is a real pass or fail. The job runs on every pull request, so it is not skipped by a path filter.","kind":"enforces","lines":["          if printf '%s\\n' \"${changed[@]}\" | grep -qE '^(\\.github/(workflows|actions)/|action\\.ya?ml$|\\.github/dependabot\\.ya?ml$)'; then","            fetch zizmorcore/zizmor \"v$ZIZMOR_VERSION\" zizmor-x86_64-unknown-linux-gnu.tar.gz \"$ZIZMOR_SHA256\"","            tar -xzf \"$RUNNER_TEMP/zizmor-x86_64-unknown-linux-gnu.tar.gz\" -C \"$bin\" zizmor","            echo \"::group::zizmor (GitHub Actions workflows)\"","            \"$bin/zizmor\" . || failed+=(zizmor)","            echo \"::endgroup::\"","          fi","","          if [ ${#failed[@]} -gt 0 ]; then","            echo \"::error::security scan found problems: ${failed[*]} (see the groups above)\"","            exit 1","          fi","          echo \"security scan: clean\""],"uses":[]},{"node":"checks","file":"scripts/check-handoff.ts","from":48,"to":61,"title":"check-handoff --pre-merge: fail while a handoff file exists","explain":"preMerge returns an error when .pause/handoff.md exists, with the git rm command to clear it. The CLI block picks preMerge when --pre-merge is passed, else the content check. Any error is printed and the process exits 1; otherwise it prints OK.","why":"A handoff must not ride a merge into main, where a later /resume would act on it. The agent runs this on the head it is about to merge; nothing in CI runs the --pre-merge form.","kind":"enforces","lines":["/** Errors when a handoff would ride a merge into main. */","export function preMerge(path: string): string[] {","  return existsSync(path) ? [`handoffs live only on branches; clear it before merging to main: git rm ${path} && git commit -m \"chore: clear handoff before merge\"`] : [];","}","","if (import.meta.url === `file://${process.argv[1]}`) {","  const args = process.argv.slice(2);","  const mergeMode = args.includes('--pre-merge');","  const path = args.find(a => a !== '--pre-merge') ?? '.pause/handoff.md';","  const errors = mergeMode ? preMerge(path) : existsSync(path) ? check(readFileSync(path, 'utf8')) : [];","  for (const e of errors) console.error(`check-handoff: ${path}: ${e}`);","  if (errors.length) process.exit(1);","  console.log(`check-handoff: OK (${existsSync(path) ? path : `no ${path}`})`);","}"],"uses":["scripts/check-handoff.ts#check"]},{"node":"merge","file":"scripts/queue-delivery.ts","from":9,"to":27,"title":"queue advance: record the merged PR and the fresh branch","explain":"It refuses unless the id is the selected delivery task, that task was accepted as done, no task is active, --pr looks like a pull request URL and --branch is not empty. On success it clears deliveryTask and deliveryAccepted, saves, and writes the PR and branch to the log.","why":"This closes the delivery cycle so the queue will hand out the next task. The code checks only the queue's own state and the URL's shape; it does not ask GitHub whether the PR merged, so the orchestrator vouches for that.","kind":"implements","lines":["/**"," * `queue advance \u003cid> --pr \u003curl> --branch \u003cfresh>` — an audited attestation, not a"," * remote check: the queue verifies its own state (selected task completed and"," * accepted, no active claims) and records the PR and fresh branch the root vouches for."," */","export function cmdAdvance(q: Queue, id: string, pr: string, branch: string): number {","  const task = q.tasks.find(t => t.id === id);","  if (!id || q.config.deliveryTask !== id || !q.config.deliveryAccepted || (task && task.status !== 'done')","      || q.tasks.some(t => t.status === 'active')","      || !MERGED_PR_URL.test(pr) || !branch.trim()) {","    console.error('advance: requires selected completed task, no active claims, --pr \u003cmerged-pr-url> and --branch \u003cfresh-working-branch>');","    return 1;","  }","  const advanced = setConfig(q, { deliveryTask: '', deliveryAccepted: false });","  save(advanced);","  log(`advance ${id}: root attests authorized validated merge ${pr}; fresh branch ${branch}`);","  console.log(`delivery acknowledged for ${id}; external merge/validation evidence is root-owned${drainKick(advanced)}`);","  return 0;","}"],"uses":["scripts/queue-delivery.ts#MERGED_PR_URL","scripts/queue-io.ts#save","scripts/queue-io.ts#log","scripts/queue-model.ts#Queue","scripts/queue-model.ts#setConfig","scripts/queue-gates.ts#drainKick"]},{"node":"merge","file":".github/workflows/release.yml","from":18,"to":43,"title":"Release job: tag main after the merge","explain":"On a push to main it checks out full history and reads the version from package.json. If the tag v\u003cversion> already exists it stops. Otherwise it creates the annotated tag and pushes only the tag.","why":"This is the only code that runs because of the merge. It relies on the version bump already being on the PR branch, and it pushes a tag, never a commit, so main's history stays one squash commit per PR.","kind":"implements","lines":["  tag:","    runs-on: ubuntu-latest","    permissions:","      contents: write","    steps:","      - name: Checkout","        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5","        with:","          fetch-depth: 0","          persist-credentials: false","","      - name: Tag release","        env:","          GH_TOKEN: ${{ github.token }}","        run: |","          VERSION=$(node -p \"require('./package.json').version\")","          if git rev-parse \"v$VERSION\" >/dev/null 2>&1; then","            echo \"Tag v$VERSION already exists — skipping\"","            exit 0","          fi","          git config user.name \"github-actions[bot]\"","          git config user.email \"github-actions[bot]@users.noreply.github.com\"","          gh auth setup-git","          git tag -a \"v$VERSION\" -m \"Release v$VERSION\"","          git push origin \"v$VERSION\"","          echo \"Tagged v$VERSION\""],"uses":[]}],"promptOnly":[]},"prune":{"overview":"/prune is a prose pipeline: skills/prune.md tells the agent to run the two reviews, write design.md and prd.md, then run /tdd and /create-pr. No script collects the findings table, assigns F-01 style IDs or checks that the PR body lists them. The code that exists is shared with other flows: scripts/check-quality-mechanical.sh covers the mechanical part of the structure review, the commit hook and package.json back the TDD phase, and scripts/compute-bump.ts, scripts/check-handoff.ts and the three PR workflows back the pull request.","refs":[{"node":"audit","file":"scripts/check-quality-mechanical.sh","from":194,"to":218,"title":"check-quality-mechanical.sh: pick the files, run the checks, exit","explain":"Chooses which files to check: the staged files with --staged, the paths given as arguments, or by default the source files that differ from main (git diff main...HEAD). It runs check_file on each. If any violation was counted it prints the total and exits 1.","why":"The audit looks at the current branch. With no arguments this script checks exactly the source files the branch changed against main. skills/prune.md does not call the script by name; it is the scripted form of the mechanical rules in the /simplify checklist, and the rest of that review is done by the agent.","kind":"enforces","lines":["# Resolve files: explicit args, staged files, or files changed vs main.","# A read loop rather than mapfile, so this runs on macOS's bash 3.2 (the hook","# ships to consumers' machines), and the loop guard keeps an empty set safe there.","SOURCE_RE='\\.(js|mjs|ts|tsx|sh|py|rb|go)$'","FILES=()","collect() { while IFS= read -r f; do FILES+=(\"$f\"); done \u003c \u003c(grep -E \"$SOURCE_RE\" || true); }","if [ \"${1:-}\" = \"--staged\" ]; then","  collect \u003c \u003c(git diff --cached --name-only --diff-filter=ACMR 2>/dev/null)","elif [ $# -gt 0 ]; then","  FILES=(\"$@\")","else","  collect \u003c \u003c(git diff main...HEAD --name-only 2>/dev/null)","fi","","if [ ${#FILES[@]} -gt 0 ]; then","  for f in \"${FILES[@]}\"; do","    check_file \"$f\"","  done","fi","","if [ \"$VIOLATIONS\" -gt 0 ]; then","  echo \"\"","  echo \"${VIOLATIONS} mechanical violation(s) found. Fix before creating a PR.\"","  exit 1","fi"],"uses":["scripts/check-quality-mechanical.sh#check_file"]},{"node":"audit","file":"scripts/check-quality-mechanical.sh","from":63,"to":73,"title":"check_file: the 500-line file length check","explain":"Counts the lines in the file with wc -l. If the count is over MAX_LINES (500) and the file has no \"quality-ok: file-length\" pragma, it emits a Readability/major violation with the file name. Each emit adds one to VIOLATIONS, which makes the script exit non-zero at the end.","why":"File length is one of the rubric rules the structure review applies. This check gives the same answer every time, so a finding of this kind does not depend on the reviewer.","kind":"enforces","lines":["  # File length. A `quality-ok: file-length — \u003creason>` pragma anywhere in the file","  # (by convention on the first non-shebang line) blesses a genuinely cohesive file","  # that reads as one unit and would only be fragmented by a split. Like the","  # magic-number pragma, the keyword is the gate; the required reason is enforced at","  # review time, not parsed here. Commented-out-code has no such escape hatch.","  local count","  count=$(wc -l \u003c \"$file\")","  if [ \"$count\" -gt \"$MAX_LINES\" ] \\","     && ! grep -Eq '(#|//)[[:space:]]*quality-ok:[[:space:]]*file-length' \"$file\"; then","    emit \"${file}:${MAX_LINES} [Readability/major] file is ${count} lines — exceeds ${MAX_LINES}-line limit; split into cohesive modules (or add a 'quality-ok: file-length — \u003creason>' pragma if it is one cohesive unit)\"","  fi"],"uses":["scripts/check-quality-mechanical.sh#emit","scripts/lib/skill-test.sh#has"]},{"node":"tdd","file":"scripts/test-tdd-rubric.sh","from":15,"to":22,"title":"test-tdd-rubric.sh: skills/tdd.md must keep its rubric steps","explain":"Greps skills/tdd.md for six patterns: the @-include of lib/code-quality-rubric.md, the rubric being loaded before GREEN, REFACTOR as a confirmation pass, the per-slice score table, the 30-line fix threshold, and the surface-to-user rule. It counts passes and failures and exits non-zero if any pattern is missing. npm test runs it through test:shell.","why":"Phase 4 hands the fixes to /tdd. This test keeps the rubric scoring and the 30-line fix rule in the skill text the agent follows there.","kind":"tests","lines":["echo \"TDD rubric integration check: $TDD\"","check \"@-include of rubric present\"           \"@\\.\\./lib/code-quality-rubric\"","check \"rubric loaded before GREEN\"            \"rubric|quality.*before|generative\"","check \"REFACTOR as confirmation framing\"      \"confirm|confirmation|already\"","check \"per-slice score display\"               \"score.*slice|slice.*score|dimension.*score|Quality Scores\"","check \"auto-fix threshold stated\"             \"30 line|30-line|auto.fix\"","check \"surface threshold stated\"              \"surface|block.*arch|architectural\"","echo \"\"; echo \"$PASS passed, $FAIL failed.\"; [ \"$FAIL\" -eq 0 ]"],"uses":["scripts/test-tdd-rubric.sh#check"]},{"node":"tdd","file":".githooks/pre-commit","from":28,"to":41,"title":"pre-commit hook: mechanical check, typecheck, skill routing gate","explain":"Runs on every git commit once core.hooksPath points at .githooks. It runs the mechanical quality check on the staged files, then tsc --noEmit if a tsconfig.json exists, then check-resolvable.ts and the skills-doc freshness check. The script runs under set -eu, so the first failing step aborts the commit.","why":"Each fix group is a slice with its own commits. With the hook enabled every commit must pass the mechanical check and the typecheck, so a fix cannot add a new mechanical violation.","kind":"enforces","lines":["if [ -f scripts/check-quality-mechanical.sh ]; then","  bash scripts/check-quality-mechanical.sh --staged","fi","","if [ -f tsconfig.json ]; then","  if [ -x node_modules/.bin/tsc ]; then","    node_modules/.bin/tsc --noEmit","  else","    echo \"pre-commit: tsconfig.json present but tsc not installed — skipping (install deps, e.g. npm ci)\" >&2","  fi","fi","","if [ -f scripts/check-resolvable.ts ]; then node scripts/check-resolvable.ts; fi","if [ -f scripts/update-skills-doc.ts ]; then node scripts/update-skills-doc.ts --check; fi"],"uses":[".githooks/pre-commit#staged"]},{"node":"tdd","file":"package.json","from":9,"to":14,"title":"package.json: what \"the full suite\" runs","explain":"npm test chains four scripts. test:node runs every *.test.ts under scripts/, tools/ and lib/ with node --test. test:tools runs each tool's own test file, test:shell runs every scripts/test-*.sh, and test:checks runs the repo checks. test:integration is separate and is not part of npm test.","why":"/tdd runs /code-refiner only when the full suite is green. These scripts define that suite.","kind":"implements","lines":["    \"test\": \"npm run test:node && npm run test:tools && npm run test:shell && npm run test:checks\",","    \"test:node\": \"node --test --test-concurrency=1 'scripts/**/*.test.ts' 'tools/**/*.test.ts' 'lib/**/*.test.ts'\",","    \"test:tools\": \"tools/hoist-skill/test && tools/sync/test && node tools/linter-setup/test && node tools/dependency-watch/test\",","    \"test:shell\": \"for f in scripts/test-*.sh; do [ \\\"$f\\\" = scripts/test-read-once.sh ] || bash \\\"$f\\\" || exit 1; done\",","    \"test:checks\": \"node scripts/check-resolvable.ts --strict && node scripts/update-skills-doc.ts --check && node scripts/check-agents-detail.ts && node scripts/check-handoff.ts && node scripts/check-guidelines.ts && node scripts/render-explorer-pages.ts --check && node scripts/render-diagrams.ts --check\",","    \"test:integration\": \"RUN_INTEGRATION=1 tools/hoist-skill/test-integration && RUN_INTEGRATION=1 tools/sync/test-integration && RUN_INTEGRATION=1 tools/linter-setup/test-integration\","],"uses":[]},{"node":"pr","file":"scripts/compute-bump.ts","from":20,"to":35,"title":"computeBump: next version from the branch commit messages","explain":"Walks the commit lines. BREAKING CHANGE or a feat!/fix! prefix sets a major bump and stops. A feat: line sets minor, and a fix: line sets patch if nothing higher was seen. With no such line it returns \"none\"; otherwise it splits the current version and returns the next one.","why":"/create-pr Step 3 pipes the branch commits into this script to bump package.json before opening the PR. A prune branch with only refactor, test and docs commits gets \"none\" and no bump.","kind":"implements","lines":["export function computeBump(messages: string[], current: string): BumpResult {","  let bump: BumpKind = 'none';","  for (const line of messages) {","    if (/(BREAKING CHANGE|^feat(\\(.*\\))?!:|^fix(\\(.*\\))?!:)/.test(line)) { bump = 'major'; break; }","    // A 'major' match above always breaks, so bump is never 'major' here.","    if (/^feat(\\(.*\\))?:/.test(line)) { bump = 'minor'; }","    else if (/^fix(\\(.*\\))?:/.test(line)) { if (bump === 'none') bump = 'patch'; }","  }","  if (bump === 'none') return { bump, next: null };","","  const [major, minor, patch] = current.split('.').map(Number);","  const next = bump === 'major' ? `${major + 1}.0.0`","             : bump === 'minor' ? `${major}.${minor + 1}.0`","             : `${major}.${minor}.${patch + 1}`;","  return { bump, next };","}"],"uses":["scripts/compute-bump.ts#BumpKind","scripts/compute-bump.ts#BumpResult"]},{"node":"pr","file":"scripts/test-create-pr-gate.sh","from":23,"to":32,"title":"test-create-pr-gate.sh: quality gate comes before the PR body","explain":"Finds the line number of the \"Step 5\" heading and of the \"Step 6\" heading in skills/create-pr.md. It passes only if both exist and Step 5 comes first. Earlier lines in the same file assert that the skill mentions the score table, the 10/10 threshold and the override syntax.","why":"The PR step relies on /create-pr scoring every file 10/10 before it drafts the body. That gate is run by the agent; this test only keeps it in the skill and in the right order.","kind":"tests","lines":["# Gate (Step 5) must appear before Step 6 (PR body drafting). Match the section","# HEADINGS, not prose cross-references, so an earlier \"(Step 6)\" mention in the","# body of another step can't invert the check.","gate_line=$(grep -nE '^#+[[:space:]].*Step 5' \"$FILE\" | head -1 | cut -d: -f1)","step6_line=$(grep -nE '^#+[[:space:]].*Step 6' \"$FILE\" | head -1 | cut -d: -f1)","if [ -n \"$gate_line\" ] && [ -n \"$step6_line\" ] && [ \"$gate_line\" -lt \"$step6_line\" ]; then","  ok \"quality gate (Step 5) appears before PR body drafting (Step 6)\"","else","  fail \"quality gate must appear before PR body drafting\"","fi"],"uses":["scripts/test-create-pr-gate.sh#fail"]},{"node":"pr","file":".github/workflows/ci.yml","from":12,"to":24,"title":"CI job \"verify\": npm test on every PR to main","explain":"On a pull request to main the job checks out the code, installs the Node version named in .node-version, runs npm ci, and then runs npm test. A failing test fails the job.","why":"Runs the full suite on the prune PR. The fixes are refactors, so this is the hosted check that behavior did not change.","kind":"enforces","lines":["  verify:","    runs-on: ubuntu-latest","    env:","      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true","    steps:","      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5","        with:","          persist-credentials: false","      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5","        with:","          node-version-file: .node-version","      - run: npm ci","      - run: npm test"],"uses":[]},{"node":"pr","file":".github/workflows/quality.yml","from":11,"to":21,"title":"Quality Gate workflow: mechanical checks on all tracked source","explain":"On every pull request the job lists all tracked js, mjs, ts, tsx, sh, py, rb and go files with git ls-files. It passes the whole list to check-quality-mechanical.sh. Any violation makes the script exit 1, which fails the job.","why":"Re-checks the mechanical rules over every tracked source file on the PR. A prune run that left a 500-line file or commented-out code fails here.","kind":"enforces","lines":["  mechanical:","    name: Mechanical checks","    runs-on: ubuntu-latest","    steps:","      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5","        with:","          persist-credentials: false","      - name: Run mechanical quality checks (all files)","        run: |","          mapfile -t FILES \u003c \u003c(git ls-files | grep -E '\\.(js|mjs|ts|tsx|sh|py|rb|go)$' || true)","          [ ${#FILES[@]} -gt 0 ] && bash scripts/check-quality-mechanical.sh \"${FILES[@]}\""],"uses":[]},{"node":"pr","file":".github/workflows/security.yml","from":46,"to":59,"title":"Security scan: list changed files and run gitleaks on them","explain":"Lists the files the PR adds or changes by diffing the merge commit against its first parent. If there are any, it downloads the pinned gitleaks release, copies the changed files into a temp folder and scans that folder for secrets. A finding adds gitleaks to the failed list, and a later step exits 1 when that list is not empty.","why":"/create-pr Step 2c runs nothing locally and relies on this check. It must pass before the PR can merge.","kind":"enforces","lines":["          mapfile -d '' changed \u003c \u003c(git diff -z --name-only --diff-filter=ACMR HEAD^1 HEAD)","          echo \"${#changed[@]} changed file(s)\"","          failed=()","","          if [ ${#changed[@]} -gt 0 ]; then","            fetch gitleaks/gitleaks \"v$GITLEAKS_VERSION\" \"gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz\" \"$GITLEAKS_SHA256\"","            tar -xzf \"$RUNNER_TEMP/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz\" -C \"$bin\" gitleaks","            tree=\"$RUNNER_TEMP/changed\"; mkdir -p \"$tree\"","            # The checkout is HEAD, so copy the changed files from it (paths on stdin: no argument-length limit).","            printf '%s\\0' \"${changed[@]}\" | tar --null -T - -cf - | tar -x -C \"$tree\"","            echo \"::group::gitleaks (secrets in changed files)\"","            (cd \"$tree\" && \"$bin/gitleaks\" dir . --no-banner --redact -v -i \"$GITHUB_WORKSPACE\") || failed+=(gitleaks)","            echo \"::endgroup::\"","          fi"],"uses":[]},{"node":"pr","file":"scripts/check-handoff.ts","from":48,"to":61,"title":"check-handoff.ts --pre-merge: no handoff file on the head to merge","explain":"preMerge returns an error when .pause/handoff.md still exists, with the git rm command that clears it. The CLI block below it picks preMerge when --pre-merge is passed, prints each error, and exits 1 if there is one.","why":"/create-pr tells the orchestrator to remove .pause/handoff.md and run this before merging. It stops a handoff file from reaching main with the prune PR.","kind":"enforces","lines":["/** Errors when a handoff would ride a merge into main. */","export function preMerge(path: string): string[] {","  return existsSync(path) ? [`handoffs live only on branches; clear it before merging to main: git rm ${path} && git commit -m \"chore: clear handoff before merge\"`] : [];","}","","if (import.meta.url === `file://${process.argv[1]}`) {","  const args = process.argv.slice(2);","  const mergeMode = args.includes('--pre-merge');","  const path = args.find(a => a !== '--pre-merge') ?? '.pause/handoff.md';","  const errors = mergeMode ? preMerge(path) : existsSync(path) ? check(readFileSync(path, 'utf8')) : [];","  for (const e of errors) console.error(`check-handoff: ${path}: ${e}`);","  if (errors.length) process.exit(1);","  console.log(`check-handoff: OK (${existsSync(path) ? path : `no ${path}`})`);","}"],"uses":["scripts/check-handoff.ts#check"]}],"promptOnly":[{"node":"design","what":"The agent writes docs/quality-\u003cbranch-short>/design.md with the findings table and grouped decisions, commits it and runs /design-review, all by hand from the template in the skill."},{"node":"prd","what":"The agent runs /to-prd to turn the finding classes into user stories that cite finding IDs and to name which fixes need tests; nothing checks the IDs."}]},"qa":{"overview":"/qa is carried out entirely by the agent following skills/qa.md: no script starts the app, runs probes, assigns severities, counts reverts or writes the report. The only code is scripts/test-qa-skill.sh, which greps the skill text so its rules cannot be dropped, the wrapper check in scripts/resolver-phases.ts that keeps the /qa command pointing at that text, and the pre-commit hook that each fix commit passes through.","refs":[{"node":"setup","file":"scripts/resolver-phases.ts","from":142,"to":155,"title":"Wrapper integrity: each harness wrapper must point at the skill file","explain":"For every registered skill it builds the expected path skills/\u003cname>.md. It then opens each harness wrapper that exists (Claude, Cursor, Antigravity skill and workflow) and fails the check if the wrapper does not contain a reference to that path. It runs from scripts/check-resolvable.ts, in the pre-commit hook and in npm test.","why":"This is the only code on the way into /qa: it guarantees the command loads skills/qa.md and not a stale copy. Everything after that entry is the agent following the text.","kind":"enforces","lines":["export function phaseWrapperIntegrity(rows: ResolverRow[], { fail, SKILLS_DIR, CURSOR_RULES, ANTIGRAVITY_SKILLS, ANTIGRAVITY_WORKFLOWS, rel }: PhaseCtx): void {","  for (const r of rows) {","    const expected = `skills/${r.name}.md`;","    const check = (path: string, include: string): void => {","      if (!existsSync(path)) return;","      if (!readFileSync(path, 'utf8').includes(include))","        fail('Wrapper', `${rel(path)} must contain '${include}' — edit skills/${r.name}.md, not the wrapper`);","    };","    check(join(SKILLS_DIR, r.name, 'SKILL.md'),              `@../../../${expected}`);","    check(join(CURSOR_RULES, `${r.name}.mdc`),               `@../../${expected}`);","    check(join(ANTIGRAVITY_SKILLS, r.name, 'SKILL.md'),      `../../../${expected}`);","    check(join(ANTIGRAVITY_WORKFLOWS, `${r.name}.md`),       `../../${expected}`);","  }","}"],"uses":["scripts/resolver-phases.ts#PhaseCtx","tools/lib/resolver-parse.ts#ResolverRow"]},{"node":"setup","file":"scripts/test-qa-skill.sh","from":11,"to":15,"title":"qa skill test: surfaces, clean tree, diff scope","explain":"Three case-sensitive greps require the bold surface names browser, API and CLI in skills/qa.md. Two more require the text 'git status --porcelain' and either 'diff-aware' or 'git diff'.","why":"Pins the setup rules in the text: the surface list, the clean-tree check, and scoping probes to the diff. Nothing here runs git status or picks surfaces; the agent does that.","kind":"tests","lines":["has_cs \"$S\" '\\*\\*browser\\*\\*'                   \"surface: browser\"","has_cs \"$S\" '\\*\\*API\\*\\*'                       \"surface: HTTP API\"","has_cs \"$S\" '\\*\\*CLI\\*\\*'                       \"surface: CLI\"","has \"$S\" 'git status --porcelain'               \"requires a clean working tree\"","has \"$S\" 'diff-aware|git diff'                  \"scopes probes to the diff by default\""],"uses":["scripts/lib/skill-test.sh#has","scripts/lib/skill-test.sh#has_cs"]},{"node":"setup","file":"scripts/lib/skill-test.sh","from":6,"to":16,"title":"has / has_cs / finish: the assertions the skill tests are built from","explain":"ok and fail print a line and bump a counter. has runs a case-insensitive extended-regex grep over a file and records pass or fail; has_cs is the case-sensitive form. finish prints the totals and returns non-zero if anything failed.","why":"Shows what the skill acceptance tests can and cannot prove: they only check that a phrase is present in the skill text. They never run the flow or watch what an agent does.","kind":"tests","lines":["PASS=0; FAIL=0","ok()  { echo \"  ✓ $1\"; PASS=$((PASS + 1)); }","fail(){ echo \"  ✗ $1\"; FAIL=$((FAIL + 1)); }","","# has \u003cfile> \u003cextended-regex> \u003clabel> — case-insensitive grep assertion.","has() { grep -qiE \"$2\" \"$1\" && ok \"$3\" || fail \"$3\"; }","","# has_cs \u003cfile> \u003cextended-regex> \u003clabel> — case-sensitive variant.","has_cs() { grep -qE \"$2\" \"$1\" && ok \"$3\" || fail \"$3\"; }","","finish() { echo \"\"; echo \"$PASS passed, $FAIL failed.\"; [ \"$FAIL\" -eq 0 ]; }"],"uses":[]},{"node":"fixloop","file":"scripts/test-qa-skill.sh","from":19,"to":22,"title":"qa skill test: fix-loop rules","explain":"Four greps over skills/qa.md require the phrases 'regression test', '/investigate', 're-run' or 're-verify', and 'two reverts'.","why":"Keeps the fix loop's rules in the text: a regression test per fix, diagnosis through /investigate, re-running the probe, and the stop rule. The revert count and the 30-fix cap are tracked by the agent, not by code.","kind":"tests","lines":["has \"$S\" 'regression test'                      \"regression test before each fix\"","has \"$S\" '/investigate'                         \"diagnoses with /investigate\"","has \"$S\" 're-run|re-verify'                     \"re-verifies after each fix\"","has \"$S\" 'two reverts'                          \"self-regulation stop rule\""],"uses":["scripts/lib/skill-test.sh#has"]},{"node":"fixloop","file":".githooks/pre-commit","from":16,"to":30,"title":"pre-commit hook: lint and mechanical check on staged files","explain":"staged lists the staged files that match a pattern. If an ESLint config exists and ESLint is installed, the staged JS/TS files are linted. Then, if the mechanical check script exists, it runs with --staged. A non-zero exit from either step aborts the commit (set -eu).","why":"Each QA fix is its own commit (fix(qa): QA-NNN), so with hooks enabled every fix is linted and mechanically checked before it lands. The hook does not check the commit message, the regression test, or that the probe was re-run.","kind":"enforces","lines":["# Linters read the working-tree copy, so a partially staged file is checked as edited.","staged() { git diff --cached --name-only --diff-filter=ACMR -z -- \"$@\"; }","","if ls eslint.config.* > /dev/null 2>&1; then","  if [ -x node_modules/.bin/eslint ]; then","    staged '*.js' '*.mjs' '*.cjs' '*.ts' '*.tsx' |","      xargs -0 -r node_modules/.bin/eslint --no-warn-ignored --","  else","    echo \"pre-commit: ESLint configured but not installed — skipping (install deps, e.g. npm ci)\" >&2","  fi","fi","","if [ -f scripts/check-quality-mechanical.sh ]; then","  bash scripts/check-quality-mechanical.sh --staged","fi"],"uses":[]},{"node":"report","file":"scripts/test-qa-skill.sh","from":24,"to":27,"title":"qa skill test: blocked status, summary line, feature-chain wiring","explain":"Greps skills/qa.md for 'blocked' and for 'QA found'. Then greps skills/feature-chain.md for '/qa' and for 'QA'.","why":"Pins that an unreachable surface is reported as blocked, that the report ends with the one-line summary, and that the feature chain calls /qa and repeats that line. The report itself is written by the agent.","kind":"tests","lines":["has \"$S\" 'blocked'                              \"unreachable surface is reported blocked, not passed\"","has \"$S\" 'QA found'                             \"one-line summary for PR body\"","has skills/feature-chain.md '/qa'               \"feature-chain runs /qa\"","has skills/feature-chain.md 'QA'                \"feature-chain Phase 4 summary reports QA\""],"uses":["scripts/lib/skill-test.sh#has"]}],"promptOnly":[{"node":"setup","what":"The agent runs git status --porcelain, picks surfaces from git diff main...HEAD --stat, starts the app the way the repo documents, polls for readiness, and uses only seeded or synthetic data."},{"node":"probe","what":"The agent drives each entry point with good and bad input using the repo's own tools, saves evidence outside the repo, logs each issue as QA-NNN with severity and repro steps, and marks unreachable surfaces blocked."},{"node":"triage","what":"The agent sorts issues by severity, applies the quick, standard or exhaustive tier, defers the rest, and stops here in --report-only mode; the test only checks that the three tier names appear in the skill text."},{"node":"fixloop","what":"The agent follows /investigate for each in-tier issue, writes the failing regression test, fixes, re-runs the probe, commits, and counts reverts and fixes itself to decide when to stop."},{"node":"final","what":"The agent re-runs every probe near a fix plus the happy path on each surface and puts any regression first in the report."},{"node":"report","what":"The agent fills in the report table and summary line, writing docs/\u003cfeature-slug>/qa-report.md inside the feature chain or printing it in chat when standalone."}]},"queue-lifecycle":{"overview":"This flow is almost entirely code. scripts/queue.ts is the CLI, scripts/queue-model.ts holds the state changes as pure functions, scripts/queue-io.ts stores them in queue.db and re-renders queue.md, and queue-task-origin.ts, queue-claim.ts and queue-delivery.ts carry the add, claim and advance commands. The only part left to the agent is the delivery itself: opening the PR, reading checks and merging, which `queue advance` records but does not verify.","refs":[{"node":"add","file":"scripts/queue.ts","from":322,"to":331,"title":"queue add: record one task","explain":"The title is the joined positional words; an empty title prints usage and exits 1. taskOrigin decides whether the add is allowed, and a refusal exits 2. addTask appends the task (or puts it first with --top) with the flags and origin tags merged in. save writes the store, the log gets an 'add' line, and the new id is printed with a drain hint.","why":"This is the entry point of the flow: the owner's request becomes a typed task with an id. Skipping it leaves the request only in chat, where no later step can find it.","kind":"implements","lines":["    case 'add': {","      const title = f.positionals.join(' ').trim();","      if (!title) { console.error('usage: queue add \"\u003ctitle>\" [--parent \u003cid> | --requested \"\u003chuman words>\"] [flags]'); return 1; }","      const origin = taskOrigin(q, f);","      if (!origin.ok) { console.error(origin.error); return 2; }","      q = addTask(q, title, { top: f.bools.has('top'), ...withOrigin(taskOverrides(f), origin.patch) });","      save(q); log(`add ${title}`);","      const t = q.tasks[f.bools.has('top') ? 0 : q.tasks.length - 1];","      console.log(`added ${t.id}${t.mode === 'chain' ? ' (chain)' : ''} — ${title}${drainKick(q)}`); return 0;","    }"],"uses":["scripts/queue-io.ts#save","scripts/queue-io.ts#log","scripts/queue-gates.ts#drainKick","scripts/queue-model.ts#addTask","scripts/queue-cli-args.ts#taskOverrides","scripts/queue-task-origin.ts#taskOrigin","scripts/queue-task-origin.ts#withOrigin"]},{"node":"add","file":"scripts/queue-task-origin.ts","from":20,"to":35,"title":"taskOrigin: refuse an agent's add without the owner's words","explain":"It reads the --parent and --requested flags. An unknown parent id is an error. With neither flag, it checks the environment for agent markers such as CLAUDECODE or CODEX_THREAD_ID: an agent session is refused with the AGENT_ADD_REFUSAL message, a human passes. Otherwise it returns tags and a note that record the parent or the quoted request on the task.","why":"This is the check behind 'only the owner creates tasks'. Without it an agent could grow the backlog with its own ideas. The comment at the top of the file notes the quote is not authenticated, so this is a guardrail, not proof.","kind":"enforces","lines":["/**"," * Resolve where a new task comes from. Humans need no flags. An agent must name an existing parent"," * task or quote the human's request; either is recorded on the task (a `parent:\u003cid>` or"," * `requested-by:human` tag plus a note) so reviewers can trace every task to its human owner."," */","export function taskOrigin(q: Queue, f: Parsed, env: NodeJS.ProcessEnv = process.env): Origin {","  const parent = flagValue(f, 'parent');","  const requested = flagValue(f, 'requested');","  if (parent && !q.tasks.some(t => t.id === parent)) return { ok: false, error: `queue add: --parent ${parent} is not a task in this queue` };","  if (!parent && !requested) return isAgentSession(env) ? { ok: false, error: AGENT_ADD_REFUSAL } : { ok: true, patch: {} };","  return { ok: true, patch: originPatch(parent, requested) };","}","","const AGENT_ADD_REFUSAL = 'queue add: tasks are human-owned. From an agent session, add a task only when a human asked for it: '","  + 'pass --requested \"\u003cthe human\\'s own words>\" (add --parent \u003ctask-id> to record lineage). '","  + 'Record findings on the existing task (note, checkpoint, evidence) and ask the human before adding new work.';"],"uses":["scripts/queue-task-origin.ts#isAgentSession","scripts/queue-task-origin.ts#Origin","scripts/queue-task-origin.ts#originPatch","scripts/queue-task-origin.ts#flagValue","scripts/queue-cli-args.ts#Parsed","scripts/queue-model.ts#Queue"]},{"node":"add","file":"scripts/queue-io.ts","from":215,"to":230,"title":"renderView: rewrite queue.md from the store on every save","explain":"Unless told to discard edits, it first checks that queue.md was not hand-edited since the last render. It serializes the queue to Markdown and records the text's sha256 in the store. After the transaction commits it writes a temp file and renames it over queue.md.","why":"queue.db is the store and queue.md is its readable view; this keeps the two in step on each change. The rename means a reader never sees half a file, and the hash check stops a save from silently overwriting hand edits.","kind":"implements","lines":["/**"," * Record the view `q` (the store's contents) renders to, and write it once the"," * transaction commits: via a temp file + rename, so a reader never sees half a file."," */","function renderView(db: DatabaseSync, defer: Defer, q: Queue, { discardEdits = false } = {}): void {","  const p = resolve(queueFile());","  if (!discardEdits) assertViewUnedited(db, p);","  const md = serializeQueue(q);","  recordRender(db, p, sha256(md));","  defer(() => {","    mkdirSync(dirname(p), { recursive: true });","    const tmp = `${p}.${process.pid}.tmp`;","    writeFileSync(tmp, md);","    renameSync(tmp, p);","  });","}"],"uses":["scripts/queue-io.ts#queueFile","scripts/queue-io.ts#sha256","scripts/queue-io.ts#assertViewUnedited","scripts/queue-model.ts#Queue","scripts/queue-model.ts#serializeQueue","scripts/queue-db.ts#Defer","scripts/queue-db.ts#recordRender"]},{"node":"pending","file":"scripts/queue-model.ts","from":763,"to":773,"title":"isEligible and deadlocked: the kinds of waiting","explain":"isEligible is true for a pending task that is not held, is allowed by the delivery gate, and whose every dependency is done. deadlocked lists pending tasks with a dependency that failed, which can never become eligible on their own.","why":"These two predicates are the eligible, waiting and held states of a pending task. tick uses deadlocked to say why an idle queue is stuck.","kind":"implements","lines":["/** A pending task is eligible only when it isn't held and every dependency is done. */","export function isEligible(task: Task, q: Queue): boolean {","  return task.status === 'pending' && !task.held && deliveryAllows(q, task.id)","    && task.dependsOn.every(d => q.tasks.find(x => x.id === d)?.status === 'done');","}","","/** Pending tasks blocked by a dependency that failed (can never become eligible). */","export function deadlocked(q: Queue): Task[] {","  return q.tasks.filter(t => t.status === 'pending'","    && t.dependsOn.some(d => q.tasks.find(x => x.id === d)?.status === 'failed'));","}"],"uses":["scripts/queue-model.ts#Task","scripts/queue-model.ts#Queue","scripts/queue-model.ts#deliveryAllows"]},{"node":"pending","file":"scripts/queue-model.ts","from":813,"to":822,"title":"nextActionable: resume the active task, else the top eligible one","explain":"A stopped queue returns null. Otherwise it returns the first active task the delivery gate allows; if there is none, the first eligible task in list order; else null.","why":"Line order in the queue is the priority, and this is where that order is applied. An already active task is always resumed before anything new starts.","kind":"implements","lines":["/**"," * The single task a serial worker should act on now: resume an active task if one"," * exists, else the topmost eligible pending task. Null if stopped or drained."," */","export function nextActionable(q: Queue): Task | null {","  if (q.config.status === 'stopped') return null;","  return q.tasks.find(t => t.status === 'active' && deliveryAllows(q, t.id))","    ?? q.tasks.find(t => isEligible(t, q))","    ?? null;","}"],"uses":["scripts/queue-model.ts#Task","scripts/queue-model.ts#Queue","scripts/queue-model.ts#deliveryAllows","scripts/queue-model.ts#isEligible"]},{"node":"active","file":"scripts/queue.ts","from":127,"to":149,"title":"queue tick: start the next task and print it","explain":"It runs dispatchGate and returns its exit code if blocked. It asks nextActionable for a task; with none it prints IDLE (naming tasks stuck behind a failed dependency) and exits 3. A pending task is begun, the delivery task is latched, the queue is saved, and the task block is printed with the done/fail commands. Exit 0.","why":"This is the serial loop's entry: one call moves the top task from pending to active. The exit codes let a driver tell 'work started' from idle, paused, stopped, conflict and delivery pending without parsing text.","kind":"implements","lines":["function cmdTick(q: Queue): number {","  const gate = dispatchGate(q);","  if (gate.blocked !== null) return gate.blocked;","  q = gate.queue;","  const t = nextActionable(q);","  if (!t) {","    const stuck = deadlocked(q);","    console.log(stuck.length","      ? `queue: IDLE — ${stuck.length} task(s) blocked by a failed dependency: ${stuck.map(x => x.id).join(', ')}`","      : 'queue: IDLE — no eligible tasks');","    save(q);","    return EXIT.IDLE;","  }","  if (t.status === 'pending') { q = beginTask(q, t.id, now(), t.owner); log(`begin ${t.id}`); }","  q = selectDelivery(q, t.id);","  save(q);","  const current = q.tasks.find(x => x.id === t.id)!;","  console.log(`queue: working ${t.id}\\n${taskBlock(current)}\\n`","    + (q.config.deliveryMode === 'batch' ? 'Delivery: legacy batch.\\n'","      : 'Delivery: per-task; root must complete the PR/merge cycle before advance.\\n')","    + `When finished: node scripts/queue.ts done ${t.id}  (or fail ${t.id} \"\u003creason>\")`);","  return EXIT.DISPATCHED;","}"],"uses":["scripts/queue.ts#EXIT","scripts/queue.ts#dispatchGate","scripts/queue-io.ts#now","scripts/queue-io.ts#save","scripts/queue-io.ts#log","scripts/queue-model.ts#Queue","scripts/queue-model.ts#beginTask","scripts/queue-model.ts#selectDelivery","scripts/queue-model.ts#deadlocked","scripts/queue-model.ts#nextActionable","scripts/queue-model.ts#taskBlock"]},{"node":"active","file":"scripts/queue-claim.ts","from":22,"to":38,"title":"queue claim: give a pending task to a worker or slot","explain":"refusal rejects a task that is not pending, is held, or is blocked by an unfinished delivery cycle. branchFlag rejects a --branch value that is not one name. The worker name comes from --worker, else a name built from the process id. One save marks the task active with that owner and, when given, links the branch in the same write.","why":"This is how a slot takes a task: the task's owner becomes the slot id. Linking the branch in the same write means a task is never active with an unlinked branch.","kind":"implements","lines":["/**"," * `queue claim \u003cid> [--worker w] [--branch b]`. Returns the process exit code. The caller passes its task"," * printer, so consumers whose queue keeps `taskBlock` in another module sync this file unchanged."," */","export function cmdClaim(q: Queue, id: string, flags: Map\u003cstring, string>, taskBlock: (t: Task) => string): number {","  const t = q.tasks.find(x => x.id === id)!;","  const refused = refusal(q, t);","  if (refused) { (refused.stderr ? console.error : console.log)(refused.message); return 1; }","  const branch = branchFlag(flags);","  if (branch === null) { console.error('claim: --branch needs one branch name'); return 1; }","  const worker = flags.get('worker') ?? `worker-${process.pid}`;","  const on = branch ? ` on ${branch}` : '';","  save(branch ? setField(beginTask(q, id, now(), worker), id, { branch }) : beginTask(q, id, now(), worker));","  log(`claim ${id} by ${worker}${on}`);","  console.log(`claimed ${id} for ${worker}${on}\\n${taskBlock({ ...t, owner: worker, branch: branch || t.branch })}`);","  return 0;","}"],"uses":["scripts/queue-claim.ts#refusal","scripts/queue-claim.ts#branchFlag","scripts/queue-io.ts#now","scripts/queue-io.ts#save","scripts/queue-io.ts#log","scripts/queue-model.ts#Task","scripts/queue-model.ts#Queue","scripts/queue-model.ts#setField","scripts/queue-model.ts#beginTask","scripts/queue-model.ts#taskBlock"]},{"node":"active","file":"scripts/queue.ts","from":99,"to":125,"title":"dispatchGate: stop on a pause, an expired lease or a pending delivery","explain":"It auto-resumes a usage pause whose time has come. A stopped queue returns exit 4 (paused until a time) or 5 (stopped). Any active task older than leaseMinutes prints OWNERSHIP CONFLICT and returns 6 without touching the claim. In per-task mode, a latched delivery task with nothing actionable returns 7.","why":"tick and ready call this first. An expired lease stops dispatch and is reported; it is never reclaimed, because the queue cannot know whether the worker is still running.","kind":"enforces","lines":["/**"," * Auto-resume a due usage pause, then report whether the queue is drainable."," * Returns a blocking EXIT code for pauses or ambiguous ownership, or null to proceed."," */","function dispatchGate(q: Queue): { queue: Queue; blocked: number | null } {","  const due = resumeIfDue(q, now());","  if (due.resumed) { q = due.queue; save(q); log('auto-resumed (usage window reopened)'); }","  if (q.config.status === 'stopped') {","    if (q.config.resumeAt) {","      console.log(`queue: PAUSED until ${q.config.resumeAt} (usage window) — auto-resumes after`);","      return { queue: q, blocked: EXIT.PAUSED };","    }","    console.log('queue: STOPPED — run `queue start` to resume');","    return { queue: q, blocked: EXIT.STOPPED };","  }","  const expired = staleLeases(q, now(), q.config.leaseMinutes);","  if (expired.length) {","    console.log(`queue: OWNERSHIP CONFLICT — expired lease(s) remain active: ${expired","      .map(t => t.id).join(', ')}. Do not reclaim or dispatch; resolve ownership explicitly.`);","    return { queue: q, blocked: EXIT.CONFLICT };","  }","  if (q.config.deliveryMode !== 'batch' && q.config.deliveryTask && !nextActionable(q)) {","    console.log(`queue: DELIVERY PENDING — ${q.config.deliveryTask}; finish its PR/merge cycle and fresh branch, then advance`);","    return { queue: q, blocked: EXIT.DELIVERY };","  }","  return { queue: q, blocked: null };","}"],"uses":["scripts/queue.ts#EXIT","scripts/queue.ts#dispatch","scripts/queue-io.ts#now","scripts/queue-io.ts#save","scripts/queue-io.ts#log","scripts/queue-model.ts#Queue","scripts/queue-model.ts#resumeIfDue","scripts/queue-model.ts#staleLeases","scripts/queue-model.ts#nextActionable"]},{"node":"outcome","file":"scripts/queue.ts","from":165,"to":198,"title":"queue done: validate, complete, archive","explain":"If the task has a validate command and --skip-validate is absent, it runs it with the queue lock released, reloads the queue, and aborts if the task changed meanwhile. A failed validation records a failure and exits 1. Otherwise it marks the task done, removes every done task no unfinished task depends on, appends those to archive.md, and logs it.","why":"Done is decided by the validate command, not by the worker's say-so. The reload check stops a long validation from overwriting a change another process made.","kind":"implements","lines":["function cmdDone(q: Queue, id: string, skip: boolean): number {","  const t = q.tasks.find(x => x.id === id);","  if (!t) { console.error(`done: unknown task id ${id}`); return 1; }","  if (t.validate && !skip) {","    const r = unlocked(() => runValidate(t));","    q = load();","    const refreshed = q.tasks.find(task => task.id === id);","    if (!refreshed || !isDeepStrictEqual(t, refreshed)) {","      console.error(`done: ${id} changed during validation; inspect and retry`);","      return 1;","    }","    if (!r.ok) {","      const res = recordFailure(q, id, `validation failed: ${r.tail}`, q.config.maxFailures, now());","      save(res.queue);","      log(`validate-fail ${id} (${res.failures}/${q.config.maxFailures})`);","      console.log(`✗ validation failed for ${id} → ${res.terminal ? 'failed' : 'retry'} (${r.tail})`);","      return 1;","    }","  }","  // Complete the task, then archive it out of the live queue right away — plus any","  // earlier done task this completion just freed (one whose last unfinished","  // dependent was this one). A done task still depended on by unfinished work is","  // kept until that work finishes, so dependency resolution never breaks.","  let dq = markDone(selectDelivery(q, id), id, now());","  const sweep = archivableDone(dq);","  for (const s of sweep) dq = removeTask(dq, s.id);","  save(dq);","  if (sweep.length) appendArchive(sweep);","  const archivedSelf = sweep.some(s => s.id === id);","  log(`done ${id}${sweep.length ? ` → archived ${sweep.map(s => s.id).join(', ')}` : ''}`);","  console.log(`✓ ${id} done${t.validate && !skip ? ' (validation passed)' : ''}`","    + (archivedSelf ? ' → archived' : ' (kept: still a dependency)'));","  return 0;","}"],"uses":["scripts/queue.ts#runValidate","scripts/queue-io.ts#now","scripts/queue-io.ts#unlocked","scripts/queue-io.ts#load","scripts/queue-io.ts#save","scripts/queue-io.ts#log","scripts/queue-io.ts#appendArchive","scripts/queue-model.ts#Queue","scripts/queue-model.ts#removeTask","scripts/queue-model.ts#markDone","scripts/queue-model.ts#recordFailure","scripts/queue-model.ts#selectDelivery"]},{"node":"outcome","file":"scripts/queue-model.ts","from":518,"to":542,"title":"recordFailure: retry until maxFailures, then failed","explain":"It adds one to the task's failure count and stores the reason as the note. Below maxFailures the task goes back to pending and moves to the end of the list; at maxFailures it becomes failed and keeps its place. Owner, worktree and lease are cleared and elapsed time is banked either way.","why":"This is the retry-or-failed branch of the outcome. Moving a retry to the back lets other work run first; a failed task stays visible until requeue or archive.","kind":"implements","lines":["/**"," * Record a failure. The task retries (moved to the back of the line, still"," * pending) until it reaches maxFailures, then goes terminal `failed`. Either way"," * its worktree/owner are released. Returns the new queue plus whether it went"," * terminal and the running failure count."," */","export function recordFailure(","  q: Queue, id: string, reason: string | null, maxFailures: number, nowIso: string,","): { queue: Queue; terminal: boolean; failures: number } {","  const task = q.tasks.find(t => t.id === id);","  if (!task) return { queue: q, terminal: false, failures: 0 };","  q = selectDelivery(q, id);","  if (q.config.deliveryTask === id) q = setConfig(q, { deliveryAccepted: false });","  const failures = task.failures + 1;","  const terminal = failures >= maxFailures;","  const updated: Task = {","    ...task, failures, note: reason ?? task.note,","    status: terminal ? 'failed' : 'pending', owner: null, worktree: null, startedAt: null,","    elapsedSecs: bankSession(task, nowIso),","  };","  const rest = q.tasks.filter(t => t.id !== id);","  // terminal keeps position; a retry drops to the back so other work proceeds first.","  const tasks = terminal ? q.tasks.map(t => (t.id === id ? updated : t)) : [...rest, updated];","  return { queue: withTasks(q, tasks), terminal, failures };","}"],"uses":["scripts/queue-model.ts#Task","scripts/queue-model.ts#Queue","scripts/queue-model.ts#bankSession","scripts/queue-model.ts#withTasks","scripts/queue-model.ts#setConfig","scripts/queue-model.ts#selectDelivery"]},{"node":"outcome","file":"scripts/queue-model.ts","from":775,"to":793,"title":"archivableDone: which done tasks may leave the queue","explain":"It collects the ids that any pending or active task lists as a dependency. It returns the done tasks not in that set. Failed tasks are never returned.","why":"Dependencies are resolved against the live queue, so archiving a done task that pending work depends on would block that work forever. That is why a done task sometimes stays.","kind":"implements","lines":["/**"," * Completed (`done`) tasks that may be archived out of the live queue right now."," * `isEligible` resolves a task's `deps` against the *live* queue, so a done task is"," * still needed while any unfinished (pending/active) task depends on it — archiving"," * it early would deadlock that dependent. So a done task is archivable only once no"," * unfinished task lists it as a dependency; a chain therefore archives from the"," * leaves inward as each dependent finishes. Failed tasks are never returned — they"," * stay visible so `deadlocked()` can still report dependents blocked by a failed"," * dependency (sweep them explicitly with `queue archive`)."," */","export function archivableDone(q: Queue): Task[] {","  const neededByUnfinished = new Set\u003cstring>();","  for (const t of q.tasks) {","    if (t.status === 'pending' || t.status === 'active') {","      for (const d of t.dependsOn) neededByUnfinished.add(d);","    }","  }","  return q.tasks.filter(t => t.status === 'done' && !neededByUnfinished.has(t.id));","}"],"uses":["scripts/queue-model.ts#Task","scripts/queue-model.ts#Queue","scripts/queue-model.ts#isEligible","scripts/queue-model.ts#deadlocked"]},{"node":"deliver","file":"scripts/queue-model.ts","from":750,"to":761,"title":"selectDelivery and deliveryAllows: one task per delivery cycle","explain":"selectDelivery stores the task id in config.deliveryTask unless the mode is batch or a task is already selected. deliveryAllows answers whether a given task may start: always in batch mode; otherwise only when nothing is selected or it is the selected task.","why":"The selection lives in config, so it survives the task being marked done and archived. That is what holds the queue until the PR cycle is acknowledged.","kind":"enforces","lines":["/** Persist the current cycle independently of task status and archive lifetime. */","export function selectDelivery(q: Queue, id: string): Queue {","  return q.config.deliveryMode === 'batch' || q.config.deliveryTask ? q","    : setConfig(q, { deliveryTask: id, deliveryAccepted: false });","}","","/** Admission gate shared by selectors and explicit claim surfaces. */","export function deliveryAllows(q: Queue, id: string): boolean {","  if (q.config.deliveryMode === 'batch') return true;","  const selected = q.config.deliveryTask || q.tasks.find(t => t.status === 'active')?.id;","  return !selected || selected === id;","}"],"uses":["scripts/queue-model.ts#Queue","scripts/queue-model.ts#setConfig"]},{"node":"deliver","file":"scripts/queue-delivery.ts","from":9,"to":27,"title":"queue advance: record the merged PR and the fresh branch","explain":"It refuses unless the id is the selected delivery task, that task was accepted as done, no task is active, --pr looks like a pull request URL and --branch is not empty. On success it clears deliveryTask and deliveryAccepted, saves, and writes the PR and branch to the log.","why":"This closes the delivery cycle so the queue will hand out the next task. The code checks only the queue's own state and the URL's shape; it does not ask GitHub whether the PR merged, so the orchestrator vouches for that.","kind":"implements","lines":["/**"," * `queue advance \u003cid> --pr \u003curl> --branch \u003cfresh>` — an audited attestation, not a"," * remote check: the queue verifies its own state (selected task completed and"," * accepted, no active claims) and records the PR and fresh branch the root vouches for."," */","export function cmdAdvance(q: Queue, id: string, pr: string, branch: string): number {","  const task = q.tasks.find(t => t.id === id);","  if (!id || q.config.deliveryTask !== id || !q.config.deliveryAccepted || (task && task.status !== 'done')","      || q.tasks.some(t => t.status === 'active')","      || !MERGED_PR_URL.test(pr) || !branch.trim()) {","    console.error('advance: requires selected completed task, no active claims, --pr \u003cmerged-pr-url> and --branch \u003cfresh-working-branch>');","    return 1;","  }","  const advanced = setConfig(q, { deliveryTask: '', deliveryAccepted: false });","  save(advanced);","  log(`advance ${id}: root attests authorized validated merge ${pr}; fresh branch ${branch}`);","  console.log(`delivery acknowledged for ${id}; external merge/validation evidence is root-owned${drainKick(advanced)}`);","  return 0;","}"],"uses":["scripts/queue-delivery.ts#MERGED_PR_URL","scripts/queue-io.ts#save","scripts/queue-io.ts#log","scripts/queue-model.ts#Queue","scripts/queue-model.ts#setConfig","scripts/queue-gates.ts#drainKick"]},{"node":"deliver","file":"scripts/queue-delivery.test.ts","from":42,"to":60,"title":"Test: tick exits 7 until advance is given a PR and a branch","explain":"With two tasks, tick starts the first and claim or begin on the second is refused. After done, tick and ready exit 7 and signal exits 3. advance fails for the wrong task and without --pr/--branch, then succeeds, and the next tick starts the second task.","why":"It pins the rule that a done task still holds the queue and that exit 7 means delivery pending, not drained.","kind":"tests","lines":["try {","  ok('add-many', 'First', 'Second');","  ok('tick');","  assert.notEqual(run('claim', 'task-002').status, 0);","  assert.notEqual(run('begin', 'task-002').status, 0);","  ok('done', 'task-001');","  ok('start'); // Start is not acknowledgment of a completed delivery cycle.","  assert.equal(run('tick').status, 7);","  assert.equal(run('ready').status, 7);","  assert.equal(run('signal').status, 3);","  assert.notEqual(run('advance', 'task-002', '--pr', 'https://github.com/a/b/pull/1', '--branch', 'feat/next').status, 0);","  assert.notEqual(run('advance', 'task-001').status, 0);","  ok('advance', 'task-001', '--pr', 'https://github.com/a/b/pull/1', '--branch', 'feat/next');","  assert.match(ok('tick'), /working task-002/);","  for (let i = 0; i \u003c 3; i++) ok('fail', 'task-002', 'red');","  ok('archive');","  assert.notEqual(run('advance', 'task-002', '--pr', 'https://github.com/a/b/pull/2', '--branch', 'feat/next').status, 0);","  assert.equal(run('tick').status, 7);","} finally { rmSync(dir, { recursive: true, force: true }); }"],"uses":["scripts/queue-delivery.test.ts#done","scripts/queue-delivery.test.ts#dir","scripts/queue-delivery.test.ts#run"]}],"promptOnly":[]},"retro":{"overview":"Retro is almost entirely agent-followed prose: skills/retro.md is the whole procedure and no script reconstructs a session, traces causes, ranks findings, builds the report or routes the chosen work. The only retro-specific files with any effect are the thin wrappers and the RESOLVER row that make /retro reachable and carry its 'only when the user requests' description. There is no retro test script; the generic skill validator (scripts/check-resolvable.ts) covers its registration like any other skill.","refs":[{"node":"reconstruct","file":".claude/skills/retro/SKILL.md","from":1,"to":5,"title":"Claude wrapper: retro runs only on request","explain":"The frontmatter description begins 'Use only when the user requests a session retrospective' and ends 'present proposals before changes'. The last line includes the canonical body skills/retro.md.","why":"The first stage says retro runs only when the user asks for it. This description is the text a harness reads when deciding whether to activate the skill, and the RESOLVER row for retro matches only the literal /retro command. Nothing in code blocks an unrequested run; it rests on this wording. Rebuilding the session from the conversation or a log is done by the agent; no script reads session logs.","kind":"implements","lines":["---","description: Use only when the user requests a session retrospective to identify evidence-backed improvements to agent tooling, checks, navigation, and steering; present proposals before changes","---","","@../../../skills/retro.md"],"uses":[]}],"promptOnly":[{"node":"trace","what":"The agent reads repo instructions, skills, check commands, hooks and CI wiring itself and ties each struggle to an environmental cause."},{"node":"classify","what":"The agent sorts findings into the category table in the skill, keeps one durable remedy per finding, and ranks by impact, recurrence and cost."},{"node":"report","what":"The agent writes the R-01 style table with evidence, cause, proposed change, cost and verification, and makes no edits; the read-only rule is not enforced by code."},{"node":"route","what":"After the user picks remedies the agent hands each to the named skill (skillify, add-linter, feature-chain, upstream, improve, code-refiner or prune); there is no dispatcher."}]},"review-gates":{"overview":"Most of this flow is prose: the two reviewers, the merge of findings, the single fixer and the re-verify loop are all carried out by agents reading skills/code-refiner.md, skills/validate.md and skills/simplify.md. The code that exists is the deterministic part of the structural review (scripts/check-quality-mechanical.sh, run by .githooks/pre-commit and .github/workflows/quality.yml), a few shell tests that pin the wording of the skills, and the queue's per-task validate command. No code in the repo writes, reads or compares a verification receipt; CI simply runs everything on every pull request.","refs":[{"node":"gather","file":"scripts/check-quality-mechanical.sh","from":194,"to":212,"title":"File selection: explicit files, staged files, or the diff against main","explain":"collect reads file names from stdin and keeps those with a source extension (js, mjs, ts, tsx, sh, py, rb, go). With --staged the names come from the git index; with arguments the given files are used as is; with nothing they come from git diff main...HEAD. Each selected file is then passed to check_file.","why":"This is the same diff the flow gathers (git diff main...HEAD), but only for the mechanical check. The diff and file contents handed to the two reviewers are gathered by the agent, not by this script.","kind":"implements","lines":["# Resolve files: explicit args, staged files, or files changed vs main.","# A read loop rather than mapfile, so this runs on macOS's bash 3.2 (the hook","# ships to consumers' machines), and the loop guard keeps an empty set safe there.","SOURCE_RE='\\.(js|mjs|ts|tsx|sh|py|rb|go)$'","FILES=()","collect() { while IFS= read -r f; do FILES+=(\"$f\"); done \u003c \u003c(grep -E \"$SOURCE_RE\" || true); }","if [ \"${1:-}\" = \"--staged\" ]; then","  collect \u003c \u003c(git diff --cached --name-only --diff-filter=ACMR 2>/dev/null)","elif [ $# -gt 0 ]; then","  FILES=(\"$@\")","else","  collect \u003c \u003c(git diff main...HEAD --name-only 2>/dev/null)","fi","","if [ ${#FILES[@]} -gt 0 ]; then","  for f in \"${FILES[@]}\"; do","    check_file \"$f\"","  done","fi"],"uses":["scripts/check-quality-mechanical.sh#check_file"]},{"node":"reviewers","file":"scripts/check-quality-mechanical.sh","from":63,"to":73,"title":"check_file: 500-line file length limit","explain":"Counts the lines in the file. If the count is over MAX_LINES (500) and the file has no 'quality-ok: file-length' pragma, it prints a Readability/major violation with a file:line citation and adds one to the violation count.","why":"Carries out the rubric's file-length criterion, which the structure reviewer may not override. Without it the limit would depend on a model noticing a long file.","kind":"implements","lines":["  # File length. A `quality-ok: file-length — \u003creason>` pragma anywhere in the file","  # (by convention on the first non-shebang line) blesses a genuinely cohesive file","  # that reads as one unit and would only be fragmented by a split. Like the","  # magic-number pragma, the keyword is the gate; the required reason is enforced at","  # review time, not parsed here. Commented-out-code has no such escape hatch.","  local count","  count=$(wc -l \u003c \"$file\")","  if [ \"$count\" -gt \"$MAX_LINES\" ] \\","     && ! grep -Eq '(#|//)[[:space:]]*quality-ok:[[:space:]]*file-length' \"$file\"; then","    emit \"${file}:${MAX_LINES} [Readability/major] file is ${count} lines — exceeds ${MAX_LINES}-line limit; split into cohesive modules (or add a 'quality-ok: file-length — \u003creason>' pragma if it is one cohesive unit)\"","  fi"],"uses":["scripts/check-quality-mechanical.sh#emit","scripts/lib/skill-test.sh#has"]},{"node":"reviewers","file":"scripts/check-quality-mechanical.sh","from":167,"to":175,"title":"check_file: flag magic numbers","explain":"After the earlier skips (comments, named constants, test files, return/exit, pragma) and after quoted strings are stripped, the line is matched against a pattern for a bare integer of two or more digits. A match prints a Readability/minor violation with file:line. The pragma flag is then reset for the next line.","why":"Carries out the rubric's 'no magic numbers' criterion as a script, so the structure review's mechanical findings are repeatable.","kind":"implements","lines":["    # Flag bare integers ≥2 digits that are not array indices or lone 0/1.","    # Bash ERE in [[ =~ ]] supports {2,}; the regex lives in a variable so it","    # is matched as a pattern (no subprocess vs the old echo|grep).","    local magic_re='[^a-zA-Z0-9_.\"'\\''][0-9]{2,}[^a-zA-Z0-9_.]'","    if [[ \"$scan\" =~ $magic_re ]]; then","      emit \"${file}:${lineno} [Readability/minor] magic number — extract to a named constant (or use quality-ok: magic-number pragma if the value is self-documenting)\"","    fi","    prev_quality_ok=0","  done \u003c \"$file\""],"uses":["scripts/check-quality-mechanical.sh#emit"]},{"node":"reviewers","file":"scripts/check-quality-mechanical.sh","from":177,"to":191,"title":"check_file: flag commented-out code","explain":"Reads the file again line by line. A line counts as commented code when it starts with // or # followed by a code keyword such as function, const, return or if. When two such lines are consecutive it prints a Clarity/minor violation for the second one.","why":"Carries out the rubric's 'no commented-out code' criterion. This one has no pragma, so the code must be deleted.","kind":"implements","lines":["  # Commented-out code: two or more consecutive lines starting with // or #","  # that look like code (contain common code tokens).","  local prev_was_comment=0","  lineno=0","  while IFS= read -r line; do","    lineno=$((lineno + 1))","    if [[ \"$line\" =~ ^[[:space:]]*(//|#)[[:space:]]*(function|const|let|var|return|if|for|while|class|import|export|}) ]]; then","      if [ \"$prev_was_comment\" -eq 1 ]; then","        emit \"${file}:${lineno} [Clarity/minor] commented-out code block — delete dead code instead of archiving inline\"","      fi","      prev_was_comment=1","    else","      prev_was_comment=0","    fi","  done \u003c \"$file\""],"uses":["scripts/check-quality-mechanical.sh#emit"]},{"node":"reviewers","file":"scripts/test-rubric-format.sh","from":22,"to":37,"title":"Rubric format test: the four dimensions and scoring rules must be present","explain":"Each check greps lib/code-quality-rubric.md for one pattern and counts a pass or fail. This block requires the four dimension headings (Quality, Readability, Encapsulation, Clarity), the citation rule, the score formula, the weights, and the inline-override rules.","why":"The structure reviewer scores against this rubric file. The test stops the rubric from losing a dimension or its scoring rule; it does not check any score a reviewer gives.","kind":"tests","lines":["check \"file exists\"                      \".\"","check \"persona preamble present\"         \"thoughtful senior engineer|joy to read|asks nothing unnecessary\"","check \"Quality dimension heading\"        \"^## 1\\. Quality\"","check \"Readability dimension heading\"    \"^## 2\\. Readability\"","check \"Encapsulation dimension heading\"  \"^## 3\\. Encapsulation\"","check \"Clarity dimension heading\"        \"^## 4\\. Clarity\"","check \"citation requirement stated\"      \"filename:line|cite.*line|citation\"","check \"score formula present\"            \"Score.*10|10.*violation|Σ\"","check \"weight declarations present\"      \"minor|major|critical\"","check \"common failure table present\"     \"^\\| .* \\| .* \\| .*\\|\"","check \"parameter count criterion\"        \"parameter|param\"","check \"reader load criterion\"            \"reader|cognitive|hold.
