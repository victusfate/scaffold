n agent does.","kind":"tests","lines":["PASS=0; FAIL=0","ok()  { echo \"  ✓ $1\"; PASS=$((PASS + 1)); }","fail(){ echo \"  ✗ $1\"; FAIL=$((FAIL + 1)); }","","# has \u003cfile> \u003cextended-regex> \u003clabel> — case-insensitive grep assertion.","has() { grep -qiE \"$2\" \"$1\" && ok \"$3\" || fail \"$3\"; }","","# has_cs \u003cfile> \u003cextended-regex> \u003clabel> — case-sensitive variant.","has_cs() { grep -qE \"$2\" \"$1\" && ok \"$3\" || fail \"$3\"; }","","finish() { echo \"\"; echo \"$PASS passed, $FAIL failed.\"; [ \"$FAIL\" -eq 0 ]; }"],"uses":[]},{"node":"hypothesis","file":"scripts/test-investigate-skill.sh","from":14,"to":17,"title":"investigate skill test: single hypothesis, one change at a time, failing test first","explain":"Greps skills/investigate.md for a 'Phase 3 ... Hypothes' heading, a 'Phase 4 ... Fix' heading, the phrase 'one variable at a time' (or 'one change at a time'), and 'failing test'.","why":"Pins the Hypothesis rule (one variable at a time) and the Fix rule (failing test first) in the text. No code checks that only one thing was changed or that the test failed before the fix.","kind":"tests","lines":["has \"$S\" 'Phase 3.*Hypothes'                     \"phase 3: single hypothesis\"","has \"$S\" 'Phase 4.*Fix'                          \"phase 4: fix\"","has \"$S\" 'one (variable|change) at a time'       \"test one change at a time\"","has \"$S\" 'failing test'                          \"failing regression test before fix\""],"uses":["scripts/lib/skill-test.sh#has"]},{"node":"verify","file":"scripts/test-investigate-skill.sh","from":18,"to":21,"title":"investigate skill test: three-fix stop, architecture question, evidence, flakes","explain":"Greps skills/investigate.md for 'three failed fixes' (or a close variant), 'architecture', 'evidence' and 'flak'.","why":"Keeps the stop-after-three rule, the design question for the user, the evidence-before-claims table and the 'flaky is not a root cause' note in the text. The attempt count is kept by the agent.","kind":"tests","lines":["has \"$S\" 'three (failed )?fixes|3 failed fixes'  \"stop after three failed fixes\"","has \"$S\" 'architecture'                          \"escalate to architecture question\"","has \"$S\" 'evidence'                              \"evidence-before-claims gate\"","has \"$S\" 'flak'                                  \"flake is not a root cause\""],"uses":["scripts/lib/skill-test.sh#has"]},{"node":"fix","file":"scripts/test-investigate-skill.sh","from":22,"to":25,"title":"investigate skill test: links from create-pr and tdd","explain":"Greps skills/create-pr.md and skills/tdd.md for '/investigate'. finish then prints the totals and fails the script if any assertion failed.","why":"The Fix stage hands the regression test to /tdd, and /tdd and /create-pr send unexpected failures back here. This keeps those links from being removed from the other skills.","kind":"tests","lines":["has skills/create-pr.md '/investigate'           \"create-pr Step 2 diagnoses with /investigate\"","has skills/tdd.md '/investigate'                 \"tdd routes unexpected failures to /investigate\"","","finish"],"uses":["scripts/lib/skill-test.sh#has","scripts/lib/skill-test.sh#finish"]}],"promptOnly":[{"node":"repro","what":"The agent reads the full error, writes down the exact reproducing command, checks git log and git diff main...HEAD and the environment, logs what crosses each boundary, and traces back to the first divergence."},{"node":"compare","what":"The agent finds similar working code in the repo, lists every difference from the broken path, and notes what the broken path assumes."},{"node":"hypothesis","what":"The agent writes one 'X is the root cause because Y' statement and tests it with the smallest change, forming a new hypothesis instead of stacking changes when it is refuted."},{"node":"fix","what":"The agent writes the smallest failing regression test in the repo's test style, confirms it fails for the named reason, then makes one fix at the root cause with no other edits."},{"node":"verify","what":"The agent re-runs the new test, the original command and the nearby suite in the same turn, counts failed attempts itself, stops after three to raise the design question, and writes the six-line report."}]},"loop-tick":{"overview":"The tick itself is a list of steps the orchestrator follows from skills/loop.md; no script runs the six stages in order. Code supplies the pieces each step calls: scripts/agent-loop-*.ts is the external driver that fires runs, scripts/topology.ts validates the slot file, and the queue CLI (scripts/queue.ts, queue-claim.ts, queue-worktrees.ts, queue-model.ts, queue-links.ts, queue-lanes.ts) records claims, results, parks and heartbeats. Choosing a task for a slot, reviewing work, comparing live subagents with tasks and the per-tick probe are agent judgment; the repo ships no probe script.","refs":[{"node":"wake","file":"scripts/agent-loop-runner.ts","from":30,"to":56,"title":"supervise: the external driver's run loop","explain":"The detached supervisor loops while no stop was requested, the lifetime has not expired and failures are under the limit. Each pass it marks a run as started, calls execute to run the configured command, then records the outcome and resets or raises the failure count. A result of complete or blocked ends the loop; otherwise the next run is set one interval after this run finished.","why":"This is the external driver that fires a tick when no native /loop is available. The interval is counted from the end of a run, so it restarts ended work and never overlaps or paces a run that is still going.","kind":"implements","lines":["    while (!stopRequest(dir, generation) && Date.now() \u003c config.expiresAt && progress.failures \u003c config.maxFailures) {","      if (Date.now() \u003c next) { await delay(Math.min(HEARTBEAT_MS, next - Date.now())); continue; }","      progress.running = true;","      progress.startedAt = Date.now();","      progress.runs++;","      publish();","      const result = await execute(config, dir, progress.runs, session);","      if (result.directive?.resume) {","        session = result.directive.resume;","        config.session = session;","        save(dir, 'config.json', config);","      }","      progress.outcome = result.outcome;","      progress.directive = result.directive;","      progress.finishedAt = Date.now();","      progress.running = false;","      progress.failures = progress.outcome === 'exit 0' ? 0 : progress.failures + 1;","      publish();","      if (config.requireResult && !result.directive) { terminalReason = result.outcome; break; }","      if (result.directive?.status === 'complete') { terminalReason = 'completed'; break; }","      if (result.directive?.status === 'blocked') {","        progress.failures++;","        terminalReason = 'blocked';","        break;","      }","      next = Date.now() + config.interval;","    }"],"uses":["scripts/agent-loop-runner.ts#HEARTBEAT_MS","scripts/agent-loop-process.ts#execute","scripts/agent-loop-state.ts#save","scripts/agent-loop-state.ts#stopRequest","scripts/agent-loop-state.ts#status"]},{"node":"topology","file":"scripts/topology.ts","from":89,"to":99,"title":"parseTopology: validate the topology object","explain":"It rejects anything that is not a JSON object and any key outside orchestrator, tick_minutes and slots. It parses the orchestrator, defaults the tick to 10 minutes and requires a positive number. It then parses the slot list, which defaults to empty.","why":"Step 1 of the tick: an invalid topology must be reported as a blocker. Without this a typo in the file would silently change which slots exist.","kind":"enforces","lines":["/** Validate a parsed JSON value. Throws TopologyError naming the first problem. */","export function parseTopology(raw: unknown): Topology {","  if (!isObject(raw)) throw new TopologyError('topology must be a JSON object');","  rejectUnknown(raw, TOP_KEYS, 'topology');","  const orchestrator = parseOrchestrator(raw.orchestrator);","  const tick = raw.tick_minutes ?? DEFAULT_TICK_MINUTES;","  if (typeof tick !== 'number' || !Number.isFinite(tick) || tick \u003c= 0) {","    throw new TopologyError('tick_minutes must be a positive number');","  }","  return { orchestrator, tickMinutes: tick, slots: parseSlots(raw.slots ?? []) };","}"],"uses":["scripts/topology.ts#Topology","scripts/topology.ts#TopologyError","scripts/topology.ts#DEFAULT_TICK_MINUTES","scripts/topology.ts#TOP_KEYS","scripts/topology.ts#isObject","scripts/topology.ts#rejectUnknown","scripts/topology.ts#parseOrchestrator","scripts/topology.ts#parseSlots"]},{"node":"topology","file":"scripts/topology.ts","from":101,"to":117,"title":"loadTopology and CLI: read the file, exit 1 on error","explain":"loadTopology returns the default (an orchestrator and no slots) when the file is missing. Otherwise it parses the JSON and validates it, turning a parse failure into a TopologyError. The CLI entry prints the topology as JSON, or prints the error and exits 1.","why":"This is the `node scripts/topology.ts` command the tick runs. It carries both branches of the stage: no file means the orchestrator works alone, a bad file stops with a named error.","kind":"implements","lines":["/** Read and validate the topology file; a missing file is the default (orchestrator only). */","export function loadTopology(path: string = process.env.TOPOLOGY_FILE ?? TOPOLOGY_PATH): Topology {","  if (!existsSync(path)) return defaultTopology();","  let raw: unknown;","  try { raw = JSON.parse(readFileSync(path, 'utf8')); }","  catch (error) { throw new TopologyError(`${path}: invalid JSON (${(error as Error).message})`); }","  return parseTopology(raw);","}","","function main(argv: string[]): void {","  try { process.stdout.write(`${JSON.stringify(loadTopology(argv[0]), null, 2)}\\n`); }","  catch (error) {","    if (!(error instanceof TopologyError)) throw error;","    process.stderr.write(`topology: ${error.message}\\n`);","    process.exit(1);","  }","}"],"uses":["scripts/topology.ts#Topology","scripts/topology.ts#TopologyError","scripts/topology.ts#TOPOLOGY_PATH","scripts/topology.ts#defaultTopology","scripts/topology.ts#parseTopology"]},{"node":"review","file":"scripts/queue-lanes.ts","from":122,"to":133,"title":"lane finish: worker reports done, claim stays","explain":"It requires the task to be active and owned by the worker named in --worker. It then writes the lane sidecar with state awaiting-review and logs that root review is required. The task status and owner are not changed.","why":"A finished slot does not close its own task; the orchestrator reviews it first. Without this a worker could mark its own work done and skip review.","kind":"enforces","lines":["  if (sub === 'finish') {","    const task = q.tasks.find(t => t.id === id)!;","    const worker = f.flags.get('worker');","    if (task.status !== 'active' || !worker || task.owner !== worker) {","      console.error('lane finish: active task and matching --worker required');","      return 1;","    }","    beatLane(id, { worker, state: 'awaiting-review', step: 'worker finished', tail: f.flags.get('tail') });","    log(`lane finish ${id} by ${worker}; root review required`);","    console.log(`worker finished ${id}; claim retained for root review`);","    return 0;","  }"],"uses":["scripts/queue-lanes.ts#beatLane","scripts/queue-io.ts#log"]},{"node":"review","file":"scripts/queue.ts","from":165,"to":198,"title":"done: validate, mark done, archive","explain":"If the task has a validate command it runs it outside the queue lock, reloads the queue and refuses if the task changed meanwhile. A failed validation is recorded as a failure and the command exits 1. Otherwise the task is marked done, and it and any done task it just freed are moved to the archive.","why":"This sets the `done` status after review. The validate run means a task cannot be closed while its own check fails.","kind":"implements","lines":["function cmdDone(q: Queue, id: string, skip: boolean): number {","  const t = q.tasks.find(x => x.id === id);","  if (!t) { console.error(`done: unknown task id ${id}`); return 1; }","  if (t.validate && !skip) {","    const r = unlocked(() => runValidate(t));","    q = load();","    const refreshed = q.tasks.find(task => task.id === id);","    if (!refreshed || !isDeepStrictEqual(t, refreshed)) {","      console.error(`done: ${id} changed during validation; inspect and retry`);","      return 1;","    }","    if (!r.ok) {","      const res = recordFailure(q, id, `validation failed: ${r.tail}`, q.config.maxFailures, now());","      save(res.queue);","      log(`validate-fail ${id} (${res.failures}/${q.config.maxFailures})`);","      console.log(`✗ validation failed for ${id} → ${res.terminal ? 'failed' : 'retry'} (${r.tail})`);","      return 1;","    }","  }","  // Complete the task, then archive it out of the live queue right away — plus any","  // earlier done task this completion just freed (one whose last unfinished","  // dependent was this one). A done task still depended on by unfinished work is","  // kept until that work finishes, so dependency resolution never breaks.","  let dq = markDone(selectDelivery(q, id), id, now());","  const sweep = archivableDone(dq);","  for (const s of sweep) dq = removeTask(dq, s.id);","  save(dq);","  if (sweep.length) appendArchive(sweep);","  const archivedSelf = sweep.some(s => s.id === id);","  log(`done ${id}${sweep.length ? ` → archived ${sweep.map(s => s.id).join(', ')}` : ''}`);","  console.log(`✓ ${id} done${t.validate && !skip ? ' (validation passed)' : ''}`","    + (archivedSelf ? ' → archived' : ' (kept: still a dependency)'));","  return 0;","}"],"uses":["scripts/queue.ts#runValidate","scripts/queue-io.ts#now","scripts/queue-io.ts#unlocked","scripts/queue-io.ts#load","scripts/queue-io.ts#save","scripts/queue-io.ts#log","scripts/queue-io.ts#appendArchive","scripts/queue-model.ts#Queue","scripts/queue-model.ts#removeTask","scripts/queue-model.ts#markDone","scripts/queue-model.ts#recordFailure","scripts/queue-model.ts#selectDelivery"]},{"node":"review","file":"scripts/queue-model.ts","from":572,"to":588,"title":"parkTask: back to pending, branch and resume note kept","explain":"It does nothing without a branch. For the task it banks the elapsed time if it was active, builds a dated `parked` line from the resume text, and returns the task as pending with owner and start time cleared. The branch is kept and the line is appended to the note.","why":"This is `park --resume`: the slot is released but the work and the next step survive. Without it a stopped lane would either stay falsely active or lose its branch.","kind":"implements","lines":["/**"," * Park a task whose lane stopped with work in hand: it returns to pending (owner and lease cleared,"," * elapsed time banked) but keeps the BRANCH the work lives on, plus a dated resume line in the note,"," * so it renders `[~]` and the next lane resumes there instead of starting over."," */","export function parkTask(q: Queue, id: string, branch: string, resume: string, nowIso: string): Queue {","  if (!branch) return q;","  return mapTask(q, id, t => {","    const banked = t.status === 'active' ? bankSession(t, nowIso) : t.elapsedSecs;","    const line = `parked ${nowIso.slice(0, ISO_DATE_LEN)}: ${resume || 'resume on ' + branch}`;","    return {","      ...t, status: t.status === 'active' || t.status === 'pending' ? 'pending' : t.status,","      owner: null, startedAt: null, elapsedSecs: banked, branch,","      note: t.note ? `${t.note} | ${line}` : line,","    };","  });","}"],"uses":["scripts/queue-model.ts#Queue","scripts/queue-model.ts#ISO_DATE_LEN","scripts/queue-model.ts#bankSession","scripts/queue-model.ts#mapTask"]},{"node":"dispatch","file":"scripts/queue-console-slots.ts","from":23,"to":32,"title":"slotViews: a slot is busy when an active task is owned by its id","explain":"It takes the active tasks and, for each topology slot, picks those whose owner equals the slot id. The slot is busy if there is at least one and overbooked if there is more than one. The matching lane heartbeat, if any, is attached as detail.","why":"This is the rule 'free = no active task owned by its id', as the console's Slots panel computes it. The agent applies the same rule by reading the queue; the panel is only as true as the claims.","kind":"implements","lines":["export function slotViews(q: Queue, topology: Topology, lanes: LaneView[] = []): { slots: SlotView[]; orphans: ConsoleOrphan[] } {","  const active = q.tasks.filter(t => t.status === 'active');","  const slots = topology.slots.map(slot => {","    const mine = active.filter(t => t.owner === slot.id);","    const lane = lanes.find(l => mine.some(t => t.id === l.id)) ?? null;","    return {","      ...slot, busy: mine.length > 0, overbooked: mine.length > 1, lane,","      tasks: mine.map(t => ({ id: t.id, title: t.title, startedAt: t.startedAt })),","    };","  });"],"uses":["scripts/queue-console-slots.ts#SlotView","scripts/queue-console-slots.ts#ConsoleOrphan","scripts/topology.ts#Topology","scripts/queue-model.ts#Queue","scripts/queue-console.ts#LaneView"]},{"node":"dispatch","file":"scripts/queue-worktrees.ts","from":24,"to":44,"title":"worktree add: isolated checkout on queue/\u003cid>","explain":"It finds the task, picks the base branch from config or the current branch, and runs `git worktree add` on a new branch queue/\u003cid>, reusing the branch if it exists. It records the branch and worktree path on the task. It prints the first steps for the lane, including a fast-forward-only merge of the base.","why":"The worktree is created before the claim so the slot has an isolated checkout and a branch to link. The CLI never merges back; the orchestrator integrates.","kind":"implements","lines":["function cmdWorktreeAdd(q: Queue, id: string): number {","  const t = q.tasks.find(x => x.id === id);","  if (!t) { console.error(`worktree add: unknown task id ${id}`); return 1; }","  const base = q.config.integrationBranch || currentBranch();","  const branch = `queue/${id}`;","  const rel = wtRel(id);","  const abs = join(ROOT, rel);","  let baseSha: string;","  try {","    try { git(`worktree add ${abs} -b ${branch} ${base}`); }","    catch { git(`worktree add ${abs} ${branch}`); } // branch already exists","    baseSha = git(`rev-parse ${base}`);","  } catch (e) { console.error(`worktree add failed: ${(e as Error).message}`); return 1; }","  save(setField(q, id, { branch, worktree: rel }));","  log(`worktree add ${id} → ${rel} (${branch} off ${base} @ ${baseSha})`);","  console.log(`worktree ready: ${rel}  on ${branch}  (base ${base} @ ${baseSha})\\n`","    + `First step in the lane: \\`git merge --ff-only ${base}\\` (a reused branch may be stale); stop if it cannot fast-forward. `","    + `cd ${rel} to work in isolation; commit locally and report the tip. `","    + `The root reviews, integrates into ${base}, finalizes the claim and removes the worktree.`);","  return 0;","}"],"uses":["scripts/queue-worktrees.ts#git","scripts/queue-worktrees.ts#currentBranch","scripts/queue-worktrees.ts#wtRel","scripts/queue-io.ts#ROOT","scripts/queue-io.ts#save","scripts/queue-io.ts#log","scripts/queue-model.ts#Queue","scripts/queue-model.ts#setField"]},{"node":"dispatch","file":"scripts/queue-claim.ts","from":26,"to":38,"title":"claim: give a pending task to a slot and link its branch","explain":"It refuses unless the task is pending, not held, and allowed by the current delivery cycle. It checks that --branch is a single name. It then saves one write that marks the task active, sets the owner to the --worker value and stores the branch.","why":"This is `claim \u003cid> --worker \u003cslot> --branch \u003cb>`. Owner and branch land in the same write, so a slot's task is never active with an unlinked branch.","kind":"implements","lines":["export function cmdClaim(q: Queue, id: string, flags: Map\u003cstring, string>, taskBlock: (t: Task) => string): number {","  const t = q.tasks.find(x => x.id === id)!;","  const refused = refusal(q, t);","  if (refused) { (refused.stderr ? console.error : console.log)(refused.message); return 1; }","  const branch = branchFlag(flags);","  if (branch === null) { console.error('claim: --branch needs one branch name'); return 1; }","  const worker = flags.get('worker') ?? `worker-${process.pid}`;","  const on = branch ? ` on ${branch}` : '';","  save(branch ? setField(beginTask(q, id, now(), worker), id, { branch }) : beginTask(q, id, now(), worker));","  log(`claim ${id} by ${worker}${on}`);","  console.log(`claimed ${id} for ${worker}${on}\\n${taskBlock({ ...t, owner: worker, branch: branch || t.branch })}`);","  return 0;","}"],"uses":["scripts/queue-claim.ts#refusal","scripts/queue-claim.ts#branchFlag","scripts/queue-io.ts#now","scripts/queue-io.ts#save","scripts/queue-io.ts#log","scripts/queue-model.ts#Task","scripts/queue-model.ts#Queue","scripts/queue-model.ts#setField","scripts/queue-model.ts#beginTask","scripts/queue-model.ts#taskBlock"]},{"node":"reconcile","file":"scripts/queue-console-slots.ts","from":33,"to":37,"title":"slotViews: find orphan owners","explain":"It builds the set of slot ids. When the topology has slots, every active task with no owner, or an owner that is not a slot id, is listed as an orphan. The slots and orphans are returned together.","why":"Reconcile says an active task whose owner is not a slot must be adopted or parked. This surfaces those tasks; the agent still does the adopting or parking.","kind":"implements","lines":["  const ids = new Set(topology.slots.map(s => s.id));","  const orphans = topology.slots.length === 0 ? [] : active.filter(t => !t.owner || !ids.has(t.owner))","    .map(t => ({ id: t.id, title: t.title, owner: t.owner }));","  return { slots, orphans };","}"],"uses":[]},{"node":"reconcile","file":"scripts/queue.ts","from":103,"to":125,"title":"dispatchGate: stop dispatch on pause or expired lease","explain":"It first resumes a usage pause whose time has passed. If the queue is stopped or paused it returns a blocking exit code. If any active task has been held longer than the lease it prints OWNERSHIP CONFLICT and blocks. It also blocks while a delivery cycle is unfinished.","why":"An active task with no live owner is a mismatch the tick must resolve before starting more work. The gate blocks `tick` and `ready` instead of reclaiming the task, so ambiguous ownership is never taken over by code.","kind":"enforces","lines":["function dispatchGate(q: Queue): { queue: Queue; blocked: number | null } {","  const due = resumeIfDue(q, now());","  if (due.resumed) { q = due.queue; save(q); log('auto-resumed (usage window reopened)'); }","  if (q.config.status === 'stopped') {","    if (q.config.resumeAt) {","      console.log(`queue: PAUSED until ${q.config.resumeAt} (usage window) — auto-resumes after`);","      return { queue: q, blocked: EXIT.PAUSED };","    }","    console.log('queue: STOPPED — run `queue start` to resume');","    return { queue: q, blocked: EXIT.STOPPED };","  }","  const expired = staleLeases(q, now(), q.config.leaseMinutes);","  if (expired.length) {","    console.log(`queue: OWNERSHIP CONFLICT — expired lease(s) remain active: ${expired","      .map(t => t.id).join(', ')}. Do not reclaim or dispatch; resolve ownership explicitly.`);","    return { queue: q, blocked: EXIT.CONFLICT };","  }","  if (q.config.deliveryMode !== 'batch' && q.config.deliveryTask && !nextActionable(q)) {","    console.log(`queue: DELIVERY PENDING — ${q.config.deliveryTask}; finish its PR/merge cycle and fresh branch, then advance`);","    return { queue: q, blocked: EXIT.DELIVERY };","  }","  return { queue: q, blocked: null };","}"],"uses":["scripts/queue.ts#EXIT","scripts/queue.ts#dispatch","scripts/queue-io.ts#now","scripts/queue-io.ts#save","scripts/queue-io.ts#log","scripts/queue-model.ts#Queue","scripts/queue-model.ts#resumeIfDue","scripts/queue-model.ts#staleLeases","scripts/queue-model.ts#nextActionable"]},{"node":"reconcile","file":"scripts/queue-links.ts","from":20,"to":29,"title":"queue links: report or clear links to deleted branches","explain":"It lists unfinished tasks whose linked branch is not a local branch. With none it prints OK and exits 0. Otherwise it prints each dangling link and exits 1, or with --fix clears the branch field and saves.","why":"Housekeeping after reconcile: a task must link only a live branch. A stale link would mislead the next dispatch and the branch count.","kind":"enforces","lines":["export function cmdLinks(q: Queue, fix: boolean, branches: ReadonlySet\u003cstring> = localBranches()): number {","  const stale = danglingLinks(q, branches);","  if (stale.length === 0) { console.log('queue links: every task branch link names a live branch'); return 0; }","  for (const s of stale) console.log(`${fix ? 'cleared' : 'DANGLING'} ${s.id} -> ${s.branch} (branch gone)`);","  if (!fix) { console.log('queue links: run `queue links --fix` to clear them (tasks keep their status)'); return 1; }","  let next = q;","  for (const s of stale) next = setField(next, s.id, { branch: '' });","  save(next); log(`links: cleared ${stale.length} dangling branch link(s)`);","  return 0;","}"],"uses":["scripts/queue-links.ts#danglingLinks","scripts/queue-links.ts#localBranches","scripts/queue-io.ts#save","scripts/queue-io.ts#log","scripts/queue-model.ts#Queue","scripts/queue-model.ts#setField"]},{"node":"supervise","file":"scripts/queue-lanes.ts","from":52,"to":71,"title":"beatLane: heartbeat with the current step","explain":"It reads the lane's sidecar file or starts a blank one stamped with a start time. It merges in the worker, model, step, state and output tail it was given. It stamps updatedAt and writes the file.","why":"The heartbeat carries the step and a tail of output, not just a timestamp. That is what lets the orchestrator ask whether a job advanced since the last tick; the comparison itself is done by the agent.","kind":"implements","lines":["/**"," * Record a heartbeat for a lane: merge the patch over the existing sidecar"," * (or a blank), stamp updatedAt. First beat also stamps startedAt."," */","export function beatLane(id: string, patch: LanePatch = {}): LaneState {","  mkdirSync(laneDir(), { recursive: true });","  const prev = existsSync(lanePath(id)) ? readOne(lanePath(id)) : null;","  const base = prev ?? { ...blank(id), startedAt: now() };","  const next: LaneState = {","    ...base,","    worker: patch.worker ?? base.worker,","    model: patch.model ?? base.model,","    step: patch.step ?? base.step,","    state: patch.state ?? base.state,","    tail: patch.tail ?? base.tail,","    updatedAt: now(),","  };","  writeFileSync(lanePath(id), JSON.stringify(next, null, 2) + '\\n');","  return next;","}"],"uses":["scripts/queue-lanes.ts#LaneState","scripts/queue-lanes.ts#LanePatch","scripts/queue-lanes.ts#laneDir","scripts/queue-lanes.ts#lanePath","scripts/queue-lanes.ts#blank","scripts/queue-lanes.ts#readOne","scripts/queue-io.ts#sidecar","scripts/queue-io.ts#now"]},{"node":"supervise","file":"scripts/agent-loop-process.ts","from":24,"to":36,"title":"readDirective: a run must report continue, complete or blocked","explain":"It reads the result file the run was told to write. It returns nothing unless the file is a JSON object whose status is continue, complete or blocked and whose summary is a non-empty string. An optional resume id is kept.","why":"With --require-result the driver treats a missing or malformed result as a failure, so exit code 0 alone is not counted as progress. This is the one place code checks progress instead of liveness.","kind":"enforces","lines":["export function readDirective(path: string): AgentDirective | undefined {","  if (!existsSync(path)) return;","  try {","    const value = JSON.parse(readFileSync(path, 'utf8')) as unknown;","    if (!isRecord(value)) return;","    const { status, summary, resume } = value;","    if (!isDirectiveStatus(status)) return;","    if (typeof summary !== 'string' || !summary.trim()) return;","    const directive: AgentDirective = { status, summary: summary.trim() };","    if (typeof resume === 'string' && resume.trim()) directive.resume = resume.trim();","    return directive;","  } catch { return; }","}"],"uses":["scripts/agent-loop-process.ts#isRecord","scripts/agent-loop-process.ts#isDirectiveStatus","scripts/agent-loop-state.ts#AgentDirective","scripts/agent-loop-state.ts#status"]}],"promptOnly":[]},"mind-meld":{"overview":"Most of the recorded dive is code: scripts/mind-meld.ts is the CLI and reference adapter, scripts/mind-meld-sandbox.ts runs code in Docker, scripts/mind-meld-schema.ts validates the bundle, and scripts/mind-meld-viewer.ts and scripts/mind-meld-pages.ts render it. That code only covers the tiny reference example (scripts/mind-meld-example.ts); adapters for a real stack are left to each repo. Choosing the question and writing the narration are done by the agent from the skill text. The default static map (scripts/mind-meld-map.ts, scripts/mind-meld-langs.ts) is also code, but this diagram has no stage for it.","refs":[{"node":"adapters","file":"scripts/mind-meld.ts","from":42,"to":66,"title":"index(): the reference index adapter","explain":"It reads the five mind-meld source files into memory. It parses the example file with the TypeScript compiler and makes one node per exported function, with its start and end line. It then walks each function body and records a static call edge wherever one indexed function calls another. The result is a version 1 bundle with the source text, a hash per file and no runs yet.","why":"This is the \"index adapter\" half of the stage: nodes, static call edges, source bytes and hashes. It only indexes the reference example, so a real repo still has to write its own.","kind":"implements","lines":["export function index(): MeldBundle {","  const tsc = compiler ?? missingTypeScript();","  const sources = Object.fromEntries(IMPLEMENTATION.map(file => [`scripts/${file}`, readFileSync(join(ROOT, 'scripts', file), 'utf8')]));","  const ast = tsc.createSourceFile(EXAMPLE, sources[EXAMPLE], tsc.ScriptTarget.Latest, true, tsc.ScriptKind.TS);","  const functions = ast.statements.filter(tsc.isFunctionDeclaration).filter(f => f.modifiers?.some(m => m.kind === tsc.SyntaxKind.ExportKeyword));","  const nodes: MeldNode[] = functions.map(f => ({","    id: f.name!.text, file: EXAMPLE,","    line: ast.getLineAndCharacterOfPosition(f.getStart(ast)).line + 1,","    endLine: ast.getLineAndCharacterOfPosition(f.getEnd()).line + 1,","    layer: f.name!.text === 'combat' ? 'entry' : 'core',","  }));","  const ids = new Set(nodes.map(n => n.id));","  const edges: MeldEdge[] = [];","  for (const f of functions) {","    function visit(node: ts.Node): void {","      if (tsc.isCallExpression(node) && tsc.isIdentifier(node.expression) && ids.has(node.expression.text)) {","        edges.push({ from: f.name!.text, to: node.expression.text, file: EXAMPLE,","          line: ast.getLineAndCharacterOfPosition(node.getStart(ast)).line + 1, kind: 'call' });","      }","      tsc.forEachChild(node, visit);","    }","    visit(f);","  }","  return { version: 1, nodes, edges, sources, ...sourceManifest(sources), runs: [] };","}"],"uses":["scripts/mind-meld.ts#ROOT","scripts/mind-meld.ts#EXAMPLE","scripts/mind-meld.ts#IMPLEMENTATION","scripts/mind-meld.ts#compiler","scripts/mind-meld.ts#missingTypeScript","scripts/mind-meld-schema.ts#MeldNode","scripts/mind-meld-schema.ts#MeldEdge","scripts/mind-meld-schema.ts#MeldBundle","scripts/mind-meld-schema.ts#text","scripts/mind-meld-schema.ts#sourceManifest"]},{"node":"adapters","file":"scripts/mind-meld.ts","from":96,"to":103,"title":"run_flow / run_piece: only registered targets run","explain":"run_flow accepts one entry name, combat, and throws for anything else. run_piece accepts only the damage target with the fake policy save: memory, and throws otherwise. Both then hand off to the shared run function.","why":"This is the rule that an execution adapter runs only targets it has registered. Without it a question could be turned into an arbitrary command.","kind":"enforces","lines":["export function run_flow(entry: string, value: unknown): MeldRun {","  if (entry !== 'combat') throw new Error('reference flow supports only combat');","  return run('flow', value);","}","export function run_piece(target: string, value: unknown, fakes: { save: string }): MeldRun {","  if (target !== 'damage' || Object.keys(fakes).join(',') !== 'save' || fakes.save !== 'memory') throw new Error('reference piece supports damage with save: memory');","  return run('piece', value);","}"],"uses":["scripts/mind-meld.ts#run","scripts/mind-meld-schema.ts#MeldRun","scripts/mind-meld-pages.ts#value"]},{"node":"adapters","file":"scripts/mind-meld-langs.ts","from":229,"to":244,"title":"loadAdapters: a repo adds its own language adapter","explain":"It looks for .mind-meld/languages in the repo and imports every .ts, .js or .mjs file there. Each default export must have a name, extensions and a facts function, or loading fails with the file name. The repo adapters are placed before the four built-in ones, so a repo can replace a built-in for an extension.","why":"This is how repo-specific code plugs in for the static map. Note it serves the map command; the recorded dive has no equivalent loader, so its adapters are hand-written exports like the reference.","kind":"implements","lines":["const isAdapter = (a: unknown): a is LanguageAdapter => {","  const x = a as Partial\u003cLanguageAdapter> | null;","  return Boolean(x && typeof x.name === 'string' && Array.isArray(x.extensions) && typeof x.facts === 'function');","};","","// The repo's own adapters come first, so a repo can also replace a built-in for an extension.","export async function loadAdapters(root: string): Promise\u003cLanguageAdapter[]> {","  const dir = join(root, REPO_ADAPTERS);","  const files = existsSync(dir) ? readdirSync(dir).filter(f => /\\.(ts|js|mjs)$/.test(f)).sort() : [];","  const repo = await Promise.all(files.map(async f => {","    const adapter = ((await import(pathToFileURL(join(dir, f)).href)) as { default?: unknown }).default;","    if (!isAdapter(adapter)) throw new Error(`${REPO_ADAPTERS}/${f}: default export needs name, extensions and facts()`);","    return adapter;","  }));","  return [...repo, ...BUILT_IN];","}"],"uses":["scripts/mind-meld-langs.ts#LanguageAdapter","scripts/mind-meld-langs.ts#BUILT_IN","scripts/mind-meld-langs.ts#REPO_ADAPTERS"]},{"node":"run","file":"scripts/mind-meld-sandbox.ts","from":19,"to":30,"title":"sandboxArgs: the locked-down docker run command","explain":"It builds the argument list for docker run. The list pins the image by digest and forbids pulling, turns the network off, makes the root read-only, drops all capabilities, runs as an unprivileged user and caps processes, memory and CPU. The source file is mounted read-only and the only writable place is a small temporary /work. The command inside the container is wrapped in timeout so it is killed at the deadline.","why":"These flags are the sandbox the \"Record real runs\" stage promises. Dropping any of them would let recorded code reach the network or write to the repo.","kind":"enforces","lines":["export function sandboxArgs(source: string, name: string, args: string[], timeoutMs = MELD_LIMIT_MS): string[] {","  const file = realpathSync(source);","  if (file.includes(',')) throw new Error('Docker bind path cannot contain commas');","  return [...dockerArgs(), 'run', '--rm', '--pull=never', '--name', name,","    '--network=none', '--read-only', '--cap-drop=ALL', '--security-opt=no-new-privileges',","    '--pids-limit=32', '--memory=128m', '--cpus=1', '--user=65534:65534',","    '--tmpfs=/work:rw,noexec,nosuid,size=16m,mode=1777', '--workdir=/work',","    '--env=HOME=/work', '--env=HTTP_PROXY=', '--env=HTTPS_PROXY=', '--env=ALL_PROXY=',","    '--env=NO_PROXY=', '--env=no_proxy=', '--env=http_proxy=', '--env=https_proxy=', '--env=all_proxy=',","    '--mount', `type=bind,src=${file},dst=/app/example.ts,readonly`,","    MELD_IMAGE, 'timeout', '-s', 'KILL', String(Math.ceil(timeoutMs / MILLISECONDS_PER_SECOND)), 'node', '/app/example.ts', ...args];","}"],"uses":["scripts/mind-meld-sandbox.ts#MELD_IMAGE","scripts/mind-meld-sandbox.ts#MELD_LIMIT_MS","scripts/mind-meld-sandbox.ts#MILLISECONDS_PER_SECOND","scripts/mind-meld-sandbox.ts#dockerArgs"]},{"node":"run","file":"scripts/mind-meld-sandbox.ts","from":53,"to":71,"title":"runSandbox: snapshot, run, clean up","explain":"It rejects a timeout outside the allowed limit and makes a unique container name and a temporary folder. It copies the source into that folder as a read-only file, checking the hash first if one was given, and runs the container. Whether the run worked or not, it then force-removes only the container with that name and deletes the temporary folder. A cleanup error or the run error is thrown; otherwise the output is returned.","why":"This carries out one recorded run and guarantees nothing is left behind. There is no fallback path: if Docker fails, the run fails.","kind":"implements","lines":["/** The only container removed is this invocation's random named child. */","export function runSandbox(source: string, args: string[], timeoutMs = MELD_LIMIT_MS, expectedHash?: string): string {","  if (!Number.isInteger(timeoutMs) || timeoutMs \u003c 1 || timeoutMs > MELD_LIMIT_MS) throw new Error('invalid timeout');","  const name = `mind-meld-${randomUUID()}`;","  const scratch = mkdtempSync(join(tmpdir(), 'mind-meld-'));","  const snapshot = join(scratch, 'example.ts');","  const env = dockerEnvironment();","  let error: Error | undefined;","  let output = '';","  try {","    snapshotSource(source, snapshot, expectedHash);","    output = executeChild(sandboxArgs(snapshot, name, args, timeoutMs), { env, timeoutMs });","  } catch (cause) { error = cause instanceof Error ? cause : new Error(String(cause)); }","  const cleanup = cleanupChild(name, env);","  rmSync(scratch, { recursive: true, force: true });","  if (cleanup) throw cleanup;","  if (error) throw error;","  return output;","}"],"uses":["scripts/mind-meld-sandbox.ts#MELD_LIMIT_MS","scripts/mind-meld-sandbox.ts#sandboxArgs","scripts/mind-meld-sandbox.ts#dockerEnvironment","scripts/mind-meld-sandbox.ts#cleanupChild","scripts/mind-meld-sandbox.ts#snapshotSource","scripts/mind-meld-sandbox.ts#executeChild"]},{"node":"run","file":"scripts/mind-meld-example.ts","from":7,"to":14,"title":"span: how an event gets recorded","explain":"Each instrumented function calls span with its name, its parent event id and its input. span appends a new event, runs the real work, then stores the output and the measured duration on that event. The script prints the output and the full event list as JSON when it ends.","why":"This is where the recording comes from: real calls inside the container, with the parent taken from the actual call. The reference example is the only code instrumented this way.","kind":"implements","lines":["function span(node: string, parent: string | null, input: string, work: () => string): string {","  const event: Event = { id: String(events.length), node, parent, durationMs: 0, input, output: '', changes: [] };","  events.push(event);","  const start = performance.now();","  event.output = work();","  event.durationMs = performance.now() - start;","  return event.output;","}"],"uses":["scripts/mind-meld-example.ts#Event","scripts/mind-meld-example.ts#events","scripts/mind-meld-example.ts#output"]},{"node":"run","file":"scripts/mind-meld.test.ts","from":88,"to":96,"title":"Sandbox probes: no writes, no network, timeout kills","explain":"The first test runs a probe script in the real sandbox that tries to overwrite its own source and open a network connection, and expects both to fail while a save in the temporary folder works. The second runs an endless loop with a 1.5 second limit and expects the sandbox to fail it. Both run only when RUN_MIND_MELD_SANDBOX is set; CI sets it in the mind-meld-sandbox job.","why":"The skill says an execution adapter may not be called working until these probes pass. They are the proof that the sandbox flags do what they claim.","kind":"tests","lines":["void test('real sandbox denies repository writes and external network, allows isolated save', live, () => temp(root => {","  const file = join(root, 'probe.ts');","  writeFileSync(file, `import {writeFileSync} from 'node:fs';\\nimport {connect} from 'node:net';\\ntry {writeFileSync('/app/example.ts','tamper'); throw new Error('writable source');} catch(e) {if (!['EROFS','EACCES'].includes(e.code)) throw e;}\\nwriteFileSync('/work/save.json','isolated');\\nconst socket = connect({host:'1.1.1.1',port:53});\\nsocket.on('connect',()=>{throw new Error('network connected');});\\nsocket.on('error',e=>{if(e.code!=='ENETUNREACH') throw e;console.log('isolated');});`);","  assert.equal(runSandbox(file, []).trim(), 'isolated');","}));","void test('real sandbox kills a timed-out computation', live, () => temp(root => {","  const file = join(root, 'loop.ts'); writeFileSync(file, 'while(true) {}');","  assert.throws(() => runSandbox(file, [], 1500), /sandbox failed/);","}));"],"uses":["scripts/mind-meld.test.ts#live","scripts/mind-meld.test.ts#temp","scripts/mind-meld-sandbox.ts#runSandbox"]},{"node":"bundle","file":"scripts/mind-meld.ts","from":78,"to":95,"title":"cacheKey and run: cache a recording by what could change it","explain":"cacheKey hashes the source snapshot hash, compiler version, image, mode, inputs and fake policy. run checks the inputs, indexes the source and looks the key up in an in-memory cache, returning a copy on a hit. On a miss it runs the sandbox, stamps the result with the key and snapshot hash, and fails if the source changed while it ran. The result is validated as part of a bundle before it is cached.","why":"This is the rule that a recording is never reused under a new source hash. The cache lives only for one process; nothing is stored on disk.","kind":"implements","lines":["/** Includes every execution dependency, runtime/image, inputs, fake policy and schema. */","export function cacheKey(mode: 'flow' | 'piece', value: unknown, snapshot = index()): string {","  const snapshotHash = snapshot.snapshotHash;","  return createHash('sha256').update(JSON.stringify({ version: 1, snapshotHash, compiler: compiler?.version ?? null, image: MELD_IMAGE, mode, inputs: inputs(value), fakes: { save: 'memory' } })).digest('hex');","}","function run(mode: 'flow' | 'piece', value: unknown): MeldRun {","  const normalized = inputs(value);","  const snapshot = index();","  const key = cacheKey(mode, normalized, snapshot);","  const hit = cache.get(key);","  if (hit) return structuredClone(hit);","  const raw = JSON.parse(runSandbox(join(ROOT, EXAMPLE), [mode, JSON.stringify(normalized)], MELD_LIMIT_MS, snapshot.sourceHashes[EXAMPLE])) as Record\u003cstring, unknown>;","  const result = { ...raw, key, snapshotHash: snapshot.snapshotHash, mode, entry: mode === 'flow' ? 'combat' : 'damage' } as MeldRun;","  if (index().snapshotHash !== snapshot.snapshotHash) throw new Error('source changed during execution');","  validateBundle({ ...snapshot, runs: [result] });","  cache.set(key, structuredClone(result));","  return result;","}"],"uses":["scripts/mind-meld.ts#ROOT","scripts/mind-meld.ts#EXAMPLE","scripts/mind-meld.ts#cache","scripts/mind-meld.ts#compiler","scripts/mind-meld.ts#inputs","scripts/mind-meld.ts#index","scripts/mind-meld-sandbox.ts#MELD_IMAGE","scripts/mind-meld-sandbox.ts#MELD_LIMIT_MS","scripts/mind-meld-sandbox.ts#runSandbox","scripts/mind-meld-schema.ts#MeldRun","scripts/mind-meld-schema.ts#validateBundle","scripts/mind-meld-pages.ts#value"]},{"node":"bundle","file":"scripts/mind-meld-schema.ts","from":86,"to":102,"title":"validateBundle: the executable schema","explain":"It requires version 1, then checks the sources for size, the hashes against the source text, the nodes against the sources and the static edges against the nodes. For each run it checks the fields, that the run carries the bundle snapshot hash, that its key is unique and its entry is an indexed node, and then validates its events. Any failed check throws.","why":"Every command validates a bundle with this before it renders, diffs or prints it. Without it a hand-edited or mismatched bundle could be shown as evidence.","kind":"enforces","lines":["export function validateBundle(value: unknown): asserts value is MeldBundle {","  const b = record(value);","  if (b.version !== 1) throw new Error('unsupported Mind Meld version');","  const sources = record(b.sources);","  validateSources(sources);","  validateManifest(b, sources);","  const nodes = validateNodes(b.nodes, sources);","  validateEdges(b.edges, nodes, sources);","  const keys = new Set\u003cstring>();","  for (const item of array(b.runs)) {","    const r = record(item); text(r.key); text(r.entry); text(r.output);","    if (r.snapshotHash !== b.snapshotHash) throw new Error('run belongs to another source snapshot');","    if (keys.has(r.key) || !nodes.has(r.entry)) throw new Error('duplicate run or missing entry');","    if (r.mode !== 'flow' && r.mode !== 'piece') throw new Error('invalid run mode');","    validateEvents(r.events, nodes); keys.add(r.key);","  }","}"],"uses":["scripts/mind-meld-schema.ts#MeldBundle","scripts/mind-meld-schema.ts#record","scripts/mind-meld-schema.ts#text","scripts/mind-meld-schema.ts#array","scripts/mind-meld-schema.ts#validateNodes","scripts/mind-meld-schema.ts#validateEvents","scripts/mind-meld-schema.ts#validateManifest","scripts/mind-meld-schema.ts#validateEdges","scripts/mind-meld-schema.ts#validateSources"]},{"node":"bundle","file":"scripts/mind-meld-schema.ts","from":56,"to":71,"title":"sourceManifest and validateManifest: the snapshot identity","explain":"sourceManifest hashes each source file and then hashes the sorted list of those hashes into one snapshot hash. validateManifest repeats the work on a bundle it is given: it rejects absolute or escaping paths, recomputes every file hash, and compares the recomputed snapshot hash with the one in the bundle.","why":"This binds the embedded source text to the hash that runs are stamped with. It is what makes \"this run belongs to this source\" checkable.","kind":"enforces","lines":["export const sourceHash = (source: string | Buffer): string => createHash('sha256').update(source).digest('hex');","export function sourceManifest(sources: Record\u003cstring, string>): { sourceHashes: Record\u003cstring, string>; snapshotHash: string } {","  const sourceHashes = Object.fromEntries(Object.keys(sources).sort().map(file => [file, sourceHash(sources[file])]));","  return { sourceHashes, snapshotHash: sourceHash(JSON.stringify(sourceHashes)) };","}","function validateManifest(b: Record\u003cstring, unknown>, sources: Record\u003cstring, unknown>): void {","  const hashes = record(b.sourceHashes);","  const checked: Record\u003cstring, string> = {};","  for (const file of Object.keys(sources).sort()) {","    if (!file || file.startsWith('/') || file.includes('\\\\') || file.split('/').some(p => !p || p === '.' || p === '..') || file.includes('\\0')) throw new Error('invalid source path');","    const content = sources[file]; text(content);","    if (hashes[file] !== sourceHash(content)) throw new Error('source hash mismatch');","    checked[file] = String(hashes[file]);","  }","  if (Object.keys(hashes).length !== Object.keys(sources).length || b.snapshotHash !== sourceHash(JSON.stringify(checked))) throw new Error('snapshot hash mismatch');","}"],"uses":["scripts/mind-meld-schema.ts#record","scripts/mind-meld-schema.ts#text"]},{"node":"bundle","file":"scripts/mind-meld.ts","from":104,"to":107,"title":"diff: compare two recorded runs","explain":"For each of the two runs it lists the nodes its events visited in order, its output, and all state changes its events recorded. It returns the six lists side by side and judges nothing.","why":"This is the diff operation of the bundle stage: paths, outputs and state mutations from each run. The agent reads the difference; the code only lays it out.","kind":"implements","lines":["export function diff(a: MeldRun, b: MeldRun): { pathA: string[]; pathB: string[]; outputA: string; outputB: string; changesA: unknown[]; changesB: unknown[] } {","  return { pathA: a.events.map(e => e.node), pathB: b.events.map(e => e.node), outputA: a.output, outputB: b.output,","    changesA: a.events.flatMap(e => e.changes), changesB: b.events.flatMap(e => e.changes) };","}"],"uses":["scripts/mind-meld-schema.ts#MeldRun"]},{"node":"view","file":"scripts/mind-meld.ts","from":68,"to":76,"title":"verifySnapshot: does the recording still match the checkout?","explain":"It validates the bundle, then resolves each recorded file path inside the chosen checkout root. If a path resolves outside the root, or the file on disk hashes differently from the recording, it throws \"stale source snapshot\" with the file name.","why":"This is the verify step. Without it an old tour could be read as a statement about today's code.","kind":"enforces","lines":["/** Verify recorded source bytes against a checkout; offline HTML cannot perform this check. */","export function verifySnapshot(bundle: MeldBundle, root = ROOT): void {","  validateBundle(bundle);","  const base = realpathSync(root);","  for (const [file, hash] of Object.entries(bundle.sourceHashes)) {","    const path = realpathSync(resolve(base, file));","    if (!path.startsWith(base + sep) || sourceHash(readFileSync(path, 'utf8')) !== hash) throw new Error(`stale source snapshot: ${file}`);","  }","}"],"uses":["scripts/mind-meld.ts#ROOT","scripts/mind-meld-schema.ts#MeldBundle","scripts/mind-meld-schema.ts#sourceHash","scripts/mind-meld-schema.ts#validateBundle","scripts/mind-meld-viewer.ts#hash"]},{"node":"view","file":"scripts/mind-meld-viewer.ts","from":138,"to":153,"title":"renderViewer: the one-file offline page","explain":"It validates the bundle and embeds it, with the viewer function, as one inline script. The page carries a Content-Security-Policy that allows only that script and that style by hash and blocks all network connections. The page text states the snapshot hash and that checkout freshness is unknown offline. The same viewer script holds the run selector, the Previous and Next step buttons and the state-key filter.","why":"This is the view command that writes tour.html. The policy is why the page needs no server and cannot fetch anything.","kind":"implements","lines":["export function renderViewer(bundle: MeldBundle): string {","  validateBundle(bundle);","  const data = jsonForScript(bundle);","  const script = stripTypeScriptTypes(`(${viewer.toString()})(${data});`);","  return `\u003c!doctype html>","\u003chtml lang=\"en\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">","\u003cmeta http-equiv=\"Content-Security-Policy\" content=\"default-src 'none'; script-src 'sha256-${hash(script)}'; style-src 'sha256-${hash(STYLE)}'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'\">","\u003ctitle>Mind Meld · recorded code tour\u003c/title>\u003cstyle>${STYLE}\u003c/style>\u003c/head>\u003cbody>","\u003cheader>\u003ch1>Mind Meld\u003c/h1>\u003cp>A learning IDE over recorded execution. Click a node or step to inspect its source.\u003c/p>\u003csmall>Static arrows show possible calls from source. Observed arrows, values and changes come from recorded runs. Narration never supplies edges.\u003c/small>\u003c/header>","\u003cmain>\u003cp id=\"snapshot\">Source snapshot: ${bundle.snapshotHash}. Offline capture; current checkout freshness is unknown. Run the CLI verify command before relying on this tour.\u003c/p>\u003csection>\u003ch2>Structure map\u003c/h2>\u003cdiv id=\"diagram\">\u003c/div>\u003cdiv id=\"graph\">\u003c/div>\u003ch3>Static dependencies (possible calls)\u003c/h3>\u003cul id=\"static-edges\">\u003c/ul>\u003ch3>Observed call edges\u003c/h3>\u003cul id=\"edges\">\u003c/ul>\u003c/section>","\u003cdiv class=\"columns\">\u003csection>\u003ch2>Flow trace &amp; guided tour\u003c/h2>\u003clabel>Recorded run \u003cselect id=\"run\">\u003c/select>\u003c/label>","\u003cbutton id=\"previous\" type=\"button\">Previous step\u003c/button>\u003cbutton id=\"next\" type=\"button\">Next step\u003c/button>\u003cp id=\"position\" aria-live=\"polite\">\u003c/p>\u003col id=\"trace\">\u003c/ol>\u003cpre id=\"values\">\u003c/pre>","\u003ch2>Data flow\u003c/h2>\u003clabel>Follow state key \u003cinput id=\"state\" placeholder=\"e.g. hp\">\u003c/label>\u003col id=\"changes\">\u003c/ol>\u003c/section>","\u003caside>\u003ch2>Source\u003c/h2>\u003cp id=\"citation\" aria-live=\"polite\">\u003c/p>\u003cpre>\u003ccode id=\"source\">\u003c/code>\u003c/pre>\u003c/aside>\u003c/div>\u003c/main>","\u003cscript>${script}\u003c/script>\u003c/body>\u003c/html>`;","}"],"uses":["scripts/mind-meld-viewer.ts#viewer","scripts/mind-meld-viewer.ts#STYLE","scripts/mind-meld-viewer.ts#hash","scripts/mind-meld-schema.ts#MeldBundle","scripts/mind-meld-schema.ts#validateBundle","scripts/json-script.ts#jsonForScript"]},{"node":"view","file":"scripts/mind-meld-pages.ts","from":85,"to":104,"title":"bundleToSpec: the same evidence as a markdown page","explain":"It validates the bundle and turns each indexed function into a page entry with its source link, static calls, recorded calls and source excerpt. If there are runs, the arrows are only the recorded parent-to-child calls; if there are none, the arrows are the static calls, labelled as not observed. The spec is checked before it is returned for rendering.","why":"This is the pages command. Every line comes from an indexed span or a recorded event, so the page cannot contain narration or invented steps.","kind":"implements","lines":["export function bundleToSpec(bundle: MeldBundle, options: PageOptions): ExplorerSpec {","  validateBundle(bundle);","  const entries = [...new Set(bundle.runs.map(r => r.entry))];","  const lanes = laneOrder(bundle);","  const spec: ExplorerSpec = {","    title: options.title ?? `Mind meld: ${entries.join(', ') || 'index'}`,","    lede: lede(bundle),","    lanes: lanes.map(id => ({ id, name: id })),","    // Stages follow lane order so a reader meets the entry point first.","    nodes: Object.fromEntries(lanes.flatMap(lane => bundle.nodes.filter(n => layerOf(n) === lane))","      .map(n => [n.id, nodeOf(bundle, n, options.sourcePrefix)])),","    flows: bundle.runs.length ? bundle.runs.flatMap(flowOf) : staticFlow(bundle),","    ask: { context: bundle.runs.length","      ? `The reader is learning how ${entries.join(', ')} works in this repo from recorded runs (snapshot ${bundle.snapshotHash}).`","      : `The reader is learning how this repo's code is structured, from a static index (snapshot ${bundle.snapshotHash}).` },","  };","  const problems = validateSpec(spec);","  if (problems.length) throw new Error(`mind-meld pages: ${problems.join('; ')}`);","  return spec;","}"],"uses":["scripts/mind-meld-pages.ts#PageOptions","scripts/mind-meld-pages.ts#layerOf","scripts/mind-meld-pages.ts#nodeOf","scripts/mind-meld-pages.ts#flowOf","scripts/mind-meld-pages.ts#staticFlow","scripts/mind-meld-pages.ts#laneOrder","scripts/mind-meld-pages.ts#lede","scripts/explorer-spec.ts#ExplorerSpec","scripts/explorer-spec.ts#validateSpec","scripts/mind-meld-schema.ts#MeldBundle","scripts/mind-meld-schema.ts#validateBundle"]}],"promptOnly":[{"node":"question","what":"The agent names the question, finds the real entry point, test and state owner by reading source, and picks a flow to record; no script helps choose."},{"node":"tour","what":"The agent writes the narration from the two prompts in the skill and must cite file:line and event ids; the code only steps through recorded events in the viewer and never checks or stores narration."},{"node":"adapters","what":"Adapters for a real stack (Rust, Godot and so on) are written by hand in the child repo following the contract table; scaffold ships only the reference adapter for its own example."}]},"orchestration":{"overview":"About half of this flow is code, and nearly all of it is the queue CLI: scripts/queue.ts with queue-task-origin.ts, queue-claim.ts, queue-worktrees.ts, queue-lanes.ts and queue-delivery.ts, plus scripts/topology.ts for the slots. The code records who owns which task and refuses out-of-order moves. Choosing a slot, starting the subagent, merging the target into the lane, merging the lane, opening the PR and the squash merge are all done by the agent from prose; the code never merges or pushes.","refs":[{"node":"request","file":"scripts/queue-task-origin.ts","from":20,"to":35,"title":"taskOrigin: refuse an agent's add without the owner's words","explain":"It reads the --parent and --requested flags. An unknown parent id is an error. With neither flag, it checks the environment for agent markers such as CLAUDECODE or CODEX_THREAD_ID: an agent session is refused with the AGENT_ADD_REFUSAL message, a human passes. Otherwise it returns tags and a note that record the parent or the quoted request on the task.","why":"This is the check behind 'only the owner creates tasks'. Without it an agent could grow the backlog with its own ideas. The comment at the top of the file notes the quote is not authenticated, so this is a guardrail, not proof.","kind":"enforces","lines":["/**"," * Resolve where a new task comes from. Humans need no flags. An agent must name an existing parent"," * task or quote the human's request; either is recorded on the task (a `parent:\u003cid>` or"," * `requested-by:human` tag plus a note) so reviewers can trace every task to its human owner."," */","export function taskOrigin(q: Queue, f: Parsed, env: NodeJS.ProcessEnv = process.env): Origin {","  const parent = flagValue(f, 'parent');","  const requested = flagValue(f, 'requested');","  if (parent && !q.tasks.some(t => t.id === parent)) return { ok: false, error: `queue add: --parent ${parent} is not a task in this queue` };","  if (!parent && !requested) return isAgentSession(env) ? { ok: false, error: AGENT_ADD_REFUSAL } : { ok: true, patch: {} };","  return { ok: true, patch: originPatch(parent, requested) };","}","","const AGENT_ADD_REFUSAL = 'queue add: tasks are human-owned. From an agent session, add a task only when a human asked for it: '","  + 'pass --requested \"\u003cthe human\\'s own words>\" (add --parent \u003ctask-id> to record lineage). '","  + 'Record findings on the existing task (note, checkpoint, evidence) and ask the human before adding new work.';"],"uses":["scripts/queue-task-origin.ts#isAgentSession","scripts/queue-task-origin.ts#Origin","scripts/queue-task-origin.ts#originPatch","scripts/queue-task-origin.ts#flagValue","scripts/queue-cli-args.ts#Parsed","scripts/queue-model.ts#Queue"]},{"node":"request","file":"scripts/queue.ts","from":322,"to":331,"title":"queue add: record one task","explain":"The title is the joined positional words; an empty title prints usage and exits 1. taskOrigin decides whether the add is allowed, and a refusal exits 2. addTask appends the task (or puts it first with --top) with the flags and origin tags merged in. save writes the store, the log gets an 'add' line, and the new id is printed with a drain hint.","why":"This is the entry point of the flow: the owner's request becomes a typed task with an id. Skipping it leaves the request only in chat, where no later step can find it.","kind":"implements","lines":["    case 'add': {","      const title = f.positionals.join(' ').trim();","      if (!title) { console.error('usage: queue add \"\u003ctitle>\" [--parent \u003cid> | --requested \"\u003chuman words>\"] [flags]'); return 1; }","      const origin = taskOrigin(q, f);","      if (!origin.ok) { console.error(origin.error); return 2; }","      q = addTask(q, title, { top: f.bools.has('top'), ...withOrigin(taskOverrides(f), origin.patch) });","      save(q); log(`add ${title}`);","      const t = q.tasks[f.bools.has('top') ? 0 : q.tasks.length - 1];","      console.log(`added ${t.id}${t.mode === 'chain' ? ' (chain)' : ''} — ${title}${drainKick(q)}`); return 0;","    }"],"uses":["scripts/queue-io.ts#save","scripts/queue-io.ts#log","scripts/queue-gates.ts#drainKick","scripts/queue-model.ts#addTask","scripts/queue-cli-args.ts#taskOverrides","scripts/queue-task-origin.ts#taskOrigin","scripts/queue-task-origin.ts#withOrigin"]},{"node":"dispatch","file":"scripts/topology.ts","from":89,"to":108,"title":"parseTopology and loadTopology: read the worker slots","explain":"parseTopology rejects anything that is not an object or has unknown keys, checks the orchestrator model, defaults tick_minutes to 10 and requires it to be positive, then parses the slots. loadTopology reads .agent/topology.json (or TOPOLOGY_FILE); a missing file means an orchestrator with no slots, and bad JSON throws a TopologyError.","why":"Dispatch starts by reading the slots from this file. The file has no routing fields on purpose: which task suits which slot is the orchestrator's judgment, not code.","kind":"implements","lines":["/** Validate a parsed JSON value. Throws TopologyError naming the first problem. */","export function parseTopology(raw: unknown): Topology {","  if (!isObject(raw)) throw new TopologyError('topology must be a JSON object');","  rejectUnknown(raw, TOP_KEYS, 'topology');","  const orchestrator = parseOrchestrator(raw.orchestrator);","  const tick = raw.tick_minutes ?? DEFAULT_TICK_MINUTES;","  if (typeof tick !== 'number' || !Number.isFinite(tick) || tick \u003c= 0) {","    throw new TopologyError('tick_minutes must be a positive number');","  }","  return { orchestrator, tickMinutes: tick, slots: parseSlots(raw.slots ?? []) };","}","","/** Read and validate the topology file; a missing file is the default (orchestrator only). */","export function loadTopology(path: string = process.env.TOPOLOGY_FILE ?? TOPOLOGY_PATH): Topology {","  if (!existsSync(path)) return defaultTopology();","  let raw: unknown;","  try { raw = JSON.parse(readFileSync(path, 'utf8')); }","  catch (error) { throw new TopologyError(`${path}: invalid JSON (${(error as Error).message})`); }","  return parseTopology(raw);","}"],"uses":["scripts/topology.ts#Topology","scripts/topology.ts#TopologyError","scripts/topology.ts#DEFAULT_TICK_MINUTES","scripts/topology.ts#TOPOLOGY_PATH","scripts/topology.ts#TOP_KEYS","scripts/topology.ts#defaultTopology","scripts/topology.ts#isObject","scripts/topology.ts#rejectUnknown","scripts/topology.ts#parseOrchestrator","scripts/topology.ts#parseSlots"]},{"node":"dispatch","file":"scripts/queue-worktrees.ts","from":18,"to":44,"title":"queue worktree add: create the lane","explain":"The base is config.integrationBranch, else the current branch. It runs git worktree add at .agent/queue/wt/\u003cid> on a new branch queue/\u003cid>; if that branch already exists it reuses it. It saves the branch and worktree path on the task, logs the base commit, and prints the lane's first step: git merge --ff-only \u003cbase>.","why":"This creates the isolated lane off the working branch before the task is claimed. The ff-only check and the merge back are only printed as instructions; the comment says the CLI never auto-merges.","kind":"implements","lines":["/**"," * Create an isolated git worktree for a task on branch `queue/\u003cid>`, cut from the"," * integration base (config.integrationBranch, or the current branch). Records the"," * branch + worktree path on the task. Merge-back is deliberately agent-driven"," * (see skills/queue.md, aligned with design.md D7) — the CLI never auto-merges."," */","function cmdWorktreeAdd(q: Queue, id: string): number {","  const t = q.tasks.find(x => x.id === id);","  if (!t) { console.error(`worktree add: unknown task id ${id}`); return 1; }","  const base = q.config.integrationBranch || currentBranch();","  const branch = `queue/${id}`;","  const rel = wtRel(id);","  const abs = join(ROOT, rel);","  let baseSha: string;","  try {","    try { git(`worktree add ${abs} -b ${branch} ${base}`); }","    catch { git(`worktree add ${abs} ${branch}`); } // branch already exists","    baseSha = git(`rev-parse ${base}`);","  } catch (e) { console.error(`worktree add failed: ${(e as Error).message}`); return 1; }","  save(setField(q, id, { branch, worktree: rel }));","  log(`worktree add ${id} → ${rel} (${branch} off ${base} @ ${baseSha})`);","  console.log(`worktree ready: ${rel}  on ${branch}  (base ${base} @ ${baseSha})\\n`","    + `First step in the lane: \\`git merge --ff-only ${base}\\` (a reused branch may be stale); stop if it cannot fast-forward. `","    + `cd ${rel} to work in isolation; commit locally and report the tip. `","    + `The root reviews, integrates into ${base}, finalizes the claim and removes the worktree.`);","  return 0;","}"],"uses":["scripts/queue-worktrees.ts#git","scripts/queue-worktrees.ts#currentBranch","scripts/queue-worktrees.ts#wtRel","scripts/queue-io.ts#ROOT","scripts/queue-io.ts#save","scripts/queue-io.ts#log","scripts/queue-model.ts#Queue","scripts/queue-model.ts#setField"]},{"node":"dispatch","file":"scripts/queue-claim.ts","from":22,"to":38,"title":"queue claim: give a pending task to a worker or slot","explain":"refusal rejects a task that is not pending, is held, or is blocked by an unfinished delivery cycle. branchFlag rejects a --branch value that is not one name. The worker name comes from --worker, else a name built from the process id. One save marks the task active with that owner and, when given, links the branch in the same write.","why":"This is how a slot takes a task: the task's owner becomes the slot id. Linking the branch in the same write means a task is never active with an unlinked branch.","kind":"implements","lines":["/**"," * `queue claim \u003cid> [--worker w] [--branch b]`. Returns the process exit code. The caller passes its task"," * printer, so consumers whose queue keeps `taskBlock` in another module sync this file unchanged."," */","export function cmdClaim(q: Queue, id: string, flags: Map\u003cstring, string>, taskBlock: (t: Task) => string): number {","  const t = q.tasks.find(x => x.id === id)!;","  const refused = refusal(q, t);","  if (refused) { (refused.stderr ? console.error : console.log)(refused.message); return 1; }","  const branch = branchFlag(flags);","  if (branch === null) { console.error('claim: --branch needs one branch name'); return 1; }","  const worker = flags.get('worker') ?? `worker-${process.pid}`;","  const on = branch ? ` on ${branch}` : '';","  save(branch ? setField(beginTask(q, id, now(), worker), id, { branch }) : beginTask(q, id, now(), worker));","  log(`claim ${id} by ${worker}${on}`);","  console.log(`claimed ${id} for ${worker}${on}\\n${taskBlock({ ...t, owner: worker, branch: branch || t.branch })}`);","  return 0;","}"],"uses":["scripts/queue-claim.ts#refusal","scripts/queue-claim.ts#branchFlag","scripts/queue-io.ts#now","scripts/queue-io.ts#save","scripts/queue-io.ts#log","scripts/queue-model.ts#Task","scripts/queue-model.ts#Queue","scripts/queue-model.ts#setField","scripts/queue-model.ts#beginTask","scripts/queue-model.ts#taskBlock"]},{"node":"dispatch","file":"scripts/queue-console-slots.ts","from":19,"to":37,"title":"slotViews: which slots are busy","explain":"It takes the active tasks and, for each topology slot, picks those whose owner equals the slot id. A slot with one or more is busy; with more than one it is flagged overbooked. Active tasks owned by no known slot are returned as orphans.","why":"A free slot is defined as 'no active task owned by this slot id', so the claim's --worker value is what marks a slot busy. This view feeds the console's Slots panel; the dispatch decision itself is still made by the agent.","kind":"implements","lines":["/**"," * Derive slot occupancy from task status alone (owner = slot id), so the UI is only as true as the"," * orchestrator's task bookkeeping. Heartbeat sidecars, when present, attach as detail."," */","export function slotViews(q: Queue, topology: Topology, lanes: LaneView[] = []): { slots: SlotView[]; orphans: ConsoleOrphan[] } {","  const active = q.tasks.filter(t => t.status === 'active');","  const slots = topology.slots.map(slot => {","    const mine = active.filter(t => t.owner === slot.id);","    const lane = lanes.find(l => mine.some(t => t.id === l.id)) ?? null;","    return {","      ...slot, busy: mine.length > 0, overbooked: mine.length > 1, lane,","      tasks: mine.map(t => ({ id: t.id, title: t.title, startedAt: t.startedAt })),","    };","  });","  const ids = new Set(topology.slots.map(s => s.id));","  const orphans = topology.slots.length === 0 ? [] : active.filter(t => !t.owner || !ids.has(t.owner))","    .map(t => ({ id: t.id, title: t.title, owner: t.owner }));","  return { slots, orphans };","}"],"uses":["scripts/queue-console-slots.ts#SlotView","scripts/queue-console-slots.ts#ConsoleOrphan","scripts/topology.ts#Topology","scripts/queue-model.ts#Queue","scripts/queue-console.ts#LaneView"]},{"node":"work","file":"scripts/queue-model.ts","from":863,"to":876,"title":"taskBlock: the task text a worker receives","explain":"It builds a list of lines from the task: the mode (chain or direct), the architecture mode and its guidance, the docs slug, the accept note, files, contracts and the validate command. Empty lines are dropped and the result is wrapped in a \u003cqueue_task id=...> block. tick and claim print this block.","why":"This is how the subagent learns whether to build a chore directly or run the full design-to-refine chain, and what counts as accepted. Following those steps is then up to the agent.","kind":"implements","lines":["/** The prompt block a worker receives for a task (tick/claim). */","export function taskBlock(t: Task): string {","  const spec = [","    t.mode === 'chain' ? 'mode: chain (design→prd→plan→tdd→refine, autonomous, no questions)' : 'mode: direct',","    `architecture: ${t.architecture}`,","    architectureGuidance(t.architecture),","    t.slug ? `slug: docs/${t.slug}/` : '',","    t.accept ? `accept: ${t.accept}` : '',","    t.files.length ? `files: ${t.files.join(', ')}` : '',","    t.contracts.length ? `contracts: ${t.contracts.join(', ')}` : '',","    t.validate ? `validate: ${t.validate}` : '',","  ].filter(Boolean).join('\\n');","  return `\u003cqueue_task id=\"${t.id}\">\\n${t.title}\\n${spec}\\n\u003c/queue_task>`;","}"],"uses":["scripts/queue-model.ts#architectureGuidance","scripts/queue-model.ts#Task"]},{"node":"work","file":"scripts/queue-lanes.ts","from":104,"to":133,"title":"queue lane finish: the subagent reports done and keeps its claim","explain":"The first part of cmdLane lists lane heartbeat files, marking stale ones and stop requests. For 'finish' it requires the task to be active and --worker to match the task's owner, then writes the lane file with state awaiting-review and logs that root review is required. The task itself stays active.","why":"The subagent reports and stops; it does not mark its own task done or merge. The claim stays in place until the orchestrator reviews the lane.","kind":"implements","lines":["/**"," * The `queue lane ...` verbs: heartbeat sidecars the live board reads, plus"," * cooperative stop flags. Read-only toward the queue itself — beats never"," * touch task state (that is claim/done/fail's job), so this lives with the"," * sidecars rather than the CLI dispatcher."," */","export function cmdLane(q: Queue, sub: string, id: string, f: Parsed): number {","  if (sub === 'list') {","    const lanes = readLanes();","    if (!lanes.length) { console.log('lanes: none'); return 0; }","    for (const l of lanes) {","      const stale = laneStale(l, now(), q.config.leaseMinutes) ? ' (stale)' : '';","      const stop = stopRequested(l.id) ? ' [stop requested]' : '';","      console.log(`${l.id} @${l.worker ?? '?'} · ${l.step ?? 'no step'}${stale}${stop}`);","    }","    return 0;","  }","  if (!id || !q.tasks.some(t => t.id === id)) { console.error(`lane ${sub}: unknown task id`); return 1; }","  if (sub === 'finish') {","    const task = q.tasks.find(t => t.id === id)!;","    const worker = f.flags.get('worker');","    if (task.status !== 'active' || !worker || task.owner !== worker) {","      console.error('lane finish: active task and matching --worker required');","      return 1;","    }","    beatLane(id, { worker, state: 'awaiting-review', step: 'worker finished', tail: f.flags.get('tail') });","    log(`lane finish ${id} by ${worker}; root review required`);","    console.log(`worker finished ${id}; claim retained for root review`);","    return 0;","  }"],"uses":["scripts/queue-lanes.ts#beatLane","scripts/queue-lanes.ts#readLanes","scripts/queue-lanes.ts#laneStale","scripts/queue-lanes.ts#stopRequested","scripts/queue-io.ts#now","scripts/queue-io.ts#log","scripts/queue-model.ts#Queue","scripts/queue-cli-args.ts#Parsed"]},{"node":"work","file":"scripts/queue.ts","from":82,"to":95,"title":"runValidate: run the task's validate command in its worktree","explain":"No validate command means success. Otherwise the command runs with the task's worktree as its working directory when one is recorded. A non-zero exit returns failure with the last three lines of output.","why":"The task's own gate runs against the lane's files, not the orchestrator's checkout. Without the worktree cwd a lane's work could be judged by code that is not in it.","kind":"implements","lines":["/** Run a task's validation command; the worktree (if any) is the working dir. */","function runValidate(task: Task): { ok: boolean; tail: string } {","  const cmd = task.validate;","  if (!cmd) return { ok: true, tail: '' };","  const cwd = task.worktree ? join(ROOT, task.worktree) : process.cwd();","  try {","    execSync(cmd, { cwd, stdio: 'pipe', encoding: 'utf8' });","    return { ok: true, tail: '' };","  } catch (e) {","    const out = String((e as { stdout?: string; stderr?: string }).stderr","      || (e as { stdout?: string }).stdout || (e as Error).message);","    return { ok: false, tail: out.trim().split('\\n').slice(-3).join(' | ') };","  }","}"],"uses":["scripts/queue-io.ts#ROOT","scripts/queue-model.ts#Task"]},{"node":"integrate","file":".github/workflows/ci.yml","from":11,"to":24,"title":"CI verify job: npm test on every PR to main","explain":"On a pull request to main, the job checks out the code without stored credentials, installs the Node version from .node-version, runs npm ci and then npm test. npm test chains the node tests, the tool tests, the shell tests and the repo checks.","why":"These are the 'real check results' the orchestrator reads after it opens the PR. The earlier half of this stage (merge the target into the lane, re-run gates locally, merge the lane) has no code; the agent does it from the rules.","kind":"enforces","lines":["jobs:","  verify:","    runs-on: ubuntu-latest","    env:","      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true","    steps:","      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5","        with:","          persist-credentials: false","      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5","        with:","          node-version-file: .node-version","      - run: npm ci","      - run: npm test"],"uses":[]},{"node":"ship","file":"scripts/queue-delivery.ts","from":9,"to":27,"title":"queue advance: record the merged PR and the fresh branch","explain":"It refuses unless the id is the selected delivery task, that task was accepted as done, no task is active, --pr looks like a pull request URL and --branch is not empty. On success it clears deliveryTask and deliveryAccepted, saves, and writes the PR and branch to the log.","why":"This closes the delivery cycle so the queue will hand out the next task. The code checks only the queue's own state and the URL's shape; it does not ask GitHub whether the PR merged, so the orchestrator vouches for that.","kind":"implements","lines":["/**"," * `queue advance \u003cid> --pr \u003curl> --branch \u003cfresh>` — an audited attestation, not a"," * remote check: the queue verifies its own state (selected task completed and"," * accepted, no active claims) and records the PR and fresh branch the root vouches for."," */","export function cmdAdvance(q: Queue, id: string, pr: string, branch: string): number {","  const task = q.tasks.find(t => t.id === id);","  if (!id || q.config.deliveryTask !== id || !q.config.deliveryAccepted || (task && task.status !== 'done')","      || q.tasks.some(t => t.status === 'active')","      || !MERGED_PR_URL.test(pr) || !branch.trim()) {","    console.error('advance: requires selected completed task, no active claims, --pr \u003cmerged-pr-url> and --branch \u003cfresh-working-branch>');","    return 1;","  }","  const advanced = setConfig(q, { deliveryTask: '', deliveryAccepted: false });","  save(advanced);","  log(`advance ${id}: root attests authorized validated merge ${pr}; fresh branch ${branch}`);","  console.log(`delivery acknowledged for ${id}; external merge/validation evidence is root-owned${drainKick(advanced)}`);","  return 0;","}"],"uses":["scripts/queue-delivery.ts#MERGED_PR_URL","scripts/queue-io.ts#save","scripts/queue-io.ts#log","scripts/queue-model.ts#Queue","scripts/queue-model.ts#setConfig","scripts/queue-gates.ts#drainKick"]},{"node":"ship","file":".github/workflows/release.yml","from":18,"to":43,"title":"Release job: tag main after the merge","explain":"On a push to main it checks out full history and reads the version from package.json. If the tag v\u003cversion> already exists it stops. Otherwise it creates the annotated tag and pushes only the tag.","why":"This is the only code that runs because of the merge. It relies on the version bump already being on the PR branch, and it pushes a tag, never a commit, so main's history stays one squash commit per PR.","kind":"implements","lines":["  tag:","    runs-on: ubuntu-latest","    permissions:","      contents: write","    steps:","      - name: Checkout","        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5","        with:","          fetch-depth: 0","          persist-credentials: false","","      - name: Tag release","        env:","          GH_TOKEN: ${{ github.token }}","        run: |","          VERSION=$(node -p \"require('./package.json').version\")","          if git rev-parse \"v$VERSION\" >/dev/null 2>&1; then","            echo \"Tag v$VERSION already exists — skipping\"","            exit 0","          fi","          git config user.name \"github-actions[bot]\"","          git config user.email \"github-actions[bot]@users.noreply.github.com\"","          gh auth setup-git","          git tag -a \"v$VERSION\" -m \"Release v$VERSION\"","          git push origin \"v$VERSION\"","          echo \"Tagged v$VERSION\""],"uses":[]}],"promptOnly":[]},"pr-workflow":{"overview":"Most of this flow is the agent following skills/create-pr.md with git and gh; no script opens, watches or merges the PR. Code covers the edges: a session-start hook that warns when the branch is behind main, compute-bump.ts for the version, the hosted checks in .github/workflows (ci.yml, quality.yml, security.yml), check-handoff.ts before the merge, and release.yml after it. The repo has no Makefile, so the skill's `make ci` step falls through to its 'no local gate' branch here.","refs":[{"node":"branch","file":".claude/session-start/hook.sh","from":19,"to":32,"title":"Session-start hook: warn when the branch is behind origin/main","explain":"It fetches origin/main quietly and exits if the fetch fails. It reads the current branch and counts commits that origin/main has and HEAD lacks. If the count is not zero it prints a warning: pull when on main, merge origin/main otherwise.","why":"Thi
