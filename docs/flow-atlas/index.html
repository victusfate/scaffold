tes or checks plan.md."},{"node":"prep","what":"For each slice the agent decides the interface changes, lists the behaviors to test and names the assumption the slice tests, all from the skill text."}]},"agentic-task-queue":{"overview":"The design describes a queue shared across projects and stored as GitHub Issues. What is built is a queue for one repository: a local SQLite store (.agent/queue/queue.db) with a Markdown view (queue.md), driven by scripts/queue.ts, queue-model.ts, queue-io.ts, queue-db.ts, queue-claim.ts and queue-worktrees.ts. Built: manual adding, dependency ordering, claiming under a lock, a lease clock, worktree per task, running the validate command, retry then failed. Not built anywhere in this repo: the GitHub Issues store and its labels, assign-and-verify claiming, cross-project targeting, the push trigger, GitHub Action workers, automated and assistant-proposed ingestion with the collision check, the high/default priority tiers, the proposed and reconciling states, and any merge-back or reconciliation code (merging is done by the agent and the root from skills/queue.md). Two built behaviours contradict the design: an expired lease blocks dispatch instead of returning the task to pending, and an agent is refused when it tries to add a task on its own.","refs":[{"node":"ING","file":"scripts/queue.ts","from":322,"to":331,"title":"queue add: the one built ingestion path","explain":"The command joins its arguments into a title and refuses an empty one. It asks taskOrigin whether this caller may add a task. It then appends the task (or puts it first with --top), saves, logs, and prints the new id plus a drain marker if the task can run now.","why":"This is manual ingestion as built: one task per call, written by whoever runs the command. There is no alignment loop or slicer in code; the caller supplies deps, files and validate as flags.","kind":"implements","lines":["    case 'add': {","      const title = f.positionals.join(' ').trim();","      if (!title) { console.error('usage: queue add \"\u003ctitle>\" [--parent \u003cid> | --requested \"\u003chuman words>\"] [flags]'); return 1; }","      const origin = taskOrigin(q, f);","      if (!origin.ok) { console.error(origin.error); return 2; }","      q = addTask(q, title, { top: f.bools.has('top'), ...withOrigin(taskOverrides(f), origin.patch) });","      save(q); log(`add ${title}`);","      const t = q.tasks[f.bools.has('top') ? 0 : q.tasks.length - 1];","      console.log(`added ${t.id}${t.mode === 'chain' ? ' (chain)' : ''} — ${title}${drainKick(q)}`); return 0;","    }"],"uses":["scripts/queue-io.ts#save","scripts/queue-io.ts#log","scripts/queue-gates.ts#drainKick","scripts/queue-model.ts#addTask","scripts/queue-cli-args.ts#taskOverrides","scripts/queue-task-origin.ts#taskOrigin","scripts/queue-task-origin.ts#withOrigin"]},{"node":"ING","file":"scripts/queue-task-origin.ts","from":25,"to":31,"title":"taskOrigin: agents may not add tasks on their own","explain":"It reads the --parent and --requested flags. A named parent must be an existing task. With neither flag, a human is allowed, but a session that carries an agent environment marker is refused with an explanation. With a flag, the origin is recorded on the task as a tag and a note.","why":"This is the opposite of the design's automated ingestion: the code blocks agent-created tasks unless a human asked for them. No watcher, cron or telemetry source feeds the queue.","kind":"enforces","lines":["export function taskOrigin(q: Queue, f: Parsed, env: NodeJS.ProcessEnv = process.env): Origin {","  const parent = flagValue(f, 'parent');","  const requested = flagValue(f, 'requested');","  if (parent && !q.tasks.some(t => t.id === parent)) return { ok: false, error: `queue add: --parent ${parent} is not a task in this queue` };","  if (!parent && !requested) return isAgentSession(env) ? { ok: false, error: AGENT_ADD_REFUSAL } : { ok: true, patch: {} };","  return { ok: true, patch: originPatch(parent, requested) };","}"],"uses":["scripts/queue-task-origin.ts#isAgentSession","scripts/queue-task-origin.ts#Origin","scripts/queue-task-origin.ts#AGENT_ADD_REFUSAL","scripts/queue-task-origin.ts#originPatch","scripts/queue-task-origin.ts#flagValue","scripts/queue-cli-args.ts#Parsed","scripts/queue-model.ts#Queue"]},{"node":"DISP","file":"scripts/queue-db.ts","from":36,"to":68,"title":"SCHEMA: the queue store is a local SQLite file","explain":"The store has a meta table for config, a tasks table and a views table that remembers the hash of the rendered queue.md. A task row holds id, position, status, dependencies, files, validate command, failures, owner, branch, worktree and start time. Status can only be pending, active, done or failed, and position is unique.","why":"This takes the place of the GitHub Issues store in the design. It has no repo, priority, assignee, heartbeat or deferrals column, and no proposed or reconciling status, so those parts of the task schema cannot be stored.","kind":"implements","lines":["const SCHEMA = `","CREATE TABLE IF NOT EXISTS meta (","  key   TEXT PRIMARY KEY NOT NULL,","  value TEXT NOT NULL",");","CREATE TABLE IF NOT EXISTS tasks (","  id           TEXT PRIMARY KEY NOT NULL CHECK (id \u003c> ''),","  position     INTEGER NOT NULL UNIQUE,","  title        TEXT NOT NULL,","  status       TEXT NOT NULL CHECK (status IN ('pending', 'active', 'done', 'failed')),","  mode         TEXT NOT NULL CHECK (mode IN ('direct', 'chain')),","  architecture ${ARCHITECTURE_COLUMN},","  held         INTEGER NOT NULL CHECK (held IN (0, 1)),","  elapsed_secs INTEGER NOT NULL CHECK (elapsed_secs >= 0),","  slug         TEXT,","  depends_on   TEXT NOT NULL,","  files        TEXT NOT NULL,","  tags         TEXT NOT NULL DEFAULT '[]',","  contracts    TEXT NOT NULL DEFAULT '[]' CHECK (json_valid(contracts) AND json_type(contracts) = 'array'),","  validate     TEXT,","  accept       TEXT,","  note         TEXT,","  failures     INTEGER NOT NULL CHECK (failures >= 0),","  owner        TEXT,","  branch       TEXT,","  worktree     TEXT,","  started_at   TEXT",");","CREATE TABLE IF NOT EXISTS views (","  path   TEXT PRIMARY KEY NOT NULL,","  sha256 TEXT NOT NULL",");","`;"],"uses":["scripts/queue-db.ts#ARCHITECTURE_COLUMN"]},{"node":"DISP","file":"scripts/queue-io.ts","from":89,"to":115,"title":"acquire: one lock file makes every queue command atomic","explain":"It tries to create the lock file beside the store in exclusive mode and writes its pid and time into it. If the file already exists it checks whether the holder process is dead and, if so, takes over. Otherwise it waits 20 ms and tries again, and after 60 seconds it throws.","why":"Every CLI command runs inside this lock, so two workers on the same machine cannot both claim one task. This replaces the design's assign, re-read and verify on a GitHub issue; it does not work across machines.","kind":"enforces","lines":["function acquire(): void {","  const path = lockPath();","  mkdirSync(dirname(path), { recursive: true });","  const deadline = Date.now() + LOCK_WAIT_MS;","  for (;;) {","    try {","      const fd = openSync(path, 'wx');","      try {","        writeFileSync(fd, `pid=${process.pid} acquiredAt=${now()}\\n`);","      } catch (error) {","        closeSync(fd);","        rmSync(path, { force: true });","        throw error;","      }","      held = { fd, path };","      return;","    } catch (error) {","      if ((error as NodeJS.ErrnoException).code !== 'EEXIST') throw error;","      if (reclaimDeadHolder(path)) continue;","      if (Date.now() >= deadline) {","        throw new Error(`queue: lock ${path} remained held for ${LOCK_WAIT_MS}ms; `","          + 'confirm its holder is dead before removing it', { cause: error });","      }","      napSync(LOCK_POLL_MS);","    }","  }","}"],"uses":["scripts/queue-io.ts#now","scripts/queue-io.ts#LOCK_POLL_MS","scripts/queue-io.ts#LOCK_WAIT_MS","scripts/queue-io.ts#held","scripts/queue-io.ts#lockPath","scripts/queue-io.ts#napSync","scripts/queue-io.ts#reclaimDeadHolder"]},{"node":"DISP","file":"scripts/queue-model.ts","from":763,"to":773,"title":"isEligible: the dependency gate","explain":"A task is eligible when it is pending, not held, allowed by the current delivery cycle, and every task it depends on is done. deadlocked lists pending tasks that depend on a failed task, which can never become eligible.","why":"This is the design's rule that a task never starts before its dependencies complete, and that a failure only strands its dependents. Order among eligible tasks is the line order of the queue; the two priority tiers are not built.","kind":"enforces","lines":["/** A pending task is eligible only when it isn't held and every dependency is done. */","export function isEligible(task: Task, q: Queue): boolean {","  return task.status === 'pending' && !task.held && deliveryAllows(q, task.id)","    && task.dependsOn.every(d => q.tasks.find(x => x.id === d)?.status === 'done');","}","","/** Pending tasks blocked by a dependency that failed (can never become eligible). */","export function deadlocked(q: Queue): Task[] {","  return q.tasks.filter(t => t.status === 'pending'","    && t.dependsOn.some(d => q.tasks.find(x => x.id === d)?.status === 'failed'));","}"],"uses":["scripts/queue-model.ts#Task","scripts/queue-model.ts#Queue","scripts/queue-model.ts#deliveryAllows"]},{"node":"DISP","file":"scripts/queue-claim.ts","from":26,"to":38,"title":"claim: lease a task to a worker","explain":"It refuses a task that is not pending, is held, or is blocked by an unfinished delivery cycle. It takes the worker name from --worker or makes one from the process id. In one save it marks the task active, records the owner and start time, and links a branch if --branch was given.","why":"This is the claim step. It is safe because the caller already holds the queue lock, not because of a verify-after-write.","kind":"implements","lines":["export function cmdClaim(q: Queue, id: string, flags: Map\u003cstring, string>, taskBlock: (t: Task) => string): number {","  const t = q.tasks.find(x => x.id === id)!;","  const refused = refusal(q, t);","  if (refused) { (refused.stderr ? console.error : console.log)(refused.message); return 1; }","  const branch = branchFlag(flags);","  if (branch === null) { console.error('claim: --branch needs one branch name'); return 1; }","  const worker = flags.get('worker') ?? `worker-${process.pid}`;","  const on = branch ? ` on ${branch}` : '';","  save(branch ? setField(beginTask(q, id, now(), worker), id, { branch }) : beginTask(q, id, now(), worker));","  log(`claim ${id} by ${worker}${on}`);","  console.log(`claimed ${id} for ${worker}${on}\\n${taskBlock({ ...t, owner: worker, branch: branch || t.branch })}`);","  return 0;","}"],"uses":["scripts/queue-claim.ts#refusal","scripts/queue-claim.ts#branchFlag","scripts/queue-io.ts#now","scripts/queue-io.ts#save","scripts/queue-io.ts#log","scripts/queue-model.ts#Task","scripts/queue-model.ts#Queue","scripts/queue-model.ts#setField","scripts/queue-model.ts#beginTask","scripts/queue-model.ts#taskBlock"]},{"node":"DISP","file":"scripts/queue.ts","from":103,"to":125,"title":"dispatchGate: an expired lease stops dispatch","explain":"Before any task is handed out, it resumes a paused queue whose pause time has passed, and reports a stopped or paused queue. It then looks for active tasks whose start time is older than leaseMinutes. If any exist it prints OWNERSHIP CONFLICT and returns exit code 6 without changing them. It also blocks while a finished task still waits for its merge to be acknowledged.","why":"The design says a stale lease returns the task to pending for another worker. The code deliberately does not: it stops and asks for the owner to be resolved, so a slow worker is never doubled up.","kind":"enforces","lines":["function dispatchGate(q: Queue): { queue: Queue; blocked: number | null } {","  const due = resumeIfDue(q, now());","  if (due.resumed) { q = due.queue; save(q); log('auto-resumed (usage window reopened)'); }","  if (q.config.status === 'stopped') {","    if (q.config.resumeAt) {","      console.log(`queue: PAUSED until ${q.config.resumeAt} (usage window) — auto-resumes after`);","      return { queue: q, blocked: EXIT.PAUSED };","    }","    console.log('queue: STOPPED — run `queue start` to resume');","    return { queue: q, blocked: EXIT.STOPPED };","  }","  const expired = staleLeases(q, now(), q.config.leaseMinutes);","  if (expired.length) {","    console.log(`queue: OWNERSHIP CONFLICT — expired lease(s) remain active: ${expired","      .map(t => t.id).join(', ')}. Do not reclaim or dispatch; resolve ownership explicitly.`);","    return { queue: q, blocked: EXIT.CONFLICT };","  }","  if (q.config.deliveryMode !== 'batch' && q.config.deliveryTask && !nextActionable(q)) {","    console.log(`queue: DELIVERY PENDING — ${q.config.deliveryTask}; finish its PR/merge cycle and fresh branch, then advance`);","    return { queue: q, blocked: EXIT.DELIVERY };","  }","  return { queue: q, blocked: null };","}"],"uses":["scripts/queue.ts#EXIT","scripts/queue.ts#dispatch","scripts/queue-io.ts#now","scripts/queue-io.ts#save","scripts/queue-io.ts#log","scripts/queue-model.ts#Queue","scripts/queue-model.ts#resumeIfDue","scripts/queue-model.ts#staleLeases","scripts/queue-model.ts#nextActionable"]},{"node":"DISP","file":"scripts/queue-model.ts","from":837,"to":855,"title":"drainSignal: tell a poller that work is waiting","explain":"It returns nothing when the queue is stopped or any task is active. Otherwise it counts eligible tasks and, if there are any, returns the line \"queue: DRAIN-WANTED \u003cn> pending\". The queue signal command prints that line, and add, set and top append it to their output.","why":"This is the built form of distribution: something polls the local queue and wakes a worker when the marker appears. The push path (an issue or label event firing a worker) does not exist.","kind":"implements","lines":["/** Stable prefix a Monitor / cron / agent keys on to (re)start a stalled drain. */","export const DRAIN_MARKER = 'queue: DRAIN-WANTED';","","/**"," * The machine signal that a running queue has drainable work but no driver"," * attached — the invariant \"non-empty + running ⇒ a driver is attached\" made"," * observable. Returns a stable `queue: DRAIN-WANTED \u003cn> pending` marker when the"," * queue is running, no task is active (nothing is currently draining), and at"," * least one pending task is eligible to run now; `null` otherwise (stopped, a"," * driver already active, or nothing eligible — dep-blocked/empty is genuinely"," * idle). Emitted on any mutation that can leave a running queue drainable, so a"," * later add/reprioritize re-attaches a driver instead of stalling until idlePoll."," */","export function drainSignal(q: Queue): string | null {","  if (q.config.status !== 'running') return null;","  if (q.tasks.some(t => t.status === 'active')) return null;","  const ready = q.tasks.filter(t => isEligible(t, q)).length;","  return ready ? `${DRAIN_MARKER} ${ready} pending` : null;","}"],"uses":["scripts/queue-model.ts#Queue","scripts/queue-model.ts#isEligible"]},{"node":"WORK","file":"scripts/queue.ts","from":127,"to":149,"title":"tick: a worker pulls the next task","explain":"It runs the dispatch gate and returns its exit code if blocked. It picks an already active task if there is one, else the first eligible task from the top. With nothing to do it prints IDLE, naming tasks stuck behind a failed dependency, and exits 3. Otherwise it marks the task active and prints the task block with the done and fail commands to run after.","why":"This is the pull a Phase 1 worker makes. The agent then does the work itself; the script does not start an agent.","kind":"implements","lines":["function cmdTick(q: Queue): number {","  const gate = dispatchGate(q);","  if (gate.blocked !== null) return gate.blocked;","  q = gate.queue;","  const t = nextActionable(q);","  if (!t) {","    const stuck = deadlocked(q);","    console.log(stuck.length","      ? `queue: IDLE — ${stuck.length} task(s) blocked by a failed dependency: ${stuck.map(x => x.id).join(', ')}`","      : 'queue: IDLE — no eligible tasks');","    save(q);","    return EXIT.IDLE;","  }","  if (t.status === 'pending') { q = beginTask(q, t.id, now(), t.owner); log(`begin ${t.id}`); }","  q = selectDelivery(q, t.id);","  save(q);","  const current = q.tasks.find(x => x.id === t.id)!;","  console.log(`queue: working ${t.id}\\n${taskBlock(current)}\\n`","    + (q.config.deliveryMode === 'batch' ? 'Delivery: legacy batch.\\n'","      : 'Delivery: per-task; root must complete the PR/merge cycle before advance.\\n')","    + `When finished: node scripts/queue.ts done ${t.id}  (or fail ${t.id} \"\u003creason>\")`);","  return EXIT.DISPATCHED;","}"],"uses":["scripts/queue.ts#EXIT","scripts/queue.ts#dispatchGate","scripts/queue-io.ts#now","scripts/queue-io.ts#save","scripts/queue-io.ts#log","scripts/queue-model.ts#Queue","scripts/queue-model.ts#beginTask","scripts/queue-model.ts#selectDelivery","scripts/queue-model.ts#deadlocked","scripts/queue-model.ts#nextActionable","scripts/queue-model.ts#taskBlock"]},{"node":"WORK","file":"scripts/queue.ts","from":250,"to":288,"title":"queue loop: print the routine a Claude session runs","explain":"It prints a /loop instruction for the current queue. A paused queue gets a slow poll. Otherwise the text tells the session to arm a monitor that polls queue signal, then repeat tick (or ready, for parallel batch mode) while the exit code is 0, stop on idle, and stop and report on an ownership conflict.","why":"This is how the worker substrate is built: a text instruction for a live agent session, with exit codes to steer it. Phase 2, a GitHub Action that drains the queue on a schedule, has no workflow in .github/workflows.","kind":"implements","lines":["function cmdLoop(q: Queue): number {","  const paused = q.config.status === 'stopped' && q.config.resumeAt !== '';","  if (paused) {","    console.log(`/loop ${q.config.pausePoll} queue is paused for a usage window: run `","      + '`node scripts/queue.ts tick` — it auto-resumes once the window reopens, then '","      + 'switch back to the normal interval');","    return 0;","  }","  const drain = q.config.deliveryMode === 'batch' && q.config.maxParallel > 1","    ? 'run `node scripts/queue.ts ready` and dispatch each returned task in its own worktree, then done/fail each'","    : 'run `node scripts/queue.ts tick` and do the task it prints, then `done \u003cid>` or `fail \u003cid>`';","  // Arm a Monitor that POLLS `queue signal` (not the file mtime): it emits an event","  // only when a running queue has eligible work and no active driver, so it never","  // fires on an empty/idle queue, yet re-wakes the loop the moment a later add makes","  // work drainable. Each finished task auto-archives out of the queue, so a drain","  // ends with the queue truly empty. On idle (tick exits 3) TERMINATE the loop","  // (ScheduleWakeup stop:true) — the signal-Monitor is the standing driver. Exit 5","  // (operator stop) always ends the loop; exit 4 slow-polls a usage window.","  const signalPoll = `arm a Monitor whose command polls the drain signal — e.g. `","    + `\\`while true; do node scripts/queue.ts signal; sleep ${q.config.idlePoll}; done\\` — `","    + `it prints a line ONLY when work is drainable, so it never fires on an empty queue`;","  console.log(`/loop ${q.config.idlePoll} drain the work queue: FIRST ${signalPoll}; `","    + `ONE orchestrator owns this session; other sessions and user-launched agent CLIs are `","    + `independent and must never be stopped, reclaimed, interrupted, or signalled. Queue lease `","    + `expiry is metadata only and grants no process authority. `","    + `Delivery mode: ${q.config.deliveryMode}. Read skills/queue.md: per-task requires root PR, real local and hosted validation, authorized merge and fresh branch before advance; exit 7 is pending delivery, not drained. `","    + `THEN repeatedly ${drain} — keep going while tick/ready exits 0 (each completed task `","    + `auto-archives out of the queue). On exit 3 (idle/drained) TERMINATE the loop with `","    + `ScheduleWakeup stop:true; the signal-Monitor re-wakes the loop only when a later add `","    + `makes work drainable, so the queue can't stall and no loop fires on an empty queue. `","    + `Only if you could NOT arm a Monitor, fall back to re-arming the ${q.config.idlePoll} `","    + `heartbeat (it must poll, so it may wake on an empty queue). Exit 5 (operator stop) `","    + `always stops the loop; exit 4 slow-polls at ${q.config.pausePoll}. `","    + `Exit 6 (ownership conflict) stops dispatch: report the conflict and leave claims, `","    + `processes, and worktrees untouched until ownership is resolved. `","    + `Cadence: busy → continue immediately · idle → stop:true (signal-Monitor re-wakes on new `","    + `work; ${q.config.idlePoll} heartbeat only if unmonitored) · paused → ${q.config.pausePoll}.`);","  return 0;","}"],"uses":["scripts/queue.ts#dispatch","scripts/queue-io.ts#log","scripts/queue-model.ts#Queue"]},{"node":"EXEC","file":"scripts/queue-worktrees.ts","from":24,"to":44,"title":"worktree add: an isolated checkout per task","explain":"It takes the base from the integrationBranch setting, or the current branch if that is blank. It creates a git worktree at .agent/queue/wt/\u003cid> on a new branch queue/\u003cid> cut from the base, or reuses the branch if it exists. It records the branch and worktree path on the task and prints what the lane should do next, including that the root does the integration.","why":"This is the worktree-per-task rule, in the same repository as the queue. Checking out a different target repo from a project label is not built.","kind":"implements","lines":["function cmdWorktreeAdd(q: Queue, id: string): number {","  const t = q.tasks.find(x => x.id === id);","  if (!t) { console.error(`worktree add: unknown task id ${id}`); return 1; }","  const base = q.config.integrationBranch || currentBranch();","  const branch = `queue/${id}`;","  const rel = wtRel(id);","  const abs = join(ROOT, rel);","  let baseSha: string;","  try {","    try { git(`worktree add ${abs} -b ${branch} ${base}`); }","    catch { git(`worktree add ${abs} ${branch}`); } // branch already exists","    baseSha = git(`rev-parse ${base}`);","  } catch (e) { console.error(`worktree add failed: ${(e as Error).message}`); return 1; }","  save(setField(q, id, { branch, worktree: rel }));","  log(`worktree add ${id} → ${rel} (${branch} off ${base} @ ${baseSha})`);","  console.log(`worktree ready: ${rel}  on ${branch}  (base ${base} @ ${baseSha})\\n`","    + `First step in the lane: \\`git merge --ff-only ${base}\\` (a reused branch may be stale); stop if it cannot fast-forward. `","    + `cd ${rel} to work in isolation; commit locally and report the tip. `","    + `The root reviews, integrates into ${base}, finalizes the claim and removes the worktree.`);","  return 0;","}"],"uses":["scripts/queue-worktrees.ts#git","scripts/queue-worktrees.ts#currentBranch","scripts/queue-worktrees.ts#wtRel","scripts/queue-io.ts#ROOT","scripts/queue-io.ts#save","scripts/queue-io.ts#log","scripts/queue-model.ts#Queue","scripts/queue-model.ts#setField"]},{"node":"EXEC","file":"scripts/queue.ts","from":165,"to":198,"title":"done: run validate, then complete","explain":"If the task has a validate command it releases the lock, runs the command in the task's worktree, and reloads the queue; a task that changed meanwhile is refused. A failing command records a failure and exits 1. A pass marks the task done, then moves it and any done tasks nothing still depends on into the archive.","why":"This is the validation gate before a task counts as completed. It checks the task branch only; it does not merge and does not re-run validation on the merged result.","kind":"enforces","lines":["function cmdDone(q: Queue, id: string, skip: boolean): number {","  const t = q.tasks.find(x => x.id === id);","  if (!t) { console.error(`done: unknown task id ${id}`); return 1; }","  if (t.validate && !skip) {","    const r = unlocked(() => runValidate(t));","    q = load();","    const refreshed = q.tasks.find(task => task.id === id);","    if (!refreshed || !isDeepStrictEqual(t, refreshed)) {","      console.error(`done: ${id} changed during validation; inspect and retry`);","      return 1;","    }","    if (!r.ok) {","      const res = recordFailure(q, id, `validation failed: ${r.tail}`, q.config.maxFailures, now());","      save(res.queue);","      log(`validate-fail ${id} (${res.failures}/${q.config.maxFailures})`);","      console.log(`✗ validation failed for ${id} → ${res.terminal ? 'failed' : 'retry'} (${r.tail})`);","      return 1;","    }","  }","  // Complete the task, then archive it out of the live queue right away — plus any","  // earlier done task this completion just freed (one whose last unfinished","  // dependent was this one). A done task still depended on by unfinished work is","  // kept until that work finishes, so dependency resolution never breaks.","  let dq = markDone(selectDelivery(q, id), id, now());","  const sweep = archivableDone(dq);","  for (const s of sweep) dq = removeTask(dq, s.id);","  save(dq);","  if (sweep.length) appendArchive(sweep);","  const archivedSelf = sweep.some(s => s.id === id);","  log(`done ${id}${sweep.length ? ` → archived ${sweep.map(s => s.id).join(', ')}` : ''}`);","  console.log(`✓ ${id} done${t.validate && !skip ? ' (validation passed)' : ''}`","    + (archivedSelf ? ' → archived' : ' (kept: still a dependency)'));","  return 0;","}"],"uses":["scripts/queue.ts#runValidate","scripts/queue-io.ts#now","scripts/queue-io.ts#unlocked","scripts/queue-io.ts#load","scripts/queue-io.ts#save","scripts/queue-io.ts#log","scripts/queue-io.ts#appendArchive","scripts/queue-model.ts#Queue","scripts/queue-model.ts#removeTask","scripts/queue-model.ts#markDone","scripts/queue-model.ts#recordFailure","scripts/queue-model.ts#selectDelivery"]},{"node":"EXEC","file":"scripts/queue-model.ts","from":524,"to":542,"title":"recordFailure: retry, then failed","explain":"It adds one to the task's failure count and stores the reason as its note. Below maxFailures the task goes back to pending at the end of the line with its owner and worktree link cleared. At maxFailures it becomes failed and keeps its place.","why":"The design marks a task failed on the first failure and deletes its worktree. The code retries up to maxFailures (default 3) and only clears the worktree link; removing the worktree is a separate command.","kind":"implements","lines":["export function recordFailure(","  q: Queue, id: string, reason: string | null, maxFailures: number, nowIso: string,","): { queue: Queue; terminal: boolean; failures: number } {","  const task = q.tasks.find(t => t.id === id);","  if (!task) return { queue: q, terminal: false, failures: 0 };","  q = selectDelivery(q, id);","  if (q.config.deliveryTask === id) q = setConfig(q, { deliveryAccepted: false });","  const failures = task.failures + 1;","  const terminal = failures >= maxFailures;","  const updated: Task = {","    ...task, failures, note: reason ?? task.note,","    status: terminal ? 'failed' : 'pending', owner: null, worktree: null, startedAt: null,","    elapsedSecs: bankSession(task, nowIso),","  };","  const rest = q.tasks.filter(t => t.id !== id);","  // terminal keeps position; a retry drops to the back so other work proceeds first.","  const tasks = terminal ? q.tasks.map(t => (t.id === id ? updated : t)) : [...rest, updated];","  return { queue: withTasks(q, tasks), terminal, failures };","}"],"uses":["scripts/queue-model.ts#Task","scripts/queue-model.ts#Queue","scripts/queue-model.ts#bankSession","scripts/queue-model.ts#withTasks","scripts/queue-model.ts#setConfig","scripts/queue-model.ts#selectDelivery"]},{"node":"EXEC","file":"scripts/queue-delivery.ts","from":14,"to":27,"title":"advance: the root says the merge happened","explain":"It requires that the named task is the one awaiting delivery, is done and accepted, that no task is active, and that a pull request URL and a fresh branch name were given. It then clears the delivery latch so the next task can be dispatched, and logs the PR and branch.","why":"This is the only code at the merge-back step, and it is an attestation: the script does not merge, check the PR, or detect conflicts. Until it runs, dispatchGate holds the next task back.","kind":"enforces","lines":["export function cmdAdvance(q: Queue, id: string, pr: string, branch: string): number {","  const task = q.tasks.find(t => t.id === id);","  if (!id || q.config.deliveryTask !== id || !q.config.deliveryAccepted || (task && task.status !== 'done')","      || q.tasks.some(t => t.status === 'active')","      || !MERGED_PR_URL.test(pr) || !branch.trim()) {","    console.error('advance: requires selected completed task, no active claims, --pr \u003cmerged-pr-url> and --branch \u003cfresh-working-branch>');","    return 1;","  }","  const advanced = setConfig(q, { deliveryTask: '', deliveryAccepted: false });","  save(advanced);","  log(`advance ${id}: root attests authorized validated merge ${pr}; fresh branch ${branch}`);","  console.log(`delivery acknowledged for ${id}; external merge/validation evidence is root-owned${drainKick(advanced)}`);","  return 0;","}"],"uses":["scripts/queue-delivery.ts#MERGED_PR_URL","scripts/queue-io.ts#save","scripts/queue-io.ts#log","scripts/queue-model.ts#Queue","scripts/queue-model.ts#setConfig","scripts/queue-gates.ts#drainKick"]}],"promptOnly":[{"node":"ING","what":"Not built: /queue ingest with its alignment loop and slicer, automated watcher/cron/telemetry ingestion with the context-collision check and deferral count, and assistant proposals with a proposed state; an agent breaks work into tasks by hand from skills/queue.md and adds them one at a time."},{"node":"DISP","what":"Not built: the GitHub Issues store with status/priority/project labels, assign-then-verify claiming, a heartbeat that returns a stale task to pending, the push trigger, cross-project sharing and the high/default priority tiers; the store is one repository's local SQLite file."},{"node":"WORK","what":"Phase 1 is an agent session following the printed /loop text and skills/queue.md; Phase 2 GitHub Action worker crons are not built (the only queue workflow, agent-loop.yml, runs tests)."},{"node":"EXEC","what":"Not built: checking out a target repo from a project label, the merge-back into the integration branch, the reconciling state and the automatic high-priority reconciliation task; the agent applies changes, and the root merges and resolves conflicts by hand under skills/queue.md."}]},"_helpers":{"tools/linter-setup/detect.ts#DetectResult":{"name":"DetectResult","kind":"interface","file":"tools/linter-setup/detect.ts","line":9,"to":12,"doc":"","lines":["export interface DetectResult {","  language: Language;","  state: DetectState;","}"],"truncated":false,"explain":"One detected language paired with the state of its linter config in the repo. detect returns an array of these."},"tools/linter-setup/detect.ts#DEFAULT_SRC_ROOT":{"name":"DEFAULT_SRC_ROOT","kind":"const","file":"tools/linter-setup/detect.ts","line":14,"to":14,"doc":"","lines":["const DEFAULT_SRC_ROOT = join(dirname(fileURLToPath(import.meta.url)), '../..');"],"truncated":false,"explain":"The absolute path two directories above the detect.ts file, which is the scaffold repo root. detect uses it as the default place to find linter templates when no srcRoot is passed."},"tools/linter-setup/detect.ts#extMap":{"name":"extMap","kind":"const","file":"tools/linter-setup/detect.ts","line":16,"to":16,"doc":"","lines":["const extMap = new Map\u003cstring, Language>();"],"truncated":false,"explain":"A Map from file extension (such as '.py' or '.ts') to the Language that owns it, built at module load from every registry entry's extensions. detect uses it to map tracked files to languages."},"tools/linter-setup/registry.ts#Language":{"name":"Language","kind":"type","file":"tools/linter-setup/registry.ts","line":1,"to":2,"doc":"","lines":["export type Language =","  | 'js' | 'ts' | 'python' | 'go' | 'rust'"],"truncated":false,"explain":"The union of supported language ids: js, ts, python, go, rust, ruby, shell, elixir, zig and mojo. It is the key type of the linter registry."},"tools/linter-setup/detect.ts#DetectState":{"name":"DetectState","kind":"type","file":"tools/linter-setup/detect.ts","line":8,"to":8,"doc":"","lines":["export type DetectState = 'none' | 'foreign' | 'scaffold' | 'stale';"],"truncated":false,"explain":"The union 'none' | 'foreign' | 'scaffold' | 'stale' describing a language's linter config: no config file, a config without the scaffold marker, a config with the marker that is current or unstamped, or a config whose stamped hash differs from the current template."},"tools/linter-setup/detect.ts#stampedHash":{"name":"stampedHash","kind":"function","file":"tools/linter-setup/detect.ts","line":25,"to":32,"doc":"Read the hash stamped into a config's marker line.   undefined → marker absent (foreign)   null      → marker present but unstamped (legacy — treated as current)   \u003chex>     → stamped hash","lines":["function stampedHash(content: string, marker: string): string | null | undefined {","  const idx = content.indexOf(marker);","  if (idx === -1) return undefined;","  const nl = content.indexOf('\\n', idx);","  const line = content.slice(idx, nl === -1 ? content.length : nl);","  const m = line.match(/sha256:([0-9a-f]+)/);","  return m ? m[1] : null;","}"],"truncated":false,"explain":"Takes a config file's text and a marker string and returns the hex digits after 'sha256:' on the line where the marker first appears. Returns null when the marker is present but that line has no hash, and undefined when the marker is absent."},"tools/linter-setup/registry.ts#registry":{"name":"registry","kind":"const","file":"tools/linter-setup/registry.ts","line":17,"to":40,"doc":"","lines":["export const registry: Record\u003cLanguage, RegistryEntry> = {","  js: {","    extensions: ['.js', '.mjs', '.cjs'],","    linter: 'ESLint',","    configFile: 'eslint.config.mjs',","    workflowFile: 'lint-js.yml',","    extraFiles: ['.prettierrc.json', '.prettierignore'],","    marker: '// scaffold-linter: js',","    metricsOnly: false,","    // npm packages the shipped config imports — added to the consumer's","    // package.json devDependencies on adopt, so the starter runs locally.","    devDependencies: {","      eslint: '^10.5.0',","      '@eslint/js': '^10.0.1',","      globals: '^17.6.0',","      prettier: '^3.8.1',","    },","    // package.json scripts added on adopt. Plain JS has no type-checker, so","    // `lint:fix` is a bare autofix.","    scripts: {","      lint: 'eslint . --max-warnings 0',","      'format:check': 'prettier . --check',","      format: 'prettier . --write',","      'lint:fix': 'eslint . --fix',"],"truncated":true,"explain":"A table keyed by language id that holds each language's file extensions, linter name, optional config file name, workflow file name, marker comment, metricsOnly flag, and optionally extra files to ship plus devDependencies and scripts to add to package.json. Detection, emission, hashing and package.json merging all read from it."},"tools/linter-setup/hash.ts#templateHash":{"name":"templateHash","kind":"function","file":"tools/linter-setup/hash.ts","line":12,"to":18,"doc":"","lines":["export function templateHash(srcRoot: string, lang: Language): string | null {","  const entry = registry[lang];","  if (!entry?.configFile) return null;","  const tplPath = join(srcRoot, 'lib', 'linters', lang, entry.configFile);","  if (!existsSync(tplPath)) return null;","  return createHash('sha256').update(readFileSync(tplPath)).digest('hex').slice(0, HASH_PREFIX_LEN);","}"],"truncated":false,"explain":"Takes the scaffold root and a language and returns the first 12 hex characters of the sha256 of that language's config template at lib/linters/\u003clang>/\u003cconfigFile>. Returns null when the language has no config file or the template file does not exist."},"tools/linter-setup/run#main":{"name":"main","kind":"shell function","file":"tools/linter-setup/run","line":84,"to":85,"doc":"","lines":["main().catch(e => { console.error(e.message); process.exit(1); });",""],"truncated":false,"explain":"With --detect-only it runs detection on the --into directory and prints the results as JSON to stdout. Otherwise it reads a JSON array of languages from stdin, calls emit for each to write linter configs and workflows into that directory (and update its package.json), and prints one line per file written, sidecar-written or skipped plus a dependency note. It prints an error and exits 1 when stdin is empty, is not a JSON array, or an emit call throws."},"tools/sync/run.ts#check":{"name":"check","kind":"const","file":"tools/sync/run.ts","line":34,"to":34,"doc":"","lines":["const check      = has('--check');"],"truncated":false,"explain":"A boolean that is true when --check was passed on the command line. The sync script reads it to report what would change without writing files or the ledger."},"tools/sync/run.ts#srcRoot":{"name":"srcRoot","kind":"const","file":"tools/sync/run.ts","line":38,"to":38,"doc":"","lines":["const srcRoot    = srcRootArg ? resolve(srcRootArg) : SCAFFOLD_ROOT;"],"truncated":false,"explain":"The absolute path of the scaffold source tree to sync from: the --scaffold-root=\u003cpath> argument when given, otherwise the SYNC_SCAFFOLD_ROOT environment variable, otherwise the directory two levels above the script."},"tools/sync/run.ts#INTO":{"name":"INTO","kind":"const","file":"tools/sync/run.ts","line":39,"to":39,"doc":"","lines":["const INTO       = resolve(intoRaw);"],"truncated":false,"explain":"The absolute path of the directory being synced into, resolved from the --into command-line argument, or the current directory when the flag is absent."},"tools/linter-setup/detect.ts#detect":{"name":"detect","kind":"function","file":"tools/linter-setup/detect.ts","line":34,"to":57,"doc":"","lines":["export function detect(repoPath: string, srcRoot = DEFAULT_SRC_ROOT): DetectResult[] {","  const files = execSync('git ls-files', { cwd: repoPath })","    .toString().trim().split('\\n').filter(Boolean);","","  // Vendored linter templates and setup tooling ship example configs in many","  // languages (e.g. a .credo.exs for Elixir). When scaffold lints itself these","  // would be detected as repo source, so exclude them from language detection.","  const VENDORED = /^(lib\\/linters|tools\\/linter-setup)\\//;","","  const detected = new Set\u003cLanguage>();","  for (const file of files) {","    if (VENDORED.test(file)) continue;","    const lang = extMap.get(extname(file));","    if (lang) detected.add(lang);","  }","","  // A tsconfig.json signals a TypeScript project even when only .js files are","  // tracked (JS-with-checkJs setups), so promote to the ts variant.","  if (existsSync(join(repoPath, 'tsconfig.json'))) detected.add('ts');","","  // ts supersedes js: the ts ESLint config lints plain JS via fall-through, and","  // both variants emit the same eslint.config.mjs — emitting both would collide.","  if (detected.has('ts')) detected.delete('js');",""],"truncated":true,"explain":"Takes a repo path and an optional scaffold root, runs git ls-files in the repo, and returns one { language, state } per language found by file extension, ignoring files under lib/linters and tools/linter-setup; a tsconfig.json adds ts, and ts removes js. State comes from reading the language's config file and comparing its stamped hash with the current template hash. It throws if the git command fails and writes nothing."},"tools/linter-setup/emit.ts#stampMarker":{"name":"stampMarker","kind":"function","file":"tools/linter-setup/emit.ts","line":17,"to":19,"doc":"Stamp the template hash into the config's marker line, so detection can later tell a current scaffold config from a stale one. First occurrence only.","lines":["function stampMarker(content: string, marker: string, hash: string): string {","  return content.replace(marker, `${marker} sha256:${hash}`);","}"],"truncated":false,"explain":"Takes a config file's text, a marker string and a hash, and returns the text with ' sha256:\u003chash>' appended after the first occurrence of the marker. The text is returned unchanged if the marker does not appear."},"tools/linter-setup/emit.ts#alternateFormatter":{"name":"alternateFormatter","kind":"function","file":"tools/linter-setup/emit.ts","line":21,"to":30,"doc":"","lines":["function alternateFormatter(targetRepo: string): boolean {","  const names = ['.prettierrc', '.prettierrc.json5', '.prettierrc.yml', '.prettierrc.yaml', '.prettierrc.toml',","    '.prettierrc.js', '.prettierrc.ts', '.prettierrc.mjs', '.prettierrc.mts', '.prettierrc.cjs', '.prettierrc.cts',","    'prettier.config.js', 'prettier.config.ts', 'prettier.config.mjs', 'prettier.config.mts', 'prettier.config.cjs', 'prettier.config.cts'];","  if (names.some(name => existsSync(join(targetRepo, name)))) return true;","  const pkg = join(targetRepo, 'package.json');","  if (!existsSync(pkg)) return false;","  try { return Object.hasOwn(JSON.parse(readFileSync(pkg, 'utf8')) as object, 'prettier'); }","  catch { return true; } // Preserve an unparsable consumer manifest for manual repair.","}"],"truncated":false,"explain":"Takes a target repo path and returns true if the repo has any Prettier config file other than .prettierrc.json (such as .prettierrc, .prettierrc.yml or prettier.config.js) or a 'prettier' key in package.json. It also returns true when package.json exists but cannot be parsed, and false when none of these is found."},"tools/linter-setup/deps.ts#MergeResult":{"name":"MergeResult","kind":"interface","file":"tools/linter-setup/deps.ts","line":15,"to":18,"doc":"","lines":["export interface MergeResult {","  added: string[];","  status: MergeStatus;","}"],"truncated":false,"explain":"The result of a package.json merge: added lists the names that were newly inserted, and status is one of 'none', 'no-package-json', 'unparsable', 'satisfied', 'written' or 'sidecar'. mergeDevDependencies and mergeScripts return it."},"tools/linter-setup/deps.ts#mergeDevDependencies":{"name":"mergeDevDependencies","kind":"const","file":"tools/linter-setup/deps.ts","line":70,"to":70,"doc":"pins. Existing key order is preserved; new keys are appended.  Returns { added: string[], status } where status is one of:   'none'            — language declares no devDependencies   'no-package-json' — target has no package.json (nothing written)   'unparsable'      — package.json exists but is not valid JSON   'satisfied'       — every package already present (nothing written)   'written'         — added packages were written","lines":["export const mergeDevDependencies = (targetRepo: string, language: Language): MergeResult =>"],"truncated":false,"explain":"Takes a target repo path and a language and adds that language's registry devDependencies to the repo's package.json, skipping any name already in dependencies or devDependencies; the file is rewritten with its existing indentation only if something was added. Returns { added, status }, with status 'none', 'no-package-json', 'unparsable' or 'satisfied' when nothing was written and 'written' otherwise."},"tools/linter-setup/deps.ts#mergeScripts":{"name":"mergeScripts","kind":"const","file":"tools/linter-setup/deps.ts","line":77,"to":77,"doc":"Idempotently add a language's lint scripts (lint, lint:fix) to the target repo's package.json. Only fills in script names the repo hasn't already defined — never overwrites a consumer's own `lint` command. Returns the same { added, status } shape as mergeDevDependencies.","lines":["export const mergeScripts = (targetRepo: string, language: Language): MergeResult =>"],"truncated":false,"explain":"Takes a target repo path and a language and adds that language's registry scripts to the repo's package.json scripts, skipping any script name already defined; the file is rewritten with its existing indentation only if something was added. Returns { added, status }, with status 'none', 'no-package-json', 'unparsable' or 'satisfied' when nothing was written and 'written' otherwise."},"tools/linter-setup/deps.ts#PackageJson":{"name":"PackageJson","kind":"interface","file":"tools/linter-setup/deps.ts","line":6,"to":10,"doc":"The subset of package.json this tool reads and writes.","lines":["interface PackageJson {","  dependencies?: Record\u003cstring, string>;","  devDependencies?: Record\u003cstring, string>;","  scripts?: Record\u003cstring, string>;","}"],"truncated":false,"explain":"The part of a package.json this module reads and writes: optional dependencies, devDependencies and scripts maps of string to string."},"tools/linter-setup/deps.ts#detectIndent":{"name":"detectIndent","kind":"function","file":"tools/linter-setup/deps.ts","line":22,"to":25,"doc":"Indentation of an existing JSON file, so we don't reflow the consumer's package.json. Falls back to two spaces.","lines":["function detectIndent(text: string): string | number {","  const m = text.match(/\\n([ \\t]+)\"/);","  return m ? m[1] : 2;","}"],"truncated":false,"explain":"Takes the text of a JSON file and returns the whitespace that precedes the first quoted key on its own line. Returns the number 2 when no such indented line is found; the value is passed to JSON.stringify as the indent."},"tools/linter-setup/deps.ts#Section":{"name":"Section","kind":"type","file":"tools/linter-setup/deps.ts","line":27,"to":27,"doc":"","lines":["type Section = 'devDependencies' | 'scripts';"],"truncated":false,"explain":"The union 'devDependencies' | 'scripts', naming which package.json section a merge writes to."},"tools/linter-setup/test#makeTmp":{"name":"makeTmp","kind":"shell function","file":"tools/linter-setup/test","line":68,"to":76,"doc":"","lines":["function makeTmp() {","  const dir = mkdtempSync(join(tmpdir(), 'linter-setup-test-'));","  execSync('git init -q', { cwd: dir });","  execSync('git config commit.gpgsign false', { cwd: dir });","  execSync('git config user.email \"test@test.com\"', { cwd: dir });","  execSync('git config user.name \"Test\"', { cwd: dir });","  execSync('git commit --allow-empty -m init -q', { cwd: dir });","  return dir;","}"],"truncated":false,"explain":"Takes nothing, creates a new temporary directory named linter-setup-test-* under the system temp dir, runs git init in it, sets local git config (no commit signing, a test user name and email), and makes one empty commit. Returns the directory path; it throws if any git command fails."},"scripts/test-council-skill.sh#fail":{"name":"fail","kind":"shell function","file":"scripts/test-council-skill.sh","line":5,"to":28,"doc":"","lines":["fail(){ echo \"  ✗ $1\"; FAIL=$((FAIL + 1)); }","","SKILL=skills/council.md","CLAUDE_WRAPPER=.claude/skills/council/SKILL.md","CURSOR_MIRROR=.cursor/rules/council.mdc","ANTIGRAVITY_SKILL=.agents/skills/council/SKILL.md","ANTIGRAVITY_WORKFLOW=.agent/workflows/council.md","MANIFEST=.github/scaffold-files.txt","","for f in \"$SKILL\" \"$CLAUDE_WRAPPER\" \"$CURSOR_MIRROR\" \"$ANTIGRAVITY_SKILL\" \"$ANTIGRAVITY_WORKFLOW\"; do","  [ -f \"$f\" ] && ok \"$f exists\" || fail \"$f missing\"","done","","# The five advisor personas must all be present","for persona in Contrarian 'First-Principles' Expansionist Outsider Executor; do","  grep -q \"$persona\" \"$SKILL\" \\","    && ok \"advisor persona present: $persona\" || fail \"advisor persona missing: $persona\"","done","","# Core mechanics","grep -qiE 'parallel|concurrent' \"$SKILL\" \\","  && ok \"advisors run in parallel\" || fail \"parallel advisor execution not described\"","","grep -qiE 'peer review|anonymize|anonymized' \"$SKILL\" \\"],"truncated":true,"explain":"Takes a description, prints it to stdout prefixed with a cross mark, and increments the script's global FAIL counter. It does not exit the script."},"scripts/lib/skill-test.sh#has":{"name":"has","kind":"shell function","file":"scripts/lib/skill-test.sh","line":11,"to":17,"doc":"has \u003cfile> \u003cextended-regex> \u003clabel> — case-insensitive grep assertion.","lines":["has() { grep -qiE \"$2\" \"$1\" && ok \"$3\" || fail \"$3\"; }","","# has_cs \u003cfile> \u003cextended-regex> \u003clabel> — case-sensitive variant.","has_cs() { grep -qE \"$2\" \"$1\" && ok \"$3\" || fail \"$3\"; }","","finish() { echo \"\"; echo \"$PASS passed, $FAIL failed.\"; [ \"$FAIL\" -eq 0 ]; }",""],"truncated":false,"explain":"Takes a file, an extended regular expression and a label, and greps the file case-insensitively for the pattern. It prints the label with a check mark and increments PASS on a match, or prints it with a cross and increments FAIL otherwise, including when the file cannot be read."},"scripts/queue-model.ts#architectureGuidance":{"name":"architectureGuidance","kind":"function","file":"scripts/queue-model.ts","line":62,"to":65,"doc":"","lines":["export function architectureGuidance(mode: ArchitectureMode): string {","  return ARCHITECTURE_GUIDANCE[parseArchitecture(mode)]","    + ' In every mode, validation, security and compatibility checks remain mandatory; release authority is unchanged.';","}"],"truncated":false,"explain":"Takes an architecture mode (builder-led, collaborative or model-led) and returns the instruction text for that mode followed by a sentence saying validation, security and compatibility checks stay mandatory. It throws an Error if the value is not one of the three modes."},"scripts/queue-model.ts#Task":{"name":"Task","kind":"interface","file":"scripts/queue-model.ts","line":67,"to":90,"doc":"","lines":["export interface Task {","  id: string;","  title: string;","  status: TaskStatus;","  mode: TaskMode;","  architecture: ArchitectureMode;","  held: boolean;","  /** Cumulative agent seconds banked across all work sessions on this task. */","  elapsedSecs: number;","  slug: string | null;","  dependsOn: string[];","  files: string[];","  /** Authoritative executable schemas, migrations and tests. References, never a prose classification. */","  contracts: string[];","  /** Free-form labels for grouping and filtering (`group:speed`, `owner-report`); `list --tag` filters on them. */","  tags: string[];","  validate: string | null;","  accept: string | null;","  note: string | null;","  failures: number;","  owner: string | null;","  branch: string | null;","  worktree: string | null;","  startedAt: string | null;"],"truncated":true,"explain":"One queue task: its id, title, status (pending, active, done or failed), mode, architecture setting, held flag, banked elapsed seconds, slug, dependency ids, files, contracts, tags, validate command, acceptance text, note, failure count, and the claim fields owner, branch, worktree and startedAt. It is the record stored in the queue and passed to every task operation."},".githooks/pre-commit#staged":{"name":"staged","kind":"shell function","file":".githooks/pre-commit","line":17,"to":40,"doc":"Linters read the working-tree copy, so a partially staged file is checked as edited.","lines":["staged() { git diff --cached --name-only --diff-filter=ACMR -z -- \"$@\"; }","","if ls eslint.config.* > /dev/null 2>&1; then","  if [ -x node_modules/.bin/eslint ]; then","    staged '*.js' '*.mjs' '*.cjs' '*.ts' '*.tsx' |","      xargs -0 -r node_modules/.bin/eslint --no-warn-ignored --","  else","    echo \"pre-commit: ESLint configured but not installed — skipping (install deps, e.g. npm ci)\" >&2","  fi","fi","","if [ -f scripts/check-quality-mechanical.sh ]; then","  bash scripts/check-quality-mechanical.sh --staged","fi","","if [ -f tsconfig.json ]; then","  if [ -x node_modules/.bin/tsc ]; then","    node_modules/.bin/tsc --noEmit","  else","    echo \"pre-commit: tsconfig.json present but tsc not installed — skipping (install deps, e.g. npm ci)\" >&2","  fi","fi","","if [ -f scripts/check-resolvable.ts ]; then node scripts/check-resolvable.ts; fi"],"truncated":true,"explain":"Prints the NUL-separated paths of files staged in the git index as added, copied, modified or renamed, limited to the pathspecs passed as arguments. It changes nothing; the output is meant to be piped to xargs -0."},"scripts/check-quality-mechanical.sh#emit":{"name":"emit","kind":"shell function","file":"scripts/check-quality-mechanical.sh","line":16,"to":37,"doc":"","lines":["emit() { echo \"$1\"; VIOLATIONS=$((VIOLATIONS + 1)); }","","QUALITY_IGNORE=()","if [ -f .quality-ignore ]; then","  while IFS= read -r pat || [ -n \"$pat\" ]; do","    pat=\"${pat%%#*}\"; pat=\"${pat#\"${pat%%[![:space:]]*}\"}\"; pat=\"${pat%\"${pat##*[![:space:]]}\"}\"","    [ -n \"$pat\" ] && QUALITY_IGNORE+=(\"${pat%/}\")","  done \u003c .quality-ignore","fi","","is_ignored() {","  local f=\"${1#./}\" pat","  for pat in ${QUALITY_IGNORE[@]+\"${QUALITY_IGNORE[@]}\"}; do","    if [[ \"$pat\" == *'*'* ]]; then","      # shellcheck disable=SC2053 # the pattern is a deliberate glob","      [[ \"$f\" == $pat ]] && return 0","    else","      [[ \"$f\" == \"$pat\" || \"$f\" == \"$pat\"/* ]] && return 0","    fi","  done","  return 1","}"],"truncated":false,"explain":"Prints its first argument, a violation message, to stdout and adds one to the global VIOLATIONS counter. The script exits 1 at the end when that counter is above zero."},"scripts/lib/skill-test.sh#finish":{"name":"finish","kind":"shell function","file":"scripts/lib/skill-test.sh","line":16,"to":17,"doc":"","lines":["finish() { echo \"\"; echo \"$PASS passed, $FAIL failed.\"; [ \"$FAIL\" -eq 0 ]; }",""],"truncated":false,"explain":"Prints a blank line and then the '\u003cPASS> passed, \u003cFAIL> failed.' totals from the global counters. Its exit status is 0 when FAIL is zero and non-zero otherwise, so a test script ending with it fails if any assertion failed."},"scripts/queue-model.ts#Queue":{"name":"Queue","kind":"interface","file":"scripts/queue-model.ts","line":121,"to":124,"doc":"","lines":["export interface Queue {","  config: QueueConfig;","  tasks: Task[];","}"],"truncated":false,"explain":"The whole work queue in memory: a config object (run status, intervals, failure and lease limits, parallelism, delivery state, the next id counter) plus the ordered list of tasks, where list order is priority. It is what load returns, what save persists, and what every queue operation takes and returns."},"scripts/queue-model.ts#setConfig":{"name":"setConfig","kind":"function","file":"scripts/queue-model.ts","line":498,"to":500,"doc":"","lines":["export function setConfig(q: Queue, patch: Partial\u003cQueueConfig>): Queue {","  return { config: { ...q.config, ...patch }, tasks: q.tasks };","}"],"truncated":false,"explain":"Takes a queue and a partial config and returns a new queue with those config values overriding the existing ones and the same tasks. Nothing is validated or saved."},"scripts/queue.ts#EXIT":{"name":"EXIT","kind":"const","file":"scripts/queue.ts","line":78,"to":78,"doc":"Exit codes for the loop entry points (tick, ready, signal) so a driver can branch its next cadence without parsing text: 0 = work dispatched/wanted → continue; 3 = idle → back off to a long fallback; 4 = paused for a usage window → slow-poll; 5 = stopped → halt; 6 = ownership conflict → stop and report. A bare `return 1` stays the usage/error code.","lines":["const EXIT = { DISPATCHED: 0, IDLE: 3, PAUSED: 4, STOPPED: 5, CONFLICT: 6, DELIVERY: 7 } as const;"],"truncated":false,"explain":"The exit codes the queue's loop commands return so a driver can decide what to do next: DISPATCHED 0, IDLE 3, PAUSED 4 (usage window), STOPPED 5, CONFLICT 6 (expired lease still active) and DELIVERY 7 (a delivery cycle is pending)."},"scripts/queue-io.ts#log":{"name":"log","kind":"function","file":"scripts/queue-io.ts","line":377,"to":379,"doc":"","lines":["export function log(msg: string): void {","  appendFileSync(sidecar('log.md'), `- ${now()} ${msg}\\n`);","}"],"truncated":false,"explain":"Appends one line, '- \u003cISO timestamp> \u003cmessage>', to log.md beside the queue file. Returns nothing."},"scripts/queue-model.ts#nextActionable":{"name":"nextActionable","kind":"function","file":"scripts/queue-model.ts","line":817,"to":822,"doc":"","lines":["export function nextActionable(q: Queue): Task | null {","  if (q.config.status === 'stopped') return null;","  return q.tasks.find(t => t.status === 'active' && deliveryAllows(q, t.id))","    ?? q.tasks.find(t => isEligible(t, q))","    ?? null;","}"],"truncated":false,"explain":"Takes a queue and returns the one task to work on now: the first active task the delivery cycle permits, otherwise the first eligible pending task in list order. Returns null when the queue is stopped or no such task exists."},"scripts/queue-delivery.ts#MERGED_PR_URL":{"name":"MERGED_PR_URL","kind":"const","file":"scripts/queue-delivery.ts","line":7,"to":7,"doc":"","lines":["const MERGED_PR_URL = /^https:\\/\\/[^\\s]+\\/pull\\/\\d+$/;"],"truncated":false,"explain":"A regular expression matching an https URL with no whitespace that ends in /pull/\u003cnumber>. cmdAdvance rejects a --pr value that does not match it; it checks only the shape, not that the PR is merged."},"scripts/queue-io.ts#save":{"name":"save","kind":"function","file":"scripts/queue-io.ts","line":296,"to":298,"doc":"","lines":["export function save(q: Queue): void {","  withLock(() => openStore((db, defer) => renderView(db, defer, persistQueue(db, defer, q))));","}"],"truncated":false,"explain":"Takes a queue and, under the queue lock, writes it to the SQLite store and rewrites the queue.md view in one transaction; lane files of tasks that ended or were removed are deleted after the commit. Throws a QueueIntegrityError and saves nothing if queue.md was edited since the store last rendered it, and throws if the lock stays held for 60 seconds."},"scripts/queue-gates.ts#drainKick":{"name":"drainKick","kind":"function","file":"scripts/queue-gates.ts","line":60,"to":63,"doc":"","lines":["export function drainKick(q: Queue): string {","  const sig = drainSignal(q);","  return sig ? `\\n${sig}  → start now: \\`node scripts/queue.ts tick\\` (or the loop)` : '';","}"],"truncated":false,"explain":"Takes a queue and returns a string to append to command output: a newline, the DRAIN-WANTED marker with the count of eligible tasks, and a hint to run tick, when the queue is running, has no active task and has at least one eligible task. Returns an empty string otherwise."},"scripts/check-handoff.ts#check":{"name":"check","kind":"function","file":"scripts/check-handoff.ts","line":27,"to":46,"doc":"","lines":["export function check(text: string, maxLines = MAX_LINES): string[] {","  const lines = text.replace(/\\n$/, '').split('\\n');","  const errors: string[] = [];","  let inState = false;","  let sawState = false;","  lines.forEach((line, i) => {","    const n = i + 1;","    if (/^#{1,6} /.test(line)) {","      inState = /^## State\\s*$/.test(line);","      sawState ||= inState;","    } else if (inState && /^\\s*[-*] /.test(line) && !TAG.test(line)) {","      errors.push(`State bullet at line ${n} needs [verified: \u003ccmd>] or [unverified]: ${line.trim()}`);","    }","    if (UNSAFE_TAG.test(line)) errors.push(`line ${n}: a [verified: …] tag is evidence, not a command to replay; cite a repo check or file:line: ${line.trim()}`);","    if (CLASH.test(line)) errors.push(`line ${n} keeps a correction beside the old fact; rewrite the fact in place: ${line.trim()}`);","  });","  if (!sawState) errors.unshift(\"no '## State' section: list the facts the next session relies on, each tagged [verified: \u003ccmd>] or [unverified]\");","  if (lines.length > maxLines) errors.push(`handoff is ${lines.length} lines, over the ${maxLines}-line limit; keep current state, drop history (git keeps it)`);","  return errors;","}"],"truncated":false,"explain":"Takes the text of a handoff and an optional line limit (default 80) and returns a list of error strings, empty when the handoff passes. It reports a missing '## State' heading, any bullet under that heading with no [verified: ...] or [unverified] tag, any line whose verified tag contains shell syntax or a fetch command, any line with a correction marker, and a line count over the limit. It reads nothing but its argument and has no side effects."},"scripts/resolver-phases.ts#PhaseCtx":{"name":"PhaseCtx","kind":"interface","file":"scripts/resolver-phases.ts","line":12,"to":29,"doc":"Shared context passed to every phase. Each phase destructures the subset it needs; collecting them in one type keeps the call sites in check-resolvable.ts honest about what each phase consumes.","lines":["export interface PhaseCtx {","  fail: Reporter;","  warn: Reporter;","  rel: (p: string) => string;","  ROOT: string;","  SKILLS_DIR: string;","  CURSOR_RULES: string;","  ANTIGRAVITY_SKILLS: string;","  ANTIGRAVITY_WORKFLOWS: string;","  MANIFEST: string;","  INTERNAL: string;","  STRICT: boolean;","  skillDirs: string[];","  bundledSkills: Set\u003cstring>;","  trackedFiles: string[];","  manifestSet: Set\u003cstring>;","  listedInManifest: (p: string) => boolean;","}"],"truncated":false,"explain":"The shared context handed to every resolver check phase: the fail and warn reporter functions, a function that makes a path repo-relative, the repo root and the skill, Cursor, Antigravity, manifest and internal-list paths, the STRICT flag, the skill directories on disk, the set of bundled skills, the tracked files, the manifest entries, and a function that tests whether a path is listed in the manifest."},"tools/lib/resolver-parse.ts#ResolverRow":{"name":"ResolverRow","kind":"interface","file":"tools/lib/resolver-parse.ts","line":4,"to":9,"doc":"","lines":["export interface ResolverRow {","  name: string;","  regexCell: string;","  path: string;","  purpose: string;","}"],"truncated":false,"explain":"One parsed row of the RESOLVER.md skills table: the skill name, the raw regex cell (backticks kept), the path to the skill's canonical file, and the purpose text. parseResolverRows returns these."},"scripts/agent-loop-runner.ts#HEARTBEAT_MS":{"name":"HEARTBEAT_MS","kind":"const","file":"scripts/agent-loop-runner.ts","line":9,"to":9,"doc":"","lines":["const HEARTBEAT_MS = 250;"],"truncated":false,"explain":"The number 250, in milliseconds. The supervisor uses it as the interval at which it rewrites progress.json with a fresh heartbeat timestamp, and as the longest single sleep while waiting for the next run."},"scripts/agent-loop-process.ts#execute":{"name":"execute","kind":"function","file":"scripts/agent-loop-process.ts","line":71,"to":94,"doc":"","lines":["export async function execute(config: Config, dir: string, run = 1, sessionOverride?: string): Promise\u003cExecutionResult> {","  const log = join(dir, 'output.log');","  const resultPath = join(dir, RESULT_FILE);","  rmSync(resultPath, { force: true });","  if (existsSync(log)) renameSync(log, join(dir, 'previous.log'));","  const fd = openSync(log, 'w', 0o600);","  const argv = runArgv(config, run, sessionOverride);","  const child = spawn(argv[0], argv.slice(1), {","    cwd: config.cwd, stdio: ['ignore', fd, fd], detached: process.platform !== 'win32', windowsHide: true,","    env: { ...process.env, SCAFFOLD_AGENT: '1', SCAFFOLD_AGENT_LOOP_RESULT: resultPath },","  });","  let done = false;","  let outcome = '';","  child.once('error', error => { done = true; outcome = `spawn error: ${error.message}`; });","  child.once('exit', (code, signal) => { done = true; outcome = signal ? `signal ${signal}` : `exit ${code}`; });","  const deadline = Date.now() + config.timeout;","  try {","    while (!done) {","      const cancelled = stopRequest(dir, config.generation)?.cancel;","      if (cancelled || Date.now() >= deadline) {","        await terminate(child);","        return { outcome: cancelled ? 'cancelled' : 'timeout' };","      }","      await delay(Math.min(POLL_MS, Math.max(1, deadline - Date.now())));"],"truncated":true,"explain":"Runs one loop iteration: it deletes run-result.json in the state directory, renames any existing output.log to previous.log, and spawns the configured command without a shell (the warm argv on runs after the first when one is set, with {{SESSION}} replaced by the session id) in config.cwd, with stdout and stderr written to output.log and SCAFFOLD_AGENT and SCAFFOLD_AGENT_LOOP_RESULT set in its environment. It polls about every 100 ms and, if a cancelling stop request for this generation appears or config.timeout elapses, kills the child's process tree and resolves with outcome 'cancelled' or 'timeout'. Otherwise it resolves with the outcome 'exit N', 'signal X' or 'spawn error: ...'; when the exit is 0 and config.requireResult is set it also returns the directive read from run-result.json, or the outcome 'missing or invalid required result' if that file is absent or malformed."},"scripts/agent-loop-state.ts#save":{"name":"save","kind":"function","file":"scripts/agent-loop-state.ts","line":97,"to":112,"doc":"","lines":["export function save(dir: string, name: string, value: unknown): void {","  const temp = join(dir, `${name}.${randomUUID()}.tmp`);","  try {","    writeFileSync(temp, JSON.stringify(value, null, 2) + '\\n', { mode: 0o600, flag: 'wx' });","    for (let attempt = 1; ; attempt++) {","      try {","        renameSync(temp, join(dir, name));","        break;","      } catch (error) {","        const code = (error as NodeJS.ErrnoException).code ?? '';","        if (!RENAME_RETRY_CODES.has(code) || attempt >= RENAME_ATTEMPTS) throw error;","        sleepSync(RENAME_BACKOFF_MS * attempt);","      }","    }","  } finally { rmSync(temp, { force: true }); }","}"],"truncated":false,"explain":"Writes the value as pretty-printed JSON to the file `name` inside `dir` by first writing a uniquely named temp file with mode 0600 and then renaming it over the target, so readers never see a partial file. A rename that fails with EPERM, EBUSY or EACCES is retried up to 40 times with a short blocking sleep between attempts; any other error, or the last failed attempt, is thrown. The temp file is always removed."},"scripts/agent-loop-state.ts#stopRequest":{"name":"stopRequest","kind":"function","file":"scripts/agent-loop-state.ts","line":173,"to":178,"doc":"","lines":["export function stopRequest(dir: string, generation: string): { cancel: boolean } | undefined {","  const path = join(dir, 'stopped.json');","  if (!existsSync(path)) return;","  const request = JSON.parse(readFileSync(path, 'utf8')) as { generation: string; cancel: boolean };","  if (request.generation === generation) return request;","}"],"truncated":false,"explain":"Reads stopped.json in the state directory and returns its { generation, cancel } contents when its generation equals the one passed in. Returns undefined when the file does not exist or names a different generation, and throws if the file is not valid JSON."},"scripts/agent-loop-state.ts#status":{"name":"status","kind":"function","file":"scripts/agent-loop-state.ts","line":187,"to":197,"doc":"The single source of truth for loop status, shared by the CLI, the supervise loop, and test fixtures (which poll this directly instead of spawning a CLI process per poll).","lines":["export function status(dir: string): object {","  const config = readConfig(dir);","  const progress = readProgress(dir);","  const live = alive(progress);","  const stopped = stopRequest(dir, config.generation);","  const pending = pendingSteering(dir, config.generation).length;","  return { ...config, ...progress, driver: 'node', armed: live && !stopped && Date.now() \u003c config.expiresAt,","    supervisor: live ? 'active' : progress.ended ? 'stopped' : 'stale',","    running: live && progress.running, interrupted: !live && progress.running,","    stopRequested: !!stopped, pendingSteering: pending, log: join(dir, 'output.log') };","}"],"truncated":false,"explain":"Takes a loop state directory and returns one object that merges config.json and progress.json with derived fields: driver 'node', armed, supervisor ('active', 'stopped' or 'stale'), running, interrupted, stopRequested, the count of unacknowledged steering messages, and the path to output.log. It only reads files and probes the supervisor PID with signal 0; it throws if config.json is missing or unparseable."},"scripts/topology.ts#Topology":{"name":"Topology","kind":"interface","file":"scripts/topology.ts","line":25,"to":29,"doc":"","lines":["export interface Topology {","  orchestrator: { model: string };","  tickMinutes: number;","  slots: Slot[];","}"],"truncated":false,"explain":"The validated topology shape: an orchestrator object with a model string, tickMinutes as a number, and an array of slots (each with id, harness, model and optional effort). It is what parseTopology, loadTopology and defaultTopology return."},"scripts/topology.ts#TopologyError":{"name":"TopologyError","kind":"class","file":"scripts/topology.ts","line":31,"to":31,"doc":"","lines":["export class TopologyError extends Error {}"],"truncated":false,"explain":"An Error subclass with no added fields, thrown by the topology parsing and loading functions for any invalid topology file. The script's main catches this class to print the message and exit 1, and rethrows any other error."},"scripts/topology.ts#DEFAULT_TICK_MINUTES":{"name":"DEFAULT_TICK_MINUTES","kind":"const","file":"scripts/topology.ts","line":34,"to":34,"doc":"quality-ok: magic-number — the loop skill's documented default tick cadence","lines":["export const DEFAULT_TICK_MINUTES = 10;"],"truncated":false,"explain":"The number 10, the tick interval in minutes used when a topology file is absent or does not set tick_minutes."},"scripts/topology.ts#TOP_KEYS":{"name":"TOP_KEYS","kind":"const","file":"scripts/topology.ts","line":37,"to":37,"doc":"","lines":["const TOP_KEYS = ['orchestrator', 'tick_minutes', 'slots'];"],"truncated":false,"explain":"The list of key names allowed at the top level of a topology JSON object: orchestrator, tick_minutes and slots. parseTopology passes it to rejectUnknown so any other top-level key is an error."},"scripts/topology.ts#isObject":{"name":"isObject","kind":"function","file":"scripts/topology.ts","line":45,"to":47,"doc":"","lines":["function isObject(v: unknown): v is Record\u003cstring, unknown> {","  return typeof v === 'object' && v !== null && !Array.isArray(v);","}"],"truncated":false,"explain":"Takes any value and returns true only when it is a non-null object that is not an array, narrowing its type to a string-keyed record."},"scripts/topology.ts#rejectUnknown":{"name":"rejectUnknown","kind":"function","file":"scripts/topology.ts","line":49,"to":52,"doc":"","lines":["function rejectUnknown(obj: Record\u003cstring, unknown>, allowed: string[], where: string): void {","  const extra = Object.keys(obj).find(k => !allowed.includes(k));","  if (extra) throw new TopologyError(`${where}: unknown key \"${extra}\"`);","}"],"truncated":false,"explain":"Takes an object, a list of allowed key names and a location label, and throws TopologyError naming the first key of the object that is not in the list, prefixed with the label. Returns nothing when every key is allowed."},"scripts/topology.ts#parseOrchestrator":{"name":"parseOrchestrator","kind":"function","file":"scripts/topology.ts","line":72,"to":76,"doc":"","lines":["function parseOrchestrator(raw: unknown): { model: string } {","  if (!isObject(raw)) throw new TopologyError('orchestrator must be an object');","  rejectUnknown(raw, ['model'], 'orchestrator');","  return { model: nonEmptyString(raw.model, 'orchestrator.model') };","}"],"truncated":false,"explain":"Takes the raw orchestrator value from the topology JSON and returns { model } with the model string. Throws TopologyError if the value is not an object, has any key other than model, or model is not a non-empty string."},"scripts/topology.ts#parseSlots":{"name":"parseSlots","kind":"function","file":"scripts/topology.ts","line":78,"to":87,"doc":"","lines":["function parseSlots(raw: unknown): Slot[] {","  if (!Array.isArray(raw)) throw new TopologyError('slots must be an array');","  const slots = raw.map(parseSlot);","  const seen = new Set\u003cstring>();","  for (const s of slots) {","    if (seen.has(s.id)) throw new TopologyError(`duplicate slot id \"${s.id}\"`);","    seen.add(s.id);","  }","  return slots;","}"],"truncated":false,"explain":"Takes the raw slots value from the topology JSON, validates each element as a slot, and returns the resulting Slot array. Throws TopologyError if the value is not an array, any slot is invalid, or two slots share the same id."},"scripts/topology.ts#TOPOLOGY_PATH":{"name":"TOPOLOGY_PATH","kind":"const","file":"scripts/topology.ts","line":35,"to":35,"doc":"","lines":["export const TOPOLOGY_PATH = join(dirname(fileURLToPath(import.meta.url)), '..', '.agent', 'topology.json');"],"truncated":false,"explain":"The absolute path of .agent/topology.json in the repo that contains this script, computed from the script's own location. loadTopology reads this path when neither an argument nor the TOPOLOGY_FILE environment variable is given."},"scripts/topology.ts#defaultTopology":{"name":"defaultTopology","kind":"function","file":"scripts/topology.ts","line":41,"to":43,"doc":"","lines":["export function defaultTopology(): Topology {","  return { orchestrator: { model: 'default' }, tickMinutes: DEFAULT_TICK_MINUTES, slots: [] };","}"],"truncated":false,"explain":"Takes nothing and returns a new Topology with orchestrator model 'default', tickMinutes set to DEFAULT_TICK_MINUTES (10) and an empty slots array. loadTopology returns it when the topology file does not exist."},"scripts/topology.ts#parseTopology":{"name":"parseTopology","kind":"function","file":"scripts/topology.ts","line":90,"to":99,"doc":"","lines":["export function parseTopology(raw: unknown): Topology {","  if (!isObject(raw)) throw new TopologyError('topology must be a JSON object');","  rejectUnknown(raw, TOP_KEYS, 'topology');","  const orchestrator = parseOrchestrator(raw.orchestrator);","  const tick = raw.tick_minutes ?? DEFAULT_TICK_MINUTES;","  if (typeof tick !== 'number' || !Number.isFinite(tick) || tick \u003c= 0) {","    throw new TopologyError('tick_minutes must be a positive number');","  }","  return { orchestrator, tickMinutes: tick, slots: parseSlots(raw.slots ?? []) };","}"],"truncated":false,"explain":"Takes an already-parsed JSON value and returns a validated Topology, using DEFAULT_TICK_MINUTES when tick_minutes is absent and an empty list when slots is absent. Throws TopologyError naming the first problem: not an object, an unknown key, an invalid orchestrator or slot, or a tick_minutes that is not a positive finite number."},"scripts/queue-lanes.ts#beatLane":{"name":"beatLane","kind":"function","file":"scripts/queue-lanes.ts","line":56,"to":71,"doc":"","lines":["export function beatLane(id: string, patch: LanePatch = {}): LaneState {","  mkdirSync(laneDir(), { recursive: true });","  const prev = existsSync(lanePath(id)) ? readOne(lanePath(id)) : null;","  const base = prev ?? { ...blank(id), startedAt: now() };","  const next: LaneState = {","    ...base,","    worker: patch.worker ?? base.worker,","    model: patch.model ?? base.model,","    step: patch.step ?? base.step,","    state: patch.state ?? base.state,","    tail: patch.tail ?? base.tail,","    updatedAt: now(),","  };","  writeFileSync(lanePath(id), JSON.stringify(next, null, 2) + '\\n');","  return next;","}"],"truncated":false,"explain":"Takes a task id and an optional patch of worker, model, step, state and tail, and writes the lane's JSON file with those fields merged over the existing record and updatedAt set to the current time, creating the lanes directory if needed. When there is no readable existing record it starts from a blank one with startedAt set to now. Returns the record it wrote."},"scripts/queue.ts#runValidate":{"name":"runValidate","kind":"function","file":"scripts/queue.ts","line":83,"to":95,"doc":"","lines":["function runValidate(task: Task): { ok: boolean; tail: string } {","  const cmd = task.validate;","  if (!cmd) return { ok: true, tail: '' };","  const cwd = task.worktree ? join(ROOT, task.worktree) : process.cwd();","  try {","    execSync(cmd, { cwd, stdio: 'pipe', encoding: 'utf8' });","    return { ok: true, tail: '' };","  } catch (e) {","    const out = String((e as { stdout?: string; stderr?: string }).stderr","      || (e as { stdout?: string }).stdout || (e as Error).message);","    return { ok: false, tail: out.trim().split('\\n').slice(-3).join(' | ') };","  }","}"],"truncated":false,"explain":"Takes a task and runs its validate command in a shell, in the task's worktree if it has one and otherwise in the current directory. It returns { ok: true, tail: '' } when there is no command or the command exits 0, and { ok: false, tail } with the last three lines of the command's error output joined by ' | ' when it fails. It does not throw."},"scripts/queue-io.ts#now":{"name":"now","kind":"function","file":"scripts/queue-io.ts","line":67,"to":67,"doc":"","lines":["export function now(): string { return new Date().toISOString(); }"],"truncated":false,"explain":"Returns the current time as an ISO 8601 string."},"scripts/queue-io.ts#unlocked":{"name":"unlocked","kind":"function","file":"scripts/queue-io.ts","line":192,"to":196,"doc":"","lines":["export function unlocked\u003cT>(fn: () => T): T {","  if (!held) return fn();","  release();","  try { return fn(); } finally { acquire(); }","}"],"truncated":false,"explain":"Takes a function and returns its result; if this process holds the queue lock, it releases the lock (closing and deleting the lock file) before running the function and re-acquires it afterwards, even if the function throws. If no lock is held it just runs the function. Re-acquiring can throw if another process keeps the lock for 60 seconds, and the caller has to reload the queue afterwards because other processes may have changed it."},"scripts/queue-io.ts#load":{"name":"load","kind":"function","file":"scripts/queue-io.ts","line":291,"to":293,"doc":"","lines":["export function load(): Queue {","  return openStore(db => readStore(db));","}"],"truncated":false,"explain":"Opens the SQLite store in one transaction and returns the queue read from it. The first open of a new store also imports an existing queue.md into it, rewrites that file, and may add the store to .gitignore."},"scripts/queue-io.ts#appendArchive":{"name":"appendArchive","kind":"function","file":"scripts/queue-io.ts","line":382,"to":387,"doc":"","lines":["export function appendArchive(tasks: Task[]): void {","  const block = `\\n## Archived ${now()}\\n\\n`","    + tasks.map(t => `- [${t.status === 'done' ? 'x' : '!'}] ${t.id} — ${t.title}`","      + (t.elapsedSecs ? ` · ⏱${formatDurationSecs(t.elapsedSecs)}` : '')).join('\\n') + '\\n';","  appendFileSync(sidecar('archive.md'), block);","}"],"truncated":false,"explain":"Takes a list of tasks and appends a dated '## Archived' section to archive.md beside the queue file, one line per task with a done or failed marker, id, title and elapsed time when it is set. Returns nothing."},"scripts/queue-model.ts#removeTask":{"name":"removeTask","kind":"function","file":"scripts/queue-model.ts","line":493,"to":496,"doc":"","lines":["export function removeTask(q: Queue, id: string): Queue {","  if (q.tasks.some(t => t.id === id && t.status === 'active')) q = selectDelivery(q, id);","  return withTasks(q, q.tasks.filter(t => t.id !== id));","}"],"truncated":false,"explain":"Takes a queue and a task id and returns a new queue without that task. If the task was active and no delivery task is recorded (per-task mode), its id is first recorded as the current del
