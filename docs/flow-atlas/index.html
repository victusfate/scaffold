ivery task. Nothing is saved."},"scripts/queue-model.ts#markDone":{"name":"markDone","kind":"function","file":"scripts/queue-model.ts","line":509,"to":516,"doc":"","lines":["export function markDone(q: Queue, id: string, nowIso: string): Queue {","  if (q.tasks.some(t => t.id === id && t.status === 'active')) q = selectDelivery(q, id);","  if (q.config.deliveryTask === id) q = setConfig(q, { deliveryAccepted: true });","  return mapTask(q, id, t => ({","    ...t, status: 'done', owner: null, worktree: null, startedAt: null,","    elapsedSecs: bankSession(t, nowIso),","  }));","}"],"truncated":false,"explain":"Takes a queue, a task id and a current ISO time, and returns a new queue in which that task is done, with owner, worktree and startedAt cleared and the session time since startedAt added to its elapsed seconds. If the task was active and no delivery task is recorded (per-task mode) it becomes the delivery task, and if it is the delivery task the delivery-accepted flag is set to true. Nothing is saved."},"scripts/queue-model.ts#recordFailure":{"name":"recordFailure","kind":"function","file":"scripts/queue-model.ts","line":524,"to":542,"doc":"","lines":["export function recordFailure(","  q: Queue, id: string, reason: string | null, maxFailures: number, nowIso: string,","): { queue: Queue; terminal: boolean; failures: number } {","  const task = q.tasks.find(t => t.id === id);","  if (!task) return { queue: q, terminal: false, failures: 0 };","  q = selectDelivery(q, id);","  if (q.config.deliveryTask === id) q = setConfig(q, { deliveryAccepted: false });","  const failures = task.failures + 1;","  const terminal = failures >= maxFailures;","  const updated: Task = {","    ...task, failures, note: reason ?? task.note,","    status: terminal ? 'failed' : 'pending', owner: null, worktree: null, startedAt: null,","    elapsedSecs: bankSession(task, nowIso),","  };","  const rest = q.tasks.filter(t => t.id !== id);","  // terminal keeps position; a retry drops to the back so other work proceeds first.","  const tasks = terminal ? q.tasks.map(t => (t.id === id ? updated : t)) : [...rest, updated];","  return { queue: withTasks(q, tasks), terminal, failures };","}"],"truncated":false,"explain":"Takes a queue, a task id, an optional reason, a failure limit and a current ISO time, and returns the new queue together with the task's new failure count and whether it reached the limit. The task's count goes up by one, its owner, worktree and startedAt are cleared, its session time is banked and the reason replaces its note; below the limit it becomes pending and moves to the end of the list, at the limit it becomes failed and keeps its position. It also updates the delivery task and clears the delivery-accepted flag as beginTask does, and an unknown id returns the queue unchanged with a count of 0."},"scripts/queue-model.ts#selectDelivery":{"name":"selectDelivery","kind":"function","file":"scripts/queue-model.ts","line":751,"to":754,"doc":"","lines":["export function selectDelivery(q: Queue, id: string): Queue {","  return q.config.deliveryMode === 'batch' || q.config.deliveryTask ? q","    : setConfig(q, { deliveryTask: id, deliveryAccepted: false });","}"],"truncated":false,"explain":"Takes a queue and a task id and returns a queue whose config records that id as the current delivery task, with the delivery-accepted flag set to false. It returns the queue unchanged in batch delivery mode or when a delivery task is already recorded."},"scripts/queue-model.ts#archivableDone":{"name":"archivableDone","kind":"function","file":"scripts/queue-model.ts","line":785,"to":793,"doc":"","lines":["export function archivableDone(q: Queue): Task[] {","  const neededByUnfinished = new Set\u003cstring>();","  for (const t of q.tasks) {","    if (t.status === 'pending' || t.status === 'active') {","      for (const d of t.dependsOn) neededByUnfinished.add(d);","    }","  }","  return q.tasks.filter(t => t.status === 'done' && !neededByUnfinished.has(t.id));","}"],"truncated":false,"explain":"Takes a queue and returns the done tasks that no pending or active task lists as a dependency. Failed tasks are never returned, and nothing is changed."},"scripts/queue-model.ts#ISO_DATE_LEN":{"name":"ISO_DATE_LEN","kind":"const","file":"scripts/queue-model.ts","line":144,"to":144,"doc":"","lines":["const ISO_DATE_LEN = 'YYYY-MM-DD'.length;"],"truncated":false,"explain":"The number 10, the length of a 'YYYY-MM-DD' date. parkTask uses it to cut the date part off an ISO timestamp for the 'parked \u003cdate>' line it adds to a task's note."},"scripts/queue-model.ts#bankSession":{"name":"bankSession","kind":"function","file":"scripts/queue-model.ts","line":240,"to":244,"doc":"","lines":["export function bankSession(t: Task, nowIso: string): number {","  if (!t.startedAt) return t.elapsedSecs;","  const delta = Math.floor((Date.parse(nowIso) - Date.parse(t.startedAt)) / MS_PER_SEC);","  return t.elapsedSecs + Math.max(0, delta);","}"],"truncated":false,"explain":"Takes a task and a current time as an ISO string and returns the task's elapsed seconds plus the whole seconds since its startedAt. If the task has no startedAt, or the difference is negative, it returns the existing elapsed total unchanged. It does not modify the task."},"scripts/queue-model.ts#mapTask":{"name":"mapTask","kind":"function","file":"scripts/queue-model.ts","line":447,"to":449,"doc":"","lines":["function mapTask(q: Queue, id: string, fn: (t: Task) => Task): Queue {","  return withTasks(q, q.tasks.map(t => (t.id === id ? fn(t) : t)));","}"],"truncated":false,"explain":"Takes a queue, a task id and a function, and returns a new queue in which the task with that id is replaced by the function's result; all other tasks and the config are kept. If no task has that id the returned queue has the same tasks."},"scripts/queue-console-slots.ts#SlotView":{"name":"SlotView","kind":"interface","file":"scripts/queue-console-slots.ts","line":10,"to":16,"doc":"","lines":["export interface SlotView extends Slot {","  busy: boolean;","  /** More than one active task owned by this slot: a dispatch bug worth flagging. */","  overbooked: boolean;","  tasks: SlotTask[];","  lane: LaneView | null;","}"],"truncated":false,"explain":"One topology slot as the queue console shows it: the slot's own fields plus busy (it owns at least one active task), overbooked (it owns more than one), the active tasks it owns, and the matching lane record or null."},"scripts/queue-console-slots.ts#ConsoleOrphan":{"name":"ConsoleOrphan","kind":"interface","file":"scripts/queue-console-slots.ts","line":17,"to":17,"doc":"","lines":["export interface ConsoleOrphan { id: string; title: string; owner: string | null }"],"truncated":false,"explain":"An active task whose owner is not a declared topology slot, as shown by the queue console: the task id, title and owner (or null)."},"scripts/queue-console.ts#LaneView":{"name":"LaneView","kind":"interface","file":"scripts/queue-console.ts","line":80,"to":80,"doc":"","lines":["export interface LaneView extends LaneState { stale: boolean; stop: boolean }"],"truncated":false,"explain":"A lane's heartbeat record (LaneState) plus two derived flags: stale, whether the heartbeat is older than the queue's lease allows, and stop, whether a stop has been requested for that lane."},"scripts/queue-worktrees.ts#git":{"name":"git","kind":"function","file":"scripts/queue-worktrees.ts","line":10,"to":12,"doc":"","lines":["function git(args: string, cwd = ROOT): string {","  return execSync(`git ${args}`, { cwd, encoding: 'utf8', stdio: 'pipe' }).trim();","}"],"truncated":false,"explain":"Takes a git argument string and an optional working directory (default the repo root), runs `git \u003cargs>` through the shell and returns its trimmed standard output. It throws if the command exits non-zero."},"scripts/queue-worktrees.ts#currentBranch":{"name":"currentBranch","kind":"function","file":"scripts/queue-worktrees.ts","line":13,"to":15,"doc":"","lines":["function currentBranch(): string {","  try { return git('rev-parse --abbrev-ref HEAD'); } catch { return 'main'; }","}"],"truncated":false,"explain":"Returns the name of the branch checked out in the repo root, from `git rev-parse --abbrev-ref HEAD`. If that git command fails it returns 'main'."},"scripts/queue-worktrees.ts#wtRel":{"name":"wtRel","kind":"function","file":"scripts/queue-worktrees.ts","line":16,"to":16,"doc":"","lines":["function wtRel(id: string): string { return join('.agent', 'queue', 'wt', id); }"],"truncated":false,"explain":"Takes a task id and returns the repo-relative path of that task's worktree, .agent/queue/wt/\u003cid>. It does not create or check anything."},"scripts/queue-io.ts#ROOT":{"name":"ROOT","kind":"const","file":"scripts/queue-io.ts","line":20,"to":20,"doc":"","lines":["export const ROOT = join(dirname(fileURLToPath(import.meta.url)), '..');"],"truncated":false,"explain":"The absolute path of the checkout root, computed as the parent of the directory containing this script. The default queue directory and git lookups are resolved from it."},"scripts/queue-model.ts#setField":{"name":"setField","kind":"function","file":"scripts/queue-model.ts","line":472,"to":474,"doc":"","lines":["export function setField(q: Queue, id: string, patch: Partial\u003cTask>): Queue {","  return mapTask(q, id, t => ({ ...t, ...patch }));","}"],"truncated":false,"explain":"Takes a queue, a task id and a partial task, and returns a new queue in which that task has the given fields overwritten. An unknown id leaves the tasks unchanged, and nothing is saved."},"scripts/queue-claim.ts#refusal":{"name":"refusal","kind":"function","file":"scripts/queue-claim.ts","line":8,"to":13,"doc":"","lines":["function refusal(q: Queue, t: Task): { message: string; stderr: boolean } | null {","  if (t.status !== 'pending') return { message: `claim: ${t.id} is ${t.status}, not claimable`, stderr: false };","  if (!deliveryAllows(q, t.id)) return { message: 'claim: current delivery cycle must finish first', stderr: true };","  if (t.held) return { message: `claim: ${t.id} is held — unhold it first`, stderr: false };","  return null;","}"],"truncated":false,"explain":"Takes the queue and a task and returns null when the task can be claimed. Otherwise it returns a message and whether to print it to stderr: the task is not pending, the current delivery cycle has not finished, or the task is held."},"scripts/queue-claim.ts#branchFlag":{"name":"branchFlag","kind":"function","file":"scripts/queue-claim.ts","line":16,"to":20,"doc":"","lines":["function branchFlag(flags: Map\u003cstring, string>): string | null {","  if (!flags.has('branch')) return '';","  const branch = flags.get('branch')?.trim() ?? '';","  return branch && !/\\s/.test(branch) ? branch : null;","}"],"truncated":false,"explain":"Reads the --branch flag from the parsed flags: returns '' when the flag is absent, the trimmed name when it is a non-empty value without whitespace, and null when it was given but is empty or contains whitespace."},"scripts/queue-model.ts#beginTask":{"name":"beginTask","kind":"function","file":"scripts/queue-model.ts","line":503,"to":507,"doc":"","lines":["export function beginTask(q: Queue, id: string, nowIso: string, owner: string | null = null): Queue {","  q = selectDelivery(q, id);","  if (q.config.deliveryTask === id) q = setConfig(q, { deliveryAccepted: false });","  return mapTask(q, id, t => ({ ...t, status: 'active', owner, startedAt: nowIso }));","}"],"truncated":false,"explain":"Takes a queue, a task id, a current ISO time and an optional owner, and returns a new queue in which that task is active with that owner and startedAt set to the given time. In per-task delivery mode it also records the task as the current delivery task if none is recorded, and clears the delivery-accepted flag when this task is the delivery task. Nothing is saved, and an unknown id leaves the task list unchanged."},"scripts/queue-model.ts#taskBlock":{"name":"taskBlock","kind":"function","file":"scripts/queue-model.ts","line":864,"to":876,"doc":"","lines":["export function taskBlock(t: Task): string {","  const spec = [","    t.mode === 'chain' ? 'mode: chain (design→prd→plan→tdd→refine, autonomous, no questions)' : 'mode: direct',","    `architecture: ${t.architecture}`,","    architectureGuidance(t.architecture),","    t.slug ? `slug: docs/${t.slug}/` : '',","    t.accept ? `accept: ${t.accept}` : '',","    t.files.length ? `files: ${t.files.join(', ')}` : '',","    t.contracts.length ? `contracts: ${t.contracts.join(', ')}` : '',","    t.validate ? `validate: ${t.validate}` : '',","  ].filter(Boolean).join('\\n');","  return `\u003cqueue_task id=\"${t.id}\">\\n${t.title}\\n${spec}\\n\u003c/queue_task>`;","}"],"truncated":false,"explain":"Takes a task and returns the text block handed to a worker: a \u003cqueue_task id=\"...\"> element containing the title, the mode, the architecture setting with its guidance text, and the slug, accept, files, contracts and validate lines for whichever of those the task has."},"scripts/queue.ts#dispatch":{"name":"dispatch","kind":"function","file":"scripts/queue.ts","line":304,"to":327,"doc":"","lines":["function dispatch(argv: string[], stdinItems?: string[]): number {","  const [cmd = 'list', ...rest] = argv;","  const f = parse(rest);","  const id = f.positionals[0];","  let q = load();","  const needId = (): boolean => Boolean(id && q.tasks.some(t => t.id === id));","","  switch (cmd) {","    case 'list': case 'status': {","      const tag = f.flags.get('tag');","      if (tag === '') { console.error('queue: list --tag needs a tag name'); return 2; }","      console.log(renderModel(tag ? { ...q, tasks: q.tasks.filter(t => t.tags.includes(tag)) } : q));","      return 0;","    }","    case 'show':","      if (!needId()) { console.error('show: unknown task id'); return 1; }","      console.log(showTask(q.tasks.find(t => t.id === id)!)); return 0;","","    case 'add': {","      const title = f.positionals.join(' ').trim();","      if (!title) { console.error('usage: queue add \"\u003ctitle>\" [--parent \u003cid> | --requested \"\u003chuman words>\"] [flags]'); return 1; }","      const origin = taskOrigin(q, f);","      if (!origin.ok) { console.error(origin.error); return 2; }","      q = addTask(q, title, { top: f.bools.has('top'), ...withOrigin(taskOverrides(f), origin.patch) });"],"truncated":true,"explain":"Takes the CLI arguments (and, for add-many, lines read from stdin), loads the queue, and runs the one subcommand named by the first argument, defaulting to `list`. Depending on the subcommand it saves the queue, appends to the queue log, writes lane or archive files, or runs git, and it prints the result to the console. It returns the process exit code: 0 on success, 1 or 2 for usage and input errors or an unknown command, and the EXIT codes for tick, ready and signal."},"scripts/queue-model.ts#resumeIfDue":{"name":"resumeIfDue","kind":"function","file":"scripts/queue-model.ts","line":634,"to":640,"doc":"","lines":["export function resumeIfDue(q: Queue, nowIso: string): { queue: Queue; resumed: boolean } {","  const { status, resumeAt } = q.config;","  if (status === 'stopped' && resumeAt && Date.parse(nowIso) >= Date.parse(resumeAt)) {","    return { queue: setConfig(q, { status: 'running', resumeAt: '' }), resumed: true };","  }","  return { queue: q, resumed: false };","}"],"truncated":false,"explain":"Takes a queue and a current ISO time and returns { queue, resumed }. If the queue is stopped with a resumeAt time that has been reached, the returned queue is set to running with resumeAt cleared and resumed is true; otherwise the queue is returned unchanged with resumed false, including for a stop that has no resumeAt."},"scripts/queue-model.ts#staleLeases":{"name":"staleLeases","kind":"function","file":"scripts/queue-model.ts","line":648,"to":652,"doc":"","lines":["export function staleLeases(","  q: Queue, nowIso: string, leaseMinutes: number,","): Task[] {","  return q.tasks.filter(t => t.status === 'active' && ageMinutes(t.startedAt, nowIso) >= leaseMinutes);","}"],"truncated":false,"explain":"Takes a queue, a current ISO time and a lease length in minutes, and returns the active tasks whose startedAt is at least that many minutes old. An active task with no startedAt counts as age zero. Nothing is changed or released."},"scripts/queue-links.ts#danglingLinks":{"name":"danglingLinks","kind":"function","file":"scripts/queue-links.ts","line":10,"to":13,"doc":"","lines":["export function danglingLinks(q: Queue, liveBranches: ReadonlySet\u003cstring>): { id: string; branch: string }[] {","  return q.tasks.flatMap(t =>","    t.status !== 'done' && t.branch && !liveBranches.has(t.branch) ? [{ id: t.id, branch: t.branch }] : []);","}"],"truncated":false,"explain":"Takes a queue and the set of branch names that exist, and returns an { id, branch } pair for every task that is not done and whose branch field names a branch outside that set. Tasks with an empty branch are not reported; nothing is changed."},"scripts/queue-links.ts#localBranches":{"name":"localBranches","kind":"function","file":"scripts/queue-links.ts","line":15,"to":18,"doc":"","lines":["function localBranches(): Set\u003cstring> {","  const out = execSync(\"git for-each-ref --format='%(refname:short)' refs/heads\", { cwd: ROOT, encoding: 'utf8', stdio: 'pipe' });","  return new Set(out.split('\\n').map(s => s.trim()).filter(Boolean));","}"],"truncated":false,"explain":"Runs `git for-each-ref` on refs/heads in the repo root and returns the set of local branch names. It throws if the git command fails."},"scripts/queue-lanes.ts#LaneState":{"name":"LaneState","kind":"interface","file":"scripts/queue-lanes.ts","line":18,"to":27,"doc":"","lines":["export interface LaneState {","  id: string;","  worker: string | null;","  model: string | null;","  step: string | null;","  state: string;","  startedAt: string | null;","  updatedAt: string;","  tail: string | null;","}"],"truncated":false,"explain":"The contents of one lane heartbeat file (.agent/queue/lanes/\u003ctask-id>.json): the task id, the worker, model and step (each may be null), a state string, the startedAt and updatedAt ISO times, and a tail string or null. It is what beatLane writes and readLanes returns for the live board."},"scripts/queue-lanes.ts#LanePatch":{"name":"LanePatch","kind":"interface","file":"scripts/queue-lanes.ts","line":29,"to":31,"doc":"","lines":["export interface LanePatch {","  worker?: string; model?: string; step?: string; state?: string; tail?: string;","}"],"truncated":false,"explain":"The optional fields a heartbeat may set on a lane record: worker, model, step, state and tail, all strings. It is the argument beatLane merges over the existing lane file; fields left out keep their previous value."},"scripts/queue-lanes.ts#laneDir":{"name":"laneDir","kind":"function","file":"scripts/queue-lanes.ts","line":33,"to":33,"doc":"","lines":["export function laneDir(): string { return join(dirname(queueFile()), 'lanes'); }"],"truncated":false,"explain":"Returns the path of the 'lanes' directory that sits next to the queue file (whose location comes from QUEUE_FILE or the shared queue directory). It does not create the directory."},"scripts/queue-lanes.ts#lanePath":{"name":"lanePath","kind":"function","file":"scripts/queue-lanes.ts","line":34,"to":34,"doc":"","lines":["function lanePath(id: string): string { return join(laneDir(), `${id}.json`); }"],"truncated":false,"explain":"Takes a task id and returns the path of its lane heartbeat file, \u003clanes directory>/\u003cid>.json. It does not check that the file exists."},"scripts/queue-lanes.ts#blank":{"name":"blank","kind":"function","file":"scripts/queue-lanes.ts","line":37,"to":42,"doc":"","lines":["function blank(id: string): LaneState {","  return {","    id, worker: null, model: null, step: null, state: 'running',","    startedAt: null, updatedAt: now(), tail: null,","  };","}"],"truncated":false,"explain":"Takes a task id and returns a new lane record for it with state 'running', updatedAt set to the current time, and worker, model, step, startedAt and tail all null. It writes nothing."},"scripts/queue-lanes.ts#readOne":{"name":"readOne","kind":"function","file":"scripts/queue-lanes.ts","line":44,"to":50,"doc":"","lines":["function readOne(path: string): LaneState | null {","  try {","    const raw = JSON.parse(readFileSync(path, 'utf8')) as Partial\u003cLaneState>;","    if (typeof raw.id !== 'string') return null;","    return { ...blank(raw.id), ...raw, id: raw.id, updatedAt: String(raw.updatedAt ?? now()) };","  } catch { return null; }","}"],"truncated":false,"explain":"Takes the path of a lane JSON file and returns its lane record, with missing fields filled from a blank record and updatedAt defaulting to the current time. Returns null when the file cannot be read or parsed, or has no string id."},"scripts/queue-io.ts#sidecar":{"name":"sidecar","kind":"function","file":"scripts/queue-io.ts","line":66,"to":66,"doc":"","lines":["export function sidecar(name: string): string { return join(dirname(queueFile()), name); }"],"truncated":false,"explain":"Takes a file name and returns its path in the same directory as the queue file, where log.md, archive.md and the lane files are kept."},"scripts/agent-loop-process.ts#isRecord":{"name":"isRecord","kind":"function","file":"scripts/agent-loop-process.ts","line":16,"to":18,"doc":"","lines":["function isRecord(value: unknown): value is Record\u003cstring, unknown> {","  return Boolean(value) && typeof value === 'object' && !Array.isArray(value);","}"],"truncated":false,"explain":"Type guard that returns true when the value is a non-null object that is not an array. It has no side effects."},"scripts/agent-loop-process.ts#isDirectiveStatus":{"name":"isDirectiveStatus","kind":"function","file":"scripts/agent-loop-process.ts","line":20,"to":22,"doc":"","lines":["function isDirectiveStatus(value: unknown): value is AgentDirective['status'] {","  return value === 'continue' || value === 'complete' || value === 'blocked';","}"],"truncated":false,"explain":"Type guard that returns true only when the value is exactly the string 'continue', 'complete' or 'blocked'. It has no side effects."},"scripts/agent-loop-state.ts#AgentDirective":{"name":"AgentDirective","kind":"interface","file":"scripts/agent-loop-state.ts","line":30,"to":38,"doc":"","lines":["export interface AgentDirective {","  status: 'continue' | 'complete' | 'blocked';","  summary: string;","  // Capture path (complements the pre-set {{SESSION}} path): when a run reports","  // `resume`, the driver substitutes it for `{{SESSION}}` on the NEXT run,","  // overriding the minted id. Lets CLIs that generate their own session id","  // (codex thread_id, pi session file) participate without driver CLI knowledge.","  resume?: string;","}"],"truncated":false,"explain":"The shape of the result a loop run reports back: a status of 'continue', 'complete' or 'blocked', a summary string, and an optional resume string. When resume is present the driver substitutes it for {{SESSION}} on the next run in place of the minted session id."},"scripts/mind-meld.ts#ROOT":{"name":"ROOT","kind":"const","file":"scripts/mind-meld.ts","line":20,"to":20,"doc":"","lines":["const ROOT = join(dirname(fileURLToPath(import.meta.url)), '..');"],"truncated":false,"explain":"The absolute path of the repository root, computed as the parent of the directory containing this script. Source files are read and snapshots verified relative to it."},"scripts/mind-meld.ts#EXAMPLE":{"name":"EXAMPLE","kind":"const","file":"scripts/mind-meld.ts","line":21,"to":21,"doc":"","lines":["const EXAMPLE = 'scripts/mind-meld-example.ts';"],"truncated":false,"explain":"The repo-relative path 'scripts/mind-meld-example.ts', the example program that index() parses for nodes and edges and that runs execute in the sandbox."},"scripts/mind-meld.ts#IMPLEMENTATION":{"name":"IMPLEMENTATION","kind":"const","file":"scripts/mind-meld.ts","line":24,"to":24,"doc":"","lines":["const IMPLEMENTATION = ['mind-meld.ts', 'mind-meld-schema.ts', 'mind-meld-sandbox.ts', 'mind-meld-example.ts', 'mind-meld-viewer.ts'];"],"truncated":false,"explain":"The five mind-meld file names under scripts/ whose contents index() reads into the bundle's sources, so they all feed the snapshot hash."},"scripts/mind-meld.ts#compiler":{"name":"compiler","kind":"const","file":"scripts/mind-meld.ts","line":26,"to":26,"doc":"","lines":["const compiler = await loadTypeScript();   // optional: only index() parses source"],"truncated":false,"explain":"The TypeScript compiler module returned by loadTypeScript() at module load, or a falsy value when the package is not available. index() parses source with it and cacheKey() includes its version."},"scripts/mind-meld.ts#missingTypeScript":{"name":"missingTypeScript","kind":"function","file":"scripts/mind-meld.ts","line":27,"to":29,"doc":"","lines":["function missingTypeScript(): never {","  throw new Error('mind meld index needs the typescript package: install it (npm i -D typescript) or set SCAFFOLD_TYPESCRIPT_DIR');","}"],"truncated":false,"explain":"Always throws an Error saying that mind meld index needs the typescript package and how to provide it. It never returns."},"scripts/mind-meld-schema.ts#MeldNode":{"name":"MeldNode","kind":"interface","file":"scripts/mind-meld-schema.ts","line":7,"to":7,"doc":"","lines":["export interface MeldNode { id: string; file: string; line: number; endLine: number; layer: string }"],"truncated":false,"explain":"One indexed declaration in a Mind Meld bundle: its id, the source file it lives in, its first and last line, and a layer name used to group it in views."},"scripts/mind-meld-schema.ts#MeldEdge":{"name":"MeldEdge","kind":"interface","file":"scripts/mind-meld-schema.ts","line":9,"to":9,"doc":"","lines":["export interface MeldEdge { from: string; to: string; file: string; line: number; kind: 'call' }"],"truncated":false,"explain":"One static call edge in a Mind Meld bundle: the calling node id (from), the called node id (to), the file and line of the call expression, and kind fixed to 'call'."},"scripts/mind-meld-schema.ts#MeldBundle":{"name":"MeldBundle","kind":"interface","file":"scripts/mind-meld-schema.ts","line":11,"to":11,"doc":"","lines":["export interface MeldBundle { version: 1; nodes: MeldNode[]; sources: Record\u003cstring, string>; sourceHashes: Record\u003cstring, string>; snapshotHash: string; edges: MeldEdge[]; runs: MeldRun[] }"],"truncated":false,"explain":"The shape of a mind-meld exchange file, version 1: the indexed nodes (functions with file, line span and layer), the full text of each source file keyed by path, a hash per source file, one snapshot hash over those hashes, the static call edges, and the recorded runs with their events."},"scripts/mind-meld-schema.ts#text":{"name":"text","kind":"function","file":"scripts/mind-meld-schema.ts","line":17,"to":19,"doc":"","lines":["function text(value: unknown): asserts value is string {","  if (typeof value !== 'string' || value.length > MAX_TEXT_LENGTH) throw new Error('expected bounded string');","}"],"truncated":false,"explain":"Type assertion that the value is a string of at most 1,000,000 characters. Throws 'expected bounded string' otherwise and returns nothing."},"scripts/mind-meld-schema.ts#sourceManifest":{"name":"sourceManifest","kind":"function","file":"scripts/mind-meld-schema.ts","line":57,"to":60,"doc":"","lines":["export function sourceManifest(sources: Record\u003cstring, string>): { sourceHashes: Record\u003cstring, string>; snapshotHash: string } {","  const sourceHashes = Object.fromEntries(Object.keys(sources).sort().map(file => [file, sourceHash(sources[file])]));","  return { sourceHashes, snapshotHash: sourceHash(JSON.stringify(sourceHashes)) };","}"],"truncated":false,"explain":"Takes a map of file path to source text and returns sourceHashes (each file's SHA-256, with files in sorted order) and snapshotHash (the SHA-256 of that hash map's JSON)."},"scripts/mind-meld.ts#run":{"name":"run","kind":"function","file":"scripts/mind-meld.ts","line":83,"to":95,"doc":"","lines":["function run(mode: 'flow' | 'piece', value: unknown): MeldRun {","  const normalized = inputs(value);","  const snapshot = index();","  const key = cacheKey(mode, normalized, snapshot);","  const hit = cache.get(key);","  if (hit) return structuredClone(hit);","  const raw = JSON.parse(runSandbox(join(ROOT, EXAMPLE), [mode, JSON.stringify(normalized)], MELD_LIMIT_MS, snapshot.sourceHashes[EXAMPLE])) as Record\u003cstring, unknown>;","  const result = { ...raw, key, snapshotHash: snapshot.snapshotHash, mode, entry: mode === 'flow' ? 'combat' : 'damage' } as MeldRun;","  if (index().snapshotHash !== snapshot.snapshotHash) throw new Error('source changed during execution');","  validateBundle({ ...snapshot, runs: [result] });","  cache.set(key, structuredClone(result));","  return result;","}"],"truncated":false,"explain":"Takes a mode ('flow' or 'piece') and an inputs value, and returns the recorded MeldRun, from the in-process cache when the key matches. Otherwise it re-indexes the sources, executes the example file in the sandbox, validates the result and caches it. Throws on invalid inputs, on a sandbox or validation failure, or if the sources changed during execution."},"scripts/mind-meld-schema.ts#MeldRun":{"name":"MeldRun","kind":"interface","file":"scripts/mind-meld-schema.ts","line":10,"to":10,"doc":"","lines":["export interface MeldRun { key: string; snapshotHash: string; mode: 'flow' | 'piece'; entry: string; output: string; events: MeldEvent[] }"],"truncated":false,"explain":"One recorded execution in a Mind Meld bundle: its cache key, the snapshot hash of the sources it ran against, the mode ('flow' or 'piece'), the entry node id, the output text and the ordered list of recorded events."},"scripts/mind-meld-pages.ts#value":{"name":"value","kind":"const","file":"scripts/mind-meld-pages.ts","line":24,"to":24,"doc":"A recorded value exactly as recorded, in a code span so it can't render as markdown or a hidden HTML tag. Line breaks and tabs are shown as \\n and \\t, since a code span can't hold a line break.","lines":["const value = (text: string): string => codeSpan(text.replace(/\\r?\\n/g, '\\\\n').replace(/\\t/g, '\\\\t'));"],"truncated":false,"explain":"Takes a recorded string and returns it wrapped as a markdown code span, with line breaks replaced by the two characters \\n and tabs by \\t so the span stays on one line."},"scripts/mind-meld-langs.ts#LanguageAdapter":{"name":"LanguageAdapter","kind":"interface","file":"scripts/mind-meld-langs.ts","line":31,"to":35,"doc":"A language adapter. Scaffold ships TypeScript, Python, Rust and Ruby below; a repo adds any other language in its own .mind-meld/languages/\u003cname>.ts (default export), so scaffold does not grow.","lines":["export interface LanguageAdapter {","  name: string;","  extensions: string[];","  facts(files: string[], ctx: AdapterContext): FileFacts[] | Promise\u003cFileFacts[]>;","}"],"truncated":false,"explain":"The interface a language adapter implements: a display name, the list of file extensions it handles, and a facts function that takes repo-relative file paths and an AdapterContext and returns, directly or as a promise, the FileFacts (definitions and imports) for those files."},"scripts/mind-meld-langs.ts#BUILT_IN":{"name":"BUILT_IN","kind":"const","file":"scripts/mind-meld-langs.ts","line":221,"to":226,"doc":"── Dispatch ───────────────────────────────────────────────────────────────────────────────────────","lines":["export const BUILT_IN: LanguageAdapter[] = [","  { name: 'TypeScript', extensions: ['.ts', '.tsx', '.mts'], facts: typescriptFacts },","  { name: 'Python', extensions: ['.py'], facts: pythonFacts },","  { name: 'Rust', extensions: ['.rs'], facts: rustFacts },","  { name: 'Ruby', extensions: ['.rb'], facts: rubyFacts },","];"],"truncated":false,"explain":"The list of language adapters that ship with scaffold: TypeScript (.ts, .tsx, .mts), Python (.py), Rust (.rs) and Ruby (.rb), each pairing its file extensions with the function that extracts definitions and imports. loadAdapters appends it after any adapters the repo defines, so a repo adapter for the same extension is found first."},"scripts/mind-meld-langs.ts#REPO_ADAPTERS":{"name":"REPO_ADAPTERS","kind":"const","file":"scripts/mind-meld-langs.ts","line":227,"to":227,"doc":"","lines":["export const REPO_ADAPTERS = '.mind-meld/languages';"],"truncated":false,"explain":"The string '.mind-meld/languages', the repo-relative directory from which loadAdapters imports a repository's own language adapter modules. It also appears in the error thrown when a module there has no valid default export."},"scripts/mind-meld-sandbox.ts#MELD_IMAGE":{"name":"MELD_IMAGE","kind":"const","file":"scripts/mind-meld-sandbox.ts","line":11,"to":11,"doc":"","lines":["export const MELD_IMAGE = 'node:26-alpine@sha256:c6ad9e9c1d80f6eb607c26b4b0a132ff7a2344fad1c78ea3baa2a7d4c8de6d94';"],"truncated":false,"explain":"The Docker image reference, node:26-alpine pinned by sha256 digest, that sandboxed runs execute in. It is also included in the hash that keys a recorded run, so a different image produces a different key."},"scripts/mind-meld-sandbox.ts#MELD_LIMIT_MS":{"name":"MELD_LIMIT_MS","kind":"const","file":"scripts/mind-meld-sandbox.ts","line":12,"to":12,"doc":"","lines":["export const MELD_LIMIT_MS = 10_000;"],"truncated":false,"explain":"The number 10000, in milliseconds. It is the default and the maximum timeout runSandbox accepts for a sandboxed run, and the timeout for the docker rm cleanup call."},"scripts/mind-meld-sandbox.ts#MILLISECONDS_PER_SECOND":{"name":"MILLISECONDS_PER_SECOND","kind":"const","file":"scripts/mind-meld-sandbox.ts","line":14,"to":14,"doc":"","lines":["const MILLISECONDS_PER_SECOND = 1000;"],"truncated":false,"explain":"The number 1000. sandboxArgs divides the timeout by it and rounds up to get the whole seconds passed to the timeout command inside the container."},"scripts/mind-meld-sandbox.ts#dockerArgs":{"name":"dockerArgs","kind":"function","file":"scripts/mind-meld-sandbox.ts","line":17,"to":17,"doc":"","lines":["export function dockerArgs(): string[] { return ['--host=unix:///var/run/docker.sock']; }"],"truncated":false,"explain":"Returns the single-element list ['--host=unix:///var/run/docker.sock'], the leading docker arguments that force every call to the local daemon's socket."},"scripts/mind-meld-sandbox.ts#sandboxArgs":{"name":"sandboxArgs","kind":"function","file":"scripts/mind-meld-sandbox.ts","line":19,"to":30,"doc":"","lines":["export function sandboxArgs(source: string, name: string, args: string[], timeoutMs = MELD_LIMIT_MS): string[] {","  const file = realpathSync(source);","  if (file.includes(',')) throw new Error('Docker bind path cannot contain commas');","  return [...dockerArgs(), 'run', '--rm', '--pull=never', '--name', name,","    '--network=none', '--read-only', '--cap-drop=ALL', '--security-opt=no-new-privileges',","    '--pids-limit=32', '--memory=128m', '--cpus=1', '--user=65534:65534',","    '--tmpfs=/work:rw,noexec,nosuid,size=16m,mode=1777', '--workdir=/work',","    '--env=HOME=/work', '--env=HTTP_PROXY=', '--env=HTTPS_PROXY=', '--env=ALL_PROXY=',","    '--env=NO_PROXY=', '--env=no_proxy=', '--env=http_proxy=', '--env=https_proxy=', '--env=all_proxy=',","    '--mount', `type=bind,src=${file},dst=/app/example.ts,readonly`,","    MELD_IMAGE, 'timeout', '-s', 'KILL', String(Math.ceil(timeoutMs / MILLISECONDS_PER_SECOND)), 'node', '/app/example.ts', ...args];","}"],"truncated":false,"explain":"Takes a source file path, a container name, the program arguments and a timeout, and returns the full docker argument list for a locked-down 'docker run' that mounts the resolved file read-only at /app/example.ts and runs it with node under a kill timeout of the rounded-up seconds. It starts nothing itself; it throws if the file does not exist or its real path contains a comma."},"scripts/mind-meld-sandbox.ts#dockerEnvironment":{"name":"dockerEnvironment","kind":"function","file":"scripts/mind-meld-sandbox.ts","line":32,"to":36,"doc":"","lines":["function dockerEnvironment(): NodeJS.ProcessEnv {","  const env = { ...process.env };","  for (const key of ['DOCKER_HOST', 'DOCKER_CONTEXT', 'DOCKER_TLS', 'DOCKER_TLS_VERIFY', 'DOCKER_CERT_PATH']) delete env[key];","  return env;","}"],"truncated":false,"explain":"Returns a copy of the current process environment with DOCKER_HOST, DOCKER_CONTEXT, DOCKER_TLS, DOCKER_TLS_VERIFY and DOCKER_CERT_PATH removed. It does not modify process.env."},"scripts/mind-meld-sandbox.ts#cleanupChild":{"name":"cleanupChild","kind":"function","file":"scripts/mind-meld-sandbox.ts","line":37,"to":42,"doc":"","lines":["function cleanupChild(name: string, env: NodeJS.ProcessEnv): Error | null {","  const result = spawnSync('docker', [...dockerArgs(), 'rm', '--force', name], { env, encoding: 'utf8', timeout: MELD_LIMIT_MS });","  if (result.error) return new Error(`Mind Meld child cleanup failed: ${result.error.message}`);","  if (result.status !== 0 && !result.stderr.includes('No such container:')) return new Error(`Mind Meld child cleanup failed: ${result.stderr}`);","  return null;","}"],"truncated":false,"explain":"Takes a container name and an environment and runs 'docker rm --force' on that container against the local Docker socket. It returns null on success or when Docker reports no such container, and returns (does not throw) an Error when the command could not run or failed for another reason."},"scripts/mind-meld-sandbox.ts#snapshotSource":{"name":"snapshotSource","kind":"function","file":"scripts/mind-meld-sandbox.ts","line":43,"to":47,"doc":"","lines":["function snapshotSource(source: string, target: string, expectedHash: string | undefined): void {","  const bytes = readFileSync(source);","  if (expectedHash && sourceHash(bytes) !== expectedHash) throw new Error('source changed before execution');","  writeFileSync(target, bytes, { mode: 0o444 }); chmodSync(target, 0o444);","}"],"truncated":false,"explain":"Reads the source file and writes its bytes to the target path with read-only (0444) permissions. If an expected hash is given and the SHA-256 of the bytes differs from it, it throws 'source changed before execution' before writing anything."},"scripts/mind-meld-sandbox.ts#executeChild":{"name":"executeChild","kind":"function","file":"scripts/mind-meld-sandbox.ts","line":48,"to":52,"doc":"","lines":["function executeChild(args: string[], options: { env: NodeJS.ProcessEnv; timeoutMs: number }): string {","  const result = spawnSync('docker', args, { env: options.env, encoding: 'utf8', timeout: options.timeoutMs, maxBuffer: MAX_OUTPUT, killSignal: 'SIGKILL' });","  if (result.error || result.status !== 0) throw new Error(`Mind Meld sandbox failed (no unsafe fallback): ${result.error?.message ?? result.stderr}`);","  return result.stdout;","}"],"truncated":false,"explain":"Runs docker synchronously with the given arguments, environment and timeout, killing it with SIGKILL at the timeout and capping output at 1,000,000 bytes, and returns its stdout. It throws an Error when docker cannot be run, times out, or exits non-zero."},"scripts/mind-meld-example.ts#Event":{"name":"Event","kind":"interface","file":"scripts/mind-meld-example.ts","line":4,"to":4,"doc":"A tiny real TypeScript stack: combat -> pure damage -> in-memory save. Invoked only inside the reference container by mind-meld.ts.","lines":["interface Event { id: string; node: string; parent: string | null; durationMs: number; input: string; output: string; changes: { key: string; before: string; after: string }[] }"],"truncated":false,"explain":"The shape of one recorded call in the example program: an id, the node (function) name, the parent event id or null, the duration in milliseconds, the input and output as strings, and a list of state changes each with a key, before and after value."},"scripts/mind-meld-example.ts#events":{"name":"events","kind":"const","file":"scripts/mind-meld-example.ts","line":5,"to":5,"doc":"","lines":["const events: Event[] = [];"],"truncated":false,"explain":"A module-level array that collects one Event per traced call, in call order, as span() runs. The whole array is printed in the JSON the script writes to stdout at the end."},"scripts/mind-meld-example.ts#output":{"name":"output","kind":"const","file":"scripts/mind-meld-example.ts","line":37,"to":37,"doc":"","lines":["const output = mode === 'flow' ? combat(inputs.hp, inputs.damage) : damage(inputs.hp, inputs.damage, null);"],"truncated":false,"explain":"The string result of the example run chosen by the first command-line argument: combat(hp, damage) when the mode is 'flow', otherwise damage(hp, damage, null), with hp and damage taken from the JSON in the second argument. It is printed to stdout together with the recorded events."},"scripts/mind-meld.test.ts#live":{"name":"live","kind":"const","file":"scripts/mind-meld.test.ts","line":17,"to":17,"doc":"","lines":["const live = { skip: process.env.RUN_MIND_MELD_SANDBOX !== '1' || parses.skip };"],"truncated":false,"explain":"Test options object whose skip field is set unless the environment variable RUN_MIND_MELD_SANDBOX is '1' and the typescript package loads. It is passed to the tests that run the real sandbox container."},"scripts/mind-meld.test.ts#temp":{"name":"temp","kind":"function","file":"scripts/mind-meld.test.ts","line":18,"to":21,"doc":"","lines":["function temp\u003cT>(work: (root: string) => T): T {","  const root = mkdtempSync(join(tmpdir(), 'meld-test-'));","  try { return work(root); } finally { rmSync(root, { recursive: true, force: true }); }","}"],"truncated":false,"explain":"Creates a new 'meld-test-' directory under the system temp directory, calls the given function with its path, and returns that function's result. The directory is removed recursively afterwards, including when the function throws."},"scripts/mind-meld-sandbox.ts#runSandbox":{"name":"runSandbox","kind":"function","file":"scripts/mind-meld-sandbox.ts","line":54,"to":71,"doc":"","lines":["export function runSandbox(source: string, args: string[], timeoutMs = MELD_LIMIT_MS, expectedHash?: string): string {","  if (!Number.isInteger(timeoutMs) || timeoutMs \u003c 1 || timeoutMs > MELD_LIMIT_MS) throw new Error('invalid timeout');","  const name = `mind-meld-${randomUUID()}`;","  const scratch = mkdtempSync(join(tmpdir(), 'mind-meld-'));","  const snapshot = join(scratch, 'example.ts');","  const env = dockerEnvironment();","  let error: Error | undefined;","  let output = '';","  try {","    snapshotSource(source, snapshot, expectedHash);","    output = executeChild(sandboxArgs(snapshot, name, args, timeoutMs), { env, timeoutMs });","  } catch (cause) { error = cause instanceof Error ? cause : new Error(String(cause)); }","  const cleanup = cleanupChild(name, env);","  rmSync(scratch, { recursive: true, force: true });","  if (cleanup) throw cleanup;","  if (error) throw error;","  return output;","}"],"truncated":false,"explain":"Copies the source file into a new temp directory as a read-only example.ts, runs it with the given arguments in a randomly named Docker container (no network, read-only filesystem, no image pull, limited memory, CPU and processes) and returns the container's stdout. It then force-removes that container and deletes the temp directory whether or not the run succeeded. It throws when the timeout is not an integer between 1 and 10000 ms, when expectedHash is given and the source no longer matches it, when the run fails or times out, or when the container cleanup fails."},"scripts/mind-meld.ts#cache":{"name":"cache","kind":"const","file":"scripts/mind-meld.ts","line":25,"to":25,"doc":"","lines":["const cache = new Map\u003cstring, MeldRun>();"],"truncated":false,"explain":"An in-process Map from run cache key to recorded MeldRun. run() returns a clone from it on a key match and stores a clone after each new sandbox run; it is not saved between processes."},"scripts/mind-meld.ts#inputs":{"name":"inputs","kind":"function","file":"scripts/mind-meld.ts","line":31,"to":39,"doc":"","lines":["function inputs(value: unknown): Inputs {","  if (!value || typeof value !== 'object' || Array.isArray(value)) throw new Error('expected {hp, damage}');","  const raw = value as Record\u003cstring, unknown>;","  if (Object.keys(raw).sort().join(',') !== 'damage,hp') throw new Error('expected only hp and damage');","  for (const n of [raw.hp, raw.damage]) {","    if (typeof n !== 'number' || !Number.isFinite(n) || n \u003c 0) throw new Error('hp and damage must be nonnegative finite numbers');","  }","  return { hp: Number(raw.hp), damage: Number(raw.damage) };","}"],"truncated":false,"explain":"Takes an unknown value and returns { hp, damage } when it is an object with exactly those two keys, both finite non-negative numbers. Throws an Error describing the problem otherwise."},"scripts/mind-meld.ts#index":{"name":"index","kind":"function","file":"scripts/mind-meld.ts","line":42,"to":65,"doc":"","lines":["export function index(): MeldBundle {","  const tsc = compiler ?? missingTypeScript();","  const sources = Object.fromEntries(IMPLEMENTATION.map(file => [`scripts/${file}`, readFileSync(join(ROOT, 'scripts', file), 'utf8')]));","  const ast = tsc.createSourceFile(EXAMPLE, sources[EXAMPLE], tsc.ScriptTarget.Latest, true, tsc.ScriptKind.TS);","  const functions = ast.statements.filter(tsc.isFunctionDeclaration).filter(f => f.modifiers?.some(m => m.kind === tsc.SyntaxKind.ExportKeyword));","  const nodes: MeldNode[] = functions.map(f => ({","    id: f.name!.text, file: EXAMPLE,","    line: ast.getLineAndCharacterOfPosition(f.getStart(ast)).line + 1,","    endLine: ast.getLineAndCharacterOfPosition(f.getEnd()).line + 1,","    layer: f.name!.text === 'combat' ? 'entry' : 'core',","  }));","  const ids = new Set(nodes.map(n => n.id));","  const edges: MeldEdge[] = [];","  for (const f of functions) {","    function visit(node: ts.Node): void {","      if (tsc.isCallExpression(node) && tsc.isIdentifier(node.expression) && ids.has(node.expression.text)) {","        edges.push({ from: f.name!.text, to: node.expression.text, file: EXAMPLE,","          line: ast.getLineAndCharacterOfPosition(node.getStart(ast)).line + 1, kind: 'call' });","      }","      tsc.forEachChild(node, visit);","    }","    visit(f);","  }","  return { version: 1, nodes, edges, sources, ...sourceManifest(sources), runs: [] };"],"truncated":true,"explain":"Reads the five mind-meld source files from scripts/, parses the example file with the TypeScript compiler, and returns a bundle holding one node per exported function, one edge per direct call between those functions, the sources with their hashes, and no runs. Throws if the typescript package is not available."},"scripts/mind-meld-schema.ts#validateBundle":{"name":"validateBundle","kind":"function","file":"scripts/mind-meld-schema.ts","line":86,"to":102,"doc":"","lines":["export function validateBundle(value: unknown): asserts value is MeldBundle {","  const b = record(value);","  if (b.version !== 1) throw new Error('unsupported Mind Meld version');","  const sources = record(b.sources);","  validateSources(sources);","  validateManifest(b, sources);","  const nodes = validateNodes(b.nodes, sources);","  validateEdges(b.edges, nodes, sources);","  const keys = new Set\u003cstring>();","  for (const item of array(b.runs)) {","    const r = record(item); text(r.key); text(r.entry); text(r.output);","    if (r.snapshotHash !== b.snapshotHash) throw new Error('run belongs to another source snapshot');","    if (keys.has(r.key) || !nodes.has(r.entry)) throw new Error('duplicate run or missing entry');","    if (r.mode !== 'flow' && r.mode !== 'piece') throw new Error('invalid run mode');","    validateEvents(r.events, nodes); keys.add(r.key);","  }","}"],"truncated":false,"explain":"Type assertion that a value is a well-formed version 1 Mind Meld bundle: it checks source limits, source and snapshot hashes, nodes, edges, and every run (unique key, matching snapshot hash, known entry node, mode 'flow' or 'piece', valid events). Throws an Error naming the first problem found and returns nothing."},"scripts/mind-meld-schema.ts#record":{"name":"record","kind":"function","file":"scripts/mind-meld-schema.ts","line":13,"to":16,"doc":"","lines":["function record(value: unknown): Record\u003cstring, unknown> {","  if (!value || typeof value !== 'object' || Array.isArray(value)) throw new Error('expected object');","  return value as Record\u003cstring, unknown>;","}"],"truncated":false,"explain":"Returns the value typed as a string-keyed object when it is a non-null, non-array object. Throws 'expected object' otherwise."},"scripts/mind-meld-schema.ts#array":{"name":"array","kind":"function","file":"scripts/mind-meld-schema.ts","line":20,"to":23,"doc":"","lines":["function array(value: unknown): unknown[] {","  if (!Array.isArray(value) || value.length > MAX_ARRAY_LENGTH) throw new Error('expected bounded array');","  return value as unknown[];","}"],"truncated":false,"explain":"Returns the value as an array when it is an array of at most 10,000 items. Throws 'expected bounded array' otherwise."},"scripts/mind-meld-schema.ts#validateNodes":{"name":"validateNodes","kind":"function","file":"scripts/mind-meld-schema.ts","line":27,"to":38,"doc":"","lines":["function validateNodes(value: unknown, sources: Record\u003cstring, unknown>): Set\u003cstring> {","  const ids = new Set\u003cstring>();","  for (const item of array(value)) {","    const n = record(item);","    text(n.id); text(n.file); text(n.layer); positive(n.line); positive(n.endLine);","    if (ids.has(n.id) || !Object.hasOwn(sources, n.file)) throw new Error('duplicate node or missing source');","    const source = sources[n.file]; text(source);","    if (n.endLine \u003c n.line || n.endLine > source.split('\\n').length) throw new Error('span outside source');","    ids.add(n.id);","  }","  return ids;","}"],"truncated":false,"explain":"Checks every node in a list (string id, file and layer, positive integer line and endLine, unique id, file present in sources, span inside that file's line count) and returns the set of node ids. Throws on the first failure."},"scripts/mind-meld-schema.ts#validateEvents":{"name":"validateEvents","kind":"function","file":"scripts/mind-meld-schema.ts","line":42,"to":55,"doc":"","lines":["function validateEvents(value: unknown, nodes: Set\u003cstring>): void {","  const ids = new Set\u003cstring>();","  for (const item of array(value)) {","    const e = record(item);","    text(e.id); text(e.node); text(e.input); text(e.output);","    if (ids.has(e.id) || !nodes.has(e.node)) throw new Error('duplicate event or missing node');","    validateParent(e.parent, ids);","    if (typeof e.durationMs !== 'number' || !Number.isFinite(e.durationMs) || e.durationMs \u003c 0) throw new Error('invalid duration');","    for (const change of array(e.changes)) {","      const c = record(change); text(c.key); text(c.before); text(c.after);","    }","    ids.add(e.id);","  }","}"],"truncated":false,"explain":"Checks a run's event list against the set of node ids: each event needs a unique string id, a known node, string input and output, a parent that is null or the id of an earlier event, a finite non-negative durationMs, and changes with string key, before and after. Throws on the first failure and returns nothing."},"scripts/mind-meld-schema.ts#validateManifest":{"name":"validateManifest","kind":"function","file":"scripts/mind-meld-schema.ts","line":61,"to":71,"doc":"","lines":["function validateManifest(b: Record\u003cstring, unknown>, sources: Record\u003cstring, unknown>): void {","  const hashes = record(b.sourceHashes);","  const checked: Record\u003cstring, string> = {};","  for (const file of Object.keys(sources).sort()) {","    if (!file || file.startsWith('/') || file.includes('\\\\') || file.split('/').some(p => !p || p === '.' || p === '..') || file.includes('\\0')) throw new Error('invalid source path');","    const content = sources[file]; text(content);","    if (hashes[file] !== sourceHash(content)) throw new Error('source hash mismatch');","    checked[file] = String(hashes[file]);","  }","  if (Object.keys(hashes).length !== Object.keys(sources).length || b.snapshotHash !== sourceHash(JSON.stringify(checked))) throw new Error('snapshot hash mismatch');","}"],"truncated":false,"explain":"Checks that every source path is a relative, forward-slash path with no empty, '.' or '..' segments, that the bundle's sourceHashes holds exactly one matching SHA-256 per source, and that snapshotHash equals the hash of those hashes. Throws 'invalid source path', 'source hash mismatch' or 'snapshot hash mismatch' otherwise."},"scripts/mind-meld-schema.ts#validateEdges":{"name":"validateEdges","kind":"function","file":"scripts/mind-meld-schema.ts","line":72,"to":79,"doc":"","lines":["function validateEdges(value: unknown, nodes: Set\u003cstring>, sources: Record\u003cstring, unknown>): void {","  for (const item of array(value)) {","    const e = record(item); text(e.from); text(e.to); text(e.file); positive(e.line);","    if (!nodes.has(e.from) || !nodes.has(e.to) || e.kind !== 'call') throw new Error('invalid static edge');","    const source = sources[e.file]; text(source);","    if (e.line > source.split('\\n').length) throw new Error('edge outside source');","  }","}"],"truncated":false,"explain":"Checks every edge in a list: string from, to and file, a positive integer line, both endpoints in the given node id set, kind 'call', and a line no greater than the line count of the edge's source file. Throws on the first failure and returns nothing."},"scripts/mind-meld-schema.ts#validateSources":{"name":"validateSources","kind":"function","file":"scripts/mind-meld-schema.ts","line":80,"to":85,"doc":"","lines":["function validateSources(sources: Record\u003cstring, unknown>): void {","  if (Object.keys(sources).length > MAX_SOURCE_COUNT) throw new Error('too many sources');","  let bytes = 0;","  for (const source of Object.values(sources)) { text(source); bytes += Buffer.byteLength(source); }","  if (bytes > MAX_SOURCE_BYTES) throw new Error('sources too large');","}"],"truncated":false,"explain":"Throws if the sources map has more than 1,000 entries, any value is not a bounded string, or the values total more than 10,000,000 bytes. Returns nothing."},"scripts/mind-meld-schema.ts#sourceHash":{"name":"sourceHash","kind":"const","file":"scripts/mind-meld-schema.ts","line":56,"to":56,"doc":"","lines":["export const sourceHash = (source: string | Buffer): string => createHash('sha256').update(source).digest('hex');"],"truncated":false,"explain":"Takes a string or Buffer and returns its SHA-256 digest as a hex string."},"scripts/mind-meld-viewer.ts#hash":{"name":"hash","kind":"const","file":"scripts/mind-meld-viewer.ts","line":137,"to":137,"doc":"","lines":["const hash = (text: string) => createHash('sha256').update(text).digest('base64');"],"truncated":false,"explain":"Takes a string and returns its SHA-256 digest in base64, the form used for the script and style hashes in the viewer page's Content-Security-Policy."},"scripts/mind-meld-viewer.ts#viewer":{"name":"viewer","kind":"function","file":"scripts/mind-meld-viewer.ts","line":9,"to":32,"doc":"","lines":["function viewer(bundle: MeldBundle): void {","  const RUN_HASH_LENGTH = 10;","  const GRAPH_LEFT = 20;","  const GRAPH_TOP = 30;","  const GRAPH_COLUMN_STEP = 240;","  const GRAPH_ROW_STEP = 80;","  const GRAPH_MIN_HEIGHT = 150;","  const GRAPH_MIN_WIDTH = 480;","  const GRAPH_NODE_WIDTH = 170;","  const GRAPH_NODE_HEIGHT = 40;","  const GRAPH_CORNER_RADIUS = 6;","  const GRAPH_LABEL_INSET = 12;","  const GRAPH_LABEL_BASELINE = 26;","  const element = (tag: string, text = '') => {","    const node = document.createElement(tag); node.textContent = text; return node;","  };","  const graph = document.getElementById('graph')!;","  const trace = document.getElementById('trace')!;","  const source = document.getElementById('source')!;","  const citation = document.getElementById('citation')!;","  const changes = document.getElementById('changes')!;","  const runChoice = document.getElementById('run') as HTMLSelectElement;","  const query = document.getElementById('state') as HTMLInputElement;","  let runIndex = 0;"],"truncated":true,"explain":"The browser-side program of the viewer page; renderViewer embeds its source text in the HTML and calls it with the bundle. It takes a bundle, draws the SVG call graph, fills the node lists, static edge list and run selector, and wires the click, change and input handlers that show source, events and state changes. It only touches the DOM and expects the page's fixed element ids to exist."},"scripts/mind-meld-viewer.ts#STYLE":{"name":"STYLE","kind":"const","file":"scripts/mind-meld-viewer.ts","line":136,"to":136,"doc":"","lines":["const STYLE = `body{font:16px system-ui;margin:0;background:#f7f5ef;color:#18252c}header,main{padding:1.5rem;max-width:1200px;margin:auto}h1{margin:.3rem 0}button,select,input{font:inherit;padding:.55rem;margin:.2rem;border:1px solid #667680;border-radius:.3rem;background:white;color:inherit}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #007b83;outline-offset:2px}#graph,.columns{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1rem}section,aside{min-width:0}pre{overflow:auto;background:#17252c;color:#f5f3eb;padding:1rem;line-height:1.5;max-height:34rem}mark{background:#ffe29b;color:#17252c}#snapshot{overflow-wrap:anywhere}#diagram svg{width:100%;max-height:22rem}li{margin:.35rem 0}#position{font-weight:bold}label{display:block}small{color:#435760}`;"],"truncated":false,"explain":"The CSS text for the offline viewer page. It is inlined into the page's style element and hashed for the style-src entry of the page's Content-Security-Policy."},"scripts/json-script.ts#jsonForScript":{"name":"jsonForScript","kind":"function","file":"scripts/json-script.ts","line":9,"to":11,"doc":"","lines":["export function jsonForScript(value: unknown): string {","  return JSON.stringify(value).replace(/\u003c/g, '\\\\u003c').replaceAll(LINE_SEP, '\\\\u2028').replaceAll(PARA_SEP, '\\\\u2029');","}"],"truncated":false,"explain":"Takes any JSON-serializable value and returns its JSON.stringify text with every '\u003c' and the U+2028 and U+2029 characters replaced by their \\u escapes, so the text can be placed inside an HTML script element without ending or breaking it. Parsing the result gives back the same value."},"scripts/mind-meld-pages.ts#PageOptions":{"name":"PageOptions","kind":"interface","file":"scripts/mind-meld-pages.ts","line":12,"to":17,"doc":"","lines":["export interface PageOptions {","  // How links on the page reach source files, e.g. '../' for a page one directory below the repo root.","  sourcePrefix: string;","  title?: string;","  context?: PageContext;","}"],"truncated":false,"explain":"The options for rendering a mind-meld bundle as a markdown page: sourcePrefix is the required path prefix put in front of source file links (for example '../'), title optionally overrides the generated page title, and context is an optional PageContext passed through to the markdown renderer."},"scripts/mind-meld-pages.ts#layerOf":{"name":"layerOf","kind":"const","file":"scripts/mind-meld-pages.ts","line":26,"to":26,"doc":"","lines":["const layerOf = (node: MeldNode): string => node.layer || NO_LAYER;"],"truncated":false,"explain":"Takes a bundle node and returns its layer string, or the placeholder '(no layer)' when the layer is empty."},"scripts/mind-meld-pages.ts#nodeOf":{"name":"nodeOf","kind":"function","file":"scripts/mind-meld-pages.ts","line":35,"to":50,"doc":"","lines":["function nodeOf(bundle: MeldBundle, node: MeldNode, sourcePrefix: string): ExplorerNode {","  const span = `${node.file}:${node.line}-${node.endLine}`;","  const calls = bundle.edges.filter(e => e.from === node.id).map(e => e.to);","  return {","    lane: layerOf(node),","    name: node.id,","    role: `Defined in ${span}.`,","    details: [","      // \u003c...> keeps a path with spaces or parentheses one link target.","      `Source: [${span}](\u003c${sourcePrefix}${node.file}#L${node.line}-L${node.endLine}>)`,","      ...(calls.length ? [`${STATIC_CALLS}: ${[...new Set(calls)].sort().join(', ')}`] : []),","      ...recordedCalls(bundle, node.id),","      { t: 'Source excerpt', more: [], code: excerpt(bundle.sources[node.file], node) },","    ],","  };","}"],"truncated":false,"explain":"Takes a bundle, one of its nodes and a source link prefix, and returns the ExplorerNode for that function. The result uses the node's layer as its lane and its id as its name, and its details hold a link to the file and line span, the sorted list of functions it statically calls (if any), one bullet per recorded call with input, output and state changes, and the source excerpt for its lines."},"scripts/mind-meld-pages.ts#flowOf":{"name":"flowOf","kind":"function","file":"scripts/mind-meld-pages.ts","line":53,"to":60,"doc":"A recorded hop is a call whose parent was recorded in the same run; a single-call run has none.","lines":["function flowOf(run: MeldRun): Flow[] {","  const byId = new Map\u003cstring, MeldEvent>(run.events.map(e => [e.id, e]));","  const steps = run.events.flatMap((e): FlowStep[] => {","    const parent = e.parent ? byId.get(e.parent) : undefined;","    return parent ? [[parent.node, e.node, `called with ${value(e.input)}`, `returned ${value(e.output)}`]] : [];","  });","  return steps.length ? [{ id: run.key, name: `${run.mode} ${run.entry} returned ${value(run.output)}`, steps }] : [];","}"],"truncated":false,"explain":"Takes one recorded run and returns either a one-element list holding a Flow or an empty list. The flow has a step for every event whose parent event was recorded in the same run, going from the parent's node to the event's node and labelled with the recorded input and output; a run with no such events yields an empty list."},"scripts/mind-meld-pages.ts#staticFlow":{"name":"staticFlow","kind":"function","file":"scripts/mind-meld-pages.ts","line":64,"to":67,"doc":"Without recorded runs the only true arrows are the indexed static calls, named as possible, not observed; nothing else may be drawn (an invented chain would be a claim the bundle never made).","lines":["function staticFlow(bundle: MeldBundle): Flow[] {","  const steps = bundle.edges.map((e): FlowStep => [e.from, e.to, `may call (static, ${e.file}:${e.line})`, 'not observed']);","  return steps.length ? [{ id: 'static', name: STATIC_CALLS, steps }] : [];","}"],"truncated":false,"explain":"Takes a bundle and returns either an empty list, when it has no edges, or a one-element list with a flow whose id is 'static'. That flow has one step per indexed call edge, labelled as a call that may happen at the edge's file and line and marked 'not observed'."},"scripts/mind-meld-pages.ts#laneOrder":{"name":"laneOrder","kind":"function","file":"scripts/mind-meld-pages.ts","line":70,"to":74,"doc":"Lanes in the order a reader meets them: along the first recorded path, then any other indexed layer.","lines":["function laneOrder(bundle: MeldBundle): string[] {","  const byId = new Map(bundle.nodes.map(n => [n.id, n]));","  const seen = bundle.runs.flatMap(r => r.events.map(e => layerOf(byId.get(e.node)!)));","  return [...new Set([...seen, ...bundle.nodes.map(layerOf)])];","}"],"truncated":false,"explain":"Takes a bundle and returns the distinct layer names in display order: first the layers of the nodes hit by recorded events, in the order the events occurred, then any remaining layers in node order. A node with an empty layer is listed as '(no layer)'."},"scripts/mind-meld-pages.ts#lede":{"name":"lede","kind":"function","file":"scripts/mind-meld-pages.ts","line":76,"to":81,"doc":"","lines":["function lede(bundle: MeldBundle): string {","  const origin = bundle.runs.length","    ? `Recorded from real runs of this repo's code at source snapshot ${bundle.snapshotHash}.`","    : `Indexed from this repo's source at snapshot ${bundle.snapshotHash}. No runs were recorded, so arrows are static calls that may happen, not observed ones.`;","  return `${origin} Whether that matches today's checkout is unknown until \\`mind-meld.ts verify\\` passes.`;","}"],"truncated":false,"explain":"Takes a bundle and returns the page's opening sentence. It says the page was recorded from real runs at the bundle's snapshot hash when runs exist, or indexed statically with no runs recorded otherwise, and always adds that agreement with the current checkout is unknown until 'mind-meld.ts verify' passes."},"scripts/explorer-spec.ts#ExplorerSpec":{"name":"ExplorerSpec","kind":"type","file":"scripts/explorer-spec.ts","line":50,"to":69,"doc":"","lines":["export type ExplorerSpec = {","  title: string;","  eyebrow?: string;","  lede?: string;","  lanes: { id: string; name: string; sub?: string }[];","  nodes: Record\u003cstring, ExplorerNode>;","  flows?: Flow[];","  glossary?: Record\u003cstring, Term>;","  timeline?: { intro?: string; tracks: string[]; events: TimelineEvent[] };","  topics?: Topic[];","  // Q&A framing sent with every question, ahead of the selected-node context.","  ask?: { context: string; style?: string };","  start?: { node?: string; flow?: string };","  // Relative path to the full detailed diagram image, shown after the stages on the markdown page.","  detail?: string;","  // Repo-relative files the page summarizes, and their hash when the page was last reviewed. A source","  // edit flags the page for review (render-explorer-pages); the hash is refreshed by acknowledging it.","  sources?: string[];","  reviewed?: string;","};"],"truncated":false,"explain":"The type of the JSON that describes one explorer page. It requires a title, a list of lanes and a map of nodes, and optionally carries an eyebrow, lede, flows, glossary, timeline, topics, Q&A framing, a start node or flow, a detail image path, and the source files the page summarizes with the hash recorded at last review."},"scripts/explorer-spec.ts#validateSpec":{"name":"validateSpec","kind":"function","file":"scripts/explorer-spec.ts","line":149,"to":164,"doc":"Returns every problem found; an empty list means the spec renders cleanly.","lines":["export function validateSpec(s: ExplorerSpec): string[] {","  const errs = checkRequired(s);","  if (errs.length) return errs;","  const refs: Refs = {","    nodes: known(Object.keys(s.nodes), 'node'),","    topics: known((s.topics ?? []).map(t => t.id), 'topic'),","    flows: known((s.flows ?? []).map(f => f.id), 'flow'),","  };","  checkNodes(s, errs);","  checkFlows(s, refs, errs);","  checkGlossary(s, errs);","  checkTopics(s, refs, errs);","  checkTimeline(s, refs, errs);","  checkStart(s, refs, errs);","  return errs;","}"],"truncated":false,"explain":"Takes an ExplorerSpec and returns a list of problem strings, empty when the spec is valid. If the title, lanes, nodes or (with sources) the reviewed hash are missing it returns only those errors; otherwise it reports nodes without a name, role or known lane, lanes with no nodes, duplicate or empty flows and malformed steps, incomplete glossary terms and aliases claimed twice, out-of-range timeline tracks, and any reference to an unknown node, topic or flow. It does not throw for these problems and has no side effects."},"scripts/queue-task-origin.ts#isAgentSession":{"name":"isAgentSession","kind":"function","file":"scripts/queue-task-origin.ts","line":14,"to":16,"doc":"","lines":["export function isAgentSession(env: NodeJS.ProcessEnv = process.env): boolean {","  return AGENT_ENV_MARKERS.some(key => Boolean(env[key]));","}"],"truncated":false,"explain":"Takes an environment (default process.env) and returns true when any agent marker variable is set to a non-empty value: CLAUDECODE, CODEX_THREAD_ID, CODEX_SANDBOX, CODEX_CI, GEMINI_CLI, AI_AGENT, LANE_RUN_ID or SCAFFOLD_AGENT."},"scripts/queue-task-origin.ts#Origin":{"name":"Origin","kind":"type","file":"scripts/queue-task-origin.ts","line":18,"to":18,"doc":"","lines":["export type Origin = { ok: true; patch: Partial\u003cTask> } | { ok: false; error: string };"],"truncated":false,"explain":"The result of checking where a new task comes from: either { ok: true, patch } with the tags and note to put on the task, or { ok: false, error } with the message to print. taskOrigin returns it and the add commands branch on `ok`."},"scripts/queue-task-origin.ts#originPatch":{"name":"originPatch","kind":"function","file":"scripts/queue-task-origin.ts","line":38,"to":42,"doc":"","lines":["function originPatch(parent: string, requested: string): Partial\u003cTask> {","  const tags = [...(parent ? [`parent:${parent}`] : []), ...(requested ? ['requested-by:human'] : [])];","  const note = [parent && `Child of ${parent}.`, requested && `Requested by a human: \"${requested}\"`].filter(Boolean).join(' ');","  return { tags, note };","}"],"truncated":false,"explain":"Takes a parent task id and a requested quote (either may be empty) and returns the tags and note that record them on a new task: a `parent:\u003cid>` tag and 'Child of \u003cid>.' for a parent, a `requested-by:human` tag and the quoted request for a quote. With both empty it returns an empty tag list and an empty note."},"scripts/queue-task-origin.ts#flagValue":{"name":"flagValue","kind":"function","file":"scripts/queue-task-origin.ts","line":44,"to":46,"doc":"","lines":["function flagValue(f: Parsed, key: string): string {","  return f.flags.get(key)?.trim() ?? '';","}"],"truncated":false,"explain":"Takes parsed command-line arguments and a flag name and returns that flag's value with surrounding whitespace removed, or an empty string when the flag was not given."},"scripts/queue-cli-args.ts#Parsed":{"name":"Parsed","kind":"interface","file":"scripts/queue-cli-args.ts","line":4,"to":4,"doc":"","lines":["export interface Parsed { positionals: string[]; flags: Map\u003cstring, string>; bools: Set\u003cstring>; }"],"truncated":false,"explain":"The result of parsing queue CLI arguments: positionals in order, a map of value flags to their values, and the set of flags given without a value."},"scripts/queue-model.ts#addTask":{"name":"addTask","kind":"function","file":"scripts/queue-model.ts","line":451,"to":457,"doc":"","lines":["export function addTask(q: Queue, title: string, opts: { top?: boolean } & Partial\u003cTask> = {}): Queue {","  const { top, ...over } = opts;","  const n = nextIdNum(q);","  const task: Task = { ...newTask(fmtId(n), title.trim()), ...over };","  const config = { ...q.config, nextId: n + 1 };","  return { config, tasks: top ? [task, ...q.tasks] : [...q.tasks, task] };","}"],"truncated":false,"explain":"Takes a queue, a title and optional field overrides plus a `top` flag, and returns a new queue with one new pending task added at the end, or at the front when `top` is set. The task gets the next task-NNN id, the title is trimmed, and the config's nextId counter is advanced. The input queue is not modified and nothing is saved."},"scripts/queue-cli-args.ts#taskOverrides":{"name":"taskOverrides","kind":"function","file":"scripts/queue-cli-args.ts","line":28,"to":34,"doc":"","lines":["export function taskOverrides(flags: Parsed): Partial\u003cTask> {","  const overrides: Partial\u003cTask> = {};","  for (const key of EDITABLE_TASK_FIELDS) {","    if (flags.flags.has(key)) Object.assign(overrides, fieldPatch(key, flags.flags.get(key) ?? ''));","  }","  return overrides;","}"],"truncated":false,"explain":"Takes parsed CLI arguments and returns a partial Task built from every editable task field that was given as a flag, each value coerced by fieldPatch. Fields not given are left out."},"scripts/queue-task-origin.ts#taskOrigin":{"name":"taskOrigin","kind":"function","file":"scripts/queue-task-origin.ts","line":25,"to":31,"doc":"","lines":["export function taskOrigin(q: Queue, f: Parsed, env: NodeJS.ProcessEnv = process.env): Origin {","  const parent = flagValue(f, 'parent');","  const requested = flagValue(f, 'requested');","  if (parent && !q.tasks.some(t => t.id === parent)) return { ok: false, error: `queue add: --parent ${parent} is not a task in this queue` };","  if (!parent && !requested) return isAgentSession(env) ? { ok: false, error: AGENT_ADD_REFUSAL } : { ok: true, patch: {} };","  return { ok: true, patch: originPatch(parent, requested) };","}"],"truncated":false,"explain":"Takes the queue, the parsed add arguments and an environment, and decides whether the add is allowed. It returns an error result when --parent names a task not in the queue, or when neither --parent nor --requested is given and the environment marks an agent session. Otherwise it returns ok with the tags and note for the given parent and request, or an empty patch for a human with no flags."},"scripts/queue-task-origin.ts#withOrigin":{"name":"withOrigin","kind":"function","file":"scripts/queue-task-origin.ts","line":49,"to":56,"doc":"","lines":["export function withOrigin(overrides: Partial\u003cTask>, origin: Partial\u003cTask>): Partial\u003cTask> {","  if (!origin.tags) return overrides;","  return {","    ...overrides,","    tags: [...origin.tags, ...(overrides.tags ?? []).filter(t => !origin.tags!.includes(t))],","    note: overrides.note ? `${origin.note} ${overrides.note}` : origin.note,","  };","}"],"truncated":false,"explain":"Takes the task fields built from the command's own flags and an origin patch, and returns the fields with the origin tags placed first (duplicates removed) and the origin note placed before any --note text. If the origin patch has no tags, the fields are returned unchanged."},"scripts/queue-lanes.ts#readLanes":{"name":"readLanes","kind":"function","file":"scripts/queue-lanes.ts","line":74,"to":83,"doc":"","lines":["export function readLanes(): LaneState[] {","  if (!existsSync(laneDir())) return [];","  const out: LaneState[] = [];","  for (const f of readdirSync(laneDir())) {","    if (!f.endsWith('.json')) continue;","    const lane = readOne(join(laneDir(), f));","    if (lane) out.push(lane);","  }","  return out.sort((a, b) => a.id.localeCompare(b.id));","}"],"truncated":false,"explain":"Reads every .json file in the lanes directory and returns the lane records sorted by task id. Files that cannot be parsed or have no string id are skipped, and a missing lanes directory gives an empty list."},"scripts/queue-lanes.ts#laneStale":{"name":"laneStale","kind":"function","file":"scripts/queue-lanes.ts","line":86,"to":88,"doc":"","lines":["export function laneStale(lane: LaneState, nowIso: string, leaseMinutes: number): boolean {","  return Date.parse(nowIso) - Date.parse(lane.updatedAt) >= leaseMinutes * 60_000;","}"],"truncated":false,"explain":"Takes a lane record, a current time as an ISO string and a lease length in minutes, and returns true when the lane's updatedAt is at least that many minutes before the given time. It changes nothing."},"scripts/queue-lanes.ts#stopRequested":{"name":"stopRequested","kind":"function","file":"scripts/queue-lanes.ts","line":96,"to":98,"doc":"","lines":["export function stopRequested(id: string): boolean {","  return existsSync(stopPath(id));","}"],"truncated":false,"explain":"Takes a task id and returns true when its stop flag file (\u003clanes directory>/\u003cid>.stop) exists. It changes nothing."},"scripts/compute-bump.ts#BumpKind":{"name":"BumpKind","kind":"type","file":"scripts/compute-bump.ts","line":13,"to":13,"doc":"","lines":["export type BumpKind = 'major' | 'minor' | 'patch' | 'none';"],"truncated":false,"explain":"A string union of 'major', 'minor', 'patch' and 'none'. It names the size of the version bump computeBump derived from the commit messages."},"scripts/compute-bump.ts#BumpResult":{"name":"BumpResult","kind":"interface","file":"scripts/compute-bump.ts","line":15,"to":18,"doc":"","lines":["export interface BumpResult {","  bump: BumpKind;","  next: string | null;","}"],"truncated":false,"explain":"The return shape of computeBump: bump is the BumpKind chosen, and next is the resulting version string, or null when bump is 'none'."},"scripts/test-create-pr-gate.sh#fail":{"name":"fail","kind":"shell function","file":"scripts/test-create-pr-gate.sh","line":5,"to":28,"doc":"","lines":["fail(){ echo \"  ✗ $1\"; FAIL=$((FAIL + 1)); }","","FILE=skills/create-pr.md","","[ -f \"$FILE\" ] || { echo \"MISSING: $FILE\"; exit 1; }","","grep -q 'quality' \"$FILE\" \\","  && ok \"quality gate mentioned\" || fail \"no quality gate mention\"","","grep -qE 'Quality Scores|quality.*score|score.*table' \"$FILE\" \\","  && ok \"score table referenced\" || fail \"score table not referenced\"","","grep -qE '10/10|score.*10|all.*10|10 on all' \"$FILE\" \\","  && ok \"10/10 threshold stated\" || fail \"10/10 threshold not stated\"","","grep -qE 'quality.override|override' \"$FILE\" \\","  && ok \"override mechanism referenced\" || fail \"override mechanism not referenced\"","","# Gate (Step 5) must appear before Step 6 (PR body drafting). Match the section","# HEADINGS, not prose cross-references, so an earlier \"(Step 6)\" mention in the","# body of another step can't invert the check.","gate_line=$(grep -nE '^#+[[:space:]].*Step 5' \"$FILE\" | head -1 | cut -d: -f1)","step6_line=$(grep -nE '^#+[[:space:]].*Step 6' \"$FILE\" | head -1 | cut -d: -f1)","if [ -n \"$gate_line\" ] && [ -n \"$step6_line\" ] && [ \"$gate_line\" -lt \"$step6_line\" ]; then"],"truncated":true,"explain":"Takes a description, prints it to stdout prefixed with a cross mark, and increments the script's global FAIL counter. It does not exit the script."},"scripts/check-quality-mechanical.sh#check_file":{"name":"check_file","kind":"shell function","file":"scripts/check-quality-mechanical.sh","line":46,"to":69,"doc":"","lines":["check_file() {","  local file=\"$1\"","  [ -f \"$file\" ] || return 0","  is_ignored \"$file\" && return 0","  local ext=\"${file##*.}\"","","  # Generated / machine-authored files are skipped whole — the same convention","  # ESLint and Prettier honor. A mechanical CODE-quality check has nothing to say","  # about machine-produced OUTPUT: e.g. a procedural geometry catalog is tens of","  # thousands of lines of raw vertex-coordinate arrays where every number is a","  # coordinate and \"extract to a named constant\" is meaningless. Mark such a file","  # with `@generated` in its first 5 lines. Use ONLY for genuinely generated/data","  # files — never to silence a lint on hand-maintained logic.","  if head -5 \"$file\" 2>/dev/null | grep -q '@generated'; then","    return 0","  fi","","  # File length. A `quality-ok: file-length — \u003creason>` pragma anywhere in the file","  # (by convention on the first non-shebang line) blesses a genuinely cohesive file","  # that reads as one unit and would only be fragmented by a split. Like the","  # magic-number pragma, the keyword is the gate; the required reason is enforced at","  # review time, not parsed here. Commented-out-code has no such escape hatch.","  local count","  count=$(wc -l \u003c \"$file\")"],"truncated":true,"explain":"Takes one file path and scans it, calling emit for each violation: more than 500 lines without a 'quality-ok: file-length' pragma, a bare integer of two or more digits outside a named constant, string literal, return/exit statement or pragma-covered line (this check is skipped for files whose name contains test or spec), and two or more consecutive comment lines that look like code. It returns 0 without checking anything when the path is not a regular file, is matched by .quality-ignore, or has '@generated' in its first five lines."},"scripts/test-tdd-
