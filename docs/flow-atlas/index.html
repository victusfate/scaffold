rubric.sh#check":{"name":"check","kind":"shell function","file":"scripts/test-tdd-rubric.sh","line":6,"to":13,"doc":"","lines":["check() {","  local desc=\"$1\"; local pattern=\"$2\"","  if grep -qE \"$pattern\" \"$TDD\" 2>/dev/null; then","    echo \"  ✓ $desc\"; PASS=$((PASS + 1))","  else","    echo \"  ✗ $desc\"; FAIL=$((FAIL + 1))","  fi","}"],"truncated":false,"explain":"Takes a description and an extended-regex pattern and greps the file named by TDD (skills/tdd.md) for the pattern, with grep errors suppressed. On a match it prints the description with a check mark and increments the global PASS counter; otherwise it prints it with a cross mark and increments FAIL."},"scripts/lib/skill-test.sh#has_cs":{"name":"has_cs","kind":"shell function","file":"scripts/lib/skill-test.sh","line":14,"to":17,"doc":"has_cs \u003cfile> \u003cextended-regex> \u003clabel> — case-sensitive variant.","lines":["has_cs() { grep -qE \"$2\" \"$1\" && ok \"$3\" || fail \"$3\"; }","","finish() { echo \"\"; echo \"$PASS passed, $FAIL failed.\"; [ \"$FAIL\" -eq 0 ]; }",""],"truncated":false,"explain":"Takes a file, an extended regular expression and a label, and greps the file case-sensitively for the pattern. It prints the label with a check mark and increments PASS on a match, or prints it with a cross and increments FAIL otherwise."},"scripts/queue-io.ts#queueFile":{"name":"queueFile","kind":"function","file":"scripts/queue-io.ts","line":28,"to":28,"doc":"","lines":["export function queueFile(): string { return process.env.QUEUE_FILE ?? join(sharedQueueDir(), 'queue.md'); }"],"truncated":false,"explain":"Returns the path of the rendered queue.md view: the QUEUE_FILE environment variable when set, otherwise queue.md in the main checkout's .agent/queue directory, which is shared by all linked worktrees."},"scripts/queue-io.ts#sha256":{"name":"sha256","kind":"const","file":"scripts/queue-io.ts","line":198,"to":198,"doc":"","lines":["const sha256 = (text: string): string => createHash('sha256').update(text).digest('hex');"],"truncated":false,"explain":"Takes a string and returns its SHA-256 digest as a hex string."},"scripts/queue-io.ts#assertViewUnedited":{"name":"assertViewUnedited","kind":"function","file":"scripts/queue-io.ts","line":205,"to":213,"doc":"","lines":["function assertViewUnedited(db: DatabaseSync, path: string): void {","  const recorded = renderedHash(db, path);","  if (recorded === null || !existsSync(path) || sha256(readFileSync(path, 'utf8')) === recorded) return;","  throw new QueueIntegrityError(`queue: ${path} changed since the store last rendered it, `","    + 'so it was not overwritten and nothing was saved. Preview what the file would change with '","    + '`node scripts/queue.ts import --dry-run`. If you edited it, apply the edits with `import`. '","    + 'If git swapped in another copy (checkout, pull, merge, stash), `node scripts/queue.ts render` '","    + 'rewrites it from the store.');","}"],"truncated":false,"explain":"Throws a QueueIntegrityError when the view file at the given path exists and its SHA-256 differs from the hash the store last recorded for it. Does nothing when the store never rendered that path, the file is missing, or the hashes match."},"scripts/queue-model.ts#serializeQueue":{"name":"serializeQueue","kind":"function","file":"scripts/queue-model.ts","line":412,"to":435,"doc":"","lines":["export function serializeQueue(q: Queue): string {","  const c = q.config;","  const { tasks, nextId } = assignIds(q);","  const lines = [","    '# Work Queue', '',","    '\u003c!-- queue:config',","    `status: ${c.status}`,","    `interval: ${c.interval}`,","    `maxFailures: ${c.maxFailures}`,","    `leaseMinutes: ${c.leaseMinutes}`,","    `maxParallel: ${c.maxParallel}`,","    `integrationBranch: ${c.integrationBranch}`,","    `deliveryMode: ${c.deliveryMode}`,","    `deliveryTask: ${c.deliveryTask}`,","    `deliveryAccepted: ${c.deliveryAccepted}`,","    `resumeAt: ${c.resumeAt}`,","    `idlePoll: ${c.idlePoll}`,","    `pausePoll: ${c.pausePoll}`,","    `nextId: ${nextId}`,","    '-->', '',","    ...HEADER, '',","  ];","  for (const t of tasks) {","    lines.push(`- [${markOf(t)}] ${t.id} — ${t.title}`, ...fieldLines(t));"],"truncated":true,"explain":"Takes a queue and returns the Markdown text of the queue file: the title, the config comment block, the header lines, then one checkbox line per task followed by its non-empty fields. Tasks without an id are given new task-NNN ids in the output, and the nextId written covers them. It writes no file and does not modify the queue."},"scripts/queue-db.ts#Defer":{"name":"Defer","kind":"type","file":"scripts/queue-db.ts","line":79,"to":79,"doc":"","lines":["export type Defer = (effect: () => void) => void;"],"truncated":false,"explain":"The type of the function withStore passes to its callback for queuing a side effect. Queued effects run in order only after the transaction commits, and are dropped if it rolls back."},"scripts/queue-db.ts#recordRender":{"name":"recordRender","kind":"function","file":"scripts/queue-db.ts","line":138,"to":141,"doc":"","lines":["export function recordRender(db: DatabaseSync, path: string, sha256: string): void {","  db.prepare('INSERT INTO views (path, sha256) VALUES (?, ?) '","    + 'ON CONFLICT (path) DO UPDATE SET sha256 = excluded.sha256').run(path, sha256);","}"],"truncated":false,"explain":"Takes an open database, a view path and a SHA-256 string, and inserts or updates the views table row for that path with that hash. It runs inside the caller's transaction and returns nothing."},"scripts/queue-model.ts#deliveryAllows":{"name":"deliveryAllows","kind":"function","file":"scripts/queue-model.ts","line":757,"to":761,"doc":"","lines":["export function deliveryAllows(q: Queue, id: string): boolean {","  if (q.config.deliveryMode === 'batch') return true;","  const selected = q.config.deliveryTask || q.tasks.find(t => t.status === 'active')?.id;","  return !selected || selected === id;","}"],"truncated":false,"explain":"Takes a queue and a task id and returns whether that task may be worked on now. It is always true in batch delivery mode; otherwise it is true only when there is no recorded delivery task and no active task, or when the recorded delivery task (or, failing that, the first active task) is this id."},"scripts/queue-model.ts#isEligible":{"name":"isEligible","kind":"function","file":"scripts/queue-model.ts","line":764,"to":767,"doc":"","lines":["export function isEligible(task: Task, q: Queue): boolean {","  return task.status === 'pending' && !task.held && deliveryAllows(q, task.id)","    && task.dependsOn.every(d => q.tasks.find(x => x.id === d)?.status === 'done');","}"],"truncated":false,"explain":"Takes a task and its queue and returns true when the task is pending, not held, permitted by the current delivery cycle, and every dependency id resolves to a task in the queue whose status is done. A dependency that is missing from the queue makes it false."},"scripts/queue.ts#dispatchGate":{"name":"dispatchGate","kind":"function","file":"scripts/queue.ts","line":103,"to":125,"doc":"","lines":["function dispatchGate(q: Queue): { queue: Queue; blocked: number | null } {","  const due = resumeIfDue(q, now());","  if (due.resumed) { q = due.queue; save(q); log('auto-resumed (usage window reopened)'); }","  if (q.config.status === 'stopped') {","    if (q.config.resumeAt) {","      console.log(`queue: PAUSED until ${q.config.resumeAt} (usage window) — auto-resumes after`);","      return { queue: q, blocked: EXIT.PAUSED };","    }","    console.log('queue: STOPPED — run `queue start` to resume');","    return { queue: q, blocked: EXIT.STOPPED };","  }","  const expired = staleLeases(q, now(), q.config.leaseMinutes);","  if (expired.length) {","    console.log(`queue: OWNERSHIP CONFLICT — expired lease(s) remain active: ${expired","      .map(t => t.id).join(', ')}. Do not reclaim or dispatch; resolve ownership explicitly.`);","    return { queue: q, blocked: EXIT.CONFLICT };","  }","  if (q.config.deliveryMode !== 'batch' && q.config.deliveryTask && !nextActionable(q)) {","    console.log(`queue: DELIVERY PENDING — ${q.config.deliveryTask}; finish its PR/merge cycle and fresh branch, then advance`);","    return { queue: q, blocked: EXIT.DELIVERY };","  }","  return { queue: q, blocked: null };","}"],"truncated":false,"explain":"Takes a queue and returns { queue, blocked }, where blocked is null when work may be dispatched or an exit code when it may not. It first resumes a usage pause whose time has passed, saving the queue and writing a log line. It then prints a message and blocks with PAUSED or STOPPED if the queue is stopped, CONFLICT if any active task's lease has expired, or DELIVERY if a per-task delivery is recorded and no task is actionable."},"scripts/queue-model.ts#deadlocked":{"name":"deadlocked","kind":"function","file":"scripts/queue-model.ts","line":770,"to":773,"doc":"","lines":["export function deadlocked(q: Queue): Task[] {","  return q.tasks.filter(t => t.status === 'pending'","    && t.dependsOn.some(d => q.tasks.find(x => x.id === d)?.status === 'failed'));","}"],"truncated":false,"explain":"Takes a queue and returns the pending tasks that depend on at least one task whose status is failed. Nothing is changed."},"scripts/queue-model.ts#withTasks":{"name":"withTasks","kind":"function","file":"scripts/queue-model.ts","line":443,"to":445,"doc":"","lines":["function withTasks(q: Queue, tasks: Task[]): Queue {","  return { config: q.config, tasks };","}"],"truncated":false,"explain":"Takes a queue and a task list and returns a new queue with the same config object and that task list."},"scripts/queue-delivery.test.ts#done":{"name":"done","kind":"const","file":"scripts/queue-delivery.test.ts","line":29,"to":29,"doc":"","lines":["const done = removeTask(markDone(active, 'task-001', now), 'task-001');"],"truncated":false,"explain":"A queue value in which task-001 was begun, marked done and then removed, leaving task-002 pending. The test asserts that nothing is ready or actionable in it."},"scripts/queue-delivery.test.ts#dir":{"name":"dir","kind":"const","file":"scripts/queue-delivery.test.ts","line":34,"to":34,"doc":"","lines":["const dir = mkdtempSync(join(tmpdir(), 'queue-delivery-'));"],"truncated":false,"explain":"A temporary directory created with the prefix 'queue-delivery-' when the test file loads. It holds the isolated queue.md the CLI subprocesses use and is removed at the end of the test."},"scripts/queue-delivery.test.ts#run":{"name":"run","kind":"const","file":"scripts/queue-delivery.test.ts","line":36,"to":38,"doc":"","lines":["const run = (...args: string[]) => spawnSync(process.execPath, [cli, ...args], {","  env: { ...humanEnv(), QUEUE_FILE: join(dir, 'queue.md') }, encoding: 'utf8', timeout: 10_000,","});"],"truncated":false,"explain":"Runs the queue CLI (scripts/queue.ts) with the given arguments as a synchronous child process, with QUEUE_FILE pointed at the test's temporary directory and a 10 second timeout. Returns the spawnSync result with string stdout and stderr, and does not throw on a non-zero exit."},"scripts/test-rubric-format.sh#check":{"name":"check","kind":"shell function","file":"scripts/test-rubric-format.sh","line":8,"to":18,"doc":"","lines":["check() {","  local desc=\"$1\"","  local pattern=\"$2\"","  if grep -qE \"$pattern\" \"$RUBRIC\" 2>/dev/null; then","    echo \"  ✓ $desc\"","    PASS=$((PASS + 1))","  else","    echo \"  ✗ $desc\"","    FAIL=$((FAIL + 1))","  fi","}"],"truncated":false,"explain":"Takes a description and an extended-regex pattern and greps the file named by RUBRIC (lib/code-quality-rubric.md) for the pattern, with grep errors suppressed. On a match it prints the description with a check mark and increments the global PASS counter; otherwise it prints it with a cross mark and increments FAIL."},"scripts/test-simplify.sh#fail":{"name":"fail","kind":"shell function","file":"scripts/test-simplify.sh","line":5,"to":28,"doc":"","lines":["fail(){ echo \"  ✗ $1\"; FAIL=$((FAIL + 1)); }","","FILE=skills/simplify.md","","[ -f \"$FILE\" ] || { echo \"MISSING: $FILE\"; exit 1; }","","grep -q '@../lib/code-quality-rubric.md' \"$FILE\" \\","  && ok \"@-includes shared rubric\" || fail \"missing @-include of rubric\"","","grep -q 'Quality Scores' \"$FILE\" \\","  && ok \"score table heading present\" || fail \"missing 'Quality Scores' heading\"","","grep -q 'quality-override' \"$FILE\" \\","  && ok \"override syntax referenced\" || fail \"missing override syntax\"","","grep -qE 'inline override|preceding line|// quality-override|suppress' \"$FILE\" \\","  && ok \"inline pragma awareness described\" || fail \"inline pragma awareness not described\"","","grep -q '10/10\\|score.*10\\|10 on all\\|all.*10' \"$FILE\" \\","  && ok \"10/10 gate threshold stated\" || fail \"missing 10/10 gate threshold\"","","grep -qE 'auto.?fix|auto fix' \"$FILE\" \\","  && ok \"auto-fix mode described\" || fail \"missing auto-fix mode\"",""],"truncated":true,"explain":"Takes a description, prints it to stdout prefixed with a cross mark, and increments the script's global FAIL counter. It does not exit the script."},"scripts/resolver-phases.ts#compileIgnore":{"name":"compileIgnore","kind":"const","file":"scripts/resolver-phases.ts","line":213,"to":213,"doc":"","lines":["const compileIgnore = compileKeepMatcher;"],"truncated":false,"explain":"Takes a list of path patterns and returns a function that tests whether a repo-relative path matches any of them. A pattern containing `*` is matched as a whole-path glob; any other pattern matches that exact path or anything under it as a directory. It is the same function as compileKeepMatcher from tools/lib/safe-write.ts."},"scripts/resolver-phases.ts#groupByTopDir":{"name":"groupByTopDir","kind":"function","file":"scripts/resolver-phases.ts","line":218,"to":226,"doc":"Unclassified files keyed by top-level directory (`packages/`), or by the file itself at the root: a new directory of many files gets one error naming the line that classifies it, not one error per file.","lines":["function groupByTopDir(files: string[]): Map\u003cstring, string[]> {","  const groups = new Map\u003cstring, string[]>();","  for (const f of files) {","    const top = f.includes('/') ? f.slice(0, f.indexOf('/') + 1) : f;","    const list = groups.get(top);","    if (list) list.push(f); else groups.set(top, [f]);","  }","  return groups;","}"],"truncated":false,"explain":"Takes a list of repo-relative file paths and returns a Map that groups them by their first directory segment with a trailing slash (for example `packages/`). A file at the repo root is keyed by its own name."},"bin/sync-from-scaffold.sh#local_block":{"name":"local_block","kind":"shell function","file":"bin/sync-from-scaffold.sh","line":72,"to":77,"doc":"The block appended to AGENTS.md: markers around AGENTS.local.md, separated from the upstream text by a blank line.","lines":["local_block() {","  printf '\\n%s\\n' \"$LOCAL_BEGIN\"","  cat \"$LOCAL_AGENTS\"","  [ -z \"$(tail -c 1 \"$LOCAL_AGENTS\")\" ] || printf '\\n'","  printf '%s\\n' \"$LOCAL_END\"","}"],"truncated":false,"explain":"Prints to stdout the block that is appended to AGENTS.md: a blank line, the BEGIN marker line, the contents of AGENTS.local.md (with a newline added if the file does not end in one), then the END marker line. It takes no arguments and writes no files; it fails if AGENTS.local.md cannot be read."},"bin/sync-from-scaffold.sh#in_keep_list":{"name":"in_keep_list","kind":"shell function","file":"bin/sync-from-scaffold.sh","line":156,"to":165,"doc":"Returns 0 if $1 matches any pattern in .scaffold-keep, 1 otherwise.","lines":["in_keep_list() {","  local file=\"$1\" pattern","  [ -f \".scaffold-keep\" ] || return 1","  while IFS= read -r pattern; do","    [[ -z \"$pattern\" || \"$pattern\" == \\#* ]] && continue","    # shellcheck disable=SC2053","    [[ \"$file\" == $pattern ]] && return 0","  done \u003c \".scaffold-keep\"","  return 1","}"],"truncated":false,"explain":"Takes a file path and returns 0 if it matches any glob pattern listed in .scaffold-keep in the current directory, skipping blank lines and lines starting with #. Returns 1 when nothing matches or when .scaffold-keep does not exist."},"tools/hoist-skill/manifest.ts#ManifestEntry":{"name":"ManifestEntry","kind":"interface","file":"tools/hoist-skill/manifest.ts","line":5,"to":9,"doc":"","lines":["export interface ManifestEntry {","  name: string;","  harness: string;","  ref: string;","}"],"truncated":false,"explain":"One line of the .sync/hoisted manifest: the skill name, the harness it was hoisted for, and the scaffold git ref it is pinned to. readManifest returns these and upsertManifest writes them."},"tools/hoist-skill/manifest.ts#readManifest":{"name":"readManifest","kind":"function","file":"tools/hoist-skill/manifest.ts","line":11,"to":21,"doc":"","lines":["export function readManifest(path: string): ManifestEntry[] {","  if (!existsSync(path)) return [];","  return readFileSync(path, 'utf8')","    .split('\\n')","    .filter(l => l.trim() && !l.startsWith('#'))","    .map(l => {","      const parts = l.split('\\t');","      return { name: (parts[0] || '').trim(), harness: (parts[1] || '').trim(), ref: (parts[2] || 'main').trim() };","    })","    .filter(e => e.name && e.harness);","}"],"truncated":false,"explain":"Takes a manifest file path and returns its entries as { name, harness, ref }, reading one tab-separated entry per line, skipping blank lines, lines starting with '#', and lines missing a name or harness; ref defaults to 'main'. Returns an empty array when the file does not exist."},"tools/hoist-skill/manifest.ts#PREVIOUS_PLAN":{"name":"PREVIOUS_PLAN","kind":"const","file":"tools/hoist-skill/manifest.ts","line":23,"to":23,"doc":"","lines":["const PREVIOUS_PLAN = 'grill-with-docs';"],"truncated":false,"explain":"The string 'grill-with-docs', the former name of the skill now called 'co-plan'. The manifest functions use it to find legacy entries to rename or drop."},"tools/hoist-skill/manifest.ts#CURRENT_PLAN":{"name":"CURRENT_PLAN","kind":"const","file":"tools/hoist-skill/manifest.ts","line":24,"to":24,"doc":"","lines":["const CURRENT_PLAN = 'co-plan';"],"truncated":false,"explain":"The string 'co-plan', the current name of the skill formerly called 'grill-with-docs'. The manifest functions use it to rename or drop legacy entries recorded under the old name."},"scripts/check-handoff.ts#MAX_LINES":{"name":"MAX_LINES","kind":"const","file":"scripts/check-handoff.ts","line":21,"to":21,"doc":"quality-ok: magic-number — a handoff a cold reader can take in at once; longer means it became a log","lines":["export const MAX_LINES = 80;"],"truncated":false,"explain":"The number 80. It is the default maximum number of lines check() allows in a handoff before reporting it as too long."},"scripts/check-handoff.ts#TAG":{"name":"TAG","kind":"const","file":"scripts/check-handoff.ts","line":23,"to":23,"doc":"","lines":["const TAG = /\\[(verified: *\\S[^\\]]*|unverified)\\]/;"],"truncated":false,"explain":"A regular expression that matches '[unverified]' or '[verified: \u003cnon-empty text>]'. check() uses it to decide whether a bullet under '## State' carries a verification tag."},"scripts/check-handoff.ts#CLASH":{"name":"CLASH","kind":"const","file":"scripts/check-handoff.ts","line":24,"to":24,"doc":"","lines":["const CLASH = /\\b(correction|update|edit)\\s*:|\\bsuperseded\\b|~~/i;"],"truncated":false,"explain":"A case-insensitive regular expression that matches 'correction:', 'update:' or 'edit:' (with optional space before the colon), the word 'superseded', or '~~' strikethrough. check() reports any handoff line it matches as a correction left beside the fact it corrects."},"scripts/check-handoff.ts#UNSAFE_TAG":{"name":"UNSAFE_TAG","kind":"const","file":"scripts/check-handoff.ts","line":25,"to":48,"doc":"","lines":["const UNSAFE_TAG = /\\[verified:[^\\]]*([|;&\u003c>]|\\$\\(|\\b(curl|wget|rm|sh|bash|eval|sudo)\\b)/;","","export function check(text: string, maxLines = MAX_LINES): string[] {","  const lines = text.replace(/\\n$/, '').split('\\n');","  const errors: string[] = [];","  let inState = false;","  let sawState = false;","  lines.forEach((line, i) => {","    const n = i + 1;","    if (/^#{1,6} /.test(line)) {","      inState = /^## State\\s*$/.test(line);","      sawState ||= inState;","    } else if (inState && /^\\s*[-*] /.test(line) && !TAG.test(line)) {","      errors.push(`State bullet at line ${n} needs [verified: \u003ccmd>] or [unverified]: ${line.trim()}`);","    }","    if (UNSAFE_TAG.test(line)) errors.push(`line ${n}: a [verified: …] tag is evidence, not a command to replay; cite a repo check or file:line: ${line.trim()}`);","    if (CLASH.test(line)) errors.push(`line ${n} keeps a correction beside the old fact; rewrite the fact in place: ${line.trim()}`);","  });","  if (!sawState) errors.unshift(\"no '## State' section: list the facts the next session relies on, each tagged [verified: \u003ccmd>] or [unverified]\");","  if (lines.length > maxLines) errors.push(`handoff is ${lines.length} lines, over the ${maxLines}-line limit; keep current state, drop history (git keeps it)`);","  return errors;","}","","/** Errors when a handoff would ride a merge into main. */"],"truncated":true,"explain":"A regular expression that matches a '[verified: ...' tag whose text contains a shell metacharacter (| ; & \u003c >), '$(', or one of the words curl, wget, rm, sh, bash, eval or sudo. check() reports any line it matches as a tag that holds a command rather than evidence."},"scripts/check-handoff.ts#preMerge":{"name":"preMerge","kind":"function","file":"scripts/check-handoff.ts","line":49,"to":51,"doc":"","lines":["export function preMerge(path: string): string[] {","  return existsSync(path) ? [`handoffs live only on branches; clear it before merging to main: git rm ${path} && git commit -m \"chore: clear handoff before merge\"`] : [];","}"],"truncated":false,"explain":"Takes a path and returns a one-element list with an error message telling the caller to git rm the handoff when a file exists at that path, or an empty list when it does not. It only checks for existence."},"scripts/check-handoff.test.ts#good":{"name":"good","kind":"const","file":"scripts/check-handoff.test.ts","line":7,"to":15,"doc":"","lines":["const good = [","  '# Handoff — x',","  '- **When / branch:** 2026-10-28 · `feat/x`',","  '## State',","  '- Lint passes on the branch. [verified: `npm run lint`]',","  '- The retry wrapper is probably unnecessary. [unverified]',","  '## Next steps',","  '1. Run `npm test`.',","].join('\\n');"],"truncated":false,"explain":"A string holding a small valid handoff document: a title, a branch line, a '## State' section with one [verified: ...] bullet and one [unverified] bullet, and a '## Next steps' section. The tests assert that check() returns no errors for it and derive each failing case by editing it."},"scripts/resolver-utils.ts#tokens":{"name":"tokens","kind":"function","file":"scripts/resolver-utils.ts","line":31,"to":35,"doc":"","lines":["export function tokens(text: string): Set\u003cstring> {","  return new Set(","    text.toLowerCase().split(/[^a-z0-9]+/).filter(t => t.length > 1 && !STOPWORDS.has(t))","  );","}"],"truncated":false,"explain":"Takes a text string and returns the set of its lowercase alphanumeric words, split on any other character. Words of one character and a fixed list of stopwords (a, the, to, of, and, md, etc.) are left out."},"scripts/resolver-utils.ts#jaccard":{"name":"jaccard","kind":"function","file":"scripts/resolver-utils.ts","line":37,"to":41,"doc":"","lines":["export function jaccard(a: Set\u003cstring>, b: Set\u003cstring>): number {","  const inter = [...a].filter(x => b.has(x)).length;","  const union = new Set([...a, ...b]).size;","  return union === 0 ? 0 : inter / union;","}"],"truncated":false,"explain":"Takes two sets of strings and returns the size of their intersection divided by the size of their union, a number from 0 to 1. Returns 0 when both sets are empty."},"tools/lib/resolver-parse.ts#splitRow":{"name":"splitRow","kind":"function","file":"tools/lib/resolver-parse.ts","line":14,"to":32,"doc":"Parse a RESOLVER.md table row, treating pipe characters inside backtick spans as alternation (not column separators). `\\|` inside a backtick cell unescapes to `|` during regex compilation — existing escaped patterns remain valid.","lines":["export function splitRow(row: string): string[] {","  const cells: string[] = [];","  let current = '';","  let inBacktick = false;","  for (let i = 0; i \u003c row.length; i++) {","    const ch = row[i];","    if (ch === '`') {","      inBacktick = !inBacktick;","      current += ch;","    } else if (ch === '|' && !inBacktick) {","      cells.push(current.trim());","      current = '';","    } else {","      current += ch;","    }","  }","  if (current.trim()) cells.push(current.trim());","  return cells.filter((c, i, arr) => !(i === 0 && c === '') && !(i === arr.length - 1 && c === ''));","}"],"truncated":false,"explain":"Takes one markdown table row and returns its cells as trimmed strings, splitting on '|' except where the pipe is inside a backtick span. An empty first or last cell is dropped, so the row's leading and trailing pipes produce no cells."},"scripts/resolver-utils.ts#anchorSlug":{"name":"anchorSlug","kind":"function","file":"scripts/resolver-utils.ts","line":22,"to":25,"doc":"","lines":["export function anchorSlug(cell: string): string | null {","  const m = cell.replace(/`/g, '').match(/\\^\\\\?\\/([a-z0-9-]+)/);","  return m ? m[1] : null;","}"],"truncated":false,"explain":"Takes a regex table cell, strips backticks, and returns the lowercase slug that follows the first '^/' (or '^\\/') in it. Returns null when the cell has no such anchor."},"scripts/resolver-utils.ts#compileCell":{"name":"compileCell","kind":"function","file":"scripts/resolver-utils.ts","line":9,"to":20,"doc":"Turn a /pattern/flags cell (backtick-wrapped) into a RegExp.","lines":["export function compileCell(cell: string, skill: string, fail: Reporter): RegExp | null {","  const raw = cell.replace(/`/g, '').trim();","  const m = raw.match(/^\\/(.*)\\/([a-z]*)$/s);","  if (!m) { fail('Parse', `${skill}: regex cell is not /pattern/flags → ${raw}`); return null; }","  const body = m[1].replace(/\\\\\\|/g, '|');","  try {","    return new RegExp(body, m[2]);","  } catch (e) {","    fail('Parse', `${skill}: uncompilable regex (${e instanceof Error ? e.message : String(e)})`);","    return null;","  }","}"],"truncated":false,"explain":"Takes a backtick-wrapped /pattern/flags table cell, the skill name and a fail reporter, and returns the compiled RegExp with any '\\|' in the pattern turned into '|'. If the cell is not in /pattern/flags form or the pattern does not compile, it calls fail with category 'Parse' and returns null."},"scripts/resolver-utils.ts#frontmatterDescription":{"name":"frontmatterDescription","kind":"function","file":"scripts/resolver-utils.ts","line":48,"to":62,"doc":"","lines":["export function frontmatterDescription(file: string): string | null {","  const block = frontmatterBlock(file);","  if (block === null) return null;","  const fm = block.split('\\n');","  for (let i = 0; i \u003c fm.length; i++) {","    const line = fm[i];","    if (!line.startsWith('description:')) continue;","    const inline = line.slice('description:'.length).trim();","    if (inline && inline !== '|' && inline !== '>') return inline;","    const parts: string[] = [];","    for (let j = i + 1; j \u003c fm.length && /^\\s+\\S/.test(fm[j]); j++) parts.push(fm[j].trim());","    return parts.join(' ');","  }","  return null;","}"],"truncated":false,"explain":"Takes a file path, reads the file's leading --- frontmatter block, and returns the value of its 'description:' line; when that value is empty, '|' or '>', it returns the following indented lines trimmed and joined with spaces. Returns null when there is no frontmatter or no description line; throws if the file cannot be read."},"scripts/resolver-utils.ts#frontmatterColonInPlainScalar":{"name":"frontmatterColonInPlainScalar","kind":"function","file":"scripts/resolver-utils.ts","line":66,"to":72,"doc":"YAML reads `key: a: b` as a nested mapping, so an unquoted (plain) scalar must not contain \": \". Returns the first offending key, or null when the frontmatter is safe.","lines":["export function frontmatterColonInPlainScalar(file: string): string | null {","  for (const line of (frontmatterBlock(file) ?? '').split('\\n')) {","    const kv = line.match(/^([\\w-]+):\\s+(.*)$/);","    if (kv && !/^[\"'|>]/.test(kv[2]) && kv[2].includes(': ')) return kv[1];","  }","  return null;","}"],"truncated":false,"explain":"Takes a file path, reads the file's leading --- frontmatter block, and returns the key of the first 'key: value' line whose value does not start with a quote, '|' or '>' and contains \": \". Returns null when no line matches or the file has no frontmatter; throws if the file cannot be read."},"scripts/resolver-utils.ts#normalizeWhitespace":{"name":"normalizeWhitespace","kind":"const","file":"scripts/resolver-utils.ts","line":74,"to":74,"doc":"","lines":["export const normalizeWhitespace = (s: string | null | undefined): string => (s ?? '').replace(/\\s+/g, ' ').trim();"],"truncated":false,"explain":"Takes a string, null or undefined and returns the string with every run of whitespace collapsed to one space and the ends trimmed. Null and undefined give an empty string."},"scripts/check-resolvable.ts#RESOLVER":{"name":"RESOLVER","kind":"const","file":"scripts/check-resolvable.ts","line":22,"to":22,"doc":"","lines":["const RESOLVER          = join(SKILLS_DIR, 'RESOLVER.md');"],"truncated":false,"explain":"The absolute path of .claude/skills/RESOLVER.md under the repo root. The script parses the skill rows and the bundled-skill list from this file and reports a Parse error if it does not exist."},"scripts/check-resolvable.ts#QUIET":{"name":"QUIET","kind":"const","file":"scripts/check-resolvable.ts","line":31,"to":31,"doc":"","lines":["const QUIET  = argv.has('--quiet');"],"truncated":false,"explain":"A boolean that is true when the script was run with --quiet. When true, the collected warnings are not printed; errors still are."},"scripts/check-resolvable.ts#errors":{"name":"errors","kind":"const","file":"scripts/check-resolvable.ts","line":33,"to":33,"doc":"","lines":["const errors: string[] = [], warnings: string[] = [];"],"truncated":false,"explain":"A module-level array of error message strings that the fail collector appends to during the check phases. If it is non-empty at the end, the script prints every entry to stderr and exits 1."},"scripts/check-resolvable.ts#warn":{"name":"warn","kind":"const","file":"scripts/check-resolvable.ts","line":35,"to":35,"doc":"","lines":["const warn = (phase: string, msg: string): number => warnings.push(`[${phase}] ${msg}`);"],"truncated":false,"explain":"Takes a phase name and a message, appends '[phase] message' to the module-level warnings array and returns the array's new length. Warnings are printed at the end unless --quiet is set and do not change the exit code."},"scripts/check-resolvable.ts#rows":{"name":"rows","kind":"const","file":"scripts/check-resolvable.ts","line":60,"to":60,"doc":"","lines":["const rows = parseResolverRows(RESOLVER);"],"truncated":false,"explain":"The skill rows parsed from the RESOLVER.md table when the script loads. The RESOLVER-dependent phases run only when it is non-empty, an empty or missing table is recorded as a Parse error, and its length is printed as the skill count on success."},"scripts/check-resolvable.ts#ctx":{"name":"ctx","kind":"const","file":"scripts/check-resolvable.ts","line":64,"to":70,"doc":"","lines":["const ctx: PhaseCtx = {","  fail, warn, ROOT, STRICT, MANIFEST, INTERNAL, SKILLS_DIR, CURSOR_RULES,","  ANTIGRAVITY_SKILLS, ANTIGRAVITY_WORKFLOWS,","  skillDirs: skillDirsOnDisk(),","  bundledSkills: new Set(parseBundledSkills(RESOLVER)),","  trackedFiles, manifestSet, listedInManifest, rel,","};"],"truncated":false,"explain":"The context object passed to every check phase. It holds the fail and warn collectors, the repo root and the paths of the skills, manifest, internal list, Cursor rules and Antigravity directories, the STRICT flag, the skill directories found on disk, the set of bundled skills from RESOLVER.md, the git-tracked file list, and the manifest set with its lookup and relative-path helpers."},"scripts/resolver-phases.ts#phaseReachability":{"name":"phaseReachability","kind":"function","file":"scripts/resolver-phases.ts","line":31,"to":46,"doc":"","lines":["export function phaseReachability(rows: ResolverRow[], { fail, ROOT, SKILLS_DIR, skillDirs, bundledSkills, rel }: PhaseCtx): void {","  const registered = new Set(rows.map(r => r.name));","  for (const slug of skillDirs) {","    if (!registered.has(slug) && !bundledSkills.has(slug))","      fail('Reachability', `orphaned skill '${slug}' on disk but missing from RESOLVER.md`);","  }","  for (const r of rows) {","    if (!existsSync(join(ROOT, r.path)))","      fail('Reachability', `'${r.name}' canonical path ${r.path} not found`);","    if (anchorSlug(r.regexCell) !== r.name)","      fail('Reachability', `'${r.name}' regex anchor '^/${anchorSlug(r.regexCell)}' must match its slug`);","    const claudeWrapper = join(SKILLS_DIR, r.name, 'SKILL.md');","    if (!existsSync(claudeWrapper))","      fail('Reachability', `'${r.name}' missing Claude wrapper at ${rel(claudeWrapper)}`);","  }","}"],"truncated":false,"explain":"Takes the resolver rows and the phase context and calls ctx.fail for each skill directory on disk that is neither a registered row nor a bundled skill. For each row it also fails when the row's path does not exist under ROOT, when the slug anchored in its regex cell differs from the row name, or when SKILLS_DIR/\u003cname>/SKILL.md is missing; it returns nothing."},"scripts/resolver-phases.ts#phaseBundled":{"name":"phaseBundled","kind":"function","file":"scripts/resolver-phases.ts","line":54,"to":77,"doc":"Validate bundled (vendored, self-contained) skills. Each ships as a single .claude/skills/\u003cslug>/ tree with its own SKILL.md frontmatter and is exempt from the canonical/@-include/multi-harness wrapper contract — so the only invariants are: the dir exists on disk, and SKILL.md carries a frontmatter `name` matching the slug plus a `description`. Their files are covered by the manifest-completeness phase like any other tracked file.","lines":["export function phaseBundled(_rows: ResolverRow[], { fail, SKILLS_DIR, skillDirs, bundledSkills, rel }: PhaseCtx): void {","  const onDisk = new Set(skillDirs);","  for (const slug of bundledSkills) {","    const skillMd = join(SKILLS_DIR, slug, 'SKILL.md');","    if (!onDisk.has(slug)) {","      fail('Bundled', `'${slug}' registered as bundled but ${rel(skillMd)} not found on disk`);","      continue;","    }","    const frontmatter = frontmatterBlock(skillMd) ?? '';","    const name = frontmatter.match(/^name:\\s*(.+?)\\s*$/m)?.[1]?.replace(/['\"]/g, '');","    if (!name) fail('Bundled', `${rel(skillMd)} missing frontmatter 'name:'`);","    else if (name !== slug)","      fail('Bundled', `${rel(skillMd)} frontmatter name '${name}' must equal dir '${slug}'`);","    if (!frontmatterDescription(skillMd))","      fail('Bundled', `${rel(skillMd)} missing frontmatter 'description:'`);","  }","}","","export function phaseAmbiguity(rows: ResolverRow[], { fail }: PhaseCtx): void {","  const compiled = rows","    .map(r => ({ ...r, re: compileCell(r.regexCell, r.name, fail) }))","    .filter((r): r is ResolverRow & { re: RegExp } => r.re !== null);","  const seenAnchor = new Map\u003cstring | null, string>();","  for (const r of compiled) {"],"truncated":true,"explain":"Ignores the rows and checks every bundled skill in the phase context. It calls fail('Bundled', ...) when the skill has no directory on disk, when its SKILL.md frontmatter has no `name`, when that name differs from the directory name, or when the frontmatter has no description. It returns nothing."},"scripts/resolver-phases.ts#phaseAmbiguity":{"name":"phaseAmbiguity","kind":"function","file":"scripts/resolver-phases.ts","line":72,"to":92,"doc":"","lines":["export function phaseAmbiguity(rows: ResolverRow[], { fail }: PhaseCtx): void {","  const compiled = rows","    .map(r => ({ ...r, re: compileCell(r.regexCell, r.name, fail) }))","    .filter((r): r is ResolverRow & { re: RegExp } => r.re !== null);","  const seenAnchor = new Map\u003cstring | null, string>();","  for (const r of compiled) {","    const a = anchorSlug(r.regexCell);","    if (seenAnchor.has(a)) fail('Ambiguity', `duplicate anchor '^/${a}' shared by '${seenAnchor.get(a)}' and '${r.name}'`);","    else seenAnchor.set(a, r.name);","  }","  for (let i = 0; i \u003c compiled.length; i++) {","    const r = compiled[i];","    const invocation = `/${r.name}`;","    if (!r.re.test(invocation)) fail('Ambiguity', `'${r.name}' regex does not match its own invocation '${invocation}'`);","    for (let j = i + 1; j \u003c compiled.length; j++) {","      const other = compiled[j];","      if (other.re.test(invocation)) fail('Ambiguity', `routing collision: '${invocation}' also matches '${other.name}' regex`);","      if (r.re.test(`/${other.name}`)) fail('Ambiguity', `routing collision: '/${other.name}' also matches '${r.name}' regex`);","    }","  }","}"],"truncated":false,"explain":"Takes the resolver rows and the phase context and compiles each row's regex, skipping rows whose regex fails to compile. It calls fail('Ambiguity', ...) when two rows share the same anchor slug, when a row's regex does not match its own `/\u003cname>` invocation, or when one skill's invocation also matches another row's regex. It returns nothing."},"scripts/resolver-phases.ts#phaseDry":{"name":"phaseDry","kind":"function","file":"scripts/resolver-phases.ts","line":94,"to":117,"doc":"","lines":["export function phaseDry(rows: ResolverRow[], { fail, warn, ROOT, STRICT }: PhaseCtx): void {","  // 3 consecutive meaningful lines is the minimum for intentional duplication:","  // a 1- or 2-line match fires on common phrases (\"See also:\", empty returns)","  // too often to be actionable. 3 lines is long enough to signal a real block.","  const MIN_RUN = 3;","  // Lines shorter than 20 chars are almost always structural (headings, bullets,","  // closing braces) rather than logic — filtering them keeps the duplicate","  // detector focused on actual content blocks.","  const MIN_LEN = 20;","  const norm = (l: string): string => l.trim();","  const meaningful = (l: string): boolean => l.length >= MIN_LEN && !l.startsWith('#') && !/^[-*]\\s*$/.test(l);","  const fileLines = rows","    .filter(r => existsSync(join(ROOT, r.path)))","    .map(r => ({ skill: r.name, lines: readFileSync(join(ROOT, r.path), 'utf8').split('\\n').map(norm) }));","  const blockOwners = new Map\u003cstring, Set\u003cstring>>();","  for (const { skill, lines } of fileLines) {","    for (let i = 0; i + MIN_RUN \u003c= lines.length; i++) {","      const run = lines.slice(i, i + MIN_RUN);","      if (!run.every(meaningful)) continue;","      const key = run.join('\\n');","      let owners = blockOwners.get(key);","      if (!owners) { owners = new Set(); blockOwners.set(key, owners); }","      owners.add(skill);","    }"],"truncated":true,"explain":"Takes the resolver rows and the phase context, reads each row's skill file that exists, and looks for runs of three consecutive trimmed lines, each at least 20 characters and not a heading or empty bullet, that appear in two or more skills. Each such block is reported under 'DRY' through fail when STRICT is set and through warn otherwise. It returns nothing."},"scripts/resolver-phases.ts#phaseMece":{"name":"phaseMece","kind":"function","file":"scripts/resolver-phases.ts","line":127,"to":140,"doc":"","lines":["export function phaseMece(rows: ResolverRow[], { fail }: PhaseCtx): void {","  // 0.7 Jaccard on purpose-description tokens is the overlap point where two","  // skills are almost certainly describing the same intent. Below 0.7 the","  // similarity is incidental (shared domain vocabulary). Calibrated against the","  // current skill set: the closest legitimate pair scores ~0.45.","  const THRESHOLD = 0.7;","  const sig = rows.map(r => ({ name: r.name, t: tokens(r.purpose) }));","  for (let i = 0; i \u003c sig.length; i++)","    for (let j = i + 1; j \u003c sig.length; j++) {","      const score = jaccard(sig[i].t, sig[j].t);","      if (score >= THRESHOLD)","        fail('MECE', `'${sig[i].name}' and '${sig[j].name}' are not mutually exclusive (purpose similarity ${score.toFixed(2)}) — combine via parameterized args`);","    }","}"],"truncated":false,"explain":"Takes the resolver rows and the phase context, tokenizes each row's purpose text, and computes the Jaccard similarity of every pair of rows. It calls ctx.fail with category 'MECE' for each pair scoring 0.7 or higher and returns nothing."},"scripts/resolver-phases.ts#phaseWrapperIntegrity":{"name":"phaseWrapperIntegrity","kind":"function","file":"scripts/resolver-phases.ts","line":142,"to":155,"doc":"","lines":["export function phaseWrapperIntegrity(rows: ResolverRow[], { fail, SKILLS_DIR, CURSOR_RULES, ANTIGRAVITY_SKILLS, ANTIGRAVITY_WORKFLOWS, rel }: PhaseCtx): void {","  for (const r of rows) {","    const expected = `skills/${r.name}.md`;","    const check = (path: string, include: string): void => {","      if (!existsSync(path)) return;","      if (!readFileSync(path, 'utf8').includes(include))","        fail('Wrapper', `${rel(path)} must contain '${include}' — edit skills/${r.name}.md, not the wrapper`);","    };","    check(join(SKILLS_DIR, r.name, 'SKILL.md'),              `@../../../${expected}`);","    check(join(CURSOR_RULES, `${r.name}.mdc`),               `@../../${expected}`);","    check(join(ANTIGRAVITY_SKILLS, r.name, 'SKILL.md'),      `../../../${expected}`);","    check(join(ANTIGRAVITY_WORKFLOWS, `${r.name}.md`),       `../../${expected}`);","  }","}"],"truncated":false,"explain":"Takes the resolver rows and the phase context and, for each row, reads the Claude wrapper, Cursor rule, Antigravity skill and Antigravity workflow files that exist. It calls ctx.fail for any of them whose text does not contain the expected relative include path to skills/\u003cname>.md; missing files are skipped and nothing is returned."},"scripts/resolver-phases.ts#phaseCursorParity":{"name":"phaseCursorParity","kind":"function","file":"scripts/resolver-phases.ts","line":157,"to":164,"doc":"","lines":["export function phaseCursorParity(rows: ResolverRow[], { fail, CURSOR_RULES, listedInManifest, rel }: PhaseCtx): void {","  for (const r of rows) {","    const mirror = join(CURSOR_RULES, `${r.name}.mdc`);","    if (!existsSync(mirror)) fail('Cursor', `'${r.name}' has no Cursor mirror at ${rel(mirror)}`);","    else if (!listedInManifest(`.cursor/rules/${r.name}.mdc`))","      fail('Cursor', `.cursor/rules/${r.name}.mdc not in scaffold manifest — won't sync downstream`);","  }","}"],"truncated":false,"explain":"Takes the resolver rows and the phase context and, for each skill, checks its Cursor rule file (\u003cCURSOR_RULES>/\u003cname>.mdc). It calls fail('Cursor', ...) when the file is missing, or when it exists but `.cursor/rules/\u003cname>.mdc` is not listed in the scaffold manifest. It returns nothing."},"scripts/resolver-phases.ts#phaseAntigravityParity":{"name":"phaseAntigravityParity","kind":"function","file":"scripts/resolver-phases.ts","line":166,"to":177,"doc":"","lines":["export function phaseAntigravityParity(rows: ResolverRow[], { fail, ANTIGRAVITY_SKILLS, ANTIGRAVITY_WORKFLOWS, listedInManifest, rel }: PhaseCtx): void {","  for (const r of rows) {","    const skillFile = join(ANTIGRAVITY_SKILLS, r.name, 'SKILL.md');","    if (!existsSync(skillFile)) fail('Antigravity', `'${r.name}' has no Antigravity skill at ${rel(skillFile)}`);","    else if (!listedInManifest(`.agents/skills/${r.name}/SKILL.md`))","      fail('Antigravity', `.agents/skills/${r.name}/SKILL.md not in scaffold manifest — won't sync downstream`);","    const workflowFile = join(ANTIGRAVITY_WORKFLOWS, `${r.name}.md`);","    if (!existsSync(workflowFile)) fail('Antigravity', `'${r.name}' has no Antigravity workflow at ${rel(workflowFile)}`);","    else if (!listedInManifest(`.agent/workflows/${r.name}.md`))","      fail('Antigravity', `.agent/workflows/${r.name}.md not in scaffold manifest — won't sync downstream`);","  }","}"],"truncated":false,"explain":"Takes the resolver rows and the phase context and, for each skill, checks for its Antigravity skill file (\u003cANTIGRAVITY_SKILLS>/\u003cname>/SKILL.md) and workflow file (\u003cANTIGRAVITY_WORKFLOWS>/\u003cname>.md). It calls fail('Antigravity', ...) for each file that is missing on disk, or that exists but is not listed in the scaffold manifest. It returns nothing."},"scripts/resolver-phases.ts#phaseFrontmatterParity":{"name":"phaseFrontmatterParity","kind":"function","file":"scripts/resolver-phases.ts","line":179,"to":200,"doc":"","lines":["export function phaseFrontmatterParity(rows: ResolverRow[], { fail, SKILLS_DIR, CURSOR_RULES, ANTIGRAVITY_SKILLS, ANTIGRAVITY_WORKFLOWS, rel }: PhaseCtx): void {","  for (const r of rows) {","    const claudeWrapper = join(SKILLS_DIR, r.name, 'SKILL.md');","    if (!existsSync(claudeWrapper)) continue;","    const claudeDesc = normalizeWhitespace(frontmatterDescription(claudeWrapper));","    if (!claudeDesc) { fail('Parity', `'${r.name}' Claude wrapper has no frontmatter description`); continue; }","    const forms = [","      join(CURSOR_RULES, `${r.name}.mdc`),","      join(ANTIGRAVITY_SKILLS, r.name, 'SKILL.md'),","      join(ANTIGRAVITY_WORKFLOWS, `${r.name}.md`),","    ];","    for (const f of [claudeWrapper, ...forms]) {","      const key = existsSync(f) ? frontmatterColonInPlainScalar(f) : null;","      if (key) fail('Frontmatter', `'${r.name}' ${rel(f)}: unquoted '${key}' contains \": \" — invalid YAML; rephrase or quote it`);","    }","    for (const f of forms) {","      if (!existsSync(f)) continue;","      if (normalizeWhitespace(frontmatterDescription(f)) !== claudeDesc)","        fail('Parity', `'${r.name}' description drift in ${rel(f)} — sync it with the Claude form`);","    }","  }","}"],"truncated":false,"explain":"Takes the resolver rows and the phase context and, for each skill whose Claude wrapper SKILL.md exists, compares its frontmatter description (whitespace-normalized) against the Cursor rule, Antigravity skill and Antigravity workflow files that exist. It reports through ctx.fail when the Claude wrapper has no description, when any of the four files has an unquoted frontmatter value containing \": \", or when a description differs from the Claude one; it returns nothing and skips skills with no Claude wrapper."},"scripts/resolver-phases.ts#phaseScaffold":{"name":"phaseScaffold","kind":"function","file":"scripts/resolver-phases.ts","line":202,"to":211,"doc":"","lines":["export function phaseScaffold(rows: ResolverRow[], { fail, warn, MANIFEST, listedInManifest, rel }: PhaseCtx): void {","  if (!existsSync(MANIFEST)) { fail('Scaffold', `manifest not found at ${rel(MANIFEST)}`); return; }","  for (const r of rows) {","    if (!listedInManifest(r.path))","      fail('Scaffold', `'${r.name}' path ${r.path} not in scaffold manifest — won't sync downstream`);","  }","  for (const p of ['.claude/skills/RESOLVER.md', 'scripts/check-resolvable.ts']) {","    if (!listedInManifest(p)) warn('Scaffold', `${p} not in scaffold manifest — consider adding it`);","  }","}"],"truncated":false,"explain":"Takes the resolver rows and the phase context; if the manifest file does not exist it reports one failure and returns. Otherwise it calls ctx.fail for each row whose path is not listed in the manifest, and ctx.warn if .claude/skills/RESOLVER.md or scripts/check-resolvable.ts is not listed."},"scripts/resolver-phases.ts#phaseManifestCompleteness":{"name":"phaseManifestCompleteness","kind":"function","file":"scripts/resolver-phases.ts","line":235,"to":256,"doc":"Completeness guard for the sync manifest. Every tracked file must be either shipped (scaffold-files.txt) or held back (scaffold-internal.txt); every manifest entry must be a real tracked file and not also internal. This makes \"ship unless ignored\" the default, closing the \"added a file but forgot the manifest\" gap. Scaffold-only: keyed on the internal list, which never syncs, so consumer repos (which lack it) skip the check rather than flag their own files.","lines":["export function phaseManifestCompleteness(_rows: ResolverRow[], { fail, MANIFEST, INTERNAL, manifestSet, trackedFiles, rel }: PhaseCtx): void {","  if (!existsSync(INTERNAL)) return; // not the scaffold repo — nothing to guard","  if (!existsSync(MANIFEST)) { fail('Manifest', `manifest not found at ${rel(MANIFEST)}`); return; }","","  const patterns = readFileSync(INTERNAL, 'utf8')","    .split('\\n').map(l => l.replace(/#.*/, '').trim()).filter(Boolean);","  const isInternal = compileIgnore(patterns);","  const tracked = new Set(trackedFiles);","","  for (const [top, files] of groupByTopDir(trackedFiles.filter(f => !manifestSet.has(f) && !isInternal(f)))) {","    if (files.length > 1) // only a directory key can hold more than one file","      fail('Manifest', `${files.length} tracked files under ${top} are neither shipped nor held back — add \\`${top}\\` to ${rel(INTERNAL)} to hold back the directory, or list each file in ${rel(MANIFEST)}`);","    else for (const f of files)","      fail('Manifest', `${f} is tracked but neither shipped (${rel(MANIFEST)}) nor held back (${rel(INTERNAL)}) — add it to one`);","  }","  for (const p of manifestSet) {","    if (!tracked.has(p))","      fail('Manifest', `${rel(MANIFEST)} lists ${p}, which is not a tracked file — remove or fix it`);","    else if (isInternal(p))","      fail('Manifest', `${p} is in both ${rel(MANIFEST)} and ${rel(INTERNAL)} — a file can't be shipped and held back`);","  }","}"],"truncated":false,"explain":"Takes the phase context (rows are ignored) and returns immediately when the internal hold-back list file does not exist; if the manifest file is missing it reports one failure and returns. Otherwise it reads the internal list's patterns and calls ctx.fail for every tracked file that is neither in the manifest set nor matched by an internal pattern (one grouped failure per top-level directory holding more than one such file), for every manifest entry that is not a tracked file, and for every manifest entry that also matches an internal pattern."},"scripts/queue-task-origin.ts#AGENT_ADD_REFUSAL":{"name":"AGENT_ADD_REFUSAL","kind":"const","file":"scripts/queue-task-origin.ts","line":33,"to":34,"doc":"","lines":["const AGENT_ADD_REFUSAL = 'queue add: tasks are human-owned. From an agent session, add a task only when a human asked for it: '","  + 'pass --requested \"\u003cthe human\\'s own words>\" (add --parent \u003ctask-id> to record lineage). '"],"truncated":false,"explain":"The error message returned when an agent session tries to add a task without --parent or --requested. It says tasks are human-owned and tells the agent to pass --requested with the human's own words, or to record findings on an existing task instead."},"scripts/queue-db.ts#ARCHITECTURE_COLUMN":{"name":"ARCHITECTURE_COLUMN","kind":"const","file":"scripts/queue-db.ts","line":34,"to":34,"doc":"","lines":["const ARCHITECTURE_COLUMN = `TEXT NOT NULL DEFAULT '${DEFAULT_ARCHITECTURE}' CHECK (architecture IN (${ARCHITECTURE_MODES.map(mode => `'${mode}'`).join(', ')}))`;"],"truncated":false,"explain":"The SQL column definition for the tasks.architecture column: text, not null, defaulting to the default architecture mode, with a CHECK limiting it to the known modes. It is used in the CREATE TABLE schema and in the ALTER TABLE that adds the column to older stores."},"scripts/queue-io.ts#LOCK_POLL_MS":{"name":"LOCK_POLL_MS","kind":"const","file":"scripts/queue-io.ts","line":79,"to":79,"doc":"Queue mutations span read → mutate → write, so an exclusive sidecar prevents concurrent CLI and console processes from saving stale snapshots. A lock is never age-stolen: a slow, live process is indistinguishable from a dead one. It is reclaimed only when its recorded holder is confirmed dead on this host (no such process, or that PID now belongs to a process started after the lock was taken). A holder killed mid-transaction (SIGKILL, a caller's `timeout`) never runs its `finally`, so without this its lock wedged every later caller. Otherwise contenders wait this bounded interval, then fail loudly.","lines":["const LOCK_POLL_MS = 20;"],"truncated":false,"explain":"The 20 milliseconds a process sleeps between attempts to take the queue lock while another process holds it."},"scripts/queue-io.ts#LOCK_WAIT_MS":{"name":"LOCK_WAIT_MS","kind":"const","file":"scripts/queue-io.ts","line":80,"to":80,"doc":"","lines":["const LOCK_WAIT_MS = 60_000;"],"truncated":false,"explain":"The 60,000 milliseconds a process keeps retrying for the queue lock before throwing an error that the lock remained held."},"scripts/queue-io.ts#held":{"name":"held","kind":"let","file":"scripts/queue-io.ts","line":81,"to":81,"doc":"","lines":["let held: { fd: number; path: string } | null = null;"],"truncated":false,"explain":"Module state holding the file descriptor and path of the queue lock this process currently holds, or null when it holds none. withLock and unlocked read it to decide whether to acquire or release."},"scripts/queue-io.ts#lockPath":{"name":"lockPath","kind":"function","file":"scripts/queue-io.ts","line":83,"to":83,"doc":"","lines":["function lockPath(): string { return `${dbFile()}.lock`; }"],"truncated":false,"explain":"Returns the path of the queue lock file: the store path from dbFile() with '.lock' appended."},"scripts/queue-io.ts#napSync":{"name":"napSync","kind":"function","file":"scripts/queue-io.ts","line":85,"to":87,"doc":"","lines":["function napSync(ms: number): void {","  Atomics.wait(new Int32Array(new SharedArrayBuffer(4)), 0, 0, ms);","}"],"truncated":false,"explain":"Blocks the current thread for the given number of milliseconds and returns nothing."},"scripts/queue-io.ts#reclaimDeadHolder":{"name":"reclaimDeadHolder","kind":"function","file":"scripts/queue-io.ts","line":156,"to":171,"doc":"","lines":["function reclaimDeadHolder(path: string): boolean {","  let text: string;","  try { text = readFileSync(path, 'utf8'); } catch { return true; } // released meanwhile: retry now","  const record = parseLockRecord(text);","  if (!record || record.pid === process.pid || !holderIsDead(record)) return false;","  const aside = `${path}.dead-${record.pid}-${process.pid}`;","  try { renameSync(path, aside); } catch { return true; } // another contender won: retry","  if (readFileSync(aside, 'utf8') !== text) {","    try { linkSync(aside, path); } catch { /* a newer lock exists; ours was not it */ }","    rmSync(aside, { force: true });","    return false;","  }","  rmSync(aside, { force: true });","  process.stderr.write(`queue: reclaimed lock from dead holder pid=${record.pid} (${text.trim()})\\n`);","  return true;","}"],"truncated":false,"explain":"Takes the lock file path and returns true when the caller should retry taking the lock immediately: the lock vanished, another contender moved it, or its recorded holder was confirmed dead and the file was removed (with a notice on stderr). Returns false when the record is unreadable, names this process, names a holder that may be alive, or the file changed during the attempt."}}}</script>

<script>

/* ---------- glossary terms open in place ---------- */
function richer(glossary){
  const ALIAS = {}; for (const k in glossary) for (const a of glossary[k].a) ALIAS[a] = k;
  const al = Object.keys(ALIAS).sort((a,b)=>b.length-a.length).map(s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));
  const RE = al.length ? new RegExp('(?<![\\w-])(' + al.join('|') + ')(?![\\w-])','g') : null;
  const rich = (text, skip) => { if (!RE) return [text];
    const out=[], seen=new Set(); let last=0, m; RE.lastIndex=0;
    while ((m = RE.exec(text))) { const k = ALIAS[m[1]]; if (k===skip || seen.has(k)) continue; seen.add(k);
      out.push(text.slice(last, m.index), $('button',{class:'term',type:'button','aria-expanded':'false',onclick:e=>toggle(e.currentTarget,k)}, m[1])); last = m.index + m[1].length; }
    out.push(text.slice(last)); return out; };

    const open = [...host.children].find(c => c.classList.contains('def') && c.dataset.k===k);
    if (open) { open.remove(); btn.setAttribute('aria-expanded','false'); return; }
    host.append($('span',{class:'def','data-k':k}, $('b',{}, glossary[k].t + '. '), rich(glossary[k].d, k))); btn.setAttribute('aria-expanded','true'); };

}

    A.groups.map(g => $('div',{class:'navgroup'}, $('div',{class:'eyebrow'},g.name),
      g.flows.map(sl => $('button',{class:'navitem','aria-current':state.slug===sl?'page':false,onclick:()=>go(sl)}, $('span',{},FLOWS[sl].title), dots(FLOWS[sl].counts))))));
}

/* ---------- overview ---------- */

  const tot = {confirmed:0, partial:0, unsupported:0, contradicted:0}; let missing = 0;
  for (const sl of ORDER) { for (const v of VERDICTS) tot[v] += FLOWS[sl].counts[v]; missing += FLOWS[sl].missing; }

    $('section',{class:'card'}, $('h3',{},'Verification across all flows'), bar(tot), tally(tot),

    $('section',{class:'tight'}, $('h2',{},'Flows'),
      $('div',{class:'lanes'}, A.groups.map(g => $('div',{class:'lane'}, $('div',{class:'lane-head'}, $('div',{class:'eyebrow'},g.name), g.sub ? $('span',{class:'small muted'},g.sub) : null),

    $('section',{class:'tight'}, $('h2',{},'Scoreboard'),

          $('td',{class:'mono'}, f.sources.filter(s=>!s.endsWith('.mmd')).join(', ')), VERDICTS.map(v=>$('td',{class:'num'},String(f.counts[v]))), $('td',{class:'num'},String(f.missing)), $('td',{class:'num'},String(f.code.refs))); })))))
  ];
}

const zoom = { k:1, x:0, y:0, fit:1 };
function sheet(f){

  img.style.width = f.w+'px'; img.style.height = f.h+'px';
  const vp = $('div',{class:'vp',id:'vp'}, img);

      if (pinch) zoomAt(d/pinch, (a[0]+b[0])/2 - r.left, (a[1]+b[1])/2 - r.top); pinch = d; } });
  const up = e => { pts.delete(e.pointerId); pinch = 0; if (!pts.size) vp.classList.remove('dragging'); };

    $('div',{class:'sheet-bar'}, $('span',{class:'small muted'},'Drag to pan. Pinch or Ctrl+scroll to zoom.'),
      $('div',{class:'row'}, $('button',{class:'btn sq','aria-label':'Zoom out',onclick:()=>center(1/1.3)},'−'), $('span',{class:'mono',id:'zoom-pct'},'100%'),
        $('button',{class:'btn sq','aria-label':'Zoom in',onclick:()=>center(1.3)},'+'), $('button',{class:'btn',onclick:fit},'Fit'),
        ext(gh(f.svgRepoPath), 'Open on GitHub'))), vp);
}
addEventListener('resize', () => { if (state.slug && state.tab==='explore' && sheet.refit && el('vp')) sheet.refit(); });

function checkItem(c, showStage, f){
  return $('li',{class:'check'},
    $('div',{class:'row'}, $('span',{class:'pill '+c.verdict},VLABEL[c.verdict]), showStage && f.nodes[c.node] ? $('span',{class:'pill plain'},f.nodes[c.node].name) : null,
      c.origin==='diagram' ? $('span',{class:'pill plain'},'from the diagram') : null, c.elsewhere ? $('span',{class:'pill partial'},'outside tracked sources') : null),

}
const loadingChecks = () => $('p',{class:'small muted'}, vErr ? 'The claim-by-claim detail did not load. The counts above are still correct; reload the page to try again.' : 'Loading the claim-by-claim detail…');

      return [rs.map(r => $('details',{class:'more'}, $('summary',{}, r.title+' ', $('span',{class:'mono muted'}, r.file+':'+r.from)), $('div',{style:'padding-top:8px'}, refCard(r)))),
        po.map(x => $('p',{class:'prose-only'}, x.what)), !rs.length && !po.length ? $('p',{class:'small muted'},'No code was found for this stage; the agent carries it out from the skill text.') : null,
        rs.length ? $('div',{}, $('button',{class:'btn',onclick:()=>{ state.tab='code'; render(); scrollTo(0,0); }},'Open the code walkthrough')) : null]; })()),
    $('hr',{class:'rule'}),
    $('div',{class:'tight'}, $('h3',{},'Checked against the source'), c ? [bar(c), tally(c)] : null,
      !V ? loadingChecks() : !mine.length ? $('p',{class:'small muted'},'No claims were recorded for this stage.') : [

        ok.length ? $('details',{class:'more',open:open.length ? false : ''}, $('summary',{}, ok.length+' confirmed, with the supporting line'), $('ul',{class:'checks'}, ok.map(x => checkItem(x, false, f)))) : null ]),
    $('hr',{class:'rule'}), askSection(f, n));
}

function explore(f, rich){

    ol.append($('li',{class:'tight'}, $('button',{class:'stage','aria-pressed':String(state.node===id),onclick:()=>pick(id)},
      $('span',{class:'n'}, String(i+1).padStart(2,'0')), $('span',{class:'tight',style:'gap:2px'}, $('span',{class:'nm'}, n.name, dots(f.nodeCounts[id] || {})), $('span',{class:'rl'}, n.role))),
      out.map(s => $('div',{class:'hand'}, '↓ '+s[2]+' ', $('code',{}, s[3]), f.nodes[s[1]] && f.order.indexOf(s[1]) !== i+1 ? ' → '+f.nodes[s[1]].name : null)))); });
  return [sheet(f), $('div',{class:'explore'}, $('div',{class:'tight'}, $('h3',{}, f.hasSpec ? 'Stages, in order' : 'Parts of the diagram'), ol), stagePanel(f, rich))];
}

function verifyTab(f){
  if (!V) return [loadingChecks()];
  const v = V[f.slug] || {checks:[], missing:[]}, all = v.checks;

  const chips = [['open','Needs attention', all.filter(needs).length], ...VERDICTS.map(k => [k, VLABEL[k], all.filter(c=>c.verdict===k).length]), ['all','All', all.length]];
  return [

    $('div',{class:'filters',role:'group','aria-label':'Filter claims'}, chips.map(([k,l,nn]) => $('button',{class:'chip','aria-pressed':String(state.filter===k),onclick:()=>{ state.filter=k; render(); }}, l+' '+nn))),
    shown.length ? $('div',{class:'card'}, $('ul',{class:'checks'}, shown.map(c => checkItem(c, true, f))))

    v.missing?.length ? $('section',{class:'tight'}, $('h2',{},'In the source, not shown in the flow'),
      $('div',{class:'card'}, $('ul',{class:'checks'}, v.missing.map(m => $('li',{class:'check'}, $('div',{class:'claim'}, m.what),
        m.quote ? $('div',{class:'quote'}, $('span',{}, '“'+m.quote+'”'), m.quoteOk ? ext(gh(m.file, m.line), m.file+':'+m.line) : $('span',{}, m.file+' · this quote could not be located in the file')) : null))))) : null
  ];
}

function codeTab(f){
  if (!C) return [loadingCode()];

  return [
    c.overview ? $('p',{class:'prose'}, c.overview) : null,
    $('p',{class:'small muted prose'}, 'How this was built: a Claude agent read the repo and chose each line range. The lines shown were then extracted from the files at commit '+A.commit.slice(0,7)+' by script, which also checked that every range contains the text the agent said it would. The helpers listed under an excerpt are found by script: names the excerpt uses that are defined in its own file or a file it imports, shown with their definition and any comment the source gives them; each helper\'s explanation was written by an agent that read the definition. The explanations are the agent\'s reading of the code. Stages with no code are marked, not padded.'),
    $('div',{class:'tour'}, f.order.map((id, i) => { const n = f.nodes[id], rs = refsFor(f.slug, id), po = c.promptOnly.filter(x => x.node===id);
      return $('section',{class:'card'}, $('div',{class:'tight'}, $('div',{class:'tour-h'}, $('span',{class:'n'},String(i+1).padStart(2,'0')), $('h2',{},n.name),
          $('button',{class:'btn',onclick:()=>{ state.node=id; state.tab='explore'; render(); }},'See stage')), $('p',{class:'muted'}, n.role)),
        rs.length ? $('div',{class:'refs'}, rs.map(refCard)) : null,
        po.map(x => $('p',{class:'prose-only'}, $('b',{},'No code here. '), x.what)),
        !rs.length && !po.length ? $('p',{class:'prose-only'}, 'No code was found for this stage; the agent carries it out from the skill text.') : null); }))
  ];
}

function glossaryTab(f, rich){
  const g = f.glossary, keys = Object.keys(g).sort((a,b)=>g[a].t.localeCompare(g[b].t));
  return [$('dl',{class:'gl'}, keys.map(k => [$('dt',{},g[k].t), $('dd',{},rich(g[k].d,k))]))];
}

function renderFlow(f){
  const rich = richer(f.glossary);
  const tabs = [['explore','Diagram and stages'], ['code','Code walkthrough'], ['verify','Verification'], ...(Object.keys(f.glossary).length ? [['glossary','Glossary']] : [])];
  if (!tabs.some(t => t[0]===state.tab)) state.tab = 'explore';
  const i = ORDER.indexOf(f.slug);
  return [
    $('header',{class:'tight'}, $('div',{class:'eyebrow'}, f.group), $('h1',{}, f.title), $('p',{class:'muted prose'}, f.lede)),
    facts(f),
    $('div',{class:'tabs',role:'tablist'}, tabs.map(([id,label]) => $('button',{class:'tab',role:'tab','aria-selected':String(state.tab===id),onclick:()=>{ state.tab=id; render(); }},label))),
    ...(state.tab==='explore' ? explore(f, rich) : state.tab==='code' ? codeTab(f) : state.tab==='verify' ? verifyTab(f) : glossaryTab(f, rich)),
    $('div',{class:'row',style:'justify-content:space-between'}, i>0 ? $('button',{class:'btn',onclick:()=>go(ORDER[i-1])},'← '+FLOWS[ORDER[i-1]].title) : $('span'),
      i<ORDER.length-1 ? $('button',{class:'btn',onclick:()=>go(ORDER[i+1])},FLOWS[ORDER[i+1]].title+' →') : null)

}

/* ---------- ask ---------- */
const srcCache = {};
async function source(path){ if (!(path in srcCache)) { const r = await fetch('src/'+path); if (!r.ok) throw new Error('cannot read '+path); srcCache[path] = (await r.text()).split('\n'); } return srcCache[path]; }
function toolsFor(f){
  const files = f.readable || f.sources, ok = p => { if (!files.includes(p)) throw new Error('path must be one of: '+files.join(', ')); return p; };
  return [
    { name:'search_source', description:'Search this flow\'s source files ('+files.join(', ')+') for a word or phrase (case-insensitive). Returns up to 12 matches with file, line number and two lines of context.',
      inputSchema:{type:'object',properties:{query:{type:'string'}},required:['query']},
      async execute({query}){ const q = String(query||'').toLowerCase().trim(); if (q.length < 2) throw new Error('query too short'); const hits = [];
        for (const p of files) { const L = await source(p); for (let i=0;i<L.length && hits.length<12;i++) if (L[i].toLowerCase().includes(q)) hits.push({file:p, line:i+1, text:L.slice(Math.max(0,i-2), i+3).join('\n')}); }
        return {matches:hits}; } },
    { name:'read_lines', description:'Read up to 120 lines of one source file by line range. Paths: '+files.join(', ')+'.',
      inputSchema:{type:'object',properties:{path:{type:'string'},from:{type:'integer'},to:{type:'integer'}},required:['path','from']},
      async execute({path, from, to}){ const L = await source(ok(path)), a = Math.max(1, from|0), b = Math.min(L.length, Math.max(a, (to|0) || a+60), a+119);
        return {path, from:a, to:b, totalLines:L.length, text:L.slice(a-1, b).map((t,i)=>(a+i)+': '+t).join('\n')}; } }
  ];
}
const plain = x => typeof x==='string' ? x : x.t + ' (' + x.more.flat().join(' ') + ')';
function contextFor(f, n){
  const mine = checksFor(f.slug, state.node).filter(c => c.verdict!=='confirmed');
  return (f.ask || 'The reader is exploring the diagram "'+f.title+'" from the scaffold repo, a template that gives AI coding agents shared skills, rules and workflows.')
    + ' Flow: '+f.title+'. '+f.lede
    + ' Stages in order: '+f.order.map((id,i)=>(i+1)+'. '+f.nodes[id].name+' ('+f.nodes[id].role+')').join(' ')
    + ' Selected stage: '+n.name+'. Role: '+n.role
    + (n.details?.length ? ' Details: '+n.details.map(plain).join(' ') : '')
    + (n.risks?.length ? ' Known risks: '+n.risks.map(plain).join(' ') : '')
    + (mine.length ? ' An audit of this stage against the source found: '+mine.map(c => '['+VLABEL[c.verdict]+'] "'+c.claim+'"'+(c.note ? ' — '+c.note : '')).join(' ') : '')
    + (refsFor(f.slug, state.node).length ? ' Code behind this stage: '+refsFor(f.slug, state.node).map(r => r.title+' ('+r.file+':'+r.from+'-'+r.to+'): '+r.explain).join(' ') : ' No code was found behind this stage; the agent follows the skill text.')
    + ' The source of truth is the repo files '+f.sources.join(', ')+' (readable with the tools: '+(f.readable||f.sources).join(', ')+')'+' at commit '+A.commit.slice(0,7)+'.';
}
const STYLE = ' Before stating what the skill or the code does, look it up with the tools and cite it as file:line. If the diagram and the source disagree, say so and trust the source. Say when something is not covered by the source. Plain text, short paragraphs, under 250 words.';
function askSection(f, n){
  const keep = el('ask-text'), ta = $('textarea',{id:'ask-text',placeholder:'Ask about '+n.name+'…','aria-label':'Your question'}); ta.value = keep ? keep.value : '';
  const qs = [...(n.qs||[]), 'What does the source doc require at this stage that the diagram leaves out?', 'Walk me through the code behind this stage, line by line.'];
  const status = $('span',{class:'small muted'}, sample ? 'Claude answers here and can read this flow\'s source files.' : 'Copies the question with its context, to paste into your agent chat.');
  const act = sample ? $('button',{class:'btn primary',disabled:state.busy,onclick:()=>ask(ta.value)}, state.busy ? 'Answering…' : 'Ask Claude')
    : $('button',{class:'btn primary',onclick:()=>copyQ(f, n, ta, status)},'Copy question');
  return $('div',{class:'tight'}, $('h3',{},'Ask about this stage'),
    $('div',{class:'qs'}, qs.map(q => $('button',{class:'q',onclick:()=>{ ta.value=q; ta.focus(); }},q))), ta,
    $('div',{class:'row'}, act, state.thread.length ? $('button',{class:'btn',onclick:clearThread},'Clear') : null, status),
    $('div',{class:'thread',id:'thread'}, state.thread.map(t => $('div',{class:t.role==='user'?'me':'ai'}, $('div',{class:'who'}, t.role==='user' ? 'You · '+t.about : 'Claude'), $('div',{class:'txt'}, t.text || 'Thinking…')))));
}
function clearThread(){ if (abort) abort.abort(); abort = null; state.thread = []; state.busy = false; render(); }
function copyQ(f, n, ta, status){
  const text = (ta.value.trim() || 'Explain '+n.name+'.') + '\n\nContext: ' + contextFor(f, n);
  const fallback = () => { ta.value = text; ta.select(); status.textContent = 'Selected. Copy it and paste it into your agent chat.'; };
  try { navigator.clipboard.writeText(text).then(() => { status.textContent = 'Copied. Paste it into your agent chat.'; }, fallback); } catch { fallback(); }
}
async function ask(q){
  q = (q||'').trim(); if (!q || state.busy || !sample) return;
  const f = FLOWS[state.slug], n = f.nodes[state.node];
  const history = state.thread.filter(t => t.text).slice(-6).map(t => ({role:t.role, content:t.text}));
  const ans = {role:'assistant', text:''};
  state.thread.push({role:'user', text:q, about:f.title+' / '+n.name}, ans); state.busy = true; render(); el('ask-text').value = '';
  const ctl = abort = new AbortController();
  const paint = () => { const t = document.querySelector('#thread > :last-child .txt'); if (t) t.textContent = ans.text || 'Thinking…'; };
  try {
    const r = await sample([...history, {role:'user', content:contextFor(f, n)+STYLE+'\n\nQuestion: '+q}], {signal:ctl.signal, tools:toolsFor(f), onText:({text}) => { ans.text = text; paint(); }});
    if (abort !== ctl) return;
    ans.text = r.text || ans.text;
  } catch(e) {
    if (abort !== ctl) return;
    if (e && e.code==='not_granted') { sample = null; state.thread.splice(-2, 2); }
    else ans.text = (e && e.text) || ((e && e.code==='rate_limited') ? 'Claude is busy right now. Try again in a moment.' : 'That answer did not come through. Ask again, or copy the question into your agent chat.');
  }
  state.busy = false; render();
}

/* ---------- routing ---------- */
function pick(id){ state.node = id; const y = scrollY; render(); scrollTo(0, y);
  if (matchMedia('(max-width:980px)').matches) el('panel')?.scrollIntoView({behavior:'smooth', block:'start'}); }
function go(slug, tab){ try { if (location.hash !== '#'+slug) location.hash = slug; } catch {} route(slug, tab); }
function route(slug, tab){
  const next = FLOWS[slug] ? slug : null;
  if (next !== state.slug) { if (abort) abort.abort(); abort = null; state.thread = []; state.busy = false; state.filter = 'open'; state.tab = 'explore'; state.node = next ? FLOWS[next].order[0] : null; }
  state.slug = next; if (tab) state.tab = tab; render(); scrollTo(0, 0);
}
let keepZoom = null;
function render(){
  const f = state.slug && FLOWS[state.slug];
  const sameSheet = f && state.tab==='explore' && el('vp') && keepZoom === f.slug;
  const saved = sameSheet ? {...zoom, h: el('vp').style.height} : null;
  renderSide();
  el('main').replaceChildren(...(f ? renderFlow(f) : renderOverview()).filter(Boolean));
  keepZoom = f && state.tab==='explore' ? f.slug : null;
  if (saved) requestAnimationFrame(() => requestAnimationFrame(() => { Object.assign(zoom, saved); const vp = el('vp'); if (!vp) return; vp.style.height = saved.h;
    vp.firstChild.style.transform = 'translate('+zoom.x+'px,'+zoom.y+'px) scale('+zoom.k+')'; vp.classList.toggle('zoomed', zoom.k > zoom.fit*1.02); const z = el('zoom-pct'); if (z) z.textContent = Math.round(zoom.k*100)+'%'; }));
}
addEventListener('hashchange', () => { const s = location.hash.slice(1); if ((FLOWS[s] ? s : null) !== state.slug) route(s); });
route(location.hash.slice(1));
(async () => { try { const s = await window.claude?.use?.('sample'); if (s) { sample = s; render(); } } catch {} })();
</script>
