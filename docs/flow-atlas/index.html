/* Layout: a fixed index of flows on the left; on the right one flow at a time — its diagram on a white
   sheet, the stages under it, and an inspector that pairs each claim with the line of source it rests on.
   Tokens follow scripts/explorer.template.html so the atlas reads as part of the same system. */
:root{
  --bg:#f1f4f7; --surface:#ffffff; --sunk:#e7ecf1; --ink:#15202b; --muted:#566473; --line:#d3dae2;
  --accent:#0a6a94; --accent-soft:#dcedf5; --flow:#a8480a; --flow-soft:#fbe9d8; --paper:#ffffff;
  --ok:#1b7a4b; --ok-soft:#dff2e7; --part:#8a6100; --part-soft:#f8ecc9; --none:#5b5f8f; --none-soft:#e6e7f5; --bad:#b3261e; --bad-soft:#fbe1df;
  --display:"Space Grotesk","Inter",system-ui,sans-serif; --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f151b; --surface:#172029; --sunk:#111920; --ink:#e5ebf1; --muted:#93a2b1; --line:#2b3845;
  --accent:#62c2ea; --accent-soft:#16384a; --flow:#f2ae5c; --flow-soft:#40290f; --paper:#ffffff;
  --ok:#5fd093; --ok-soft:#123524; --part:#e8c15a; --part-soft:#3a2e0c; --none:#a9adde; --none-soft:#25284a; --bad:#ff8a80; --bad-soft:#451815; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0f151b; --surface:#172029; --sunk:#111920; --ink:#e5ebf1; --muted:#93a2b1; --line:#2b3845;
  --accent:#62c2ea; --accent-soft:#16384a; --flow:#f2ae5c; --flow-soft:#40290f; --paper:#ffffff;
  --ok:#5fd093; --ok-soft:#123524; --part:#e8c15a; --part-soft:#3a2e0c; --none:#a9adde; --none-soft:#25284a; --bad:#ff8a80; --bad-soft:#451815; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;
  padding-block:20px 56px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.shell{max-width:1480px;margin:0 auto;display:grid;grid-template-columns:232px minmax(0,1fr);gap:28px;align-items:start}
button,select,textarea,input{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1{font-family:var(--display);font-size:1.75rem;font-weight:600;letter-spacing:-.01em;margin:0;text-wrap:balance}
h2{font-family:var(--display);font-size:1.15rem;font-weight:600;margin:0;text-wrap:balance}
h3{font-size:.72rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0}
p{margin:0}
.eyebrow{font-size:.72rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:.84rem} .mono{font-family:var(--mono);font-size:.8rem}
.stack{display:flex;flex-direction:column;gap:20px;min-width:0}
.tight{display:flex;flex-direction:column;gap:8px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* index of flows */
.side{position:sticky;top:calc(env(safe-area-inset-top, 0px) + 16px);max-height:calc(100vh - 32px);overflow:auto;display:flex;flex-direction:column;gap:16px;padding-right:4px}
.brand{font-family:var(--display);font-weight:600;font-size:1.05rem;background:none;border:0;padding:0;text-align:left}
.brand span{display:block;font-family:var(--body);font-weight:400;font-size:.8rem;color:var(--muted)}
.navgroup{display:flex;flex-direction:column;gap:2px}
.navgroup .eyebrow{padding:0 8px 4px}
.navitem{display:flex;justify-content:space-between;align-items:center;gap:8px;background:none;border:0;border-radius:6px;padding:5px 8px;text-align:left;font-size:.9rem}
.navitem:hover{background:var(--sunk)}
.navitem[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.dots{display:inline-flex;gap:3px;flex:none}
.dot{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dot.partial{background:var(--part)} .dot.unsupported{background:var(--none)} .dot.contradicted{background:var(--bad)} .dot.confirmed{background:var(--ok)}
.pick{display:none}
.pick select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px}

/* verdicts */
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:.74rem;font-weight:600;white-space:nowrap}
.pill.confirmed{background:var(--ok-soft);color:var(--ok)} .pill.partial{background:var(--part-soft);color:var(--part)}
.pill.unsupported{background:var(--none-soft);color:var(--none)} .pill.contradicted{background:var(--bad-soft);color:var(--bad)}
.pill.plain{background:var(--sunk);color:var(--muted)}
.bar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--sunk);min-width:80px}
.bar i{display:block;height:100%}
.bar .confirmed{background:var(--ok)} .bar .partial{background:var(--part)} .bar .unsupported{background:var(--none)} .bar .contradicted{background:var(--bad)}
.tally{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.84rem;font-variant-numeric:tabular-nums}
.tally b{font-weight:600}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.fact{border-left:2px solid var(--line);padding-left:12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.fact a{overflow-wrap:anywhere}

/* diagram sheet */
.sheet{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--paper)}
.sheet-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--surface);border-bottom:1px solid var(--line)}
.vp{position:relative;overflow:hidden;background:var(--paper);cursor:grab;touch-action:pan-y;user-select:none}
.vp.zoomed{touch-action:none}
.vp.dragging{cursor:grabbing}
.vp img{position:absolute;left:0;top:0;transform-origin:0 0;max-width:none;display:block;-webkit-user-drag:none}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:5px 11px;font-weight:500;font-size:.86rem;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.btn:disabled{opacity:.5;cursor:default}
.btn.sq{min-width:32px;padding:5px 0;text-align:center}

/* stages + inspector */
.tabs{display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid var(--line)}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px;font-weight:500;color:var(--muted);margin-bottom:-1px}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.explore{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:20px;align-items:start}
.stages{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.stage{width:100%;display:grid;grid-template-columns:26px minmax(0,1fr);gap:8px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.stage:hover{border-color:var(--accent)}
.stage[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.stage .n{font-family:var(--mono);font-size:.78rem;color:var(--flow);padding-top:2px;font-variant-numeric:tabular-nums}
.stage .nm{font-weight:600;display:flex;justify-content:space-between;gap:8px;align-items:center}
.stage .rl{color:var(--muted);font-size:.86rem}
.hand{font-size:.8rem;color:var(--muted);padding:0 12px 0 46px}
.hand code{font-family:var(--mono);font-size:.74rem;background:var(--sunk);border-radius:4px;padding:1px 5px}
.panel{position:sticky;top:calc(env(safe-area-inset-top, 0px) + 16px);max-height:calc(100vh - 32px);overflow:auto}
.panel ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px}
.more>summary{cursor:pointer} .more>summary::marker{color:var(--accent)}
.more-body{margin:6px 0 2px;padding:8px 12px;background:var(--sunk);border-radius:6px;display:flex;flex-direction:column;gap:6px;font-size:.9rem}
.rule{border:0;border-top:1px solid var(--line);margin:0;width:100%}
.term{border:0;background:none;padding:0;border-bottom:1.5px dotted var(--accent);cursor:help;text-align:inherit}
.term:hover,.term[aria-expanded="true"]{color:var(--accent)}
.def{display:block;background:var(--accent-soft);border-radius:6px;padding:8px 10px;margin:6px 0 2px;font-size:.88rem;font-weight:400}

/* checks */
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.check{display:flex;flex-direction:column;gap:5px;padding-bottom:10px;border-bottom:1px solid var(--line);min-width:0}
.check:last-child{border-bottom:0;padding-bottom:0}
.check .claim{font-weight:500}
.quote{font-family:var(--mono);font-size:.76rem;line-height:1.5;background:var(--sunk);border-radius:6px;padding:7px 10px;overflow-wrap:anywhere;display:flex;flex-direction:column;gap:4px}
.quote a{font-weight:500;align-self:flex-start}
.note{font-size:.86rem;color:var(--muted)}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:.85rem;font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.grp{display:flex;flex-direction:column;gap:10px}

/* code */
pre.code{font-family:var(--mono);font-size:.76rem;line-height:1.55;background:var(--sunk);border:1px solid var(--line);border-radius:6px;padding:10px 0;margin:0;overflow-x:auto;tab-size:2}
pre.code .l{display:block;padding:0 12px 0 0;white-space:pre}
pre.code .l i{display:inline-block;width:4.2em;padding-right:1em;text-align:right;color:var(--muted);font-style:normal;user-select:none;font-variant-numeric:tabular-nums}
.helpers{display:flex;flex-direction:column;gap:4px;border-left:2px solid var(--line);padding-left:12px}
.helper>summary{cursor:pointer;font-size:.9rem}
.helper>summary::marker{color:var(--accent)}
.helper>summary code{font-family:var(--mono);font-size:.82rem;font-weight:500}
.helper-body{display:flex;flex-direction:column;gap:8px;padding:8px 0 10px}
.ref{display:flex;flex-direction:column;gap:8px;min-width:0}
.ref .ttl{font-weight:600}
.ref p{max-width:72ch}
.refs{display:flex;flex-direction:column;gap:18px}
.tour{display:flex;flex-direction:column;gap:14px}
.tour-h{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.tour-h .n{font-family:var(--mono);font-size:.8rem;color:var(--flow)}
.prose-only{border-left:2px solid var(--line);padding-left:12px;color:var(--muted);font-size:.9rem}

/* ask */
.qs{display:flex;flex-direction:column;gap:6px}
.q{text-align:left;background:var(--sunk);border:1px solid transparent;border-radius:6px;padding:7px 10px;font-size:.88rem}
.q:hover{border-color:var(--accent)}
textarea{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%;min-height:64px;resize:vertical}
.thread{display:flex;flex-direction:column;gap:12px}
.who{font-size:.72rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.txt{white-space:pre-wrap;overflow-wrap:anywhere}
.me .txt{font-weight:500}

/* overview */
.lanes{display:flex;flex-direction:column;gap:12px}
.lane{background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px}
.lane-head{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0}
.tile:hover{border-color:var(--accent)}
.tile b{font-weight:600}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:.88rem;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
thead th{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
td.num,th.num{text-align:right}
td button{background:none;border:0;padding:0;color:var(--accent);font-weight:600;text-align:left}
.gl{margin:0;max-width:760px} .gl dt{font-weight:600;margin-top:12px} .gl dd{margin:2px 0 0}
.prose{max-width:68ch}

@media (max-width:980px){
  .shell{grid-template-columns:minmax(0,1fr);gap:16px}
  .side{position:static;max-height:none;overflow:visible;padding:0}
  .side .navgroup{display:none} .pick{display:block}
  .explore{grid-template-columns:minmax(0,1fr)}
  .panel{position:static;max-height:none}
  h1{font-size:1.4rem}
}

 that lane and reports evidence (commit, tests run, doubts). It re-reads its task at each checkpoint","line":35,"quoteOk":true,"note":"","elsewhere":false},{"node":"integrate","origin":"spec","kind":"step","claim":"Gates green, PR opened (payload: PR)","verdict":"confirmed","file":"docs/agents-detail.md","quote":"that each pass on their own can break when combined. Before opening the lane's PR or integrating it:","line":869,"quoteOk":true,"note":"","elsewhere":false},{"node":"work","origin":"spec","kind":"glossary","claim":"Worktree: An isolated git checkout per worker, so workers never collide.","verdict":"confirmed","file":"docs/agents-detail.md","quote":"- **Lanes work in isolated git worktrees** (`isolation: \"worktree\"`), each branched off the","line":854,"quoteOk":true,"note":"Isolation per lane is stated; the \"never collide\" reason is implied, not written.","elsewhere":false},{"node":"dispatch","origin":"spec","kind":"glossary","claim":"Slot: A worker seat (a model plus a tool) that the orchestrator hands tasks to; its id names the task owner.","verdict":"confirmed","file":"docs/agents-detail.md","quote":"- `slots[].id` is unique kebab-case and doubles as the queue task **owner** while the slot is busy. `harness`","line":933,"quoteOk":true,"note":"","elsewhere":false},{"node":"work","origin":"spec","kind":"glossary","claim":"ff-only: Fast-forward only: the worker proves it starts from the working branch's HEAD, or stops.","verdict":"confirmed","file":"docs/agents-detail.md","quote":"checks `git rev-parse HEAD` against it. A lane that cannot fast-forward stops and reports instead of","line":859,"quoteOk":true,"note":"","elsewhere":false},{"node":"dispatch","origin":"spec","kind":"glossary","claim":"ORCH UPDATE: The orchestrator's steering note on a running worker's task.","verdict":"confirmed","file":"docs/agents-detail.md","quote":"- **Orchestrator → lane:** to steer a running lane (a new finding, a narrowed scope, a bisect result, a changed","line":950,"q rovided; do not guess.","line":16,"quoteOk":true,"note":"","elsewhere":false},{"node":"back","origin":"diagram","kind":"box","claim":"tools/hoist-skill/run emits harness wrappers","verdict":"confirmed","file":"skills/hoist-skill.md","quote":"Wraps `tools/hoist-skill/run` — do not reimplement its logic here.","line":8,"quoteOk":true,"note":"","elsewhere":false},{"node":"back","origin":"diagram","kind":"box","claim":"Differs → sidecar; --from-manifest replays","verdict":"confirmed","file":"skills/hoist-skill.md","quote":"Clobber-safe: unchanged files are skipped, locally edited files become sidecars, `.scaffold-keep` paths are honored.","line":74,"quoteOk":true,"note":"","elsewhere":false},{"node":"back","origin":"diagram","kind":"box","claim":"ref: scaffold tag or commit a hoist is pinned to","verdict":"confirmed","file":"skills/hoist-skill.md","quote":"- **Ref** — optional scaffold ref to stamp in the manifest (`--ref \u003ctag|commit>`, default `main`). Use when the consumer pins to a specific release.","line":18,"quoteOk":true,"note":"","elsewhere":false},{"node":"upstream","origin":"diagram","kind":"box","claim":"RESOLVER: table mapping triggers to skills","verdict":"confirmed","file":"skills/upstream.md","quote":"  - a row in `.claude/skills/RESOLVER.md` with the trigger regex, path and","line":55,"quoteOk":true,"note":"","elsewhere":false},{"node":"upstream","origin":"diagram","kind":"box","claim":"harness: agent tool: Claude Code, Codex, Cursor, agy, pi","verdict":"confirmed","file":"skills/hoist-skill.md","quote":"- **Harness** — `claude` (default), `cursor`, `antigravity`, `codex`, `pi`, or `all`.","line":15,"quoteOk":true,"note":"","elsewhere":false},{"node":"bootstrap","origin":"spec","kind":"step","claim":"Sync script installed (bin/sync-from-scaffold.sh): bootstrap → down","verdict":"confirmed","file":"skills/sync-scaffold.md","quote":"This installs `bin/sync-from-scaffold.sh` but does **not** run the sync automatically.","line":33,"quoteOk":true,"note": .md","quote":"Granularity was confirmed once at plan time; surface an interface change to the user only if it departs from `plan.md`.","line":25,"quoteOk":true,"note":"tdd.md states the two surfacing conditions but never says slices otherwise run without pausing, and it also stops the loop for /investigate on an unexpected failure.","elsewhere":false},{"node":"prep","origin":"spec","kind":"role","claim":"For each slice, decide the interface and list the behaviors to test.","verdict":"confirmed","file":"skills/tdd.md","quote":"- Decide the interface changes and which behaviors to test (prioritize critical paths).","line":25,"quoteOk":true,"note":"","elsewhere":false},{"node":"prep","origin":"spec","kind":"detail","claim":"List behaviors, not implementation steps.","verdict":"confirmed","file":"skills/tdd.md","quote":"- List behaviors to test, not implementation steps.","line":26,"quoteOk":true,"note":"","elsewhere":false},{"node":"prep","origin":"spec","kind":"detail","claim":"Name the assumption the slice tests","verdict":"confirmed","file":"skills/tdd.md","quote":"- Name the assumption and intended outcome this slice tests; use the design's","line":27,"quoteOk":true,"note":"","elsewhere":false},{"node":"prep","origin":"spec","kind":"detail","claim":"Use the design's evidence, or mark it unknown.","verdict":"confirmed","file":"skills/tdd.md","quote":"evidence, or mark it unknown.","line":28,"quoteOk":true,"note":"","elsewhere":false},{"node":"prep","origin":"spec","kind":"detail","claim":"If a probe contradicts the intent, revise the design, PRD and unfinished slices first.","verdict":"confirmed","file":"skills/tdd.md","quote":"If a probe contradicts intent, revise design/PRD","line":28,"quoteOk":true,"note":"","elsewhere":false},{"node":"loop","origin":"spec","kind":"role","claim":"Write one failing test, then the least code that makes it pass, and repeat.","verdict":"confirmed","file":"skills/tdd.md","quote":"Rules: one test at a time, only enough code to pass, don't anticipate future tests.","line":40,"quoteOk":true,"note":"","elsewhere":false},{"node":"loop","origin":"spec","kind":"detail","claim":"The first test is a tracer bullet: one behavior, proving the path works end to end.","verdict":"confirmed","file":"skills/tdd.md","quote":"**Tracer bullet:** write ONE test for ONE behavior → RED → minimal code → GREEN. This proves the path works end-to-end.","line":32,"quoteOk":true,"note":"","elsewhere":false},{"node":"loop","origin":"spec","kind":"detail","claim":"Tests use the public interface only, so they survive an internal refactor.","verdict":"confirmed","file":"skills/tdd.md","quote":"A good test reads like a specification and survives internal refactors","line":9,"quoteOk":true,"note":"","elsewhere":false},{"node":"loop","origin":"spec","kind":"risk","claim":"Writing all tests first verifies imagined behavior; one test at a time keeps them honest.","verdict":"confirmed","file":"skills/tdd.md","quote":"Tests written in bulk verify imagined behavior and become insensitive to real changes.","line":20,"quoteOk":true,"note":"","elsewhere":false},{"node":"loop","origin":"spec","kind":"risk","claim":"A test that fails for a different reason, or an old test that breaks, stops the loop for /investigate.","verdict":"confirmed","file":"skills/tdd.md","quote":"or a previously green test breaks, stop the loop and run `/investigate` to find the root cause before writing more code.","line":42,"quoteOk":true,"note":"","elsewhere":false},{"node":"refactor","origin":"spec","kind":"role","claim":"Score each touched file on the four-part rubric and audit the tests before committing.","verdict":"confirmed","file":"skills/tdd.md","quote":"Score every file touched in this slice against the four rubric dimensions. Emit the score table:","line":59,"quoteOk":true,"note":"","elsewhere":false},{"node":"refactor","origin":"spec","kind":"detail","claim":"Every score must be 10/10","verdict":"partial","file":"skills/tdd.md","quote":"- Do not commit for the integration test suite; it is not a hard requirement of the slice.","elsewhere":false},{"node":"commit","origin":"spec","kind":"role","claim":"Commit the red, green and refactor steps, log the slice, then start the next one.","verdict":"confirmed","file":"skills/tdd.md","quote":"Append to `./docs/\u003cfeature-slug>/tdd-log.md`:","line":88,"quoteOk":true,"note":"","elsewhere":false},{"node":"commit","origin":"spec","kind":"detail","claim":"Commits: test (red), feat (green), and refactor only if something was refactored.","verdict":"confirmed","file":"skills/tdd.md","quote":"refactor(\u003cslug>): slice N — \u003cwhat changed>   # only if refactor happened","line":85,"quoteOk":true,"note":"","elsewhere":false},{"node":"commit","origin":"spec","kind":"detail","claim":"Each slice's status is appended to tdd-log.md.","verdict":"confirmed","file":"skills/tdd.md","quote":"Append to `./docs/\u003cfeature-slug>/tdd-log.md`:","line":88,"quoteOk":true,"note":"","elsewhere":false},{"node":"done","origin":"spec","kind":"role","claim":"Run the full suite, then /code-refiner, then stop for the user's review.","verdict":"confirmed","file":"skills/tdd.md","quote":"When the full test suite is green, run `/code-refiner` in auto-fix mode.","line":119,"quoteOk":true,"note":"","elsewhere":false},{"node":"done","origin":"spec","kind":"detail","claim":"/code-refiner runs in auto-fix mode: correctness and structure reviews, then one fix pass.","verdict":"confirmed","file":"skills/tdd.md","quote":"merges the findings, applies them in one coherent pass, and re-verifies (correctness clear, all rubric dimensions 10/10)","line":119,"quoteOk":true,"note":"","elsewhere":false},{"node":"done","origin":"spec","kind":"detail","claim":"A summary lists what was built, the tests and any deviation from the plan.","verdict":"confirmed","file":"skills/tdd.md","quote":"Then present a summary and stop for review:","line":119,"quoteOk":true,"note":"","elsewhere":false},{"node":"slices","origin":"spec","kind":"step","claim":"Slice size confirmed (payload: plan.md)","verdict":"confirmed","file":"skills/tdd.md","quote":"Granularity was confirmed once at plan time","line":25,"quoteOk":true,"note":"","elsewhere":false},{"node":"prep","origin":"spec","kind":"step","claim":"Behaviors listed (payload: test list)","verdict":"confirmed","file":"skills/tdd.md","quote":"- List behaviors to test, not implementation steps.","line":26,"quoteOk":true,"note":"","elsewhere":false},{"node":"loop","origin":"spec","kind":"step","claim":"Tests green (payload: code + tests)","verdict":"confirmed","file":"skills/tdd.md","quote":"Confirm quality scores — only after GREEN, never while RED","line":38,"quoteOk":true,"note":"","elsewhere":false},{"node":"refactor","origin":"spec","kind":"step","claim":"All 10/10 or surfaced (payload: score table)","verdict":"confirmed","file":"skills/tdd.md","quote":"- Do not commit until all scores are 10/10 or violations are explicitly surfaced.","line":72,"quoteOk":true,"note":"","elsewhere":false},{"node":"commit","origin":"spec","kind":"step","claim":"No slices left (payload: tdd-log.md)","verdict":"partial","file":"skills/tdd.md","quote":"When the full test suite is green, run `/code-refiner` in auto-fix mode.","line":119,"quoteOk":true,"note":"The final stage is gated on all slices passing and the full suite being green; the source does not say tdd-log.md is what is handed to it.","elsewhere":false},{"node":"slices","origin":"spec","kind":"glossary","claim":"Vertical slice: A thin piece of a feature that cuts through every layer and works on its own.","verdict":"partial","file":"skills/tdd.md","quote":"(each cuts through all layers: data → logic → UI → tests)","line":5,"quoteOk":true,"note":"The source says a slice cuts through all layers; it does not say a slice is thin or that it works on its own.","elsewhere":false},{"node":"refactor","origin":"spec","kind":"glossary","claim":"Rubric: Four scores for code: Quality, Readability, Encapsulation, Clarity.","verdict":"confirmed","file":"skills/tdd.md","quote":"| File | Quality | Readability | Encapsulation | Clarity |","line":63,"quoteOk":true,"note":"","elsewhere":false},{"node":"refactor","origin":"spec","kind":"glossary","claim":"Sentinel value: A non-default test value, so a bug that silently resets a field can't hide.","verdict":"confirmed","file":"skills/tdd.md","quote":"a bug that silently resets to the default hides behind matching data.","line":75,"quoteOk":true,"note":"","elsewhere":false},{"node":"loop","origin":"spec","kind":"glossary","claim":"Tracer bullet: The first test, which proves the path works end to end.","verdict":"confirmed","file":"skills/tdd.md","quote":"This proves the path works end-to-end.","line":32,"quoteOk":true,"note":"","elsewhere":false},{"node":"loop","origin":"diagram","kind":"box","claim":"RED: next test, confirm it fails","verdict":"confirmed","file":"skills/tdd.md","quote":"Write next test → confirm it fails","line":36,"quoteOk":true,"note":"","elsewhere":false},{"node":"loop","origin":"diagram","kind":"box","claim":"GREEN: minimal code, confirm it passes","verdict":"confirmed","file":"skills/tdd.md","quote":"Write minimal code to pass → confirm it passes","line":37,"quoteOk":true,"note":"","elsewhere":false},{"node":"commit","origin":"diagram","kind":"box","claim":"More slices? yes → back to stage 2","verdict":"confirmed","file":"skills/tdd.md","quote":"Execute `./docs/\u003cfeature-slug>/plan.md` using TDD, one vertical slice at a time.","line":3,"quoteOk":true,"note":"","elsewhere":false},{"node":"done","origin":"diagram","kind":"box","claim":"Summary, then wait for user review","verdict":"confirmed","file":"skills/tdd.md","quote":"Wait for the user to confirm or request changes.","line":137,"quoteOk":true,"note":"","elsewhere":false},{"node":"refactor","origin":"diagram","kind":"box","claim":"Stage title and legend: REFACTOR confirms quality / check and tidy the code without changing behavior","verdict":"partial","file":"skills/tdd.md","quote":"REFACTOR is a confirmation pass, not a correction pass.","line":48,"quoteOk":true,"note":"The source defines REFACTOR as confirming quality scores, a confirmation pass rather than a tidy-up; 'without changing behavior' is not stated.","elsewhere":false}],"missing":[{"what":"Before writing GREEN code the agent loads the quality rubric and writes to it from the start; neither the spec nor the diagram shows the rubric being applied before REFACTOR.","file":"skills/tdd.md","quote":"**The rubric is the generative voice, not a post-hoc judge.** Before writing GREEN code, load the quality rubric:","line":44,"quoteOk":true},{"what":"The source has an optional integration-test step with its own rules (when to write one, env-var gate, real empty temp directory) that the flow does not show.","file":"skills/tdd.md","quote":"### Integration tests (optional, not always run)","line":95,"quoteOk":true},{"what":"The per-cycle checklist forbids speculative features and anticipating future tests; the flow shows only 'minimal code'.","file":"skills/tdd.md","quote":"- No speculative features added","line":55,"quoteOk":true},{"what":"A green test of the wrong acceptance criterion does not close the gap; the flow shows the revise step but not this rule.","file":"skills/tdd.md","quote":"the wrong acceptance criterion does not close the gap.","line":30,"quoteOk":true}],"summary":"The TDD flow matches skills/tdd.md closely: every stage, gate and commit rule is in the source. The differences are overstatements (\"every score must be 10/10\" although surfaced violations may be committed, a caller-side test presented as required, slices said to run \"without pausing\") and the diagram calling REFACTOR a tidy-up when the source calls it a confirmation pass. The main thing not shown is that the rubric is loaded before GREEN code is written, plus the optional integration-test step.","sourcesRead":["skills/tdd.md"]},"agentic-task-queue":{"checks":[{"node":"ING","origin":" ile":"docs/agentic-task-queue/design.md","quote":"a `pending` or `running` manual task's `contextFiles` is **deferred, re-evaluated","line":167,"quoteOk":true},{"what":"A task can fail directly in the run step (task or validation failure) without going through merge-back or reconciliation: the worktree is deleted and the task is marked failed.","file":"docs/agentic-task-queue/design.md","quote":"8. **Failure:** delete the worktree (no reset needed — the integration branch was","line":416,"quoteOk":true},{"what":"Eligibility is gated by dependencies: no task starts until every dependsOn task is completed.","file":"docs/agentic-task-queue/design.md","quote":"never starts a task until all declared dependencies are `\"completed\"`. The","line":48,"quoteOk":true},{"what":"Selection among eligible tasks is two-tier priority (all high before any default), first-in first-out within a tier.","file":"docs/agentic-task-queue/design.md","quote":"eligible `\"high\"` task is selected before any `\"default\"` task; within a tier,","line":54,"quoteOk":true},{"what":"A stale lease heartbeat returns a running task to pending for another worker; the diagram names the lease but shows no path back to the queue.","file":"docs/agentic-task-queue/design.md","quote":"died — common in ephemeral environments), a sweep returns the task to `pending`","line":212,"quoteOk":true},{"what":"A worker that loses the claim race backs off and picks the next eligible task.","file":"docs/agentic-task-queue/design.md","quote":"assignee** (verify-after-write). If another worker won the race, the loser backs","line":205,"quoteOk":true},{"what":"A failure does not halt the queue; only the failed task's transitive dependents are skipped and reported.","file":"docs/agentic-task-queue/design.md","quote":"still runs. Only the failed task's **transitive dependents** are skipped — their","line":158,"quoteOk":true},{"what":"Reconciliation is itself a new high-priority task put back in the queue, and the original task sits in a reconciling state meanwhile; the diagram draws it as a box inside the execution layer with no return to the store.","file":"docs/agentic-task-queue/design.md","quote":"task `\"reconciling\"` and **enqueue a first-class reconciliation task**","line":131,"quoteOk":true},{"what":"Merges into the integration branch happen one at a time even when tasks run in parallel.","file":"docs/agentic-task-queue/design.md","quote":"- **Integration merges serialize even when execution parallelizes.** Tasks 1–3","line":108,"quoteOk":true}],"summary":"Every box in the diagram and all four merge-back outcomes are stated in design.md. The two write-back arrows are weaker: the design never says a completed issue is closed, and it only implies a failed label through status being mirrored as labels. The diagram leaves out the collision check on automated ingestion, the direct run-step failure path, dependency and priority ordering, and the stale-lease return to pending.","sourcesRead":["docs/agentic-task-queue/design.md"]}}</script>
<script type="application/json" id="code-data">{"add-linter":{"overview":"Detect and Emit are fully code: the tools/linter-setup CLI (run, detect.ts, emit.ts, hash.ts, deps.ts, registry.ts) with templates in lib/linters/. Asking the user, merging a sidecar into an existing config, tuning and committing are all done by the agent from the skill text; the CLI never edits an existing config and has no merge or tune command.","refs":[{"node":"detect","file":"tools/linter-setup/detect.ts","from":34,"to":56,"title":"detect: which languages does the repo use?","explain":"It lists the files git tracks and skips the linter templates and setup tool themselves. Each remaining file extension is looked up in the registry to get a language. A tsconfig.json adds TypeScript even with no .ts files, and when TypeScript is present plain JS is dropped because both would write the same ESLint config.","why":"This is the first half of the Detect stage. The skip list stops scaffold from detecting its own sample configs as languages in use.","kind":"implements","lines":["export function detect(repoPath: string, srcRoot = DEFAULT_SRC_ROOT): DetectResult[] {","  const files = execSync('git ls-files', { cwd: repoPath })","    .toString().trim().split('\\n').filter(Boolean);","","  // Vendored linter templates and setup tooling ship example configs in many","  // languages (e.g. a .credo.exs for Elixir). When scaffold lints itself these","  // would be detected as repo source, so exclude them from language detection.","  const VENDORED = /^(lib\\/linters|tools\\/linter-setup)\\//;","","  const detected = new Set\u003cLanguage>();","  for (const file of files) {","    if (VENDORED.test(file)) continue;","    const lang = extMap.get(extname(file));","    if (lang) detected.add(lang);","  }","","  // A tsconfig.json signals a TypeScript project even when only .js files are","  // tracked (JS-with-checkJs setups), so promote to the ts variant.","  if (existsSync(join(repoPath, 'tsconfig.json'))) detected.add('ts');","","  // ts supersedes js: the ts ESLint config lints plain JS via fall-through, and","  // both variants emit the same eslint.config.mjs — emitting both would collide.","  if (detected.has('ts')) detected.delete('js');"],"uses":["tools/linter-setup/detect.ts#DetectResult","tools/linter-setup/detect.ts#DEFAULT_SRC_ROOT","tools/linter-setup/detect.ts#extMap","tools/linter-setup/registry.ts#Language"]},{"node":"detect","file":"tools/linter-setup/detect.ts","from":58,"to":77,"title":"detect: give each language one of four states","explain":"For each language it looks for the config file named in the registry. No file means none. A file without the scaffold marker line means foreign. With a marker, it compares the hash stamped on that line to the hash of the current template: equal, unstamped or uncomputable means scaffold, and a different hash means stale.","why":"These four states decide what the skill offers: fresh add, merge, re-merge or skip. Treating an unknown hash as current avoids nagging about a config that may be fine.","kind":"implements","lines":["  return Array.from(detected).map(language => {","    const entry = registry[language];","    const configPath = entry.configFile ? join(repoPath, entry.configFile) : null;","    let state: DetectState = 'none';","    if (configPath && existsSync(configPath)) {","      const content = readFileSync(configPath, 'utf8');","      const stamped = stampedHash(content, entry.marker);","      if (stamped === undefined) {","        state = 'foreign';","      } else {","        // Legacy (unstamped) marker or unreachable template → treat as current.","        const current = templateHash(srcRoot, language);","        state = (stamped === null || current === null || stamped === current)","          ? 'scaffold'","          : 'stale';","      }","    }","    return { language, state };","  });","}"],"uses":["tools/linter-setup/detect.ts#DetectState","tools/linter-setup/detect.ts#stampedHash","tools/linter-setup/registry.ts#registry","tools/linter-setup/hash.ts#templateHash"]},{"node":"detect","file":"tools/linter-setup/hash.ts","from":6,"to":18,"title":"templateHash: the stamp that marks staleness","explain":"It finds the language's template config under lib/linters/. It returns the first 12 hex characters of the sha256 of that file. It returns null when the language has no config file or the template cannot be found.","why":"Detect compares this value with the one stamped in the repo's config. It tracks the template, not the user's edits, so tuning a config never makes it stale.","kind":"implements","lines":["// Content hash of a language's pristine scaffold template: first 12 hex chars of","// the sha256 over the template file's bytes. Returns null when the language has","// no config file, or the template is unreachable (graceful degradation — callers","// treat a null current-hash as \"cannot determine staleness\").","const HASH_PREFIX_LEN = 12;","","export function templateHash(srcRoot: string, lang: Language): string | null {","  const entry = registry[lang];","  if (!entry?.configFile) return null;","  const tplPath = join(srcRoot, 'lib', 'linters', lang, entry.configFile);","  if (!existsSync(tplPath)) return null;","  return createHash('sha256').update(readFileSync(tplPath)).digest('hex').slice(0, HASH_PREFIX_LEN);","}"],"uses":["tools/linter-setup/registry.ts#Language","tools/linter-setup/registry.ts#registry"]},{"node":"detect","file":"tools/linter-setup/run","from":38,"to":43,"title":"run --detect-only: print the states as JSON","explain":"When the --detect-only flag is present, the CLI runs detect on the target path and prints the list of language and state pairs as JSON. It then returns without reading stdin or writing any file.","why":"This is the exact command Step 1 runs. The agent parses this JSON and stops when every state is scaffold.","kind":"implements","lines":["async function main() {","  if (detectOnly) {","    const results = await detect(INTO, srcRoot);","    process.stdout.write(JSON.stringify(results, null, 2) + '\\n');","    return;","  }"],"uses":["tools/linter-setup/run#main"]},{"node":"detect","file":"tools/sync/run.ts","from":206,"to":220,"title":"sync: the hint that sends users to /add-linter","explain":"After a real sync (not a dry run) it runs the same detect function on the repo. If any language is not in the scaffold state it prints a hint naming those languages and says to run /add-linter. If detect throws, for example outside a git repo, the hint is skipped.","why":"This is the second way the flow starts. It reuses detect, so the hint and the skill always agree on what needs action.","kind":"implements","lines":["  // Suggest /add-linter for any detected language not yet using scaffold thresholds","  if (!check) {","    try {","      const langs = detect(INTO, srcRoot);","      const actionable = langs.filter(l => l.state !== 'scaffold');","      if (actionable.length > 0) {","        const names = actionable.map(l => l.language).join(', ');","        console.log('');","        console.log(`hint: languages detected without scaffold linter config: ${names}`);","        console.log('  Run /add-linter to add quality thresholds for each language.');","      }","    } catch {","      // non-fatal: skip hint if detect fails (e.g. not a git repo)","    }","  }"],"uses":["tools/sync/run.ts#check","tools/sync/run.ts#srcRoot","tools/sync/run.ts#INTO","tools/linter-setup/detect.ts#detect"]},{"node":"emit","file":"tools/linter-setup/run","from":45,"to":68,"title":"run: read the confirmed list and emit each language","explain":"Without --detect-only the CLI reads stdin and exits with an error if it is empty or not a JSON array. It then calls emit once per language in the list, and exits with an error if any emit throws.","why":"This is the hand-off from Ask to Emit: only languages the user confirmed are in the list. The CLI itself does not ask anyone anything.","kind":"implements","lines":["  const raw = await readStdin();","  if (!raw) {","    console.error('linter-setup: expected confirmed languages JSON on stdin');","    console.error('  Example: echo \\'[\"js\",\"python\"]\\' | linter-setup --into /path/to/repo');","    process.exit(1);","  }","","  let languages;","  try {","    languages = JSON.parse(raw);","    if (!Array.isArray(languages)) throw new Error('expected array');","  } catch (e) {","    console.error(`linter-setup: invalid JSON on stdin — ${e.message}`);","    process.exit(1);","  }","","  for (const lang of languages) {","    let result;","    try {","      result = await emit(lang, INTO, srcRoot);","    } catch (e) {","      console.error(`linter-setup: emit failed for ${lang} — ${e.message}`);","      process.exit(1);","    }"],"uses":[]},{"node":"emit","file":"tools/linter-setup/emit.ts","from":49,"to":86,"title":"emit: write, skip, or write a sidecar","explain":"For the config, the workflow and any extra files, it finds the template and the destination. If the destination exists and already has the scaffold marker, it is skipped. If it exists without the marker, the template is written beside it as \u003cfile>.scaffold-new and the original is not touched. If nothing is there, the file is written; a new Prettier config also becomes a sidecar when the repo already has another Prettier setup.","why":"This is the rule that the CLI never edits an existing config. Without the sidecar branch, a user's own lint rules would be overwritten.","kind":"enforces","lines":["  for (const { src, dest } of files) {","    const srcPath = join(srcDir, src);","    const destPath = join(targetRepo, dest);","","    if (!existsSync(srcPath)) continue;","","    mkdirSync(dirname(destPath), { recursive: true });","","    // The config file gets its marker hash-stamped; workflows are copied verbatim.","    const isConfig = entry.configFile && src === entry.configFile;","    const write = (to: string): void => {","      if (isConfig && hash) {","        writeFileSync(to, stampMarker(readFileSync(srcPath, 'utf8'), entry.marker, hash));","      } else {","        copyFileSync(srcPath, to);","      }","    };","","    if (src === '.prettierrc.json' && !existsSync(destPath) && alternateFormatter(targetRepo)) {","      write(`${destPath}.scaffold-new`);","      sidecars.push(dest);","      continue;","    }","","    if (existsSync(destPath)) {","      const existing = readFileSync(destPath, 'utf8');","      if (existing.includes(entry.marker)) {","        skipped.push(dest);","        continue;","      }","      write(`${destPath}.scaffold-new`);","      sidecars.push(dest);","      continue;","    }","","    write(destPath);","    written.push(dest);","  }"],"uses":["tools/linter-setup/emit.ts#stampMarker","tools/linter-setup/emit.ts#alternateFormatter"]},{"node":"emit","file":"tools/linter-setup/emit.ts","from":15,"to":19,"title":"stampMarker: put the template hash on the marker line","explain":"When a config is written, the first occurrence of the marker comment is replaced with the marker followed by sha256: and the template hash. Workflows and extra files are copied without a stamp.","why":"Detect later reads this stamp to tell a current scaffold config from a stale one. The Merge step must carry this line over by hand for the same reason.","kind":"implements","lines":["// Stamp the template hash into the config's marker line, so detection can later","// tell a current scaffold config from a stale one. First occurrence only.","function stampMarker(content: string, marker: string, hash: string): string {","  return content.replace(marker, `${marker} sha256:${hash}`);","}"],"uses":[]},{"node":"emit","file":"tools/linter-setup/emit.ts","from":88,"to":95,"title":"emit: add packages and scripts only when the config is adopted","explain":"A config counts as adopted when the language has one and it did not end up as a sidecar. Only then does emit call the two package.json merges for devDependencies and scripts. For a sidecar both results are returned with status sidecar and nothing is added.","why":"This keeps packages out of package.json until the user has actually taken the config. The agent adds them later when it applies a merge.","kind":"enforces","lines":["  // Add devDependencies only once the config is actually adopted — i.e. it was","  // written fresh or was already current. A sidecar means the consumer hasn't","  // merged our config yet, so injecting deps would be premature.","  const adopted = Boolean(entry.configFile) && !sidecars.includes(entry.configFile ?? '');","  const deps: MergeResult = adopted ? mergeDevDependencies(targetRepo, language) : { added: [], status: 'sidecar' };","  const scripts: MergeResult = adopted ? mergeScripts(targetRepo, language) : { added: [], status: 'sidecar' };","","  return { written, skipped, sidecars, deps, scripts };"],"uses":["tools/linter-setup/deps.ts#MergeResult","tools/linter-setup/deps.ts#mergeDevDependencies","tools/linter-setup/deps.ts#mergeScripts"]},{"node":"emit","file":"tools/linter-setup/deps.ts","from":29,"to":57,"title":"mergeInto: add missing package.json entries, change nothing else","explain":"It returns early if there is nothing to add, no package.json, or the file does not parse. It collects the names already present (for packages, in both dependencies and devDependencies). Each missing name is appended; present names are left as they are. If anything was added, the file is rewritten with its original indentation and trailing newline.","why":"This is why running the CLI twice is safe and why an existing version or lint script is never changed.","kind":"implements","lines":["// Shared merge engine: idempotently add entries to a package.json section.","// For devDependencies, also checks dependencies to avoid duplicates.","// Returns { added, status } — same shape for both public exports below.","function mergeInto(targetRepo: string, section: Section, entries: Record\u003cstring, string>): MergeResult {","  if (!entries || Object.keys(entries).length === 0) return { added: [], status: 'none' };","  const pkgPath = join(targetRepo, 'package.json');","  if (!existsSync(pkgPath)) return { added: [], status: 'no-package-json' };","  const raw = readFileSync(pkgPath, 'utf8');","  let pkg: PackageJson;","  try { pkg = JSON.parse(raw) as PackageJson; } catch { return { added: [], status: 'unparsable' }; }","","  const present = section === 'devDependencies'","    ? new Set([...Object.keys(pkg.dependencies ?? {}), ...Object.keys(pkg.devDependencies ?? {})])","    : new Set(Object.keys(pkg.scripts ?? {}));","","  const target = (pkg[section] ?? {}) as Record\u003cstring, string>;","  const added: string[] = [];","  for (const [name, val] of Object.entries(entries)) {","    if (present.has(name)) continue;","    target[name] = val;","    added.push(name);","  }","  if (added.length === 0) return { added: [], status: 'satisfied' };","","  pkg[section] = target as never;","  const trailingNL = raw.endsWith('\\n') ? '\\n' : '';","  writeFileSync(pkgPath, JSON.stringify(pkg, null, detectIndent(raw)) + trailingNL);","  return { added, status: 'written' };","}"],"uses":["tools/linter-setup/deps.ts#PackageJson","tools/linter-setup/deps.ts#MergeResult","tools/linter-setup/deps.ts#detectIndent","tools/linter-setup/deps.ts#Section"]},{"node":"emit","file":"tools/linter-setup/registry.ts","from":63,"to":71,"title":"registry: the TypeScript lint scripts","explain":"The registry entry for TypeScript lists the scripts added on adopt: lint, format:check, format and lint:fix. lint:fix runs the ESLint autofix and then tsc --noEmit.","why":"The skill forbids a bare autofix on a type-aware config. Shipping the type-check inside the script makes the safe form the default.","kind":"implements","lines":["    // package.json scripts added on adopt. Type-aware autofix can rewrite code","    // in ways tsc rejects, so `lint:fix` re-runs `tsc --noEmit` as the gate —","    // the fix is only trustworthy if the type-checker still passes.","    scripts: {","      lint: 'eslint . --max-warnings 0',","      'format:check': 'prettier . --check',","      format: 'prettier . --write',","      'lint:fix': 'eslint . --fix && tsc --noEmit',","    },"],"uses":[]},{"node":"emit","file":"tools/linter-setup/run","from":70,"to":80,"title":"run: one result line per file","explain":"After each emit the CLI prints a line for every written file, every sidecar (marked original unchanged) and every skipped file. It prints the packages it added with a reminder to run npm install, or the npm i -D command to run by hand when there is no package.json. Added scripts are not printed.","why":"The agent builds its Step 6 report from these lines. The merged, tuned and declined rows of that report have no CLI output and come from the agent.","kind":"implements","lines":["    for (const f of result.written)   console.log(`  written   ${lang}  ${f}`);","    for (const f of result.sidecars)  console.log(`  sidecar   ${lang}  ${f}  (original unchanged)`);","    for (const f of result.skipped)   console.log(`  skipped   ${lang}  ${f}  (scaffold already present)`);","","    const deps = result.deps;","    if (deps?.added.length) {","      console.log(`  deps      ${lang}  package.json += ${deps.added.join(', ')}  (run npm install)`);","    } else if (deps?.status === 'no-package-json') {","      const names = Object.keys(registry[lang]?.devDependencies ?? {}).join(' ');","      console.log(`  deps      ${lang}  no package.json — install manually: npm i -D ${names}`);","    }"],"uses":[]},{"node":"emit","file":"tools/linter-setup/test","from":230,"to":243,"title":"Test: an existing config is left alone","explain":"The test writes its own eslint.config.mjs into a temporary repo and runs emit for JS. It then checks the file is byte-for-byte unchanged and that eslint.config.mjs.scaffold-new now exists beside it.","why":"It pins the promise the Merge stage depends on: the original and the sidecar both exist for the agent to compare.","kind":"tests","lines":["// emit: conflict → sidecar written, original untouched","{","  const dir = makeTmp();","  const existing = 'export default []; // existing config\\n';","  writeFileSync(join(dir, 'eslint.config.mjs'), existing);","  await emit('js', dir, srcRoot);","  const original = readFileSync(join(dir, 'eslint.config.mjs'), 'utf8');","  original === existing","    ? ok('emit: original untouched on conflict')","    : fail_('emit: original was overwritten on conflict');","  existsSync(join(dir, 'eslint.config.mjs.scaffold-new'))","    ? ok('emit: sidecar written on conflict')","    : fail_('emit: sidecar not written on conflict');","}"],"uses":["tools/linter-setup/test#makeTmp"]}],"promptOnly":[{"node":"ask","what":"The agent asks one multi-select question covering every language with state none, foreign or stale, and stops if the user confirms none."},{"node":"merge","what":"The agent reads the config and its .scaffold-new sidecar, proposes a merge that keeps the user's values and the stamped marker line, shows the diff and conflicts, and on approval backs up to .bak, writes and removes the sidecar."},{"node":"finish","what":"The agent proposes tuning values from the repo's code, reports per language, and offers the commit while leaving out .bak and .scaffold-new files; nothing in the repo blocks those files from being committed."}]},"council":{"overview":"The council runs entirely as agent-followed prose: framing the brief, spawning the five advisors, anonymizing for peer review and writing the verdict have no code behind them, and the optional Jev mode has no script in this repo either. The only council-specific code is scripts/test-council-skill.sh, which greps skills/council.md so the key instructions cannot be deleted unnoticed, plus the thin wrapper that carries the trigger description. That test runs through npm test (test:shell) in CI; it checks the wording of the skill, not how a council actually behaves.","refs":[{"node":"ask","file":".claude/skills/council/SKILL.md","from":1,"to":5,"title":"Claude wrapper: the trigger description","explain":"The frontmatter holds one description line that names the five advisors, the three rounds, and the trigger phrases 'council this', 'pressure-test this' and 'should I X or Y'. It also says not to use it for factual or low-stakes questions. The last line includes the canonical body skills/council.md.","why":"This description is what the harness reads to decide whether an owner's question should start a council. The decision itself is the model's judgement; there is no code that classifies the question.","kind":"implements","lines":["---","description: Run a high-stakes decision through a council of five persona-diverse advisors (Contrarian, First-Principles, Expansionist, Outsider, Executor) in parallel, then anonymized peer review, then a chairman synthesis of where they agree, clash, and what to do. Use for real tradeoffs (\"council this\", \"pressure-test this\", \"should I X or Y\"), not factual or low-stakes questions.","---","","@../../../skills/council.md"],"uses":[]},{"node":"ask","file":"scripts/test-council-skill.sh","from":44,"to":47,"title":"test: the when-not-to-use guard stays in the skill","explain":"It greps skills/council.md, ignoring case, for 'not use', 'do not use', 'factual' or 'low-stakes'. A match counts as a pass and no match counts as a failure.","why":"The first stage says factual and low-stakes questions skip the council. This test only pins that the skill still says so; it would pass if any one of those words remained.","kind":"tests","lines":["","# When NOT to use guard (avoid ceremony on factual/low-stakes)","grep -qiE 'not use|do not use|factual|low.?stakes' \"$SKILL\" \\","  && ok \"when-not-to-use guard present\" || fail \"when-not-to-use guard missing\""],"uses":["scripts/test-council-skill.sh#fail"]},{"node":"ask","file":"scripts/test-council-skill.sh","from":49,"to":59,"title":"test: council is wired into wrapper, manifest and RESOLVER","explain":"It checks that the Claude wrapper includes skills/council.md. It checks that each of the five council files is listed in .github/scaffold-files.txt. It checks that RESOLVER.md has a row for council.","why":"An owner can only reach the council if the skill is routed and shipped. Without the RESOLVER row or manifest entries the trigger phrases would lead nowhere in a consumer repo.","kind":"tests","lines":["# Wrapper + manifest + resolver wiring","grep -q '@../../../skills/council.md' \"$CLAUDE_WRAPPER\" \\","  && ok \"Claude wrapper @-includes skill body\" || fail \"Claude wrapper missing @-include\"","","for path in 'skills/council.md' '.claude/skills/council/SKILL.md' '.cursor/rules/council.mdc' '.agents/skills/council/SKILL.md' '.agent/workflows/council.md'; do","  grep -qF \"$path\" \"$MANIFEST\" \\","    && ok \"manifest lists $path\" || fail \"manifest missing $path\"","done","","grep -q '| council |' .claude/skills/RESOLVER.md \\","  && ok \"RESOLVER.md has council entry\" || fail \"RESOLVER.md missing council entry\""],"uses":["scripts/test-council-skill.sh#fail","scripts/lib/skill-test.sh#has"]},{"node":"advisors","file":"scripts/test-council-skill.sh","from":18,"to":22,"title":"test: all five advisor lenses are named","explain":"It loops over the five persona names and greps skills/council.md for each one. Each name found is a pass; a missing name is a failure.","why":"The Five advisors stage depends on five fixed lenses that are built to disagree. This stops an edit from dropping one of them from the skill text.","kind":"tests","lines":["# The five advisor personas must all be present","for persona in Contrarian 'First-Principles' Expansionist Outsider Executor; do","  grep -q \"$persona\" \"$SKILL\" \\","    && ok \"advisor persona present: $persona\" || fail \"advisor persona missing: $persona\"","done"],"uses":["scripts/test-council-skill.sh#fail"]},{"node":"advisors","file":"scripts/test-council-skill.sh","from":24,"to":35,"title":"test: parallel, isolated, peer-reviewed, chaired","explain":"Four greps over skills/council.md, in order: 'parallel' or 'concurrent'; 'peer review' or 'anonymize'; 'chairman'; and 'isolated subagent' or 'isolated context'. Each is counted as a pass or a failure.","why":"These are the mechanics of the advisors, peer review and chairman stages. The test proves the instructions exist in the skill; it cannot check that a real run spawned isolated subagents or shuffled the labels.","kind":"tests","lines":["# Core mechanics","grep -qiE 'parallel|concurrent' \"$SKILL\" \\","  && ok \"advisors run in parallel\" || fail \"parallel advisor execution not described\"","","grep -qiE 'peer review|anonymize|anonymized' \"$SKILL\" \\","  && ok \"anonymized peer review described\" || fail \"peer review round not described\"","","grep -qi 'chairman' \"$SKILL\" \\","  && ok \"chairman synthesis described\" || fail \"chairman synthesis not described\"","","grep -qiE 'isolated subagent|isolated context' \"$SKILL\" \\","  && ok \"isolated-subagent execution described\" || fail \"isolated-subagent model not described\""],"uses":["scripts/test-council-skill.sh#fail"]},{"node":"chair","file":"scripts/test-council-skill.sh","from":37,"to":43,"title":"test: the verdict keeps its required sections","explain":"It greps skills/council.md for 'Where the council agrees', then 'Where the council clashes', then 'one thing to do first' or 'do first'. Each is a pass or a failure.","why":"The chairman must show agreement, real disagreement and a single first step. This pins those headings in the output template so the verdict format is not thinned out by an edit.","kind":"tests","lines":["# Chairman output structure","grep -qi 'Where the council agrees' \"$SKILL\" \\","  && ok \"output: agreements section\" || fail \"output missing agreements section\"","grep -qi 'Where the council clashes' \"$SKILL\" \\","  && ok \"output: clashes section\" || fail \"output missing clashes section\"","grep -qiE 'one thing to do first|do first' \"$SKILL\" \\","  && ok \"output: concrete next step\" || fail \"output missing concrete next step\""],"uses":["scripts/test-council-skill.sh#fail"]}],"promptOnly":[{"node":"brief","what":"The main agent scans the repo for context and writes a neutral brief with the decision, options, constraints, success criteria and the trade space; nothing checks the brief."},{"node":"review","what":"The agent relabels the five answers A to E in random order and gives them to five reviewers with three questions; no code does the shuffle or the dispatch, and the test only checks that the skill text mentions peer review."}]},"feature-chain":{"overview":"The chain itself is prose: skills/feature-chain.md tells the agent which skill to run next, and no script detects the entry point, writes design.md, prd.md or plan.md, or moves between phases. Code appears in three places: scripts/queue-model.ts carries a queued task's \"chain\" mode and architecture mode into the worker prompt, the commit hook and scripts/check-quality-mechanical.sh gate the commits and the refine step, and the queue delivery code plus CI and scripts/check-handoff.ts guard the final review and merge.","refs":[{"node":"design","file":"scripts/queue-model.ts","from":44,"to":65,"title":"Architecture modes and the guidance text for each","explain":"Defines the three modes: builder-led, collaborative and model-led, with collaborative as the default. parseArchitecture throws on any other value. architectureGuidance returns the sentence for the mode and appends that validation, security and compatibility checks stay mandatory and release authority is unchanged.","why":"skills/feature-chain.md names this file as the source for how much of the technical design the agent owns versus asks the builder. It keeps the mode from being read as permission to skip checks or to merge.","kind":"implements","lines":["export const ARCHITECTURE_MODES = ['builder-led', 'collaborative', 'model-led'] as const;","export type ArchitectureMode = typeof ARCHITECTURE_MODES[number];","export const DEFAULT_ARCHITECTURE: ArchitectureMode = 'collaborative';","","/** The task dial allocates architectural contribution, never validation or release authority. */","export function parseArchitecture(value: string): ArchitectureMode {","  if (!(ARCHITECTURE_MODES as readonly string[]).includes(value)) {","    throw new Error(`architecture: expected ${ARCHITECTURE_MODES.join('|')}; got ${value}`);","  }","  return value as ArchitectureMode;","}","","const ARCHITECTURE_GUIDANCE: Record\u003cArchitectureMode, string> = {","  'builder-led': \"Follow the builder's supplied architecture; surface risks and conflicts with executable contracts before changing it.\",","  collaborative: 'Propose architectural tradeoffs; ask only unresolved product or risk questions, using source and executable contracts as evidence.',","  'model-led': 'Own architectural investigation, decisions and checks; the builder focuses on UX and product intent. Resolve technical design without requiring the builder to act as architect.',","};","","export function architectureGuidance(mode: ArchitectureMode): string {","  return ARCHITECTURE_GUIDANCE[parseArchitecture(mode)]","    + ' In every mode, validation, security and compatibility checks remain mandatory; release authority is unchanged.';","}"],"uses":[]},{"node":"design","file":"scripts/queue-model.ts","from":863,"to":876,"title":"taskBlock: the prompt block a queue worker receives","explain":"Builds the text a worker gets for one task. The first line says \"mode: chain\" with the phase order, or \"mode: direct\". It then adds the architecture mode and its guidance, the docs/\u003cslug>/ folder, the acceptance text, files, contracts and validate command when set, and wraps it all in a queue_task tag.","why":"This is how a queued task starts the chain and tells the worker which docs/\u003cslug>/ folder to look in for existing artifacts. The worker still has to follow the skill text; this code only delivers the instruction.","kind":"implements","lines":["/** The prompt block a worker receives for a task (tick/claim). */","export function taskBlock(t: Task): string {","  const spec = [","    t.mode === 'chain' ? 'mode: chain (design→prd→plan→tdd→refine, autonomous, no questions)' : 'mode: direct',","    `architecture: ${t.architecture}`,","    architectureGuidance(t.architecture),","    t.slug ? `slug: docs/${t.slug}/` : '',","    t.accept ? `accept: ${t.accept}` : '',","    t.files.length ? `files: ${t.files.join(', ')}` : '',","    t.contracts.length ? `contracts: ${t.contracts.join(', ')}` : '',","    t.validate ? `validate: ${t.validate}` : '',","  ].filter(Boolean).join('\\n');","  return `\u003cqueue_task id=\"${t.id}\">\\n${t.title}\\n${spec}\\n\u003c/queue_task>`;","}"],"uses":["scripts/queue-model.ts#architectureGuidance","scripts/queue-model.ts#Task"]},{"node":"tdd","file":".githooks/pre-commit","from":28,"to":41,"title":"pre-commit hook: mechanical check, typecheck, skill routing gate","explain":"Runs on every git commit once core.hooksPath points at .githooks. It runs the mechanical quality check on the staged files, then tsc --noEmit if a tsconfig.json exists, then check-resolvable.ts and the skills-doc freshness check. The script runs under set -eu, so the first failing step aborts the commit.","why":"The TDD phase commits per slice, and the refiner fixes are committed after it. With the hook enabled each of those commits must pass the mechanical check and the typecheck; nothing checks the red/green order or tdd-log.md.","kind":"enforces","lines":["if [ -f scripts/check-quality-mechanical.sh ]; then","  bash scripts/check-quality-mechanical.sh --staged","fi","","if [ -f tsconfig.json ]; then","  if [ -x node_modules/.bin/tsc ]; then","    node_modules/.bin/tsc --noEmit","  else","    echo \"pre-commit: tsconfig.json present but tsc not installed — skipping (install deps, e.g. npm ci)\" >&2","  fi","fi","","if [ -f scripts/check-resolvable.ts ]; then node scripts/check-resolvable.ts; fi","if [ -f scripts/update-skills-doc.ts ]; then node scripts/update-skills-doc.ts --check; fi"],"uses":[".githooks/pre-commit#staged"]},{"node":"refine","file":"package.json","from":9,"to":14,"title":"package.json: what \"the full suite\" runs","explain":"npm test chains four scripts. test:node runs every *.test.ts under scripts/, tools/ and lib/ with node --test. test:tools runs each tool's own test file, test:shell runs every scripts/test-*.sh, and test:checks runs the repo checks. test:integration is separate and is not part of npm test.","why":"Refine starts only \"when the full test suite passes\". These scripts define that suite for this repo.","kind":"implements","lines":["    \"test\": \"npm run test:node && npm run test:tools && npm run test:shell && npm run test:checks\",","    \"test:node\": \"node --test --test-concurrency=1 'scripts/**/*.test.ts' 'tools/**/*.test.ts' 'lib/**/*.test.ts'\",","    \"test:tools\": \"tools/hoist-skill/test && tools/sync/test && node tools/linter-setup/test && node tools/dependency-watch/test\",","    \"test:shell\": \"for f in scripts/test-*.sh; do [ \\\"$f\\\" = scripts/test-read-once.sh ] || bash \\\"$f\\\" || exit 1; done\",","    \"test:checks\": \"node scripts/check-resolvable.ts --strict && node scripts/update-skills-doc.ts --check && node scripts/check-agents-detail.ts && node scripts/check-handoff.ts && node scripts/check-guidelines.ts && node scripts/render-explorer-pages.ts --check && node scripts/render-diagrams.ts --check\",","    \"test:integration\": \"RUN_INTEGRATION=1 tools/hoist-skill/test-integration && RUN_INTEGRATION=1 tools/sync/test-integration && RUN_INTEGRATION=1 tools/linter-setup/test-integration\","],"uses":[]},{"node":"refine","file":"scripts/check-quality-mechanical.sh","from":63,"to":73,"title":"check_file: the 500-line file length check","explain":"Counts the lines in the file with wc -l. If the count is over MAX_LINES (500) and the file has no \"quality-ok: file-length\" pragma, it emits a Readability/major violation with the file name. Each emit adds one to VIOLATIONS, which makes the script exit non-zero at the end.","why":"/code-refiner must end with every rubric score at 10/10, and mechanical violations cannot be overridden. This is one of the three rubric rules a script decides rather than the reviewer agents.","kind":"enforces","lines":["  # File length. A `quality-ok: file-length — \u003creason>` pragma anywhere in the file","  # (by convention on the first non-shebang line) blesses a genuinely cohesive file","  # that reads as one unit and would only be fragmented by a split. Like the","  # magic-number pragma, the keyword is the gate; the required reason is enforced at","  # review time, not parsed here. Commented-out-code has no such escape hatch.","  local count","  count=$(wc -l \u003c \"$file\")","  if [ \"$count\" -gt \"$MAX_LINES\" ] \\","     && ! grep -Eq '(#|//)[[:space:]]*quality-ok:[[:space:]]*file-length' \"$file\"; then","    emit \"${file}:${MAX_LINES} [Readability/major] file is ${count} lines — exceeds ${MAX_LINES}-line limit; split into cohesive modules (or add a 'quality-ok: file-length — \u003creason>' pragma if it is one cohesive unit)\"","  fi"],"uses":["scripts/check-quality-mechanical.sh#emit","scripts/lib/skill-test.sh#has"]},{"node":"refine","file":".github/workflows/quality.yml","from":11,"to":21,"title":"Quality Gate workflow: mechanical checks on all tracked source","explain":"On every pull request the job lists all tracked js, mjs, ts, tsx, sh, py, rb and go files with git ls-files. It passes the whole list to check-quality-mechanical.sh. Any violation makes the script exit 1, which fails the job.","why":"Re-runs the mechanical rubric rules on the PR. If the refiner pass left a mechanical violation, this job fails even though the agents reported 10/10.","kind":"enforces","lines":["  mechanical:","    name: Mechanical checks","    runs-on: ubuntu-latest","    steps:","      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5","        with:","          persist-credentials: false","      - name: Run mechanical quality checks (all files)","        run: |","          mapfile -t FILES \u003c \u003c(git ls-files | grep -E '\\.(js|mjs|ts|tsx|sh|py|rb|go)$' || true)","          [ ${#FILES[@]} -gt 0 ] && bash scripts/check-quality-mechanical.sh \"${FILES[@]}\""],"uses":[]},{"node":"qa","file":"scripts/test-qa-skill.sh","from":25,"to":29,"title":"test-qa-skill.sh: feature-chain must run /qa and report it","explain":"Greps skills/qa.md for the \"QA found\" summary line. Then it greps skills/feature-chain.md for \"/qa\" and for \"QA\". finish prints the totals and returns non-zero if any assertion failed.","why":"The QA phase is done by the agent driving the real app. This test only keeps the chain wired to /qa and the QA line in the final summary; without it an edit could drop the step unnoticed.","kind":"tests","lines":["has \"$S\" 'QA found'                             \"one-line summary for PR body\"","has skills/feature-chain.md '/qa'               \"feature-chain runs /qa\"","has skills/feature-chain.md 'QA'                \"feature-chain Phase 4 summary reports QA\"","","finish"],"uses":["scripts/lib/skill-test.sh#has","scripts/lib/skill-test.sh#finish"]},{"node":"review","file":".github/workflows/ci.yml","from":12,"to":24,"title":"CI job \"verify\": npm test on every PR to main","explain":"On a pull request to main the job checks out the code, installs the Node version named in .node-version, runs npm ci, and then runs npm test. A failing test fails the job.","why":"When the agent has merge authority it must validate the PR first. This job is the hosted run of the full suite on that PR.","kind":"enforces","lines":["  verify:","    runs-on: ubuntu-latest","    env:","      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true","    steps:","      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5","        with:","          persist-credentials: false","      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5","        with:","          node-version-file: .node-version","      - run: npm ci","      - run: npm test"],"uses":[]},{"node":"review","file":"scripts/queue-model.ts","from":750,"to":761,"title":"selectDelivery and deliveryAllows: one task per delivery cycle","explain":"selectDelivery records a task id as the current delivery task, unless the queue is in batch mode or one is already recorded. deliveryAllows then answers whether a task may be claimed: always in batch mode, otherwise only when no task is selected or the task is the selected one.","why":"For a queued chain task the review phase \"gates the next independent task\" until its PR cycle ends. This is that gate: other tasks are not eligible while one delivery is open.","kind":"enforces","lines":["/** Persist the current cycle independently of task status and archive lifetime. */","export function selectDelivery(q: Queue, id: string): Queue {","  return q.config.deliveryMode === 'batch' || q.config.deliveryTask ? q","    : setConfig(q, { deliveryTask: id, deliveryAccepted: false });","}","","/** Admission gate shared by selectors and explicit claim surfaces. */","export function deliveryAllows(q: Queue, id: string): boolean {","  if (q.config.deliveryMode === 'batch') return true;","  const selected = q.config.deliveryTask || q.tasks.find(t => t.status === 'active')?.id;","  return !selected || selected === id;","}"],"uses":["scripts/queue-model.ts#Queue","scripts/queue-model.ts#setConfig"]},{"node":"review","file":"scripts/queue.ts","from":120,"to":125,"title":"Dispatch guard: DELIVERY PENDING","explain":"Before dispatching, if the queue is not in batch mode, a delivery task is recorded and nothing else is actionable, it prints DELIVERY PENDING with the task id and returns the DELIVERY exit code. Otherwise it returns with no block.","why":"A finished chain task without merge authority leaves its PR waiting for the owner. This message is what a drain loop sees instead of the next task.","kind":"enforces","lines":["  if (q.config.deliveryMode !== 'batch' && q.config.deliveryTask && !nextActionable(q)) {","    console.log(`queue: DELIVERY PENDING — ${q.config.deliveryTask}; finish its PR/merge cycle and fresh branch, then advance`);","    return { queue: q, blocked: EXIT.DELIVERY };","  }","  return { queue: q, blocked: null };","}"],"uses":["scripts/queue.ts#EXIT","scripts/queue-io.ts#log","scripts/queue-model.ts#nextActionable"]},{"node":"review","file":"scripts/queue-delivery.ts","from":9,"to":27,"title":"queue advance: close the delivery cycle after the merge","explain":"cmdAdvance refuses unless the id is the selected delivery task, that task is done and accepted, no task is active, --pr looks like a pull request URL and --branch is not empty. On success it clears deliveryTask and deliveryAccepted, saves the queue and logs the PR and the fresh branch. Its own comment says it records what the root vouches for and does not check the remote.","why":"The chain ends with \"confirm the merge and cut a fresh branch before the next task\". This command is the only way to reopen dispatch, and it makes the orchestrator name the merged PR and the new branch.","kind":"enforces","lines":["/**"," * `queue advance \u003cid> --pr \u003curl> --branch \u003cfresh>` — an audited attestation, not a"," * remote check: the queue verifies its own state (selected task completed and"," * accepted, no active claims) and records the PR and fresh branch the root vouches for."," */","export function cmdAdvance(q: Queue, id: string, pr: string, branch: string): number {","  const task = q.tasks.find(t => t.id === id);","  if (!id || q.config.deliveryTask !== id || !q.config.deliveryAccepted || (task && task.status !== 'done')","      || q.tasks.some(t => t.status === 'active')","      || !MERGED_PR_URL.test(pr) || !branch.trim()) {","    console.error('advance: requires selected completed task, no active claims, --pr \u003cmerged-pr-url> and --branch \u003cfresh-working-branch>');","    return 1;","  }","  const advanced = setConfig(q, { deliveryTask: '', deliveryAccepted: false });","  save(advanced);","  log(`advance ${id}: root attests authorized validated merge ${pr}; fresh branch ${branch}`);","  console.log(`delivery acknowledged for ${id}; external merge/validation evidence is root-owned${drainKick(advanced)}`);","  return 0;","}"],"uses":["scripts/queue-delivery.ts#MERGED_PR_URL","scripts/queue-io.ts#save","scripts/queue-io.ts#log","scripts/queue-model.ts#Queue","scripts/queue-model.ts#setConfig","scripts/queue-gates.ts#drainKick"]},{"node":"review","file":"scripts/check-handoff.ts","from":48,"to":61,"title":"check-handoff.ts --pre-merge: no handoff file on the head to merge","explain":"preMerge returns an error when .pause/handoff.md still exists, with the git rm command that clears it. The CLI block below it picks preMerge when --pre-merge is passed, prints each error, and exits 1 if there is one.","why":"A merge to main must not carry a session handoff file. The orchestrator runs this on the head it merges; without it a later /resume on main could act on a stale handoff.","kind":"enforces","lines":["/** Errors when a handoff would ride a merge into main. */","export function preMerge(path: string): string[] {","  return existsSync(path) ? [`handoffs live only on branches; clear it before merging to main: git rm ${path} && git commit -m \"chore: clear handoff before merge\"`] : [];","}","","if (import.meta.url === `file://${process.argv[1]}`) {","  const args = process.argv.slice(2);","  const mergeMode = args.includes('--pre-merge');","  const path = args.find(a => a !== '--pre-merge') ?? '.pause/handoff.md';","  const errors = mergeMode ? preMerge(path) : existsSync(path) ? check(readFileSync(path, 'utf8')) : [];","  for (const e of errors) console.error(`check-handoff: ${path}: ${e}`);","  if (errors.length) process.exit(1);","  console.log(`check-handoff: OK (${existsSync(path) ? path : `no ${path}`})`);","}"],"uses":["scripts/check-handoff.ts#check"]}],"promptOnly":[{"node":"prd","what":"The agent runs /to-prd: it reads design.md and the codebase, confirms with the owner which modules need tests, writes prd.md and commits it, with no script involved."}]},"investigate":{"overview":"/investigate is prose only: every stage is the agent following skills/investigate.md, and no script counts fix attempts, checks that a test failed first, or verifies evidence. The code around it is scripts/test-investigate-skill.sh, which greps the skill text and its links from /tdd and /create-pr, the shared grep helpers in scripts/lib/skill-test.sh, and the wrapper check in scripts/resolver-phases.ts.","refs":[{"node":"repro","file":"scripts/resolver-phases.ts","from":142,"to":155,"title":"Wrapper integrity: each harness wrapper must point at the skill file","explain":"For every registered skill it builds the expected path skills/\u003cname>.md. It then opens each harness wrapper that exists (Claude, Cursor, Antigravity skill and workflow) and fails the check if the wrapper does not contain a reference to that path. It runs from scripts/check-resolvable.ts, in the pre-commit hook and in npm test.","why":"This is the only code on the way into /investigate: it guarantees the command loads skills/investigate.md and not a stale copy. Everything after that entry is the agent following the text.","kind":"enforces","lines":["export function phaseWrapperIntegrity(rows: ResolverRow[], { fail, SKILLS_DIR, CURSOR_RULES, ANTIGRAVITY_SKILLS, ANTIGRAVITY_WORKFLOWS, rel }: PhaseCtx): void {","  for (const r of rows) {","    const expected = `skills/${r.name}.md`;","    const check = (path: string, include: string): void => {","      if (!existsSync(path)) return;","      if (!readFileSync(path, 'utf8').includes(include))","        fail('Wrapper', `${rel(path)} must contain '${include}' — edit skills/${r.name}.md, not the wrapper`);","    };","    check(join(SKILLS_DIR, r.name, 'SKILL.md'),              `@../../../${expected}`);","    check(join(CURSOR_RULES, `${r.name}.mdc`),               `@../../${expected}`);","    check(join(ANTIGRAVITY_SKILLS, r.name, 'SKILL.md'),      `../../../${expected}`);","    check(join(ANTIGRAVITY_WORKFLOWS, `${r.name}.md`),       `../../${expected}`);","  }","}"],"uses":["scripts/resolver-phases.ts#PhaseCtx","tools/lib/resolver-parse.ts#ResolverRow"]},{"node":"repro","file":"scripts/test-investigate-skill.sh","from":10,"to":13,"title":"investigate skill test: the root-cause rule and the first two phases","explain":"Four case-insensitive greps over skills/investigate.md require the upstream credit, the phrase 'no fix without a root cause', a 'Phase 1 ... Reproduce' heading and a 'Phase 2 ... Compare' heading.","why":"Keeps the rule that nothing is fixed before the cause is found, and the Reproduce and Compare phases, in the text. It cannot tell whether an agent reproduced anything.","kind":"tests","lines":["has \"$S\" 'obra/superpowers.*MIT'                 \"credits upstream (MIT)\"","has \"$S\" 'no fix without (a )?root cause'        \"no-fix-before-root-cause law\"","has \"$S\" 'Phase 1.*Reproduce'                    \"phase 1: reproduce\"","has \"$S\" 'Phase 2.*(Compare|Pattern)'            \"phase 2: compare against working code\""],"uses":["scripts/lib/skill-test.sh#has"]},{"node":"repro","file":"scripts/lib/skill-test.sh","from":6,"to":16,"title":"has / has_cs / finish: the assertions the skill tests are built from","explain":"ok and fail print a line and bump a counter. has runs a case-insensitive extended-regex grep over a file and records pass or fail; has_cs is the case-sensitive form. finish prints the totals and returns non-zero if anything failed.","why":"Shows what the skill acceptance tests can and cannot prove: they only check that a phrase is present in the skill text. They never run the flow or watch what a
