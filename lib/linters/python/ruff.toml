# scaffold-linter: python
line-length = 120

[lint]
# All lint families; formatter-conflicting layout rules are delegated to ruff format.
select = ["ALL"]
ignore = ["D203", "D213", "COM812", "ISC001", "E111", "E114", "E117", "D206", "D300", "Q000", "Q001", "Q002", "Q003"]

[lint.mccabe]
max-complexity = 10

[lint.pylint]
max-args = 4

[format]
quote-style = "double"
